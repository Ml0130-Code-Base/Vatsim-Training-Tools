<script>
/* ================================================================
   MASTER DRILL BLOCK - the Drill Builder, facility-agnostic.

   The Set up a drill half of M98's builder, generalised, in M98's
   order and under M98's headings: Generate (a seeded generator that
   builds strips from the facility's own published procedures and the
   configuration in force, new seed, start blank instead), Edit (the
   frame, a name, the opening rate, run hot), Special observation - the
   frame changes mid-drill, Landline events - the other side of the
   operation, Brief - what the drill is asking of you, then the strips
   (the strip block's, which this block builds AROUND and never draws),
   Start positions - drawn by the player's own scope code (fly.preview),
   Flown on (which transition, and a departure's cleared altitude), Save
   and fly it / Save only, the saved drills, and JSON export and import.

   WHAT THE EVENTS ARE. A special observation and a landline call are
   scheduled notices the trainee types; they ride on the drill as
   events:[...] (shape in the fly block's header) and land in the Fly it
   feed. This block carries no catalogue of calls and no canned weather,
   grades nothing, and does not re-plan strips already flying.

   It needs the fly block under it (window.fly) and the strip block
   under that (window.strip). With either missing it does nothing.

   WHAT THE GENERATOR DOES NOT CLAIM. Every procedure, runway and
   transition it picks is one the deck carries and the strip block
   accepts for that field; the runway comes from the configuration in
   force, never from a guess. The numbers that are NOT published - the
   altitude an arrival starts at, a departure's cleared altitude, the
   speed it starts at, the callsigns, the types, the stagger of the
   check-ins - are DRILL PARAMETERS, picked from the fixture lists
   below. Each one is a box on the strip the trainee can change, and the
   panel says so. Nothing here is aviation data.

   ---------------------------------------------------------------
   THE CONTRACT

   window.DRILL_FACILITY = {
     id:       'IND',
     prefix:   'inddrill',            // id/class prefix and handler stem
     sectionClass: 'ind-section',     // OPTIONAL. The deck's own section class,
                                      //   so the headings match the page.
     storeKey: 'ind-drill-deck-fly-v1',  // localStorage. Never a status word:
                                      //   the key outlives the status.
     anchor:   function(){},          // the strips section; the builder opens
                                      //   above it and the save bar sits below
     rows:     function(next){},      // the strip block's rows: with an array,
                                      //   replace them and re-render; always
                                      //   return the current array
     page:     function(id){},        // OPTIONAL. 'fly' / 'setup'
     mountRails: function(el){},      // OPTIONAL. The notes rail, per section
     configs:  function(){},           // OPTIONAL. [{id, name}], the configurations
                                      //   the deck carries; with none the special
                                      //   observation has no "re-configure to"
     note:     ''                     // OPTIONAL. Plain text the Generate panel
                                      //   adds to its note: what this deck's
                                      //   generator cannot build, and why
   };

   The configuration and the frame are read from window.FLY_FACILITY
   (flow, frame, host), so the deck states each of them once. A flow may
   carry only:true, which keeps the generator to the one field it names
   (Big Sky's two areas share no airspace, so a Boise drill carries no
   Bozeman traffic); without it a drill leans toward that field and
   draws on the others too.
   ================================================================ */
(function(){
'use strict';

var D = window.DRILL_FACILITY, ST = window.strip, FL = window.fly;
if(!D || !ST || !FL || !D.prefix || typeof D.rows !== 'function'){ return; }

var PFX = D.prefix;
var FLYF = window.FLY_FACILITY || {};
var SEC = D.sectionClass || (PFX + '-sec');
var esc = ST.esc;

/* ---------- 0. fixtures - drill parameters, not aviation data ---------- */
var CARRIERS = ['DAL', 'UAL', 'AAL', 'SWA', 'JBU', 'ASA', 'FFT', 'RPA', 'SKW', 'EDV', 'FDX', 'UPS'];
var JETS = ['B738', 'A320', 'B739', 'E75L', 'CRJ9', 'A21N', 'B38M', 'E170', 'A319', 'B752'];
var PROPS = ['DH8D', 'AT72'];
var PISTONS = ['C172', 'SR22', 'PA28'];
var CLEARED = [5000, 6000, 8000, 10000];

/* a small seeded generator: the same seed builds the same drill */
function rng(seed){
 var s = (seed >>> 0) || 1;
 return function(){ s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
}
function pick(R, a){ return a[Math.floor(R() * a.length)]; }
function between(R, lo, hi){ return lo + Math.floor(R() * (hi - lo + 1)); }
function shuffled(R, a){
 var o = a.slice(), i, j, t;
 for(i = o.length - 1; i > 0; i--){ j = Math.floor(R() * (i + 1)); t = o[i]; o[i] = o[j]; o[j] = t; }
 return o;
}

/* ---------- 1. state and storage ---------- */
var KEY = D.storeKey || (PFX + '-v1');
var store = {v:1, drills:[]}, storeOk = true;
function load(){
 try{
  var raw = window.localStorage.getItem(KEY);
  if(raw){ var o = JSON.parse(raw); if(o && o.drills && o.drills.length != null) store = o; }
 }catch(e){ storeOk = false; }
}
function save(){
 try{ window.localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){ storeOk = false; }
}
var ui = {name:'', brief:'', rate:1, hot:false, seed:'', n:6, mix:'both', msg:'', exportText:'',
 speci:{on:false, at:'', ceil:'', vis:'', wind:'', cat:'', cfg:''}, lines:[]};

/* ---------- 2. the generator ---------- */
var hasFlyable = FL.haveProcs;
function flow(){ return (typeof FLYF.flow === 'function') ? FLYF.flow() : null; }
function engineOf(type){
 if(PROPS.indexOf(type) >= 0) return 'turboprop';
 if(PISTONS.indexOf(type) >= 0) return 'piston';
 return 'jet';
}
function callsign(R, used, piston){
 for(var k = 0; k < 40; k++){
  var cs = piston ? ('N' + between(R, 100, 9999) + String.fromCharCode(65 + between(R, 0, 25)) + String.fromCharCode(65 + between(R, 0, 25)))
                  : (pick(R, CARRIERS) + String(between(R, 1, 9999)));
  if(!used[cs]){ used[cs] = 1; return cs; }
 }
 return 'DAL' + between(R, 1000, 9999);
}
/* The altitude an arrival starts at: what its first published ceiling ahead allows on the
   engine's descent path, rounded to a thousand; with no ceiling anywhere on the track, a
   fixture. Said so on the strip. */
function startAlt(track, from){
 var G = 240, pts = track.pts, best = null;     /* ft per NM, below what any aircraft here can descend at, so the start is on or under the path */
 /* the LOWEST allowance over every ceiling ahead, not the first: a nearer, lower ceiling is the one that binds */
 for(var i = 0; i < pts.length; i++){
  if(pts[i].cum >= from && pts[i].hi != null){
   var a = pts[i].hi + G * (pts[i].cum - from);
   if(best == null || a < best) best = a;
  }
 }
 var firstLo = null;
 for(var j = 0; j < pts.length && firstLo == null; j++){ if(pts[j].cum >= from && pts[j].lo != null) firstLo = pts[j].lo; }
 if(best == null) return firstLo != null ? Math.ceil(firstLo / 1000) * 1000 : 12000;
 /* rounded DOWN: a start above the path could not get back onto it before the ceiling */
 var a0 = clamp(Math.floor(best / 1000) * 1000, 3000, 24000);
 /* ...but never under the next published floor, which an arrival descending via cannot climb back to */
 if(firstLo != null && a0 < firstLo) a0 = Math.ceil(firstLo / 1000) * 1000;
 return a0;
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

/* Can an aircraft of this engine climb to every published floor ahead at the rate the engine
   gives it? Climb rate in feet per minute against ground speed in NM per minute, with a margin. */
function canClimb(track, alt0, from, eng, ias){
 var cap = (FL.CLIMB[eng] || 1500) / ((ias * 1.1) / 60);
 for(var i = 0; i < track.pts.length; i++){
  var p = track.pts[i];
  if(p.lo == null || p.cum <= from) continue;
  if((p.lo - alt0) / Math.max(p.cum - from, 1) > cap * 0.8) return false;
 }
 return true;
}

function genArrival(R, used, fl){
 var apts = ST.airportsHere().filter(function(a){ return ST.arrivalsFor(a).length && !(fl && fl.only && fl.airport && a !== fl.airport); });
 if(!apts.length) return null;
 var apt = (fl && fl.airport && apts.indexOf(fl.airport) >= 0 && R() < 0.8) ? fl.airport : pick(R, apts);
 var land = (fl && fl.airport === apt && fl.land && fl.land.length) ? fl.land : [''];
 var ids = shuffled(R, ST.arrivalsFor(apt));
 for(var t = 0; t < ids.length; t++){
  var rws = shuffled(R, land);
  for(var r = 0; r < rws.length; r++){
   var type = pick(R, R() < 0.15 ? PROPS : JETS);
   var s = ST.blank();
   s.role = 'arrival'; s.rules = 'IFR'; s.dest = apt; s.gate = ids[t]; s.rwy = rws[r]; s.type = type;
   s.engine = engineOf(type);
   s.cs = callsign(R, used, false);
   var q = FL.procFor(s), tr = FL.transOptions(s);
   if(tr.length){ s.trans = pick(R, tr); }
   var T = FL.track(s);
   if(!T.ok) { delete used[s.cs]; continue; }
   /* start 35 to 80 NM from the end of the track, so something happens within minutes
      rather than twenty minutes out on a long transition; a shorter track starts at its beginning */
   var remain = between(R, 35, 80), d0 = Math.max(0, T.total - remain);
   s.dtg = String(Math.round((T.total - d0) * 10) / 10);
   s.alt = String(startAlt(T, d0));
   s.ias = s.engine === 'turboprop' ? '180' : (+s.alt >= 10000 ? '280' : '250');
   s.radar = ST.normRadar('established', 'IFR', 'arrival');
   return s;
  }
 }
 return null;
}
function genDeparture(R, used, fl){
 var apts = ST.airportsHere().filter(function(a){ return ST.departuresFor(a).length && !(fl && fl.only && fl.airport && a !== fl.airport); });
 if(!apts.length) return null;
 var apt = (fl && fl.airport && apts.indexOf(fl.airport) >= 0 && R() < 0.8) ? fl.airport : pick(R, apts);
 var rwys = (fl && fl.airport === apt && fl.dep && fl.dep.length) ? fl.dep : [''];
 var ids = shuffled(R, ST.departuresFor(apt));
 for(var t = 0; t < ids.length; t++){
  var type = pick(R, R() < 0.15 ? PROPS : JETS);
  var s = ST.blank();
  s.role = 'departure'; s.rules = 'IFR'; s.dep = apt; s.sid = ids[t]; s.depRwy = pick(R, rwys); s.type = type;
  s.engine = engineOf(type);
  s.cs = callsign(R, used, false);
  var q = FL.procFor(s), tr = FL.transOptions(s);
  if(tr.length){ s.trans = pick(R, tr); }
  var T = FL.track(s);
  if(!T.ok){ delete used[s.cs]; continue; }
  s.fromStart = String(between(R, 0, 4));
  s.alt = String(1500 + between(R, 0, 3) * 500);
  /* a departure must be able to make the SID's own floors at the climb rate it has: a slow
     turboprop is swapped for a jet, and a SID no aircraft here could climb is skipped */
  if(!canClimb(T, +s.alt, +s.fromStart, s.engine, 190)){
   s.type = 'B738'; s.engine = 'jet';
   if(!canClimb(T, +s.alt, +s.fromStart, 'jet', 190)){ delete used[s.cs]; continue; }
  }
  /* a cleared altitude that does not contradict the SID's own floor: never below the highest
     "at or above" the published track carries */
  var floorAlt = null;
  T.pts.forEach(function(p){ if(p.lo != null && (floorAlt == null || p.lo > floorAlt)) floorAlt = p.lo; });
  var ct = pick(R, CLEARED);
  if(floorAlt != null && ct < floorAlt) ct = Math.ceil(floorAlt / 1000) * 1000;
  s.climbTo = String(ct);
  s.ias = s.engine === 'turboprop' ? '160' : '190';
  s.radar = ST.normRadar('departure', 'IFR', 'departure');
  return s;
 }
 return null;
}
function genOverflight(R, used){
 var type = pick(R, R() < 0.5 ? PISTONS : JETS), eng = engineOf(type);
 var s = ST.blank();
 s.role = 'overflight'; s.type = type; s.engine = eng;
 s.rules = eng === 'piston' ? 'VFR' : 'IFR';
 s.cs = callsign(R, used, eng === 'piston');
 var er = between(R, 0, 359), xr = (er + 180 + between(R, -40, 40) + 360) % 360;
 s.entryR = String(er); s.entryD = '40'; s.exitR = String(xr); s.exitD = '40';
 s.alt = eng === 'piston' ? String(pick(R, [4000, 6000, 8000])) : String(pick(R, [24000, 28000, 34000]));
 s.ias = eng === 'piston' ? '110' : '420';
 s.radar = ST.normRadar(eng === 'piston' ? 'following' : 'established', s.rules, 'overflight');
 return s;
}
function generate(seed, n, mix){
 var R = rng(seed), used = {}, fl = flow(), out = [], i, s;
 var want = {arr:0, dep:0, over:0};
 /* A kind the deck has no procedure for anywhere is drawn as an overflight in the mixed draw, so a deck
    whose fields code no STAR or no SID still builds the drill as long as it was asked for. The draw
    below consumes the same random numbers either way, so a deck with both kinds is unchanged. */
 var canArr = ST.airportsHere().some(function(a){ return ST.arrivalsFor(a).length; });
 var canDep = ST.airportsHere().some(function(a){ return ST.departuresFor(a).length; });
 for(i = 0; i < n; i++){
  var r = R();
  if(mix === 'arrivals') want.arr++;
  else if(mix === 'departures') want.dep++;
  else if(r < 0.5){ if(canArr) want.arr++; else want.over++; }
  else if(r < 0.85){ if(canDep) want.dep++; else want.over++; }
  else want.over++;
 }
 var kinds = [];
 for(i = 0; i < want.arr; i++) kinds.push('a');
 for(i = 0; i < want.dep; i++) kinds.push('d');
 for(i = 0; i < want.over; i++) kinds.push('o');
 kinds = shuffled(R, kinds);
 var skipped = [];
 kinds.forEach(function(k){
  s = (k === 'a') ? genArrival(R, used, fl) : (k === 'd' ? genDeparture(R, used, fl) : genOverflight(R, used));
  if(s) out.push(s); else skipped.push(k === 'a' ? 'an arrival' : (k === 'd' ? 'a departure' : 'an overflight'));
 });
 /* stagger: the first two are already on the frequency, the rest check in over ten minutes */
 var t = 0;
 out.forEach(function(x, idx){
  if(idx < 2){ x.ckdIn = true; x.spawnAt = ''; }
  else { t += between(R, 30, 150); x.ckdIn = false; x.spawnAt = String(t); }
 });
 return {strips:out, skipped:skipped};
}

/* ---------- 3. the drill ---------- */
function frameText(){
 var f = (typeof FLYF.frame === 'function') ? FLYF.frame() : null;
 return (f && f.text) || '';
}
function snapshot(){
 var rows = D.rows();
 return JSON.parse(JSON.stringify(rows));
}
function configs(){
 var c = (typeof D.configs === 'function') ? D.configs() : null;
 return (c && c.length) ? c : [];
}
function cfgName(id){
 var c = configs();
 for(var i = 0; i < c.length; i++){ if(String(c[i].id) === String(id)) return c[i].name || String(id); }
 return String(id);
}
function numOf(v){ var n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.]/g, '')); return isFinite(n) ? n : null; }

/* The events the builder has typed, as the fly block's drill carries them. Whatever is blank is
   left off the event; the fly block's validate names any that cannot fire. Nothing here is data
   from a document - it is the trainee's own scenario text. */
function eventsOut(){
 var out = [], sp = ui.speci;
 if(sp.on){
  var e = {kind:'speci', at:numOf(sp.at)};
  if(sp.ceil.trim()) e.ceil = sp.ceil.trim();
  if(sp.vis.trim()) e.vis = sp.vis.trim();
  if(sp.wind.trim()) e.wind = sp.wind.trim();
  if(sp.cat) e.cat = sp.cat;
  if(sp.cfg){ e.cfg = sp.cfg; e.cfgName = cfgName(sp.cfg); }
  out.push(e);
 }
 ui.lines.forEach(function(l){
  if(!(String(l.at).trim() || l.from.trim() || l.text.trim() || l.cs.trim())) return;
  var e = {kind:'landline', at:numOf(l.at), from:l.from.trim(), text:l.text.trim()};
  if(l.cs.trim()) e.cs = l.cs.trim().toUpperCase();
  out.push(e);
 });
 return out;
}
/* A landline call about a callsign the drill does not carry reads as a call about nothing. */
function eventNotes(d){
 var notes = [], have = {}, n = 0;
 (d.strips || []).forEach(function(s){ if(s.cs) have[String(s.cs).toUpperCase()] = 1; });
 (d.events || []).forEach(function(e){
  if(e.kind !== 'landline') return;
  n++;
  if(e.cs && !have[String(e.cs).toUpperCase()]) notes.push('Landline call ' + n + ' is about ' + e.cs + ', which is not a strip in this drill.');
 });
 return notes;
}
function collect(){
 var d = {id:'d' + Date.now().toString(36), name:(ui.name || '').trim() || ('Drill ' + (store.drills.length + 1)),
  brief:ui.brief, rate:ui.hot ? 'hot' : ui.rate, at:new Date().toISOString().slice(0, 16).replace('T', ' '),
  seed:ui.seed || null, frame:{text:frameText()}, strips:snapshot()};
 var ev = eventsOut();
 if(ev.length) d.events = ev;
 return d;
}
function say(html, kind){ ui.msg = '<div class="' + PFX + '-msg ' + (kind || '') + '">' + html + '</div>'; paint(); }
function flyIt(drill){
 var r = FL.load(drill);
 if(!r.ok){
  say('<b>This drill cannot be flown yet.</b><br>' + r.errs.map(esc).join('<br>'), 'bad');
  return false;
 }
 ui.msg = '';
 if(typeof D.page === 'function') D.page('fly');
 var h = (typeof FLYF.host === 'function') ? FLYF.host() : null;
 if(h && h.scrollIntoView){ try{ h.scrollIntoView(); }catch(e){} }
 paint();
 return true;
}

/* ---------- 4. markup ---------- */
function opt(v, label, cur){ return '<option value="' + esc(v) + '"' + (String(v) === String(cur) ? ' selected' : '') + '>' + esc(label) + '</option>'; }
function fld(label, ctl){ return '<label>' + label + ctl + '</label>'; }
function inp(id, val, size, ph){
 return '<input class="' + PFX + '-in" id="' + PFX + '-' + id + '" value="' + esc(val) + '"' + (size ? ' size="' + size + '"' : '') + (ph ? ' placeholder="' + esc(ph) + '"' : '') + ' oninput="' + PFX + 'Set()">';
}
function frameInner(f){
 return f ? esc(f) : '<span class="' + PFX + '-gap">No frame set - choose a position and a configuration above.</span>';
}
var lastFrame = null;

function genPanel(){
 var body;
 if(hasFlyable){
  body = '<div class="' + PFX + '-row">'
   + fld('Seed', inp('seed', ui.seed, 10, 'any number'))
   + fld('Strips', inp('n', ui.n, 3))
   + fld('Mix', '<select class="' + PFX + '-sel" id="' + PFX + '-mix" onchange="' + PFX + 'Set()">' + opt('both', 'arrivals, departures, overflights', ui.mix) + opt('arrivals', 'arrivals only', ui.mix) + opt('departures', 'departures only', ui.mix) + '</select>')
   + '</div>'
   + '<div class="' + PFX + '-hint">Strips is the most the drill will carry, and no drill carries more than ' + ST.MAX + '. Arrivals, departures and overflights share it.</div>'
   + '<div class="' + PFX + '-actions">'
   + '<button class="' + PFX + '-go" onclick="' + PFX + 'Gen()">Generate drill</button>'
   + '<button class="' + PFX + '-btn" onclick="' + PFX + 'Dice()">new seed</button>'
   + '<button class="' + PFX + '-btn" onclick="' + PFX + 'Blank()">start blank instead</button>'
   + '<span class="' + PFX + '-hint" style="margin:0;">Same seed, same drill - write the number in your notes and you can fly it again cold.</span>'
   + '</div>'
   + '<div class="' + PFX + '-note">The generator picks procedures, runways and transitions this deck carries and the configuration in force allows. <b>The start altitude, cleared altitude, speed, callsign, type and check-in time are drill parameters, not published data</b> - each is a box on the strip you can change.' + (D.note ? ' ' + esc(D.note) : '') + '</div>';
 } else {
  body = '<div class="' + PFX + '-note">This deck carries no published procedures to fly, so there is nothing to generate from: build overflights below by radial and distance.</div>'
   + '<div class="' + PFX + '-actions"><button class="' + PFX + '-btn" onclick="' + PFX + 'Blank()">start blank instead</button></div>';
 }
 return '<div class="' + PFX + '-panel"><div class="' + PFX + '-sub">Generate</div>' + body + '</div>';
}
function lineHtml(l, i){
 return '<div class="' + PFX + '-line">'
  + '<div class="' + PFX + '-linehead"><b>Call ' + (i + 1) + '</b> <button class="' + PFX + '-btn" onclick="' + PFX + 'DropLine(' + i + ')">remove</button></div>'
  + '<div class="' + PFX + '-row">'
  + fld('At T-plus (seconds)', inp('lat' + i, l.at, 8))
  + fld('From', inp('lfrom' + i, l.from, 22, 'who is calling'))
  + fld('About callsign (optional)', inp('lcs' + i, l.cs, 10))
  + '</div>'
  + '<label class="' + PFX + '-blk">What they say <textarea class="' + PFX + '-in" id="' + PFX + '-ltxt' + i + '" rows="2" oninput="' + PFX + 'Set()">' + esc(l.text) + '</textarea></label>'
  + '</div>';
}
function editPanel(){
 var f = frameText(), sp = ui.speci, cf = configs();
 lastFrame = f;
 var cfSel = cf.length
  ? fld('Re-configure to', '<select class="' + PFX + '-sel" id="' + PFX + '-specicfg" onchange="' + PFX + 'Set()">' + opt('', 'no change', sp.cfg) + cf.map(function(c){ return opt(c.id, c.name || c.id, sp.cfg); }).join('') + '</select>')
  : '';
 return '<div class="' + PFX + '-panel" id="' + PFX + '-editor"><div class="' + PFX + '-sub">Edit</div>'
  + '<div class="' + PFX + '-frame" id="' + PFX + '-frame">' + frameInner(f) + '</div>'
  + '<div class="' + PFX + '-hint" style="margin-top:-4px;">This is the frame the Fly it page will state before traffic. It is read off the position and weather panels above; change it there.</div>'
  + '<div class="' + PFX + '-row">'
  + fld('Name', inp('name', ui.name, 30, 'what this drill is for'))
  + fld('Opening rate', '<select class="' + PFX + '-sel" id="' + PFX + '-rate" onchange="' + PFX + 'Set()">' + opt('0', 'paused', ui.rate) + opt('1', '1x - real time', ui.rate) + opt('4', '4x', ui.rate) + '</select>')
  + '<label class="' + PFX + '-chk"><input type="checkbox" id="' + PFX + '-hot"' + (ui.hot ? ' checked' : '') + ' onchange="' + PFX + 'Set()">run hot - no pausing</label>'
  + '</div>'

  + '<div class="' + PFX + '-sub" style="margin-top:16px;">Special observation - the frame changes mid-drill</div>'
  + '<div class="' + PFX + '-row">'
  + '<label class="' + PFX + '-chk"><input type="checkbox" id="' + PFX + '-speci"' + (sp.on ? ' checked' : '') + ' onchange="' + PFX + 'Set()">drop a SPECI</label>'
  + fld('At T-plus (seconds)', inp('speciat', sp.at, 8))
  + fld('New ceiling', inp('specic', sp.ceil, 10))
  + fld('New visibility', inp('speciv', sp.vis, 10))
  + fld('New wind', inp('speciw', sp.wind, 14))
  + fld('New flight category', '<select class="' + PFX + '-sel" id="' + PFX + '-specicat" onchange="' + PFX + 'Set()">' + opt('', 'no change', sp.cat) + opt('VFR', 'VFR', sp.cat) + opt('MVFR', 'MVFR', sp.cat) + opt('IFR', 'IFR', sp.cat) + opt('LIFR', 'LIFR', sp.cat) + '</select>')
  + cfSel
  + '</div>'
  + '<div class="' + PFX + '-hint">A special observation is unscheduled: it lands between the hourly reports when the weather crosses a threshold. When the clock reaches the time you set, the Fly it feed announces what you typed here - the values are yours, none is a published number.'
  + (cf.length ? ' <b>Re-configure to</b> names the configuration now in force. <b>This player does not re-plan the strips already flying</b> - they keep their published tracks, and the feed says so - so re-vector or re-assign any that need it.' : ' This deck has no configuration list to switch between, so a special observation changes the weather only.')
  + ' Nothing here is graded.</div>'

  + '<div class="' + PFX + '-sub" style="margin-top:16px;">Landline events - the other side of the operation</div>'
  + '<div id="' + PFX + '-lines">' + ui.lines.map(lineHtml).join('') + '</div>'
  + '<div class="' + PFX + '-actions"><button class="' + PFX + '-btn" onclick="' + PFX + 'AddLine()">add a landline event</button></div>'
  + '<div class="' + PFX + '-hint">A landline event is a call from the other side - a tower, a neighbouring sector, a supervisor - that lands in the Fly it feed at the time you set. You write who it is from and what they say: this deck carries no catalogue of coordination calls to draw on, because the paragraphs of the order that would define one are not transcribed here as such. <b>Content is not graded</b> and no answer is expected by the player: it is a notice on the feed, not a transmission to reply to.</div>'

  + '<label class="' + PFX + '-blk" style="margin-top:14px;">Brief - what the drill is asking of you <textarea class="' + PFX + '-in" id="' + PFX + '-brief" rows="3" placeholder="Optional. One line the coach would say before traffic." oninput="' + PFX + 'Set()">' + esc(ui.brief) + '</textarea></label>'
  + '</div>';
}
function headHtml(){
 return '<section class="' + SEC + ' ' + PFX + '-sec" id="' + PFX + '-head" data-note="drill">'
  + '<h2>Drill builder</h2>'
  + '<p class="' + PFX + '-dim">Generate a drill or build one strip by strip, say what changes while it runs, then fly it.</p>'
  + genPanel()
  + editPanel()
  + '</section>';
}
function detailsHtml(){
 var rows = D.rows(), out = '';
 rows.forEach(function(s, i){
  var role = ST.roleOf(s);
  if(role === 'overflight') return;
  var q = FL.procFor(s);
  if(!q.id) return;
  var tr = FL.transOptions(s);
  var T = FL.track(s);
  var line = '<div class="' + PFX + '-drow"><b>' + esc(s.cs || ('strip ' + (i + 1))) + '</b> <span class="' + PFX + '-dim">' + esc(q.id) + ' ' + (role === 'departure' ? 'departure' : 'arrival') + '</span> ';
  if(!T.ok){ line += '<span class="' + PFX + '-gap">cannot be flown: ' + esc(T.note) + '</span></div>'; out += line; return; }
  if(tr.length){
   line += '<label>' + (q.p && q.p.vector ? 'vectored to' : 'transition') + ' <select class="' + PFX + '-sel" onchange="' + PFX + 'Trans(' + i + ',this.value)">'
    + opt('', 'engine picks: ' + (T.entry || 'none'), s.trans || '') + tr.map(function(t){ return opt(t, t, s.trans || ''); }).join('') + '</select></label> ';
  }
  if(role === 'departure'){
   line += '<label>cleared altitude <input class="' + PFX + '-in" size="7" value="' + esc(s.climbTo || '') + '" placeholder="none" onchange="' + PFX + 'Climb(' + i + ',this.value)"></label> ';
  }
  line += '<span class="' + PFX + '-dim">' + Math.round(T.total) + ' NM' + (T.rw ? ' · runway transition ' + esc(T.rw) : '') + (T.vectored ? ' · radar vectors, a straight stand-in line to ' + esc(T.entry) + (T.coded && T.coded.length ? ' · coded: ' + esc(T.coded.join(', ')) : '') : (T.endVec ? ' · ends on a vector' : '') + (T.standIn ? ' · first leg is a straight stand-in from the field' : '')) + '</span></div>';
  out += line;
 });
 return out || '<div class="' + PFX + '-dim">No strip here follows a published procedure.</div>';
}
/* The start positions, drawn by the player's own scope code (fly.preview), so the fit, the rings,
   the outline and the tracks are the ones that will be flown. */
function previewHtml(){
 var rows = (D.rows() || []).filter(function(s){ return s && String(s.cs || '').trim(); }), p = null;
 if(typeof FL.preview === 'function'){ try{ p = FL.preview(rows); }catch(e){ p = null; } }
 if(!p) return '<div class="' + PFX + '-dim">The player cannot draw start positions here.</div>';
 var out = '';
 if(p.count){
  out += '<div class="' + PFX + '-cap">Start positions - same geometry as the live scope</div>'
   + '<div class="' + PFX + '-scopewrap">' + p.svg + '</div>'
   + '<div class="' + PFX + '-hint">Dimmed targets check in later. Each is drawn at the point on its published track where the strip starts it, on the Fly it page\'s own scope code.</div>';
 } else {
  out += '<div class="' + PFX + '-dim">Nothing to draw yet: a strip needs a callsign and either a published procedure or an overflight\'s radials before it has a start position.</div>';
 }
 if(p.skipped.length) out += '<div class="' + PFX + '-gap" style="margin-top:8px;">No start position: ' + esc(p.skipped.join('; ')) + '.</div>';
 return out;
}
function tailHtml(){
 var list = store.drills.map(function(d, i){
  var ne = d.events ? d.events.length : 0;
  return '<div class="' + PFX + '-drow"><b>' + esc(d.name) + '</b> <span class="' + PFX + '-dim">' + (d.strips ? d.strips.length : 0) + ' strips' + (ne ? ' · ' + ne + ' event' + (ne === 1 ? '' : 's') : '') + ' · ' + esc(d.at || '') + (d.seed ? ' · seed ' + esc(d.seed) : '') + '</span> '
   + '<button class="' + PFX + '-btn" onclick="' + PFX + 'Fly(' + i + ')">Fly it</button> '
   + '<button class="' + PFX + '-btn" onclick="' + PFX + 'Open(' + i + ')">Load into the strips</button> '
   + '<button class="' + PFX + '-btn" onclick="' + PFX + 'Del(' + i + ')">Delete</button>'
   + (d.brief ? '<div class="' + PFX + '-dim">' + esc(d.brief) + '</div>' : '') + '</div>';
 }).join('');
 return '<section class="' + SEC + ' ' + PFX + '-sec" id="' + PFX + '-tail" data-note="drill.saved">'
  + '<div class="' + PFX + '-panel"><div class="' + PFX + '-sub">Start positions</div>'
  + '<div id="' + PFX + '-preview">' + previewHtml() + '</div></div>'
  + '<div class="' + PFX + '-panel">'
  + '<div class="' + PFX + '-sub a">Flown on</div>'
  + '<div id="' + PFX + '-details">' + detailsHtml() + '</div>'
  + '<div class="' + PFX + '-actions">'
  + '<button class="' + PFX + '-go" onclick="' + PFX + 'SaveFly()">Save and fly it</button>'
  + '<button class="' + PFX + '-btn" onclick="' + PFX + 'SaveOnly()">Save only</button>'
  + '</div>'
  + ui.msg
  + '</div>'
  + '<div class="' + PFX + '-panel"><div class="' + PFX + '-sub">Saved drills</div>'
  + (storeOk ? '' : '<div class="' + PFX + '-msg bad">Local storage is not available in this context, so saved drills live only until the page is closed. Export them before you leave.</div>')
  + (list || '<div class="' + PFX + '-dim">None saved yet.</div>')
  + '<div class="' + PFX + '-actions">'
  + '<button class="' + PFX + '-btn" onclick="' + PFX + 'Export()">Export as JSON</button>'
  + '<button class="' + PFX + '-btn" onclick="' + PFX + 'Import()">Import from the box below</button>'
  + '</div>'
  + '<textarea class="' + PFX + '-in ' + PFX + '-json" id="' + PFX + '-json" rows="6" placeholder="Exported drills appear here. To import, paste JSON here and press Import.">' + esc(ui.exportText) + '</textarea>'
  + '</div>'
  + '</section>';
}

/* ---------- 5. painting ---------- */
function paint(){
 var h = document.getElementById(PFX + '-head'), t = document.getElementById(PFX + '-tail');
 if(h){ var nh = document.createElement('div'); nh.innerHTML = headHtml(); h.parentNode.replaceChild(nh.firstChild, h); }
 if(t){ var nt = document.createElement('div'); nt.innerHTML = tailHtml(); t.parentNode.replaceChild(nt.firstChild, t); }
}
/* the frame line follows the position and weather panels above, which this block does not own */
function paintFrame(){
 var e = document.getElementById(PFX + '-frame');
 if(!e) return;
 var t = frameText();
 if(t === lastFrame) return;
 lastFrame = t; e.innerHTML = frameInner(t);
}
/* repaint only the flown-on panel and the start positions, so typing in the head never loses focus */
function paintDetails(){
 var e = document.getElementById(PFX + '-details'); if(e) e.innerHTML = detailsHtml();
 var p = document.getElementById(PFX + '-preview'); if(p) p.innerHTML = previewHtml();
 paintFrame();
}

/* ---------- 6. handlers ---------- */
function read(){
 function v(id){ var e = document.getElementById(PFX + '-' + id); return e ? e.value : null; }
 function c(id){ var e = document.getElementById(PFX + '-' + id); return e ? !!e.checked : null; }
 if(v('name') != null) ui.name = v('name');
 if(v('brief') != null) ui.brief = v('brief');
 if(v('rate') != null) ui.rate = parseInt(v('rate'), 10) || 0;
 if(c('hot') != null) ui.hot = c('hot');
 if(v('seed') != null) ui.seed = v('seed');
 if(v('n') != null){ var n = parseInt(v('n'), 10); ui.n = (n >= 1 && n <= ST.MAX) ? n : ui.n; }
 if(v('mix') != null) ui.mix = v('mix');
 if(c('speci') != null){
  var sp = ui.speci;
  sp.on = c('speci'); sp.at = v('speciat') || ''; sp.ceil = v('specic') || ''; sp.vis = v('speciv') || '';
  sp.wind = v('speciw') || ''; sp.cat = v('specicat') || '';
  sp.cfg = (v('specicfg') != null) ? v('specicfg') : sp.cfg;
 }
 ui.lines.forEach(function(l, i){
  if(v('lat' + i) == null) return;
  l.at = v('lat' + i); l.from = v('lfrom' + i) || ''; l.cs = v('lcs' + i) || ''; l.text = v('ltxt' + i) || '';
 });
}
window[PFX + 'Set'] = function(){ read(); };
window[PFX + 'Gen'] = function(){
 read();
 var seed = parseInt(String(ui.seed).replace(/\D/g, ''), 10);
 if(!isFinite(seed)){ seed = Math.floor(Math.random() * 100000); ui.seed = String(seed); }
 var g = generate(seed, ui.n, ui.mix);
 if(!g.strips.length){ say('Nothing could be generated: no strip could be built on a published procedure this deck can fly.', 'bad'); return; }
 D.rows(g.strips);
 ui.msg = '<div class="' + PFX + '-msg">Built ' + g.strips.length + ' strip' + (g.strips.length === 1 ? '' : 's') + ' from seed ' + esc(ui.seed) + '.'
  + (g.skipped.length ? ' Could not build ' + esc(g.skipped.join(', ')) + ' on a flyable procedure.' : '')
  + ' Change any box you like, then fly it.</div>';
 paint();
};
window[PFX + 'Dice'] = function(){
 read();
 ui.seed = String(Math.floor(Math.random() * 100000));
 var e = document.getElementById(PFX + '-seed'); if(e) e.value = ui.seed;
};
window[PFX + 'Blank'] = function(){
 read();
 D.rows([ST.blank()]);
 ui.msg = '<div class="' + PFX + '-msg">Started blank. Fill in the strips below, then fly it.</div>';
 paint();
};
window[PFX + 'AddLine'] = function(){
 read();
 ui.lines.push({at:'', from:'', cs:'', text:''});
 paint();
};
window[PFX + 'DropLine'] = function(i){
 read();
 ui.lines.splice(i, 1);
 paint();
};
window[PFX + 'Trans'] = function(i, v){ var r = D.rows()[i]; if(!r) return; if(v) r.trans = v; else delete r.trans; paintDetails(); };
window[PFX + 'Climb'] = function(i, v){ var r = D.rows()[i]; if(!r) return; if(String(v).trim()) r.climbTo = String(v).trim(); else delete r.climbTo; paintDetails(); };
function readyDrill(){
 read();
 if(typeof window[ST.prefix + 'Sync'] === 'function') window[ST.prefix + 'Sync']();
 return collect();
}
window[PFX + 'SaveFly'] = function(){
 var d = readyDrill(), v = FL.validate(d);
 if(v.errs.length){ say('<b>This drill cannot be flown yet.</b><br>' + v.errs.map(esc).join('<br>'), 'bad'); return; }
 store.drills.push(d); save();
 flyIt(d);
};
window[PFX + 'SaveOnly'] = function(){
 var d = readyDrill();
 store.drills.push(d); save();
 var v = FL.validate(d), notes = v.warns.concat(eventNotes(d));
 say('Saved <b>' + esc(d.name) + '</b>, ' + d.strips.length + ' strip' + (d.strips.length === 1 ? '' : 's')
  + (d.events ? ' and ' + d.events.length + ' event' + (d.events.length === 1 ? '' : 's') : '') + '.'
  + (v.errs.length ? '<br>It cannot be flown yet: ' + v.errs.map(esc).join(' ') : '')
  + (notes.length ? '<br>' + notes.map(esc).join('<br>') : ''), v.errs.length ? 'bad' : '');
};
window[PFX + 'Fly'] = function(i){ var d = store.drills[i]; if(d) flyIt(d); };
window[PFX + 'Open'] = function(i){
 var d = store.drills[i]; if(!d) return;
 var moved = [], strips = JSON.parse(JSON.stringify(d.strips || []));
 strips.forEach(function(s){ var r = ST.normStrip(s); (r.moved || []).forEach(function(m){ moved.push((s.cs || 'a strip') + ': ' + m); }); });
 ui.name = d.name; ui.brief = d.brief || ''; ui.seed = d.seed || '';
 ui.hot = (d.rate === 'hot'); ui.rate = ui.hot ? 1 : (parseInt(d.rate, 10) || 0);
 ui.speci = {on:false, at:'', ceil:'', vis:'', wind:'', cat:'', cfg:''}; ui.lines = [];
 var specis = 0;
 (d.events || []).forEach(function(e){
  if(!e) return;
  if(e.kind === 'speci'){
   specis++;
   if(specis === 1) ui.speci = {on:true, at:String(e.at == null ? '' : e.at), ceil:String(e.ceil || ''), vis:String(e.vis || ''), wind:String(e.wind || ''), cat:String(e.cat || ''), cfg:String(e.cfg || '')};
  } else if(e.kind === 'landline'){
   ui.lines.push({at:String(e.at == null ? '' : e.at), from:String(e.from || ''), cs:String(e.cs || ''), text:String(e.text || '')});
  }
 });
 D.rows(strips);
 ui.msg = '<div class="' + PFX + '-msg">Loaded <b>' + esc(d.name) + '</b>.'
  + (specis > 1 ? ' The drill carries ' + specis + ' special observations; the builder edits one, the first.' : '')
  + (moved.length ? ' What could not follow into this facility moved: ' + esc(moved.join('; ')) + '.' : '') + '</div>';
 paint();
};
window[PFX + 'Del'] = function(i){
 var d = store.drills[i]; if(!d) return;
 if(!window.confirm('Delete the drill "' + d.name + '"? Export it first if you want to keep it.')) return;
 store.drills.splice(i, 1); save(); paint();
};
window[PFX + 'Export'] = function(){
 ui.exportText = JSON.stringify({kind:'drills', facility:(ST.FACILITY && ST.FACILITY.id) || '', drills:store.drills}, null, 1);
 paint();
};
window[PFX + 'Import'] = function(){
 var e = document.getElementById(PFX + '-json'), txt = e ? e.value : '';
 var o;
 try{ o = JSON.parse(txt); }catch(err){ say('That is not JSON: ' + esc(String(err.message || err)), 'bad'); return; }
 var list = Array.isArray(o) ? o : (o && o.drills ? o.drills : (o && o.strips ? [o] : null));
 if(!list){ say('No drills found in that JSON. It should carry a drills list or a drill with strips.', 'bad'); return; }
 var n = 0, moved = [];
 list.forEach(function(d){
  if(!d || !d.strips || !d.strips.length) return;
  d.strips.forEach(function(s){ var r = ST.normStrip(s); (r.moved || []).forEach(function(m){ moved.push((s.cs || 'a strip') + ': ' + m); }); });
  d.id = 'd' + Date.now().toString(36) + n; d.name = d.name || 'Imported drill';
  store.drills.push(d); n++;
 });
 save(); ui.exportText = '';
 say('Imported ' + n + ' drill' + (n === 1 ? '' : 's') + '.' + (moved.length ? ' What could not follow into this facility moved: ' + esc(moved.join('; ')) + '.' : ''));
};

/* ---------- 7. mount ---------- */
function mountCss(){
 if(document.getElementById(PFX + '-css')) return;
 var c = '.' + PFX + '-sec{margin-top:22px;}'
  + '.' + PFX + '-panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin:14px 0;}'
  + '.' + PFX + '-sub{font-family:var(--mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;}'
  + '.' + PFX + '-sub.a{color:var(--amber);}'
  + '.' + PFX + '-frame{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:12px;}'
  + '.' + PFX + '-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:10px 0;}'
  + '.' + PFX + '-row label,.' + PFX + '-blk{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);}'
  + '.' + PFX + '-row label.' + PFX + '-chk,.' + PFX + '-chk{flex-direction:row;align-items:center;gap:6px;font-size:11px;letter-spacing:0;text-transform:none;color:var(--dim);cursor:pointer;padding-bottom:7px;}'
  + '.' + PFX + '-blk{margin:10px 0;}'
  + '.' + PFX + '-drow label{font-family:var(--mono);font-size:10px;letter-spacing:0.06em;color:var(--dim);margin-right:8px;}'
  + '.' + PFX + '-in,.' + PFX + '-sel{background:var(--panel2);border:1px solid var(--line);border-radius:3px;color:var(--ink);font-family:var(--mono);font-size:12px;padding:6px 8px;text-transform:none;letter-spacing:0;}'
  + '.' + PFX + '-in:focus,.' + PFX + '-sel:focus{outline:2px solid var(--green);outline-offset:1px;}'
  + '.' + PFX + '-json{width:100%;box-sizing:border-box;margin-top:10px;}'
  + '.' + PFX + '-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;}'
  + '.' + PFX + '-btn{font-family:var(--mono);font-size:11.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer;}'
  + '.' + PFX + '-btn:hover{color:var(--ink);border-color:var(--dim2);}'
  + '.' + PFX + '-go{font-family:var(--mono);font-size:12px;font-weight:600;background:var(--green);color:#062;border:0;border-radius:4px;padding:9px 16px;cursor:pointer;}'
  + '.' + PFX + '-drow{padding:8px 0;border-top:1px solid var(--line);font-size:13px;}'
  + '.' + PFX + '-drow:first-of-type{border-top:0;}'
  + '.' + PFX + '-line{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin:8px 0;}'
  + '.' + PFX + '-linehead{display:flex;gap:10px;align-items:center;font-size:13px;}'
  + '.' + PFX + '-cap{font-family:var(--mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--dim2);margin-bottom:6px;}'
  + '.' + PFX + '-scopewrap{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px;}'
  + '.' + PFX + '-scopewrap svg{display:block;width:100%;height:auto;}'
  + '.' + PFX + '-dim{color:var(--dim);font-size:12px;}'
  + '.' + PFX + '-hint{font-size:11.5px;color:var(--dim2);line-height:1.55;margin-top:8px;}'
  + '.' + PFX + '-gap{color:var(--amber);}'
  + '.' + PFX + '-note{font-size:12px;color:var(--dim2);border-left:2px solid var(--line);padding-left:10px;margin-top:10px;}'
  + '.' + PFX + '-msg{font-size:13px;margin-top:12px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);}'
  + '.' + PFX + '-msg.bad{border-color:var(--amber);color:var(--amber);}';
 var st = document.createElement('style'); st.id = PFX + '-css'; st.textContent = c; document.head.appendChild(st);
}
function mount(){
 mountCss(); load();
 var anchor = (typeof D.anchor === 'function') ? D.anchor() : null;
 var hd = document.createElement('div'), tl = document.createElement('div');
 hd.innerHTML = headHtml(); tl.innerHTML = tailHtml();
 var head = hd.firstChild, tail = tl.firstChild;
 if(anchor && anchor.parentNode){
  anchor.parentNode.insertBefore(head, anchor);
  anchor.parentNode.insertBefore(tail, anchor.nextSibling);
 } else { return; }
 if(typeof D.mountRails === 'function'){ try{ D.mountRails(head); D.mountRails(tail); }catch(e){} }
 /* The strips' own handlers keep the panel honest: wrap them, never edit them. */
 ['Sync', 'Add', 'Drop'].forEach(function(n){
  var name = ST.prefix + n, orig = window[name];
  if(typeof orig !== 'function') return;
  window[name] = function(){ var r = orig.apply(this, arguments); paintDetails(); return r; };
 });
 paintDetails();
 /* the frame line is owned by blocks this one does not wrap, so it is read again after any click or
    change on the page and now and then (a fetched D-ATIS lands later); it touches the page only when
    the text has changed */
 function soon(){ setTimeout(paintFrame, 60); }
 document.addEventListener('click', soon, true);
 document.addEventListener('change', soon, true);
 setInterval(paintFrame, 1500);
}
if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', mount); }
else { mount(); }

window.drill = {store:function(){ return store; }, generate:generate, rng:rng, collect:collect, flyIt:flyIt, KEY:KEY, storeOk:function(){ return storeOk; },
 events:eventsOut, ui:function(){ return ui; }, refresh:paintDetails};
})();
</script>
