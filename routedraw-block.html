<script>
/* ================================================================
   MASTER ROUTE-DRAW BLOCK - the "Routes drawn" layer bar, facility-agnostic.

   Extracted from the M98 live scope (LAYERS, LAYER_MODES, ddLayers and the
   layer bar above the scope) and generalised so the same buttons and the same
   functions serve every deck that carries published procedures. Paste it in,
   give it a facility contract, and the plot gets a "Routes drawn" bar.

   WHAT IT DRAWS. The published SIDs and STARs the deck's procedures block
   already holds - fix coordinates from the FAA coded source (CIFP), straight
   between fixes, STARs in green and SIDs in dashed amber, the same colours
   and weights M98 uses. It adds no data of its own: every point comes from
   NS.PFIX through the procedures block's own track walker, so there is ONE
   copy of every coordinate (root CLAUDE.md invariant 5).

   THE FIVE MODES ARE M98's, WITH ONE HONEST RENAME.

     tracked   M98: the traffic being worked. HERE: the procedure open in the
               Published procedures viewer - a deck with no traffic model has
               no traffic to track, and a button that said "tracked traffic"
               would be the tool asserting something it cannot know
               (invariant 3). The mode id stays 'tracked' so the layer logic
               and any note written against it read the same everywhere.
     stars     every STAR the deck carries
     sids      every SID the deck carries
     both      every SID and every STAR
     off       nothing drawn

   AS IN M98, A LAYER CHOICE NEVER HIDES THE TRACK UNDER SOMETHING YOU ARE
   WORKING: "all SIDs" still draws the STAR that is open, and "all STARs" still
   draws the SID that is open. Only "off" is bare.

   TRIMMED TO THE FLOW, WHEN THE DECK CAN SAY WHAT THE FLOW IS. A runway
   transition belongs to one runway, so a procedure drawn for a runway that is
   not in use is the wrong picture. When the contract supplies a flow - the
   runways the current configuration lands and departs - a STAR is drawn only
   with the runway transitions that land a runway in use, a SID only with the
   ones that depart a runway in use, and a procedure whose every runway
   transition is for a runway out of use is not drawn at all. A procedure with
   no runway transitions is drawn: nothing says which flow it belongs to. The
   configuration names ONE field's runways, so only that field is trimmed;
   every other field is drawn untrimmed and the page says so. The open
   procedure is drawn as chosen, flagged if it is for a runway out of use. A
   button turns the trim off, to study every flow at once. With no flow set
   nothing is trimmed and the page says that.

   WHAT IT DOES NOT DRAW, AND SAYS SO ON THE PAGE. Arcs, holds and procedure
   turns are not flown, so a line is straight between fixes. A vector leg ends a
   line - the published data stops there and so does the plot. A fix with no
   coordinate is skipped, never placed. The 25 DME release ring M98 draws with
   its SIDs is the M98 LOA's number and has no equivalent here, so it is not in
   the master; a deck whose agreement states a ring can add it through
   `extras`.

   ---------------------------------------------------------------
   THE CONTRACT

   window.ROUTEDRAW_FACILITY = {
     id:      'IND',            // facility label, used in every message
     ns:      'IND',            // the deck's namespace on window. It must carry
                                //   the procedures block's exports: PFIX, STARS,
                                //   SIDS, trackTo. Without them this block does
                                //   nothing, per the block contract.
     prefix:  'indrd',          // id/class prefix, and the stem of the global
                                //   function '<prefix>Layers' (M98's ddLayers)
     host:    function(){...},  // the plot's <svg> element, or null
     project: function(lat, lon){ return [x, y]; },
                                // the plot's own projection, in the plot's own
                                //   user units. The deck owns it; this block
                                //   never keeps a second copy.
     open:    function(){...},  // OPTIONAL. {apt, kind, proc, entry, rwy} for the
                                //   'tracked' mode. Defaults to NS.openProc.
     reachNm: 40,               // OPTIONAL. How far past the outline the plot is
                                //   widened, in NM. Default 40.
     flow:    function(){...},  // OPTIONAL. {airport, land:[...], dep:[...], name}
                                //   for the configuration in force, or null.
                                //   Runway designators as the configuration
                                //   writes them: '5L', '23R', '14'.
     subscribe: function(fn){}, // OPTIONAL. Called once with a redraw function
                                //   the deck calls whenever the flow changes.
     pickFn:  'indpPick',       // OPTIONAL. The name of the global the
                                //   procedure viewer calls on every pick; it is
                                //   wrapped so the plot follows the selection.
     trackedLabel: 'open procedure',   // OPTIONAL label for the 'tracked' button
     extras:  function(mode, plan){ return svgString; }   // OPTIONAL
   };

   THE OBLIGATIONS ON THE DECK. (1) Its procedures block exports PFIX, STARS,
   SIDS, kindOf and trackTo (the R90 procedures block already does). (2) It
   exposes its plot's projection. (3) For 'tracked', it exposes the viewer's
   selection (NS.openProc). A deck that cannot answer (3) simply has a
   'tracked' button that draws nothing and says so.

   ---------------------------------------------------------------
   WHAT IT EXPORTS

   window[<prefix>Layers](mode)     set the mode; the M98 ddLayers
   NS.routeDraw = {
     LAYER_MODES, layers(), set(mode), plan(mode), redraw(),
     trim(), setTrim(on), FACILITY, prefix
   }
   plan(mode) is PURE - no DOM - so a harness can assert what would be drawn
   without a browser: {mode, stars:[track], sids:[track], open:track|null, flow,
   trimmed:{procs, segs, noRwy}, untrimmed:[airport]}. A
   track is {kind, id, apt, part, label, fixes:[name], runs:[[[lat,lon,name]]]}.

   THE PLOT IS WIDENED, BY A STATED REACH, AND THE REST IS CLIPPED OUT LOUD.
   Procedure entry fixes sit well outside a facility's lateral outline - a STAR
   can begin 200 NM out - and a viewBox wide enough for all of them shrinks the
   outline to a postage stamp. So while anything is drawn the svg's viewBox is
   widened to take in what lies within `reachNm` of the outline (default 40),
   and a line that runs further is cut by the edge of the plot, with the page
   saying how many tracks that is. "off" puts the original back. M98 does the
   same thing by mapping to 80 NM. The deck's own elements keep their
   coordinates.
   ================================================================ */
(function(){
'use strict';

var F = window.ROUTEDRAW_FACILITY;
if(!F || !F.ns){ return; }                       /* no contract - do nothing, per the block contract */
var NS = window[F.ns];
if(!NS || !NS.PFIX || !NS.STARS || !NS.SIDS || !NS.trackTo){ return; }   /* no procedures block */

var PFX = F.prefix || 'rd';
var FID = F.id || F.ns;

/* ---------- 1. Layers - M98's, by id ---------- */
var LAYER_MODES = [
 {id:'tracked', label:(F.trackedLabel || 'open procedure')},
 {id:'stars',   label:'all STARs'},
 {id:'sids',    label:'all SIDs'},
 {id:'both',    label:'all SIDs + STARs'},
 {id:'off',     label:'off'}
];
var LAYERS = 'tracked';

/* ---------- 2. What would be drawn - pure ---------- */
function ll(name){
 var c = NS.PFIX[name];
 return (c && isFinite(c[0]) && isFinite(c[1])) ? [c[0], c[1], name] : null;
}

/* A leg that names no fix, or a fix with no coordinate, ends the line it is
   on. A vector leg is the published data running out; nothing walks past it. */
function runsOf(legs){
 var out = [], cur = [], last = null, skipped = 0;
 for(var i = 0; i < (legs || []).length; i++){
  var g = legs[i], c = (g && !g.vec && g.f) ? ll(g.f) : null;
  if(!c){
   if(g && g.f && !g.vec) skipped++;
   if(cur.length > 1) out.push(cur);
   cur = []; last = null; continue;
  }
  if(last === g.f) continue;                     /* a join printed twice is one crossing */
  cur.push(c); last = g.f;
 }
 if(cur.length > 1) out.push(cur);
 return {runs:out, skipped:skipped};
}
function fixNames(runs){
 var seen = {}, out = [];
 runs.forEach(function(r){ r.forEach(function(c){ if(!seen[c[2]]){ seen[c[2]] = 1; out.push(c[2]); } }); });
 return out;
}
function makeTrack(kind, id, apt, part, legs){
 var r = runsOf(legs);
 if(!r.runs.length) return {skipped:r.skipped, track:null};
 return {skipped:r.skipped, track:{kind:kind, id:id, apt:apt, part:part, label:id, fixes:fixNames(r.runs), runs:r.runs}};
}
/* ---- the flow ---- */
var TRIM = true;
function flowNow(){
 if(!TRIM || typeof F.flow !== 'function') return null;
 var fl = null;
 try{ fl = F.flow(); }catch(e){ fl = null; }
 return (fl && fl.airport && ((fl.land && fl.land.length) || (fl.dep && fl.dep.length))) ? fl : null;
}
function rwyParse(s){
 var m = /^(?:RW)?(\d{1,2})([LRCB]?)$/.exec(String(s || '').toUpperCase());
 return m ? {n:parseInt(m[1], 10), s:m[2]} : null;
}
/* A runway transition fits when it serves a runway in use. 'B' (both) fits either
   parallel, and a bare number fits whatever letter the configuration writes. A key
   this cannot parse is kept: it cannot be shown to be out of use. */
function fits(key, list){
 var t = rwyParse(key);
 if(!t) return true;
 for(var i = 0; i < list.length; i++){
  var r = rwyParse(list[i]);
  if(r && r.n === t.n && (t.s === 'B' || !t.s || !r.s || t.s === r.s)) return true;
 }
 return false;
}
function partsOf(p, kind, apt, fl, tally){
 var out = [], rk = p.rwy ? Object.keys(p.rwy).sort() : [];
 if(fl && apt === fl.airport && !rk.length && tally) tally.noRwy++;   /* no runway transition coded: which flow it belongs to is not carried */
 if(fl && apt === fl.airport && rk.length){
  var want = (kind === 'SID') ? fl.dep : fl.land;
  if(want && want.length){
   var keep = rk.filter(function(k){ return fits(k, want); });
   if(!keep.length){ if(tally) tally.procs++; return null; }       /* not used in this flow at all */
   if(tally) tally.segs += rk.length - keep.length;
   rk = keep;
  }
 }
 if(p.common && p.common.length) out.push({part:'common', legs:p.common});
 if(p.trans) Object.keys(p.trans).sort().forEach(function(k){ out.push({part:'trans:' + k, legs:p.trans[k]}); });
 rk.forEach(function(k){ out.push({part:'rwy:' + k, legs:p.rwy[k]}); });
 return out;
}

/* Every procedure of one kind the deck carries. One polyline per published
   segment, and a segment that is the same run of fixes at another field is
   drawn once - a procedure serving several fields is the normal case. */
function allTracks(kind, fl, tally, other){
 var src = (kind === 'SID') ? NS.SIDS : NS.STARS, seen = {}, tracks = [], skipped = 0;
 Object.keys(src).sort().forEach(function(apt){
  if(fl && apt !== fl.airport && other && other.indexOf(apt) < 0) other.push(apt);
  Object.keys(src[apt]).sort().forEach(function(id){
   var parts = partsOf(src[apt][id], kind, apt, fl, tally);
   if(!parts) return;
   parts.forEach(function(s){
    var m = makeTrack(kind, id, apt, s.part, s.legs);
    skipped += m.skipped;
    if(!m.track) return;
    var key = kind + '|' + id + '|' + m.track.runs.map(function(r){ return r.map(function(c){ return c[2]; }).join('>'); }).join('/');
    if(seen[key]){ seen[key].also.push(apt); return; }
    m.track.also = [apt]; seen[key] = m.track; tracks.push(m.track);
   });
  });
 });
 tracks.skipped = skipped;
 return tracks;
}

function openSel(){
 var f = F.open || NS.openProc;
 if(typeof f !== 'function') return null;
 var o = null;
 try{ o = f(); }catch(e){ o = null; }
 return (o && o.proc && o.apt) ? o : null;
}
function openTrack(){
 var o = openSel(); if(!o) return null;
 var kind = o.kind || (NS.kindOf ? NS.kindOf(o.apt, o.proc) : null);
 if(!kind) return null;
 var m = makeTrack(kind, o.proc, o.apt, 'open', NS.trackTo(o.apt, o.proc, o.entry, o.rwy));
 if(m.track){
  m.track.also = [o.apt]; m.track.entry = o.entry || ''; m.track.rwy = o.rwy || ''; m.track.skipped = m.skipped;
  var fl = flowNow(), want = fl && o.apt === fl.airport ? (kind === 'SID' ? fl.dep : fl.land) : null;
  m.track.outOfFlow = !!(want && want.length && o.rwy && !fits(o.rwy, want));
 }
 return m.track;
}

/* M98's rule: "all" for the layers asked for, and the one being worked is drawn
   whatever the layer is - only "off" is bare. So the lists hold the "all" sets
   and nothing else, and `open` is drawn on top, heavier, in every mode but off. */
function plan(mode){
 var m = mode || LAYERS, o = (m === 'off') ? null : openTrack();
 var fl = flowNow(), tally = {procs:0, segs:0, noRwy:0}, other = [];
 var stars = (m === 'stars' || m === 'both') ? allTracks('STAR', fl, tally, other) : [];
 var sids  = (m === 'sids'  || m === 'both') ? allTracks('SID',  fl, tally, other) : [];
 var skipped = (stars.skipped || 0) + (sids.skipped || 0) + ((o && o.skipped) || 0);
 return {mode:m, stars:stars, sids:sids, open:o, skipped:skipped, flow:fl, trimmed:tally, untrimmed:other};
}

/* ---------- 3. Drawing ---------- */
function esc(s){
 return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function xy(c){ var q = F.project(c[0], c[1]); return [q[0], q[1]]; }
function ptsOf(run){ return run.map(function(c){ var q = xy(c); return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
function svgFor(pl){
 var s = '', used = {};
 function label(c, text, col){
  var q = xy(c), at = Math.round(q[0]) + ',' + Math.round(q[1]), n = used[at] || 0; used[at] = n + 1;
  s += '<text x="' + (q[0] + 6).toFixed(1) + '" y="' + (q[1] + 3 + n * 10).toFixed(1) + '" fill="' + col
     + '" font-family="IBM Plex Mono, monospace" font-size="9" opacity="0.85">' + esc(text) + '</text>';
 }
 function dot(c, col, r, op){ var q = xy(c); s += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="' + r + '" fill="' + col + '"' + (op ? ' opacity="' + op + '"' : '') + '/>'; }
 /* departures first, so an arrival is never hidden under one, as in M98 */
 pl.sids.forEach(function(t){
  t.runs.forEach(function(r){
   s += '<polyline points="' + ptsOf(r) + '" fill="none" stroke="var(--amber)" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>';
  });
  var lr = t.runs[t.runs.length - 1]; label(lr[lr.length - 1], t.label, 'var(--amber)');
 });
 pl.stars.forEach(function(t){
  t.runs.forEach(function(r, i){
   s += '<polyline points="' + ptsOf(r) + '" fill="none" stroke="var(--green)" stroke-width="1" opacity="0.45"/>';
   dot(r[0], 'var(--green)', 1.8, 0.6);
   if(i === 0) label(r[0], t.label, 'var(--dim)');
  });
 });
 /* the one being worked: heavier, every fix dotted and named, on top of the rest */
 if(pl.open){
  var col = pl.open.kind === 'SID' ? 'var(--amber)' : 'var(--green)';
  pl.open.runs.forEach(function(r){
   s += '<polyline points="' + ptsOf(r) + '" fill="none" stroke="' + col + '" stroke-width="1.6" opacity="0.9"' + (pl.open.kind === 'SID' ? ' stroke-dasharray="3 3"' : '') + '/>';
   r.forEach(function(c){ dot(c, col, 2.4); label(c, c[2], 'var(--ink)'); });
  });
 }
 if(typeof F.extras === 'function'){ try{ s += F.extras(pl.mode, pl) || ''; }catch(e){} }
 return s;
}

var ORIG = null;                                  /* the plot's own viewBox, kept so 'off' can restore it */
/* Plot units per nautical mile, from the deck's own projection: one minute of
   latitude is one NM, and the deck is the only thing that knows its scale. */
function unitsPerNm(){
 var name = Object.keys(NS.PFIX)[0], c = name && ll(name);
 if(!c) return 0;
 var a = F.project(c[0], c[1]), b = F.project(c[0] + 1 / 60, c[1]);
 return Math.abs(b[1] - a[1]);
}
/* The viewBox for a plan, and how many tracks run past it. */
var CLIP = 0;
function viewBoxFor(svg, pl){
 CLIP = 0;
 var all = pl.stars.concat(pl.sids, pl.open ? [pl.open] : []);
 if(!all.length || !ORIG) return ORIG;
 var reach = (F.reachNm == null ? 40 : F.reachNm) * unitsPerNm();
 var bx0 = ORIG[0] - reach, by0 = ORIG[1] - reach, bx1 = ORIG[0] + ORIG[2] + reach, by1 = ORIG[1] + ORIG[3] + reach;
 var x0 = ORIG[0], y0 = ORIG[1], x1 = ORIG[0] + ORIG[2], y1 = ORIG[1] + ORIG[3], pad = 14;
 all.forEach(function(t){
  var out = false;
  t.runs.forEach(function(r){ r.forEach(function(c){
   var p = xy(c);
   if(p[0] < bx0 || p[0] > bx1 || p[1] < by0 || p[1] > by1){ out = true; return; }
   if(p[0] - pad < x0) x0 = p[0] - pad; if(p[1] - pad < y0) y0 = p[1] - pad;
   if(p[0] + pad > x1) x1 = p[0] + pad; if(p[1] + pad > y1) y1 = p[1] + pad;
  }); });
  if(out) CLIP++;
 });
 return [x0, y0, x1 - x0, y1 - y0];
}

function count(list){ return list.length + (list.length === 1 ? ' track' : ' tracks'); }
function noteFor(pl){
 var cyc = NS.CIFP_CYCLE ? (' from CIFP ' + NS.CIFP_CYCLE) : '';
 var o = openSel();
 if(pl.mode === 'off') return 'No routes drawn.';
 var parts = [];
 if(pl.stars.length) parts.push(count(pl.stars) + ' of STARs');
 if(pl.sids.length)  parts.push(count(pl.sids) + ' of SIDs');
 var head = parts.length ? ('Drawn: ' + parts.join(' and ') + cyc + '.') : '';
 if(pl.open) head += (head ? ' ' : '') + 'Open procedure drawn heavier: <b>' + esc(pl.open.id) + '</b> at ' + esc(pl.open.apt) + cyc + '.';
 else if(o) head += (head ? ' ' : '') + 'The open procedure (' + esc(o.proc) + ' at ' + esc(o.apt) + ') has no fix with a coordinate to draw.';
 else if(!head) head = 'No procedure is open and no layer is on.';
 var fl = pl.flow;
 if(pl.mode !== 'off' && typeof F.flow === 'function'){
  if(!TRIM) head += ' <b>Not trimmed to the flow</b> - every runway transition is drawn.';
  else if(!fl) head += ' <b>No flow is set, so nothing is trimmed.</b> Choose a configuration in the frame, or read the D-ATIS.';
  else if(pl.stars.length || pl.sids.length){
   head += ' <b>Trimmed to ' + esc(fl.name || 'the flow') + '</b> at ' + esc(fl.airport)
     + ' (landing ' + esc((fl.land || []).join(' ') || 'not stated') + ', departing ' + esc((fl.dep || []).join(' ') || 'not stated') + '): '
     + pl.trimmed.procs + (pl.trimmed.procs === 1 ? ' procedure' : ' procedures') + ' not used in this flow and '
     + pl.trimmed.segs + ' more runway ' + (pl.trimmed.segs === 1 ? 'transition' : 'transitions') + ' left out.'
     + (pl.trimmed.noRwy ? (' ' + pl.trimmed.noRwy + ' ' + (pl.trimmed.noRwy === 1 ? 'procedure carries' : 'procedures carry') + ' no runway transition in CIFP, so which flow ' + (pl.trimmed.noRwy === 1 ? 'it belongs' : 'they belong') + ' to is not carried and ' + (pl.trimmed.noRwy === 1 ? 'it is' : 'they are') + ' drawn in every flow.') : '')
     + (pl.untrimmed.length ? (' ' + esc(pl.untrimmed.join(', ')) + ' ' + (pl.untrimmed.length === 1 ? 'is' : 'are') + ' not trimmed: the configuration names ' + esc(fl.airport) + '&rsquo;s runways only.') : '');
  }
 }
 if(pl.open && pl.open.outOfFlow) head += ' <span class="' + PFX + '-warn">The open procedure&rsquo;s runway transition ' + esc(pl.open.rwy) + ' is for a runway that is not in use in this flow.</span>';
 return head + ' Straight between fixes: arcs, holds and procedure turns are not flown, a vector leg ends a line, and a fix with no coordinate is skipped'
   + (pl.skipped ? (' (' + pl.skipped + ' skipped here)') : '') + '. '
   + (CLIP ? (CLIP + (CLIP === 1 ? ' track runs past the edge of the plot and is cut there. ' : ' tracks run past the edge of the plot and are cut there. ')) : '')
   + 'The open procedure is the one chosen under Published procedures. '
   + 'This is the published procedure, not which transition ' + esc(FID) + ' assigns.';
}

function redraw(){
 var svg = null;
 try{ svg = F.host && F.host(); }catch(e){ svg = null; }
 if(!svg || !svg.querySelector) return;
 if(!ORIG){
  var vb = (svg.getAttribute && svg.getAttribute('viewBox')) || '';
  var n = vb.split(/[\s,]+/).map(parseFloat);
  ORIG = (n.length === 4 && n.every(isFinite)) ? n : null;
  if(ORIG) svg.setAttribute('data-' + PFX + '-vb', vb);
 }
 var pl = plan(LAYERS), g = svg.querySelector('#' + PFX + '-routes');
 if(!g){
  g = document.createElementNS ? document.createElementNS('http://www.w3.org/2000/svg', 'g') : null;
  if(!g) return;
  g.setAttribute('id', PFX + '-routes');
  var poly = svg.querySelector('polygon');
  if(poly && poly.nextSibling) svg.insertBefore(g, poly.nextSibling); else svg.appendChild(g);
 }
 g.innerHTML = svgFor(pl);
 var vbx = viewBoxFor(svg, pl);
 if(vbx) svg.setAttribute('viewBox', vbx.map(function(v){ return +v.toFixed(1); }).join(' '));
 var note = document.getElementById(PFX + '-note');
 if(note) note.innerHTML = noteFor(pl);
}

/* ---------- 4. The bar, and the function - M98's ddLayers ---------- */
window[PFX + 'Layers'] = function(m){
 if(!LAYER_MODES.some(function(x){ return x.id === m; })) return;
 LAYERS = m;
 var bar = document.getElementById(PFX + '-layerbar');
 if(bar && bar.querySelectorAll){
  Array.prototype.slice.call(bar.querySelectorAll('button')).forEach(function(b){
   if(b.classList && b.getAttribute('data-l')) b.classList.toggle('on', (b.getAttribute('data-l')) === m);
  });
 }
 redraw();
};

var CSS =
 '.' + PFX + '-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 8px;}'
+ '.' + PFX + '-bar button{font-family:var(--mono);font-size:11.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer;}'
+ '.' + PFX + '-bar button:hover{color:var(--ink);border-color:var(--dim2);}'
+ '.' + PFX + '-bar button.on{color:var(--green);border-color:var(--green);}'
+ '.' + PFX + '-lab{font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);}'
+ '.' + PFX + '-note{margin-top:8px;font:12px/1.5 var(--body);color:var(--dim2);}'
+ '.' + PFX + '-warn{color:var(--amber);}';

function barHtml(){
 return '<span class="' + PFX + '-lab">Routes drawn</span>'
  + LAYER_MODES.map(function(m){
     return '<button data-l="' + m.id + '"' + (m.id === LAYERS ? ' class="on"' : '')
       + ' onclick="window[\'' + PFX + 'Layers\'](\'' + m.id + '\')">' + esc(m.label) + '</button>';
    }).join('')
  + (typeof F.flow === 'function'
      ? ('<button data-flow="1"' + (TRIM ? ' class="on"' : '') + ' onclick="window[\'' + PFX + 'Flow\']()" title="Draw only the runway transitions the current flow uses">trimmed to flow</button>')
      : '');
}
window[PFX + 'Flow'] = function(on){
 TRIM = (on === undefined) ? !TRIM : !!on;
 var b = document.getElementById(PFX + '-layerbar');
 if(b && b.querySelector){ var x = b.querySelector('[data-flow]'); if(x && x.classList) x.classList.toggle('on', TRIM); }
 redraw();
};

function mount(){
 var svg = null;
 try{ svg = F.host && F.host(); }catch(e){ svg = null; }
 if(!svg || !svg.parentNode || document.getElementById(PFX + '-layerbar')) return;
 var st = document.createElement('style'); st.id = PFX + '-css'; st.textContent = CSS; document.head.appendChild(st);
 var bar = document.createElement('div');
 bar.className = PFX + '-bar'; bar.id = PFX + '-layerbar'; bar.innerHTML = barHtml();
 svg.parentNode.insertBefore(bar, svg);
 var note = document.createElement('div');
 note.className = PFX + '-note'; note.id = PFX + '-note';
 if(svg.nextSibling) svg.parentNode.insertBefore(note, svg.nextSibling); else svg.parentNode.appendChild(note);
 redraw();
}

/* The plot follows the viewer. The procedure viewer calls its pick function on
   every selection, so wrap it - the extension pattern, not an edit to the deck. */
if(F.pickFn && typeof window[F.pickFn] === 'function'){
 var orig = window[F.pickFn];
 window[F.pickFn] = function(){
  var r = orig.apply(this, arguments);
  try{ redraw(); }catch(e){}
  return r;
 };
}

NS.routeDraw = {
 LAYER_MODES:LAYER_MODES, layers:function(){ return LAYERS; },
 set:function(m){ window[PFX + 'Layers'](m); },
 trim:function(){ return TRIM; }, setTrim:function(on){ window[PFX + 'Flow'](on); },
 plan:plan, redraw:redraw, FACILITY:F, prefix:PFX
};
/* The plot follows the flow: the deck hands over a redraw to call when it changes. */
if(typeof F.subscribe === 'function'){ try{ F.subscribe(function(){ try{ redraw(); }catch(e){} }); }catch(e){} }

if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', mount); }
else { mount(); }

})();
</script>
