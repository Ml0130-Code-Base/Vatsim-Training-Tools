<script>
/* ================================================================
   MASTER FLY BLOCK - the live drill player, facility-agnostic.

   Extracted from the M98 "Fly it" page (the Live Drill Player: clock,
   scope, strips, transmit box, frequency feed, response timing,
   debrief) and generalised so every deck can fly the strips it builds.
   Paste it in after the procedures block and the strip block, give it
   a facility contract, and the deck's Fly it page becomes a player.

   WHAT FLIES, AND WHAT IT FLIES ON. An arrival flies its STAR, a
   departure its SID, an overflight a straight line between the radial
   and distance the strip gives. A STAR or SID is the facility's own
   published track: fix coordinates, crossing restrictions and speed
   limits from the FAA coded source (CIFP), read through the procedures
   block's own exports (PFIX, STARS, SIDS, procOf, trackTo) and never
   copied, so there is ONE copy of every coordinate (invariant 5). An
   arrival descends via the published altitudes and flies the published
   speeds until it is told something else, as M98's does.

   WHAT IT DELIBERATELY DOES NOT DO, AND SAYS SO IN THE FEED.

     - It asserts nothing a document does not carry (invariant 3). No
       boundary is claimed, no sector owner, no handoff receiver: a
       transmission to a frequency is read back and the aircraft goes,
       and whether that was the right position is not graded, because no
       deck carries the combining table or the delegation that would say.
       Where a check is weaker than it looks the feed says "reminder,
       not a judgement".
     - It carries no standing training item (invariant 4). Nothing it
       flags is tagged to one, and the debrief says so.
     - It flies no approach intercept. Same reason M98 held back until it
       had runway records: the final approach course and the threshold
       are not in every deck. A clearance is read back; the aircraft is
       handed to the tower.
     - There is no wind model, so heading and track are the same number.
     - Straight between fixes. Arcs, holds and procedure turns are not
       flown, and a vector leg ends the published track.
     - Climb, descent and speed-change rates are ENGINE PARAMETERS, not
       aviation data. They set how fast the scope moves and are written
       as such below.

   ---------------------------------------------------------------
   THE CONTRACT

   window.FLY_FACILITY = {
     id:      'IND',          // facility label, used in every message
     prefix:  'indfly',       // id/class prefix and the stem of every
                              //   global this block defines
     ns:      'IND',          // the deck's namespace; needs the procedures
                              //   block's PFIX, procOf, trackTo for flown
                              //   procedures (without them only overflights)
     host:    function(){},   // the element the player fills, or null
     airportLL: function(icao){ return [lat,lon] },   // from the deck's data
     ref:     [lat,lon] | function(){},  // OPTIONAL. Origin of the scope and
                              //   of an overflight's radial and distance.
                              //   Default: the first airport with coordinates.
     outline: function(){ return [ring,...] },  // OPTIONAL. Lateral rings as
                              //   [[lat,lon],...], drawn dashed.
     flow:    function(){ return {airport,land:[..],dep:[..],name} | null },
                              // OPTIONAL. The configuration in force.
     frame:   function(){ return {text, seat, cfg, open:[..]} },  // OPTIONAL.
                              //   One line stating the frame before traffic.
     positions: function(){ return [{id,name,freq,open,owner:{id,name,freq}}] },
                              // OPTIONAL. What "contact ..." can switch to.
     towerFor: function(icao){ return {name,freq} | null },  // OPTIONAL.
     callName: function(role){ return 'Indianapolis Approach' }, // OPTIONAL.
     spoken:  function(cs){},  // OPTIONAL. Spoken callsign; lets "delta five
                              //   eight nine" find the strip.
     radiusNm: 60,            // OPTIONAL. Scope reach. Default: fitted.
     bank:    function(entry){},  // OPTIONAL. Receives the debrief.
     cycle:   'CIFP 261001'   // OPTIONAL. Quoted beside a published crossing.
   };

   A deck that cannot answer an optional function gets the honest
   fallback: the line is left out, never guessed.

   ---------------------------------------------------------------
   WHAT IT EXPORTS

   window.fly = { load(drill), validate(drill), step(dt), transmit(text),
                  mk(strip,i), track(strip), sim, FACILITY, ... }
   window[<prefix>Load|Rate|End|Send|Quick|Layers|Pick|Target]  the handlers

   A DRILL is {id, name, frame, strips:[strip...], rate:0|1|4|'hot'}, a
   STRIP is the strip block's row. `fly.load` refuses a drill whose strips
   cannot be flown and says why, strip by strip.
   ================================================================ */
(function(){
'use strict';

var F = window.FLY_FACILITY;
if(!F || !F.ns){ return; }                       /* no contract - do nothing, per the block contract */
var NS = window[F.ns];
var ST = window.strip;
if(!NS || !ST){ return; }                         /* no deck or no strip block */

var PFX = F.prefix || 'fly';
var FID = F.id || F.ns;
var HAVE_PROCS = !!(NS.PFIX && NS.procOf && NS.trackTo);

/* ---------- 0. small helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function el(id){ return document.getElementById(PFX + '-' + id); }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function fmtAlt(a){ return (Math.round(a / 100) * 100).toLocaleString('en-US'); }
function hundreds(a){ var h = Math.round(a / 100); return (h < 100 ? (h < 10 ? '00' : '0') : '') + h; }
function parseNum(v){ var n = parseFloat(String(v == null ? '' : v).replace(/[^\d.]/g, '')); return isFinite(n) ? n : null; }
/* A bare number under 1,000 is read as hundreds of feet - 80 is 8,000, 240 is
   24,000 - and FLnnn the way it is written. validate() says how it read. */
function parseAlt(v){
 if(v == null) return null;
 var s = String(v).trim().toUpperCase().replace(/,/g, '');
 if(!s) return null;
 var m = /^FL\s*(\d{2,3})$/.exec(s);
 if(m) return +m[1] * 100;
 m = /^(\d+)$/.exec(s);
 if(!m) return null;
 var n = +m[1];
 return n === 0 ? null : (n < 1000 ? n * 100 : n);
}
var DIG = ['zero','one','two','three','four','five','six','seven','eight','niner'];
function sayDigits(s){ return String(s).split('').map(function(c){ return /\d/.test(c) ? DIG[+c] : c; }).join(' '); }
function sayRwy(r){
 var m = /^(\d{1,2})([LRC]?)$/.exec(String(r));
 if(!m) return String(r);
 var w = {L:'left', R:'right', C:'center'}[m[2]] || '';
 return sayDigits(m[1]) + (w ? ' ' + w : '');
}
function airportLL(icao){ return (typeof F.airportLL === 'function') ? (F.airportLL(icao) || null) : null; }
function cycleTag(){ return F.cycle || (NS.CIFP_CYCLE ? ('CIFP ' + NS.CIFP_CYCLE) : 'CIFP'); }

/* ---------- 1. geometry - a flat plane around one reference point ---------- */
var REFLL = null;
function refLL(){
 if(REFLL) return REFLL;
 var r = (typeof F.ref === 'function') ? F.ref() : F.ref;
 if(!r){
  var ap = ST.airportsHere();
  for(var i = 0; i < ap.length && !r; i++){ r = airportLL(ap[i]); }
 }
 REFLL = r || [0, 0];
 return REFLL;
}
function xy(ll){
 var r = refLL();
 return {x:(ll[1] - r[1]) * Math.cos(r[0] * Math.PI / 180) * 60, y:(ll[0] - r[0]) * 60};
}
function dist(a, b){ var dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }
function crs(a, b){ return (Math.atan2(b.x - a.x, b.y - a.y) * 180 / Math.PI + 360) % 360; }
function angDiff(from, to){ return ((to - from + 540) % 360) - 180; }
function radial(r, d){ var t = r * Math.PI / 180; return {x:d * Math.sin(t), y:d * Math.cos(t)}; }

/* ---------- 2. the published track ---------- */
function procFor(s){
 var dep = (ST.roleOf(s) === 'departure');
 var apt = dep ? s.dep : s.dest, id = dep ? s.sid : s.gate;
 return {dep:dep, apt:apt, id:id,
         p:(HAVE_PROCS && apt && id) ? NS.procOf(apt, id) : null};
}
function transOptions(s){
 var q = procFor(s);
 return (q.p && q.p.trans) ? Object.keys(q.p.trans).sort() : [];
}
/* Runway transitions are keyed RWnn, RWnnL, RWnnB in the coded source, and a
   runway the strip names as 5L may be filed RW05L. Try the spellings in turn;
   nothing is invented when none matches. */
function rwKey(p, rwy){
 if(!p || !p.rwy || !rwy) return null;
 var m = /^(\d{1,2})([LRC]?)$/.exec(String(rwy));
 if(!m) return null;
 var n1 = String(+m[1]), n2 = (m[1].length < 2 ? '0' : '') + m[1], s = m[2];
 var cand = ['RW' + n2 + s, 'RW' + n1 + s, 'RW' + n2 + 'B', 'RW' + n1 + 'B', 'RW' + n2, 'RW' + n1];
 for(var i = 0; i < cand.length; i++){ if(p.rwy[cand[i]]) return cand[i]; }
 return null;
}
function legHas(legs, fix){
 for(var i = 0; i < (legs || []).length; i++){ if(legs[i].f === fix) return true; }
 return false;
}
/* Which transition the strip is on. The transition the trainee chose, else the
   one that holds the fix it is running to; none when that fix is in the common
   part, because the aircraft has already flown past every transition. A SID is
   the other way round and needs one to reach anywhere, so it takes the first. */
function pickTrans(s, q){
 var keys = (q.p && q.p.trans) ? Object.keys(q.p.trans).sort() : [];
 if(!keys.length) return null;
 if(s.trans && q.p.trans[s.trans]) return s.trans;
 if(!q.dep){
  if(s.dtgFix){
   for(var i = 0; i < keys.length; i++){ if(legHas(q.p.trans[keys[i]], s.dtgFix)) return keys[i]; }
   return null;
  }
  return keys[0];
 }
 return keys[0];
}
/* A restriction as the published table writes it, as an allowed band. */
function band(g){
 var lo = null, hi = null;
 if(g.at != null){ lo = g.at; hi = g.at; }
 if(g.above != null) lo = g.above;
 if(g.below != null) hi = g.below;
 if(g.lo != null) lo = g.lo;
 if(g.hi != null) hi = g.hi;
 return {lo:lo, hi:hi};
}
function conText(pt){
 if(pt.lo != null && pt.hi != null) return pt.lo === pt.hi ? ('at ' + fmtAlt(pt.lo)) : ('between ' + fmtAlt(pt.lo) + ' and ' + fmtAlt(pt.hi));
 if(pt.lo != null) return 'at or above ' + fmtAlt(pt.lo);
 if(pt.hi != null) return 'at or below ' + fmtAlt(pt.hi);
 return '';
}

function overflightTrack(s){
 var er = parseNum(s.entryR), ed = parseNum(s.entryD), xr = parseNum(s.exitR), xd = parseNum(s.exitD);
 var out = {ok:false, pts:[], total:0, endVec:false, kind:'overflight', id:'', note:''};
 if(er == null || ed == null || xr == null || xd == null){
  out.note = 'an overflight needs an entry radial and distance and an exit radial and distance';
  return out;
 }
 var a = radial(er, ed), b = radial(xr, xd);
 var d = dist(a, b);
 if(d < 1){ out.note = 'the entry and the exit are the same point'; return out; }
 out.pts = [{x:a.x, y:a.y, fix:'entry', cum:0}, {x:b.x, y:b.y, fix:'exit', cum:d}];
 out.total = d; out.ok = true;
 return out;
}
function buildTrack(s){
 var role = ST.roleOf(s);
 if(role === 'overflight') return overflightTrack(s);
 var q = procFor(s);
 var out = {ok:false, pts:[], total:0, endVec:false, kind:q.dep ? 'SID' : 'STAR', id:q.id || '', apt:q.apt, entry:null, rw:null, skipped:0, note:''};
 if(!HAVE_PROCS){ out.note = 'this deck carries no published procedures to fly'; return out; }
 if(!q.p){ out.note = 'no ' + (q.dep ? 'departure' : 'arrival') + ' procedure is selected, or ' + (q.id || 'it') + ' is not published at ' + (q.apt || 'that field'); return out; }
 out.entry = pickTrans(s, q);
 out.rw = rwKey(q.p, q.dep ? s.depRwy : s.rwy);
 var legs = NS.trackTo(q.apt, q.id, out.entry, out.rw) || [];
 var pts = [], last = null, cum = 0;
 for(var i = 0; i < legs.length; i++){
  var g = legs[i];
  if(!g.f) continue;                                   /* a vector leg names no fix: it ends the line or is the stand-in climb-out */
  var ll = NS.PFIX[g.f];
  if(!ll || !isFinite(ll[0])){ out.skipped++; continue; }
  var p = xy(ll), b = band(g);
  if(last && last.fix === g.f){                        /* a join printed twice is one crossing */
   if(b.lo != null) last.lo = b.lo;
   if(b.hi != null) last.hi = b.hi;
   if(g.spd != null) last.spd = g.spd;
   continue;
  }
  if(last) cum += dist(last, p);
  last = {x:p.x, y:p.y, fix:g.f, cum:cum, lo:b.lo, hi:b.hi, spd:(g.spd != null ? g.spd : null)};
  pts.push(last);
 }
 out.endVec = !!(legs.length && legs[legs.length - 1].vec);
 if(q.dep){
  /* The published SID starts at its first coded fix, never at the field: the
     climb-out to it is not coded. Start at the field and draw that leg straight,
     the way M98 does, and say it is a stand-in. */
  var fll = airportLL(q.apt);
  if(fll && pts.length){
   var f0 = xy(fll), gap = dist(f0, pts[0]);
   if(gap > 0.2){
    for(var k = 0; k < pts.length; k++) pts[k].cum += gap;
    pts.unshift({x:f0.x, y:f0.y, fix:q.apt, cum:0, lo:null, hi:null, spd:null, field:true});
    out.standIn = gap;
   }
  }
 }
 if(pts.length < 2){ out.note = (q.id + ' carries fewer than two fixes with coordinates for this runway and transition, so there is no line to fly'); return out; }
 out.pts = pts; out.total = pts[pts.length - 1].cum; out.ok = true;
 return out;
}
function fixCum(tr, name){
 for(var i = 0; i < tr.pts.length; i++){ if(tr.pts[i].fix === name) return tr.pts[i].cum; }
 return null;
}
function pointAt(tr, d){
 var p = tr.pts;
 if(!p.length) return null;
 if(d <= 0 || p.length < 2) return {x:p[0].x, y:p[0].y, hdg:p.length > 1 ? crs(p[0], p[1]) : 0};
 for(var i = 1; i < p.length; i++){
  if(d <= p[i].cum){
   var a = p[i - 1], b = p[i], seg = b.cum - a.cum, f = seg > 0 ? (d - a.cum) / seg : 0;
   return {x:a.x + (b.x - a.x) * f, y:a.y + (b.y - a.y) * f, hdg:crs(a, b)};
  }
 }
 var L = p[p.length - 1], pv = p[p.length - 2];
 return {x:L.x, y:L.y, hdg:crs(pv, L)};
}

/* ---------- 3. sim state ---------- */
var sim = {t:0, rate:0, hot:false, ac:[], feed:[], sel:null, drill:null, ended:false,
           layers:'tracked', target:20, timing:[], tx:0, pausedTx:0, tally:{good:0, flag:0, crit:0},
           los:{}, scale:null, lastTx:null, lastReal:0};
var LAYER_MODES = [
 {id:'tracked', label:'tracked traffic'},
 {id:'stars',   label:'all STARs'},
 {id:'sids',    label:'all SIDs'},
 {id:'both',    label:'all SIDs + STARs'},
 {id:'off',     label:'off'}
];
function clock(){ var m = Math.floor(sim.t / 60), s = Math.floor(sim.t % 60); return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
function log(kind, html){
 sim.feed.unshift({t:clock(), kind:kind, html:html});
 if(kind === 'good' || kind === 'flag' || kind === 'crit') sim.tally[kind]++;
 if(sim.feed.length > 160) sim.feed.pop();
 renderFeed();
}
function chip(kind, label){ return '<span class="' + PFX + '-chip ' + kind + '">' + esc(label || kind) + '</span>'; }

/* ENGINE PARAMETERS - how fast the scope moves, not facts about any aircraft
   or facility. Feet per minute climbing and descending by engine type, speed
   change in knots per second, and the 3-degree descent gradient that sets when
   an aircraft on a descend-via starts down. */
var CLIMB = {jet:2400, turboprop:1500, piston:700};
var DESC  = {jet:2000, turboprop:1200, piston:700};
var ACCEL = 1.5;
var GRAD  = 318;
var TURN  = 3;

/* ---------- 4. aircraft ---------- */
function mkAc(s, i){
 var role = ST.roleOf(s);
 var rules = (s.rules === 'VFR') ? 'VFR' : 'IFR';
 var tr = buildTrack(s);
 var eng = s.engine || 'jet';
 var ias = parseNum(s.ias);
 var st = ST.RADAR_STATES[ST.normRadar(s.radar, rules, role)] || {};
 var a = {i:i, strip:s, cs:String(s.cs || '').toUpperCase(), role:role, type:s.type || '', wake:ST.wakeOf(s.type),
  rules:rules, radar:ST.normRadar(s.radar, rules, role), ident:!!st.ident, code:!!st.code, cleared:!!st.cleared,
  engine:eng, alive:true, onFreq:false, handed:null, handedAt:0, flashed:false, flashTo:null,
  spawnAt:(s.ckdIn ? 0 : Math.max(0, parseNum(s.spawnAt) || 0)), checkT:null, checkReal:0, distAtCheck:0, firstWord:null,
  track:tr, dist:0, nav:'track', hdg:0, hdgTgt:null, turn:null, directTo:null, next:0,
  alt:parseAlt(s.alt) || 0, altAsg:null, via:false,
  ias:ias || ({jet:250, turboprop:180, piston:110}[eng] || 250), spdAsg:null, pubLimit:null, pubOn:true,
  gs:0, x:0, y:0, trail:[], endT:null, notes:{}, wasInside:null, rwy:s.rwy || '', appr:null, altim:!!s.altim};
 a.iasNorm = a.ias;
 /* a departure's cleared altitude, when the drill carries one; the strip row itself has no box for it */
 if(role === 'departure' && parseAlt(s.climbTo) != null){ a.altAsg = parseAlt(s.climbTo); a.altFrom = 'drill'; }
 if(s.mode === 'assigned' && parseNum(s.asg)){ a.spdAsg = parseNum(s.asg); a.ias = Math.min(a.ias, a.spdAsg) || a.ias; a.iasNorm = a.ias; }
 if(tr.ok){
  if(role === 'arrival'){
   var d0 = 0;
   if(s.dtgFix && fixCum(tr, s.dtgFix) != null) d0 = fixCum(tr, s.dtgFix) - (parseNum(s.dtgNm) || 0);
   else if(parseNum(s.dtg)) d0 = tr.total - parseNum(s.dtg);
   a.dist = clamp(d0, 0, tr.total);
   a.via = (rules === 'IFR');
  } else if(role === 'departure'){
   a.dist = clamp(parseNum(s.fromStart) || 0, 0, tr.total);
  }
  var p = pointAt(tr, a.dist);
  a.x = p.x; a.y = p.y; a.hdg = p.hdg;
  while(a.next < tr.pts.length && tr.pts[a.next].cum <= a.dist) a.next++;
 }
 return a;
}
function maxDist(){ return 400; }

/* Descend via: the altitude an arrival must be at or below NOW to meet every
   published ceiling ahead on a 3-degree path, never below the next published
   floor. Nothing ahead and it holds what it has. */
function viaTarget(a){
 var p = a.track.pts, d = a.dist, maxNow = Infinity, floor = null;
 /* The path is never steeper than the aircraft can fly it: at a high true airspeed a fixed
    descent rate covers more ground per foot, so the gradient it can hold shrinks, and the
    aircraft starts down earlier rather than missing the crossing. */
 var gs = Math.max(a.gs || a.ias, 150), g = Math.min(GRAD, ((DESC[a.engine] || 2000) / (gs / 60)) * 0.85);
 for(var i = 0; i < p.length; i++){
  var pt = p[i];
  if(pt.cum < d - 0.05) continue;
  var dd = Math.max(0, pt.cum - d);
  if(pt.hi != null) maxNow = Math.min(maxNow, pt.hi + g * dd);
  if(floor == null && pt.lo != null) floor = pt.lo;
 }
 if(maxNow === Infinity) return null;
 var t = Math.min(a.alt, maxNow);
 if(floor != null) t = Math.max(t, Math.min(floor, a.alt));
 return t;
}
/* A departure with no altitude assigned climbs to the highest FLOOR the SID still has
   ahead of it - a published "at or above" - and no further. The published SID gives no
   top altitude, so the engine does not make one up: past the last floor it holds what it
   has until it is told, and says so once. */
function climbTarget(a){
 var p = a.track.pts, top = null;
 for(var i = 0; i < p.length; i++){
  if(p[i].cum < a.dist - 0.05) continue;
  if(p[i].lo != null && (top == null || p[i].lo > top)) top = p[i].lo;
 }
 return top;
}
function altTarget(a){
 if(a.altAsg != null) return a.altAsg;
 if(a.role === 'departure' && a.nav === 'track') return climbTarget(a);
 if(a.via && a.nav === 'track') return viaTarget(a);
 return null;
}
/* Published speed: the limit last passed holds until the next one, and the
   aircraft starts slowing early enough to meet the next. */
function speedTarget(a){
 var base = a.iasNorm;
 if(a.spdAsg != null) base = a.spdAsg;
 else if(a.pubOn && a.nav === 'track'){
  var lim = (a.pubLimit != null) ? a.pubLimit : Infinity;
  var p = a.track.pts, gs = Math.max(a.gs || a.ias, 100);
  for(var i = 0; i < p.length; i++){
   var pt = p[i];
   if(pt.spd == null || pt.cum < a.dist) continue;
   var need = (a.ias - pt.spd) > 0 ? ((a.ias - pt.spd) / ACCEL) * (gs / 3600) + 0.5 : 0;
   if(pt.cum - a.dist <= need) lim = Math.min(lim, pt.spd);
   break;                                              /* the next restriction only */
  }
  if(lim < Infinity) base = Math.min(base, lim);
 }
 return base;
}
function inside(ring, p){
 var c = false;
 for(var i = 0, j = ring.length - 1; i < ring.length; j = i++){
  var a = ring[i], b = ring[j];
  if(((a.y > p.y) !== (b.y > p.y)) && (p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x)) c = !c;
 }
 return c;
}
var OUTLINE = null;
function outlineRings(){
 if(OUTLINE) return OUTLINE;
 var rings = (typeof F.outline === 'function') ? (F.outline() || []) : [];
 OUTLINE = rings.map(function(r){ return r.map(function(v){ return xy(v); }); });
 return OUTLINE;
}
function insideOutline(p){
 var rs = outlineRings();
 for(var i = 0; i < rs.length; i++){ if(inside(rs[i], p)) return true; }
 return false;
}
function onWhat(a){
 return a.track.kind === 'overflight' ? 'its line' : ('the ' + a.track.id + (a.track.kind === 'SID' ? ' departure' : ' arrival'));
}

function crossed(a, pt){
 var bad = null;
 if(pt.hi != null && a.alt > pt.hi + 100) bad = 'above';
 if(pt.lo != null && a.alt < pt.lo - 100) bad = 'below';
 var con = conText(pt);
 if(con){
  if(bad){
   log('flag', chip('flag') + '<b>' + esc(a.cs) + '</b> crossed ' + esc(pt.fix) + ' at ' + fmtAlt(a.alt)
    + ' - the published crossing is ' + esc(con) + ' (' + esc(cycleTag()) + '). '
    + (a.altAsg != null ? (a.altFrom === 'drill' ? 'The drill cleared it to that altitude, which overrides the published crossing. ' : 'An assigned altitude overrides a published crossing; that one is yours. ') : '')
    + 'Reminder, not a judgement: the engine flies straight between fixes and has no wind.');
  } else {
   log('good', chip('good') + '<b>' + esc(a.cs) + '</b> crossed ' + esc(pt.fix) + ' at ' + fmtAlt(a.alt) + ' - ' + esc(con) + ': met.');
  }
 }

   + '<br>' + fmtAlt(a.alt) + (at != null && Math.abs(at - a.alt) > 50 ? ' → ' + fmtAlt(at) : (a.altAsg != null && Math.abs(a.altAsg - a.alt) > 50 ? ' → ' + fmtAlt(a.altAsg) : '')) + ' ft · ' + Math.round(a.ias) + ' kt'
   + (a.rwy ? ' · rwy ' + esc(a.rwy) : '')
   + (nf ? '<br>next ' + esc(nf.fix) + ' ' + (nf.cum - a.dist).toFixed(1) + ' NM' + (conText(nf) ? ' · ' + esc(conText(nf)) : '') + (nf.spd != null ? ' · ≤' + nf.spd + ' kt' : '') : '')
   + (st ? '<br>' + st : '') + '</div>';
 }).join('');
}
function renderFeed(){
 var e = el('feed'); if(!e) return;
 e.innerHTML = sim.feed.length
  ? sim.feed.map(function(f){ return '<p><span class="t">' + f.t + '</span>' + f.html + '</p>'; }).join('')
  : '<p class="coach">Frequency quiet. Load a drill, set the rate, and key up.</p>';
}
function median(a){ var s = a.slice().sort(function(x, y){ return x - y; }); return s.length ? s[Math.floor(s.length / 2)] : null; }
function statsHtml(){
 var since = sim.lastTx ? Math.round((Date.now() - sim.lastTx) / 1000) + ' s' : '—';
 var med = median(sim.timing.map(function(x){ return x.lag; }));
 var old = null;
 sim.ac.forEach(function(a){ if(a.onFreq && a.alive && !a.handed && a.firstWord == null){ var w = (Date.now() - a.checkReal) / 1000; if(old == null || w > old.w) old = {cs:a.cs, w:w}; } });
 return 'Key-up target <input class="' + PFX + '-tin" id="' + PFX + '-target" value="' + sim.target + '" onchange="' + PFX + 'Target()" size="3">s'
  + ' · Since last transmission ' + since
  + ' · Median acknowledgement ' + (med == null ? '—' : med.toFixed(1) + ' s')
  + ' · Oldest unanswered ' + (old ? esc(old.cs) + ' ' + Math.round(old.w) + ' s' : 'none');
}
function quickHtml(){
 var a = sim.ac.filter(function(x){ return x.cs === sim.sel; })[0] || null;
 var q = [], fl = typeof F.flow === 'function' ? F.flow() : null;
 function add(label, cmd){ q.push('<button onclick="' + PFX + 'Quick(\'' + esc(cmd).replace(/'/g, '&#39;') + '\')">' + esc(label) + '</button>'); }
 if(a && a.role === 'arrival'){
  var rw = (fl && fl.land && fl.land.length) ? fl.land : ST.runwaysAt(a.strip.dest).slice(0, 2);
  rw.forEach(function(r){ add('expect ' + r, 'expect runway ' + r); });
  if(a.track.ok){ add('descend via', 'descend via the arrival'); add('resume published', 'resume published speed'); }
  var na = nextAlt(a); if(na != null) add('descend + maintain ' + fmtAlt(na), 'descend and maintain ' + na);
 }
 if(a && a.role === 'departure'){ add('climb + maintain', 'climb and maintain ' + (Math.ceil((a.alt + 3000) / 1000) * 1000)); }
 if(a){ add('speed 210', 'reduce speed to 210'); add('present heading', 'fly present heading'); add('flash', 'flash');
  if(typeof F.towerFor === 'function'){ var tw = F.towerFor(a.role === 'departure' ? a.strip.dep : a.strip.dest); if(tw) add('contact tower', 'contact tower ' + tw.freq); }
  /* a deck that cannot say which tower owns which runway offers every open tower, by name and frequency, and picks none */
  else receivers().filter(function(p){ return p.kind === 'twr' && p.open && p.freq; }).slice(0, 2).forEach(function(p){ add('contact ' + p.name, 'contact ' + p.name + ' ' + p.freq); });
 }
 return q.join('');
}
function barHtml(){
 return '<span id="' + PFX + '-ratebar"><button data-r="0" onclick="' + PFX + 'Rate(0)">pause</button> <button data-r="1" onclick="' + PFX + 'Rate(1)">1×</button> <button data-r="4" onclick="' + PFX + 'Rate(4)">4×</button> <button data-r="hot" onclick="' + PFX + 'Rate(\'hot\')">run hot</button></span>'
  + '<button onclick="' + PFX + 'End()">End drill + debrief</button>'
  + '<span class="' + PFX + '-clock" id="' + PFX + '-clock">T+' + clock() + ' · ' + (sim.rate === 0 ? 'paused' : sim.rate + '×') + '</span>';
}
function liveHtml(){
 return '<div class="' + PFX + '-bar" id="' + PFX + '-barhost">' + barHtml() + '</div>'
  + '<div class="' + PFX + '-mono" id="' + PFX + '-title" style="font-size:11.5px;color:var(--dim);margin-bottom:8px;">Load a drill to begin - build one under Set up a drill.</div>'
  + '<div class="' + PFX + '-bar" id="' + PFX + '-layerbar" style="margin:6px 0 8px;"><span class="' + PFX + '-mono" style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);">Routes drawn</span>'
  + LAYER_MODES.map(function(m){ return '<button data-l="' + m.id + '"' + (m.id === sim.layers ? ' class="on"' : '') + ' onclick="' + PFX + 'Layers(\'' + m.id + '\')">' + m.label + '</button>'; }).join('')
  + '<span class="' + PFX + '-mono" style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);margin-left:14px;">Range</span>'
  + ['fit', 40, 80, 160].map(function(r){ return '<button data-rg="' + r + '"' + (String(sim.range || 'fit') === String(r) ? ' class="on"' : '') + ' onclick="' + PFX + 'Range(\'' + r + '\')">' + (r === 'fit' ? 'fit' : r + ' NM') + '</button>'; }).join('') + '</div>'
  + '<div class="' + PFX + '-scopewrap"><div id="' + PFX + '-scopebox"></div></div>'
  + '<div class="' + PFX + '-strips" id="' + PFX + '-strips"></div>'
  + '<div class="' + PFX + '-cmdrow"><input class="' + PFX + '-cmd" id="' + PFX + '-cmd" placeholder="Transmit — e.g. DAL589 descend and maintain 8000 · reduce speed to 210 · fly heading 270 · flash · contact tower 118.3" onkeydown="if(event.key===\'Enter\')' + PFX + 'Send()">'
  + '<button class="' + PFX + '-send" onclick="' + PFX + 'Send()">Transmit</button></div>'
  + '<div class="' + PFX + '-quick" id="' + PFX + '-quick"></div>'
  + '<div class="' + PFX + '-stat" id="' + PFX + '-stat"></div>'
  + '<div class="' + PFX + '-feed" id="' + PFX + '-feed"><p class="coach">Frequency quiet. Load a drill, set the rate, and key up.</p></div>'
  + '<div id="' + PFX + '-debriefbox"></div>'
  + '<div class="' + PFX + '-note">Engine notes: the aircraft fly the facility’s own published tracks - the fix coordinates, crossing restrictions and speed limits are ' + esc(cycleTag()) + ' and nothing here adds to them. An arrival descends via the published altitudes and flies the published speeds until it is told something else; below 10,000 the crew holds 250; a bare “maintain” away from the current altitude draws a crew query. Straight between fixes, no wind, no approach intercept. <b>Nothing is scored against a standing item</b> and nothing flagged is a judgement on how the facility works - the engine does not know who owns a handoff, where a sector boundary is or what a sector’s own minima are. Climb, descent and speed-change rates are engine parameters, not aviation data.</div>';
}
function render(){
 var b = el('scopebox'); if(!b) return;
 b.innerHTML = scopeSvg();
 var s = el('strips'); if(s) s.innerHTML = stripsHtml();
 var c = el('clock'); if(c) c.textContent = 'T+' + clock() + ' · ' + (sim.ended ? 'ended' : (sim.rate === 0 ? 'paused' : (sim.hot ? 'run hot' : sim.rate + '×')));
 var t = el('title'); if(t && sim.title) t.textContent = sim.title;
 var q = el('quick'); if(q) q.innerHTML = quickHtml();
 var st = el('stat'); if(st && document.activeElement !== el('target')) st.innerHTML = statsHtml();
 var rb = el('ratebar');
 if(rb && rb.querySelectorAll){
  [].slice.call(rb.querySelectorAll('button')).forEach(function(x){
   var r = x.getAttribute('data-r'), on = (r === 'hot') ? sim.hot : (!sim.hot && String(sim.rate) === r);
   if(x.classList) x.classList.toggle('on', on);
  });
 }
 var lb = el('layerbar');
 if(lb && lb.querySelectorAll){
  [].slice.call(lb.querySelectorAll('button')).forEach(function(x){
   if(!x.classList) return;
   var l = x.getAttribute('data-l'), rg = x.getAttribute('data-rg');
   x.classList.toggle('on', l ? l === sim.layers : String(sim.range || 'fit') === rg);
  });
 }
}

/* ---------- 10. the look ---------- */
var CSS = ''
 + '.' + PFX + '-panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin:14px 0;}'
 + '.' + PFX + '-mono{font-family:var(--mono);}'
 + '.' + PFX + '-scopewrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;}'
 + '.' + PFX + '-scope{width:100%;height:auto;display:block;}'
 + '.' + PFX + '-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0;}'
 + '.' + PFX + '-bar button,.' + PFX + '-quick button{font-family:var(--mono);font-size:11.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer;}'
 + '.' + PFX + '-bar button:hover,.' + PFX + '-quick button:hover{color:var(--ink);border-color:var(--dim2);}'
 + '.' + PFX + '-bar button.on{color:var(--green);border-color:var(--green);}'
 + '.' + PFX + '-clock{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:auto;}'
 + '.' + PFX + '-strips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}'
 + '.' + PFX + '-strip{flex:1 1 190px;min-width:170px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.5;cursor:pointer;}'
 + '.' + PFX + '-strip.sel{border-color:var(--green);}'
 + '.' + PFX + '-strip.gone{opacity:0.35;}'
 + '.' + PFX + '-strip b{color:var(--ink);font-size:12.5px;}'
 + '.' + PFX + '-strip .warn{color:var(--amber);}'
 + '.' + PFX + '-cmdrow{display:flex;gap:8px;flex-wrap:wrap;}'
 + '.' + PFX + '-cmd{flex:1 1 260px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;color:var(--ink);font-family:var(--mono);font-size:12.5px;padding:9px 10px;}'
 + '.' + PFX + '-cmd:focus{outline:2px solid var(--green);outline-offset:1px;}'
 + '.' + PFX + '-send{font-family:var(--mono);font-size:12px;background:var(--green);color:#062;border:0;border-radius:4px;padding:9px 16px;cursor:pointer;font-weight:600;}'
 + '.' + PFX + '-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}'
 + '.' + PFX + '-stat{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:10px;}'
 + '.' + PFX + '-tin{background:var(--panel2);border:1px solid var(--line);border-radius:3px;color:var(--ink);font-family:var(--mono);font-size:11px;padding:2px 4px;width:34px;}'
 + '.' + PFX + '-feed{max-height:300px;overflow-y:auto;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:12.5px;margin-top:12px;}'
 + '.' + PFX + '-feed p{margin:0 0 7px;line-height:1.45;}'
 + '.' + PFX + '-feed .t{font-family:var(--mono);font-size:10.5px;color:var(--dim2);margin-right:6px;}'
 + '.' + PFX + '-feed .crew{font-style:italic;color:var(--ink);}'
 + '.' + PFX + '-feed .coach{color:var(--dim);}'
 + '.' + PFX + '-chip{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;border-radius:2px;padding:1px 6px;margin-right:6px;text-transform:uppercase;}'
 + '.' + PFX + '-chip.good{background:rgba(79,224,160,0.15);color:var(--green);}'
 + '.' + PFX + '-chip.flag{background:rgba(232,162,61,0.15);color:var(--amber);}'
 + '.' + PFX + '-chip.crit{background:rgba(232,96,77,0.18);color:var(--red);}'
 + '.' + PFX + '-chip.info{background:rgba(111,128,121,0.18);color:var(--dim);}'
 + '.' + PFX + '-note{font-size:12px;color:var(--dim2);border-left:2px solid var(--line);padding-left:10px;margin-top:12px;}'
 + '.' + PFX + '-debrief h3{font-family:var(--display);font-size:17px;margin:0 0 10px;}'
 + '.' + PFX + '-debrief li{margin-bottom:6px;font-size:13.5px;}'
 + '@media (max-width:600px){.' + PFX + '-strip{flex-basis:100%;}.' + PFX + '-feed{max-height:240px;}}';
function mountCss(){
 if(typeof document === 'undefined' || !document.getElementById || document.getElementById(PFX + '-css')) return;
 var st = document.createElement('style'); st.id = PFX + '-css'; st.textContent = CSS; document.head.appendChild(st);
}

/* ---------- 11. handlers and mount ---------- */
window[PFX + 'Load'] = function(d){ return load(d); };
window[PFX + 'Rate'] = function(r){ setRate(r); };
window[PFX + 'End'] = function(){ endDrill(); };
window[PFX + 'Bank'] = function(){ bank(); };
window[PFX + 'Send'] = function(){ var e = el('cmd'); if(!e) return; var v = e.value; e.value = ''; transmit(v); };
window[PFX + 'Quick'] = function(c){ var e = el('cmd'); if(!e) return; e.value = (sim.sel ? sim.sel + ' ' : '') + c; var v = e.value; e.value = ''; transmit(v); };
window[PFX + 'Layers'] = function(m){ sim.layers = m; render(); };
window[PFX + 'Range'] = function(r){ sim.range = (r === 'fit') ? null : parseInt(r, 10); sim.scale = null; render(); };
window[PFX + 'Pick'] = function(cs){ sim.sel = (sim.sel === cs) ? null : cs; render(); };
window[PFX + 'Target'] = function(){ var e = el('target'); var v = e ? parseInt(e.value, 10) : NaN; if(v >= 5 && v <= 120){ sim.target = v; render(); } };

function mount(){
 mountCss();
 var host = (typeof F.host === 'function') ? F.host() : null;
 if(!host) return;
 host.innerHTML = liveHtml();
 renderFeed(); render();
 startClockIdle();
}
/* The clock is only started by a rate button; this keeps the stats line fresh
   while paused, because "since last transmission" is wall time. */
function startClockIdle(){
 if(typeof setInterval !== 'function') return;
 var h = setInterval(function(){ var st = el('stat'); if(st && document.activeElement !== el('target')) st.innerHTML = statsHtml(); }, 1000);
 if(h && h.unref) h.unref();
}

window.fly = {
 FACILITY:F, sim:sim, load:load, validate:validate, step:step, transmit:transmit, mk:mkAc, track:buildTrack,
 viaTarget:viaTarget, parseAlt:parseAlt, despell:despell, pointAt:pointAt, xy:xy, render:render, setRate:setRate,
 end:endDrill, tracksFor:tracksFor, LAYER_MODES:LAYER_MODES, transOptions:transOptions, procFor:procFor, fixCum:fixCum,
 conText:conText, esc:esc, mountCss:mountCss, haveProcs:HAVE_PROCS, find:findAc,
 CLIMB:CLIMB, DESC:DESC, ACCEL:ACCEL, GRAD:GRAD
};

if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', mount); }
else { mount(); }

})();
</script>
