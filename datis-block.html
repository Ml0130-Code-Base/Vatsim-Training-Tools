<script>
/* ================================================================
   MASTER D-ATIS BLOCK - read the broadcast, find the flow, set the frame.

   Derived from the D-ATIS and weather reader the C90, AZO, S56, Big Sky and
   R90 decks carry (the grammar-driven reader, issue #13 and #18) and
   generalised behind a facility contract, so a deck that carries a
   configuration table can have its flow set from the broadcast instead of by
   hand. First used by the three ZID decks, 2026-10-20, on the owner's
   instruction: trim the routes to the flow, and make sure the D-ATIS feed is
   there to decide the flow.

   WHAT IT DOES. Reads a pasted or fetched D-ATIS - the runways in use, the
   approach advertised to each, the weather, the information letter, the
   closures - and matches the advertised runways against the deck's own
   configuration table. When exactly one configuration fits, it sets the
   frame's configuration, and the wind and flight category come with it.
   When none or several fit it SAYS SO and sets nothing about the flow: a
   frame-setting tool's worst failure is a confident wrong flow, and that is
   the failure the live pulls of M98 (#13) found twice.

   THE READER IS THE SHARED ONE, PLUS TWO ADDITIONS. The CODE from RWY_ONE to
   wxRead below is the C90 block's, which is the copy the other decks carry;
   some of its comments are shortened here and nothing else differs. The
   additions are wxExpected and readAll, kept outside the copied code: CVG
   writes its arrival broadcast "EXPECT ILS APPROACH TO RWY 36R" and SDF
   writes "VISUAL APCH RWY 17L AND 17R" with the "IN USE" in the next
   sentence, and the shared reader reads both as nothing. See the comment
   above them.

   The shared reader is grammar-driven, not shaped to one field: the
   sentence is the unit, a runway only ever comes off a runway keyword or an
   approach clause, and any sentence naming a runway as shut, out of service
   or unusable contributes nothing to the flow. The closures are READ
   SEPARATELY and are read-only - they are shown, never fed to the flow.
   A change to the reader lands in every copy in the same commit.

   ONE NETWORK CALL, OPTIONAL BY CONSTRUCTION. The fetch button asks
   atis.info for the field's D-ATIS. It is never on a path the tool needs,
   every failure hands straight to the paste box, and the parser it feeds is
   the same one paste uses - the test root CLAUDE.md invariant 6 sets for any
   network idea. There is no second call: no METAR fallback, no other host.
   A page opened from file:// may be refused by the server; paste always works.

   PASTE EITHER. The FAA D-ATIS and the vATIS profile the sim actually
   broadcasts are different texts; the reader takes either, and the facility
   references carry the vATIS presets so a pasted preset can be checked
   against the configuration it names.

   ---------------------------------------------------------------
   THE CONTRACT

   window.DATIS_FACILITY = {
     id:      'IND',
     ns:      'IND',                 // the deck's namespace; must carry CONFIGS
     prefix:  'indw',                // id/class prefix; also window[prefix]
     sectionClass: 'ind-section',    // the deck's own section class, so the
                                     //   section looks like its neighbours
     fields:  [ {id:'KIND', name:'Indianapolis Intl', datis:true} ],
     before:  'indb-frame',          // id of the section this one is inserted
                                     //   ahead of; without it, appended to .wrap
     configs: function(){ return NS.CONFIGS; },
                                     // [{id, name, land:[...], dep:[...]}]
     frame:   function(){ return {config:'5'}; },   // OPTIONAL: the frame now
     apply:   function(set){...},    // OPTIONAL: {config, wdir, wkt, cat} -
                                     //   only the keys the broadcast settled
     load:    function(){...},       // OPTIONAL persistence: return the saved
     save:    function(x){...},      //   {field, text} / store it. Without them
                                     //   the pasted text lives in memory only.
     rails:   function(section){...},// OPTIONAL: mount the deck's note rail
     log:     function(msg, kind){}  // OPTIONAL: the deck's feed
   };

   WHAT IT EXPORTS: NS.datis and window[prefix] =
     {FIELDS, read, runways, observation, category, clean, keyed, labels,
      notices, closures, itemName, match, state, doRead, doFetch}
   read(text) and match(read, configs) are pure.
   ================================================================ */
(function(){
'use strict';

var F = window.DATIS_FACILITY;
if(!F || !F.ns || !F.fields){ return; }          /* no contract - do nothing, per the block contract */
var NS = window[F.ns];
if(!NS){ return; }                                /* deck absent */

var PFX = F.prefix || 'dw';
var FID = F.id || F.ns;
var DATIS_URL  = 'https://atis.info/api/';
var DATIS_NAME = 'atis.info';
var FIELDS = F.fields;

/* ---------- 1. The reader ----------
   The code is the C90 block's, which is the copy the other decks carry
   (comments shortened). Do not edit it here alone: a change to the reader
   lands in every copy in the same commit. */

var RWY_ONE = /\d{1,2}[LRC]?/.source;
/* RY is a real spelling - KSLC writes every runway "RY 16L", and KOMA and
   KBOI both use it in their notice sections. */
var RWY_KEY = /(?:RWYS?|RUNWAYS?|RYS?)\s+/.source;
/* Items divide on a comma, an AND, or plain whitespace - KORD writes
   "RWYS 22L 28R" - and the keyword may repeat, as MSP's "RWY 30L, RWY
   30R" does. */
var RWY_SEP = '(?:' + /\s*(?:,|AND)\s*/.source + '|' + /\s+/.source + ')(?:' + RWY_KEY + ')?';
var RWY_RUN = RWY_ONE + '(?:' + RWY_SEP + RWY_ONE + ')*';

/* Any sentence naming a runway as shut, out of service or unusable
   contributes nothing, whatever else it says. This is the guard that
   stands in for the notice heading at the fields that have none. */
var NOT_IN_USE = /\b(?:CLSD|CLOSED|OTS|OUT OF SERVICE|UNAVAILABLE|UNAVBL|UNAVL|UNUSABLE|CONDITION CODES?|DEICE|LAHSO|LAND AND HOLD SHORT)\b/;
var LAND_MARK  = /\b(?:LAND|LANDING|LNDG|ARR|ARRIVAL|ARRIVALS|ARRIVING)\b/;
var DEP_MARK   = /\b(?:DEPART|DEPARTING|DEPARTURE|DEPARTURES|DEPTG|DEPG|DEPS|DEP)\b/;
var APCH_WORD  = /(?:APCH(?:ES|S)?|APPROACH(?:ES)?)/.source;
var IN_USE     = new RegExp(APCH_WORD + /\s+IN\s+USE/.source);
/* KOMA puts the runways BETWEEN the approach word and the phrase -
   "VISUAL APCH 14R, 14L, 18 IN USE" - and whether a runway KEYWORD sits in
   front of them depends on which KOMA you are reading. So the keyword is
   OPTIONAL here, and that is the whole fix: with it mandatory-absent, ELEVEN OF
   KOMA'S TWELVE published configurations parsed to nothing. */
var APCH_LIST  = new RegExp(APCH_WORD + /\s+/.source + '(?:' + RWY_KEY + ')?' + '(' + RWY_RUN + ')' + /\s+IN\s+USE/.source);
var LEAD_WORDS = /\b(?:ARR|ARRS|ARRIVAL|ARRIVALS|ARRIVING|DEP|DEPS|DEPG|DEPTG|DEPARTING|DEPARTURE|DEPARTURES|LAND|LANDING|LNDG|EXP|EXPECT|EXPECTED|VECTORS|AND|OR|IN|USE|TO|FOR|ALL|ACFT)\b/g;

/* Read to the notices and never past them, where a heading exists. Both
   spellings cut: the FAA redefined NOTAM as "notice to air missions" and
   D-ATIS text is migrating to it a field at a time. */
function wxClean(text){
 return String(text == null ? '' : text)
   .replace(/\s+/g, ' ')
   .split(/NOTICE TO AIR(?:MEN|\s+MISSIONS)|NOTAMS?\b/)[0];
}
/* The other half of the same cut. wxClean keeps the text BEFORE the heading,
   and that stays the whole rule for the flow; this keeps the text after it,
   which is the closure list, and wxClosures below reads it as closures. */
function wxNotices(text){
 var p = String(text == null ? '' : text).replace(/\s+/g, ' ')
   .split(/NOTICE TO AIR(?:MEN|\s+MISSIONS)|NOTAMS?\b/);
 return p.length > 1 ? p.slice(1).join(' ').trim() : '';
}
/* A split broadcast is segmented BEFORE it is cleaned. Each half carries
   its own notice heading, so cleaning the joined text would cut at the
   arrival half's heading and throw the departure broadcast away with it. */
function wxSegments(text){
 return String(text == null ? '' : text).split(/\n\s*\n/).map(wxClean);
}
function wxPush(list, r){ if(list.indexOf(r) < 0) list.push(r); }
function wxItems(s){
 var out = [], m = String(s || '').match(/\d{1,2}[LRC]?/g) || [];
 m.forEach(function(r){ wxPush(out, r); });
 return out;
}
function wxKeyed(s){
 var re = new RegExp(RWY_KEY + '(' + RWY_RUN + ')', 'g'), out = [], m;
 while((m = re.exec(String(s || '')))) wxItems(m[1]).forEach(function(r){ wxPush(out, r); });
 return out;
}
function wxLabel(s){
 return String(s || '')
   .replace(new RegExp(APCH_WORD, 'g'), ' ')
   .replace(LEAD_WORDS, ' ')
   .replace(/[^A-Z0-9 \/-]/g, ' ')
   .replace(/\s+/g, ' ').trim();
}
/* Pair each runway with the approach advertised to it, for the read-back.
   Display only - the runway sets are the authority, so a phrasing this
   cannot label still cannot lose a runway. */
function wxLabels(sent){
 var re = new RegExp('([A-Z0-9 \\/-]*?)' + RWY_KEY + '(' + RWY_RUN + ')', 'g');
 var out = [], m;
 while((m = re.exec(sent))){
  var rwys = wxItems(m[2]), name = wxLabel(m[1]);
  /* No name means this was not an approach statement - "LNDG AND DEPG RWY
     28L", or ORD's hold-short note about a runway already counted. The
     runway is already in the sets; only the display row is dropped. */
  if(!rwys.length || !name) continue;
  out.push({rwys:rwys, apch:name});
 }
 if(!out.length){
  var bare = sent.match(APCH_LIST);
  if(bare){
   var n = wxLabel(sent.slice(0, bare.index));
   if(n) out.push({rwys:wxItems(bare[1]), apch:n});
  }
 }
 return out;
}
function wxRunways(text){
 var land = [], dep = [], apch = [], used = [];
 wxSegments(text).forEach(function(seg){
  seg.toUpperCase().split('.').forEach(function(sent){
   if(!sent || NOT_IN_USE.test(sent)) return;
   var rwys = wxKeyed(sent);
   var bare = sent.match(APCH_LIST);
   if(bare) wxItems(bare[1]).forEach(function(r){ wxPush(rwys, r); });
   if(!rwys.length) return;
   var isApch = IN_USE.test(sent) || !!bare;
   var toLand = isApch || LAND_MARK.test(sent);
   var toDep  = DEP_MARK.test(sent);
   if(!toLand && !toDep) return;
   used.push(sent.replace(/^\s+/, ''));
   if(toLand) rwys.forEach(function(r){ wxPush(land, r); });
   if(toDep)  rwys.forEach(function(r){ wxPush(dep, r); });
   if(toLand) wxLabels(sent).forEach(function(c){ apch.push(c); });
  });
 });
 return {land:land, dep:dep, apch:apch, sentences:used};
}
/* ---- CLOSURES - issue #18 ----
   The text the flow reader throws away, read back as what it actually is.
   READ-ONLY, and that is the point. Nothing here ever reaches land, dep or
   apch, so the guard that keeps "RWY 4L, 22R CLSD" out of the runways in use
   stands exactly where it was.

   A NAMED ITEM OUT OF SERVICE IS NOT A CLOSED RUNWAY. The item name is the
   only thing that separates them, so it is what this reads most carefully -
   and where it cannot read one, it claims nothing at all and shows the
   sentence instead. */
var CLSD_WORD  = /\b(?:CLSD|CLOSED)\b/;
var OTS_WORD   = /\b(?:OTS|OUT OF SERVICE|UNUSABLE|UNAVAILABLE|UNAVBL|UNAVL)\b/;
var STATE_WORD = new RegExp(CLSD_WORD.source + '|' + OTS_WORD.source);
var ITEM_CUT   = new RegExp(',|' + STATE_WORD.source);
var CLSD_RUN   = RWY_ONE + '(?:(?:' + RWY_SEP + '|' + /\s*\/\s*/.source + ')' + RWY_ONE + ')*';
/* The item names a broadcast actually uses for equipment at a runway, taken
   from a live nationwide pull (89 broadcasts, 76 fields, 2026-09-21). A label
   counts as an item ONLY IF EVERY WORD OF IT IS ONE OF THESE; anything else is
   a sentence this cannot read, and an unreadable sentence is left alone rather
   than guessed at. LEFT and RIGHT are kept out on purpose. */
var EQUIP = ('GS GLIDESLOPE GLIDE SLOPE ILS LOC LOCALIZER LDA DME VOR NDB TACAN RNAV APCH APPROACH '
 + 'MARKER MARKERS INNER MIDDLE OUTER IM MM OM PAPI PAPIS VASI VASIS REIL REILS RAIL RAILS '
 + 'MALSR MALS ALSF ALS ODALS SFL RVR HIRL MIRL LIRL CL CNTRLN CENTERLINE TDZ TDZL '
 + 'LIGHT LIGHTS LIGHTING LGT LGTS EDGE THRESHOLD MIDPOINT ROLLOUT TOUCHDOWN '
 + 'HOLD HOLDING POSITION BLOCK PAD SIGN SIGNS BARRIER LAHSO SYSTEM AND').split(' ');
function wxWords(s){
 return String(s == null ? '' : s).replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
/* '' means no item was named, a string names one, and null means there were
   words here this cannot account for. */
function wxItemName(label){
 var ws = wxWords(label).split(' ').filter(function(w){ return w; });
 for(var i = 0; i < ws.length; i++) if(EQUIP.indexOf(ws[i]) < 0) return null;
 return ws.join(' ');
}
function wxClosures(text){
 var closed = [], ots = [], lines = [], seen = {};
 String(text == null ? '' : text).split(/\n\s*\n/).forEach(function(seg){
  var parts = String(seg).replace(/\s+/g, ' ').toUpperCase()
    .split(/NOTICE TO AIR(?:MEN|\s+MISSIONS)|NOTAMS?\b/);
  var pool = [];
  if(parts.length > 1){
   var tail = parts.slice(1).join(' ').trim();
   if(tail){ lines.push(tail); tail.split('.').forEach(function(x){ pool.push(x); }); }
  }
  parts[0].split('.').forEach(function(x){
   if(!NOT_IN_USE.test(x)) return;
   pool.push(x);
   if(String(x).trim()) lines.push(String(x).trim() + '.');
  });
  pool.forEach(function(sent){
   var re = new RegExp('([A-Z0-9 \\/-]*?)' + RWY_KEY + '(' + CLSD_RUN + ')', 'g');
   var hits = [], m;
   while((m = re.exec(sent))) hits.push({lead:m[1], rwys:wxItems(m[2]), at:m.index, end:re.lastIndex});
   hits.forEach(function(h, i){
    var after = sent.slice(h.end, (i + 1 < hits.length) ? hits[i + 1].at : sent.length);
    if(!STATE_WORD.test(after)) return;
    /* THE TRAILING HALF DECIDES. When it names something, an unreadable lead is
       only a lead-in and is dropped; when it names nothing, the lead is the only
       place an item could be, so an unreadable one there means this cannot tell
       an item out from a runway shut, and it says nothing rather than guessing. */
    var tailName = wxItemName(after.split(STATE_WORD)[0]);
    if(tailName === null) return;
    var leadName = wxItemName(String(h.lead).split(ITEM_CUT).pop());
    if(!tailName && leadName === null) return;
    var what = [leadName || '', tailName].filter(function(x){ return x; }).join(' ');
    if(what){
     /* a split broadcast repeats its notices in both halves */
     var key = what + '|' + h.rwys.join('+');
     if(!seen[key]){ seen[key] = 1; ots.push({rwys:h.rwys, what:what}); }
    } else h.rwys.forEach(function(r){ wxPush(closed, r); });
   });
  });
 });
 return {closed:closed, ots:ots, text:lines.join(' ')};
}
/* Coded, spoken, or a mix - the sources return all three. Whatever cannot
   be read is listed rather than guessed at. */
function wxObservation(text){
 var segs = wxSegments(text), t = segs.join(' ').toUpperCase(), o = {missed:[]}, m;
 if((m = t.match(/INFO(?:RMATION)? ([A-Z])\b/))) o.info = m[1];
 var letters = [];
 segs.forEach(function(seg){
  var c = seg.toUpperCase().match(/INFO(?:RMATION)? ([A-Z])\b/);
  if(c && letters.indexOf(c[1]) < 0) letters.push(c[1]);
 });
 if(letters.length > 1) o.letters = letters;
 if(/\bWIND CALM\b|\b00000KT\b/.test(t)) o.wind = 'calm';
 else if((m = t.match(/\b(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?KT\b/)))
  o.wind = m[1] + '/' + parseInt(m[2], 10) + (m[3] ? ('G' + parseInt(m[3], 10)) : '');
 else if((m = t.match(/\bWIND (\d{3}) AT (\d{1,3})(?: GUSTS? (?:TO )?(\d{1,3}))?/)))
  o.wind = m[1] + '/' + parseInt(m[2], 10) + (m[3] ? ('G' + parseInt(m[3], 10)) : '');
 else o.missed.push('wind');
 if((m = t.match(/\b(\d{1,2}) (\d)\/(\d)SM\b/))) o.vis = parseInt(m[1], 10) + parseInt(m[2], 10) / parseInt(m[3], 10);
 else if((m = t.match(/\b(\d{1,2})SM\b/))) o.vis = parseInt(m[1], 10);
 else if((m = t.match(/\b(\d)\/(\d)SM\b/))) o.vis = parseInt(m[1], 10) / parseInt(m[2], 10);
 else if((m = t.match(/VISIBILITY (\d{1,2})\b/))) o.vis = parseInt(m[1], 10);
 else o.missed.push('visibility');
 /* a ceiling is the lowest broken or overcast layer; few and scattered are
    not ceilings, so a sky with neither is unlimited rather than unknown */
 var lows = [], sawSky = false;
 (t.match(/\b(?:BKN|OVC)\d{3}\b/g) || []).forEach(function(s){ sawSky = true; lows.push(parseInt(s.slice(3), 10) * 100); });
 (t.match(/\b(?:BROKEN|OVERCAST) \d{3,5}\b/g) || []).forEach(function(s){
  sawSky = true; var n = parseInt(s.replace(/\D+/g, ''), 10); lows.push(n < 1000 ? n * 100 : n); });
 if(/\b(?:FEW|SCT|SKC|CLR|CAVOK|SCATTERED)\d*\b/.test(t)) sawSky = true;
 if(lows.length) o.ceil = Math.min.apply(null, lows);
 else if(sawSky) o.ceil = 12000;
 else o.missed.push('ceiling');
 if((m = t.match(/\bA(\d{4})\b/))) o.altim = m[1];
 else if((m = t.match(/ALTIMETER ((?:\d ?){4})/))) o.altim = m[1].replace(/\D/g, '');
 else o.missed.push('altimeter');
 return o;
}
/* The NWS/AWC thresholds. */
function wxCategory(ceil, vis){
 var c = (ceil == null ? 99999 : ceil), v = (vis == null ? 99 : vis);
 if(c < 500 || v < 1) return 'LIFR';
 if(c < 1000 || v < 3) return 'IFR';
 if(c <= 3000 || v <= 5) return 'MVFR';
 return 'VFR';
}
/* General airmanship, not a facility procedure - nothing here is cited to a
   facility document and nothing here should be. */
var TOOLBOX = {
 VFR:'Visual approaches and visual separation are available.',
 MVFR:'Marginal - a visual may still hold, but check the ceiling before you plan on one.',
 IFR:'Instrument approaches only. No visual approaches and no visual separation.',
 LIFR:'Instrument approaches only, and watch for below-minimums.'
};
function wxRead(text){
 var src = String(text == null ? '' : text).trim();
 if(!src) return null;
 var o = wxObservation(src), f = wxRunways(src);
 o.raw = src; o.land = f.land; o.dep = f.dep; o.apch = f.apch; o.flowLines = f.sentences;
 var n = wxClosures(src);
 o.closed = n.closed; o.ots = n.ots; o.notices = n.text;
 /* A runway advertised in use AND named as closed in the same broadcast is a
    contradiction the reader states rather than resolves. */
 o.clash = o.closed.filter(function(r){ return o.land.indexOf(r) >= 0 || o.dep.indexOf(r) >= 0; });
 if(!o.land.length && !o.dep.length) o.missed.push('the runways in use');
 o.cat = wxCategory(o.ceil, o.vis);
 return o;
}

/* ---- THE ADDITIONS: two landing grammars the shared reader takes for nothing ----
   NOT in the C90 reader, added here on 2026-10-20 and kept OUTSIDE the copied code so the
   copy stays comparable. Both were found in the live FAA D-ATIS pulled that day (and in
   the vATIS presets), and both fail SAFE in the shared reader - it reads no runway and
   says so - but a broadcast that reads as nothing can never set the flow.

     A  "EXPECT ILS APPROACH TO RWY 36R"        KCVG, arrival half and vATIS presets alike.
        No "IN USE" after the approach word, and "EXPECT" is not a landing marker.
     B  "VISUAL APCH RWY 17L AND 17R."          KSDF. The approach word is followed
        straight by the runways, and the "IN USE" is in the NEXT sentence ("SIMUL APCHS IN
        USE"), so the sentence is dropped as neither landing nor departing.

   Each is read as a landing statement, refuses any sentence the closures guard refuses
   (so "ILS RWY 5L APCH OTS" and "TWY D BTWN APCH END RWY 17L AND TWY D7 CLSD" add
   nothing), and merges only into the landing set. A runway list may repeat the keyword
   ("RWY 36R, RWY 36C"). THE VATIS PROFILE MARKS A SPOKEN RUNWAY WITH A LEADING CARET
   ("RWY 17L AND ^17R"), which breaks the list, so carets are removed before reading.
   The same changes belong in the shared reader; they are issue #62 and have
   NOT been made in the other decks. */
var EXPECT_APCH = new RegExp('\\bEXPECT\\b[A-Z0-9 ,\\/-]*?' + APCH_WORD + '\\s+(?:TO|FOR)\\s+(?:' + RWY_KEY + ')?(' + RWY_RUN + ')');
var APCH_RWY    = new RegExp(APCH_WORD + '\\s+(?:(?:TO|FOR)\\s+)?' + RWY_KEY + '(' + RWY_RUN + ')');
function wxExpected(text){
 var land = [], apch = [], used = [];
 wxSegments(String(text == null ? '' : text).replace(/\^/g, '')).forEach(function(seg){
  seg.toUpperCase().split('.').forEach(function(sent){
   if(!sent || NOT_IN_USE.test(sent)) return;
   var m = sent.match(EXPECT_APCH), from = 0;
   if(m) from = sent.indexOf('EXPECT') + 6;
   else { m = sent.match(APCH_RWY); from = 0; }
   if(!m) return;
   var rw = wxItems(m[1]);
   if(!rw.length) return;
   var at = sent.search(new RegExp(APCH_WORD)), name = wxLabel(sent.slice(from, at < 0 ? sent.length : at));
   rw.forEach(function(r){ wxPush(land, r); });
   if(name) apch.push({rwys:rw, apch:name});
   used.push(sent.replace(/^\s+/, ''));
  });
 });
 return {land:land, apch:apch, sentences:used};
}
/* read(): the shared reader, then the additions above, merged. */
function readAll(text){
 var clean = String(text == null ? '' : text).replace(/\^/g, '');
 var o = wxRead(clean);
 if(!o) return o;
 var ex = wxExpected(clean);
 ex.land.forEach(function(r){ wxPush(o.land, r); });
 ex.apch.forEach(function(a){
  var dup = o.apch.some(function(b){ return b.apch === a.apch && b.rwys.join() === a.rwys.join(); });
  if(!dup) o.apch.push(a);
 });
 ex.sentences.forEach(function(s){ if(o.flowLines.indexOf(s) < 0) o.flowLines.push(s); });
 if(o.land.length || o.dep.length) o.missed = o.missed.filter(function(x){ return x !== 'the runways in use'; });
 /* a runway now advertised in use and also named as closed is the same contradiction wxRead states */
 o.clash = o.closed.filter(function(r){ return o.land.indexOf(r) >= 0 || o.dep.indexOf(r) >= 0; });
 return o;
}

/* ---------- 2. Which configuration those runways describe ----------
   THE DECK'S OWN TABLE, never a second copy: every configuration names the
   runways it lands and departs, and an advertised set matches one when it lies
   inside it. Inside, not equal, because a runway shut for the day narrows the
   advertised flow without changing the configuration. Departures narrow the
   match when the broadcast states them; a broadcast that states none (IND's
   and SDF's combined ATIS name only the approach) says nothing about
   departures, and none is assumed.

   THREE OUTCOMES AND ONE REFUSAL.
     one      exactly one configuration fits - it is applied
     many     several fit - they are listed and NOTHING is applied
     none     no configuration lands these runways - stated, nothing applied
     nothing  the broadcast advertised no runway the reader could take
   Nothing is ever picked on the trainee's behalf out of several. */
function rwyKey(r){
 var m = /^(\d{1,2})([LRC]?)$/.exec(String(r || '').toUpperCase());
 return m ? {n:parseInt(m[1], 10), s:m[2]} : null;
}
/* An advertised runway is inside a configuration's list when the number
   matches and the letters agree. A bare number in the table ("14", "29")
   covers that runway whatever letter the broadcast adds. */
function inList(r, list){
 var a = rwyKey(r);
 if(!a) return false;
 for(var i = 0; i < (list || []).length; i++){
  var b = rwyKey(list[i]);
  if(b && b.n === a.n && (!b.s || !a.s || b.s === a.s)) return true;
 }
 return false;
}
function allIn(adv, list){
 for(var i = 0; i < adv.length; i++) if(!inList(adv[i], list)) return false;
 return true;
}
function wxMatch(o, configs){
 var cf = configs || [];
 if(!o || (!o.land.length && !o.dep.length)) return {kind:'nothing', configs:[]};
 var hit = cf.filter(function(c){
  if(o.land.length && !allIn(o.land, c.land)) return false;
  if(o.dep.length && !allIn(o.dep, c.dep)) return false;
  /* a broadcast that states only departures cannot settle a flow whose landing
     runways it never mentions, but it can still rule configurations out */
  return true;
 });
 if(hit.length === 1) return {kind:'one', configs:hit};
 if(hit.length > 1){
  /* where one of several lands exactly the advertised set, it is the better fit and
     is still not applied silently: it is named, the others are named, the trainee picks. */
  return {kind:'many', configs:hit};
 }
 return {kind:'none', configs:[]};
}

/* ---------- 3. State ---------- */
var fieldIds = FIELDS.map(function(f){ return f.id; });
var state = {field:fieldIds[0], text:{}, last:null, stored:true};
var saved = null;
try{ saved = F.load ? F.load() : null; }catch(e){ saved = null; }
if(saved && typeof saved === 'object'){
 if(saved.text && typeof saved.text === 'object') state.text = saved.text;
 if(saved.field && fieldIds.indexOf(saved.field) >= 0) state.field = saved.field;
}
function persist(){
 try{ if(F.save) F.save({field:state.field, text:state.text}); }catch(e){ state.stored = false; }
}
function fieldOf(id){
 for(var i = 0; i < FIELDS.length; i++){ if(FIELDS[i].id === id) return FIELDS[i]; }
 return FIELDS[0];
}
function textFor(id){ return state.text[id] || ''; }
function say_log(msg, kind){ if(typeof F.log === 'function'){ try{ F.log(msg, kind); }catch(e){} } }

/* ---------- 4. Render ---------- */
function esc(s){
 return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
   .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function c(x){ return PFX + '-' + x; }
var css = ''
 + '.' + c('sec') + '{margin-top:22px;}'
 + '.' + c('grid') + '{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px;}'
 + '.' + c('f') + '{display:flex;flex-direction:column;gap:4px;}'
 + '.' + c('lab') + '{font:11px/1.4 var(--body);color:var(--dim);letter-spacing:.04em;}'
 + '.' + c('in') + '{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:12px/1.5 var(--body);min-width:180px;}'
 + '.' + c('ta') + '{width:100%;min-height:74px;resize:vertical;font:11.5px/1.5 var(--mono);}'
 + '.' + c('btn') + '{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 11px;font:11px/1.4 var(--body);cursor:pointer;}'
 + '.' + c('btn') + ':hover{border-color:var(--dim);}'
 + '.' + c('msg') + '{margin-top:10px;font:12px/1.65 var(--body);color:var(--ink);}'
 + '.' + c('chip') + '{display:inline-block;padding:1px 7px;border-radius:3px;font:10px/1.6 var(--mono);background:var(--panel2);border:1px solid var(--line);color:var(--dim);margin-right:6px;}'
 + '.' + c('chip') + '.good{color:var(--green);border-color:var(--green);}'
 + '.' + c('chip') + '.warn{color:var(--amber);border-color:var(--amber);}'
 + '.' + c('note') + '{color:var(--amber);}'
 + '.' + c('dim') + '{color:var(--dim);}'
 + '.' + c('rows') + '{margin-top:10px;border-top:1px solid var(--line);}'
 + '.' + c('row') + '{display:flex;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font:11.5px/1.5 var(--body);}'
 + '.' + c('row') + ' b{color:var(--ink);font-weight:600;min-width:118px;}'
 + '.' + c('row') + ' span{color:var(--dim2);}';

function fieldPicker(){
 if(FIELDS.length < 2) return '';
 var opts = FIELDS.map(function(f){
  return '<option value="' + esc(f.id) + '"' + (f.id === state.field ? ' selected' : '') + '>'
   + esc(f.id) + ' - ' + esc(f.name) + (f.datis ? '' : ' (no D-ATIS)') + '</option>';
 }).join('');
 return '<div class="' + c('f') + '"><span class="' + c('lab') + '">Field</span>'
  + '<select class="' + c('in') + '" id="' + c('field') + '">' + opts + '</select></div>';
}

function section(){
 return '<section class="' + esc(F.sectionClass || '') + ' ' + c('sec') + '" id="' + c('section') + '" data-note="datis">'
  + '<h2>D-ATIS and the flow</h2>'
  + '<p class="' + c('dim') + '">Reads the current broadcast for the runways in use, matches them against '
  + esc(FID) + '&rsquo;s own configuration table, and sets the frame&rsquo;s configuration when exactly one fits. '
  + 'The wind and the flight category come with it. The routes plotted under <b>Fly it</b> follow the configuration. '
  + 'Pasting is the path that always works and needs no network; either the FAA D-ATIS or the vATIS text reads.</p>'
  + '<div class="' + c('grid') + '">' + fieldPicker()
  + '<div class="' + c('f') + '"><span class="' + c('lab') + '">&nbsp;</span><div>'
  + '<button class="' + c('btn') + '" id="' + c('read') + '">read what is pasted</button> '
  + '<button class="' + c('btn') + '" id="' + c('fetch') + '">fetch the current one</button>'
  + '</div></div></div>'
  + '<div class="' + c('f') + '"><span class="' + c('lab') + '" id="' + c('boxlab') + '"></span>'
  + '<textarea class="' + c('in') + ' ' + c('ta') + '" id="' + c('text') + '"></textarea></div>'
  + '<div class="' + c('msg') + '" id="' + c('msg') + '"></div>'
  + '<div class="' + c('rows') + '" id="' + c('rows') + '"></div>'
  + '</section>';
}

function say(html){ var b = document.getElementById(c('msg')); if(b) b.innerHTML = html; }

function cfgName(cf){ return cf.name || cf.id; }
function flowText(m, o){
 if(m.kind === 'nothing') return '<span class="' + c('dim') + '">nothing advertised to match</span>';
 if(m.kind === 'one'){
  return '<b>' + esc(cfgName(m.configs[0])) + '</b> <span class="' + c('dim') + '">- lands '
   + esc((m.configs[0].land || []).join(' ')) + ', departs ' + esc((m.configs[0].dep || []).join(' '))
   + (o.dep.length ? '' : '; the broadcast states no departure runways, so none is assumed') + '</span>';
 }
 if(m.kind === 'many'){
  return '<span class="' + c('note') + '">ambiguous - ' + esc(m.configs.map(cfgName).join('; ')) + '.</span> '
   + '<span class="' + c('dim') + '">More than one configuration fits what the broadcast states. Choose one in the frame; '
   + 'nothing was set.</span>';
 }
 return '<span class="' + c('note') + '">no matching configuration.</span> <span class="' + c('dim') + '">'
  + 'No row of ' + esc(FID) + '&rsquo;s table lands these runways, so the flow was not set and the routes are not trimmed to one. '
  + 'Read it off the runways above.</span>';
}

function rows(o, m){
 var b = document.getElementById(c('rows'));
 if(!b) return;
 if(!o){ b.innerHTML = ''; return; }
 var r = [];
 var add = function(k, v){ if(v !== '' && v != null) r.push('<div class="' + c('row') + '"><b>' + k + '</b><span>' + v + '</span></div>'); };
 var nr = '<span class="' + c('note') + '">not read</span>';
 add('Information', o.info ? esc(o.info) + (o.letters ? ' <span class="' + c('dim') + '">(split broadcast - ' + esc(o.letters.join(' and ')) + ')</span>' : '') : nr);
 add('Wind', o.wind ? esc(o.wind) : nr);
 add('Visibility', o.vis != null ? esc(String(o.vis)) : nr);
 add('Ceiling', o.ceil != null ? (o.ceil >= 12000 ? 'unlimited' : o.ceil.toLocaleString()) : nr);
 add('Altimeter', o.altim ? esc(o.altim) : nr);
 add('Flight category', esc(o.cat) + ' <span class="' + c('dim') + '">' + esc(TOOLBOX[o.cat]) + '</span>');
 add('Landing', o.land.length ? esc(o.land.join(', ')) : '<span class="' + c('note') + '">not advertised</span>');
 add('Departing', o.dep.length ? esc(o.dep.join(', ')) : '<span class="' + c('dim') + '">not stated in this broadcast</span>');
 if(o.apch.length) add('Approaches', o.apch.map(function(a){ return esc(a.apch) + ' to ' + esc(a.rwys.join(' and ')); }).join('; '));
 if(o.closed.length) add('Closed', '<span class="' + c('note') + '">' + esc(o.closed.join(', ')) + '</span>');
 if(o.ots.length) add('Out of service', o.ots.map(function(x){ return esc(x.what) + ' on ' + esc(x.rwys.join(' and ')); }).join('; '));
 if(o.notices) add('Not read as the flow', '<span class="' + c('dim') + '">' + esc(o.notices) + '</span>');
 add('Flow', flowText(m, o));
 b.innerHTML = r.join('');
}

/* The frame values a broadcast actually settled. Nothing the reader could not
   read is set, and a variable wind sets no direction. */
function settled(o, m){
 var set = {}, w = o.wind;
 if(m.kind === 'one') set.config = m.configs[0].id;
 if(w === 'calm'){ set.wdir = 0; set.wkt = 0; }
 else if(w){
  var mm = /^(\d{3}|VRB)\/(\d+)/.exec(w);
  if(mm){ if(mm[1] !== 'VRB') set.wdir = parseInt(mm[1], 10); set.wkt = parseInt(mm[2], 10); }
 }
 if(o.cat && (o.ceil != null || o.vis != null)) set.cat = o.cat;
 return set;
}

function doRead(from, apply){
 var f = fieldOf(state.field);
 var ta = document.getElementById(c('text'));
 if(ta) state.text[state.field] = ta.value;
 var o = readAll(textFor(state.field));
 state.last = o;
 if(!o){
  say('<span class="' + c('chip') + ' warn">nothing</span> The box is empty. Paste the current '
   + esc(f.id) + ' D-ATIS and press read what is pasted.');
  rows(null); persist(); return null;
 }
 var m = wxMatch(o, F.configs ? F.configs() : NS.CONFIGS);
 state.match = m;
 var got = [];
 if(o.info) got.push('information ' + esc(o.info));
 if(o.wind) got.push('wind ' + esc(o.wind));
 if(o.ceil != null) got.push('ceiling ' + (o.ceil >= 12000 ? 'unlimited' : o.ceil.toLocaleString()));
 if(o.vis != null) got.push('visibility ' + esc(String(o.vis)));
 if(o.altim) got.push('altimeter ' + esc(o.altim));
 var msg = '<span class="' + c('chip') + ' good">read</span> ' + (from ? ('from ' + esc(from) + ' - ') : '')
  + esc(f.id) + '. ' + (got.length ? ('Read ' + got.join(', ') + '.') : 'Nothing in the observation was recognised.')
  + (o.land.length ? (' Landing ' + esc(o.land.join(', ')) + (o.dep.length ? (', departing ' + esc(o.dep.join(', '))) : '') + '.') : '')
  + (o.apch.length ? (' Approaches advertised: ' + o.apch.map(function(a){ return esc(a.apch) + ' to ' + esc(a.rwys.join(' and ')); }).join('; ') + '.') : '')
  + (o.closed.length ? (' <span class="' + c('note') + '">Closed: ' + esc(o.closed.join(', ')) + '.</span>') : '')
  + (o.ots.length ? (' Out of service: ' + o.ots.map(function(x){ return esc(x.what) + ' on ' + esc(x.rwys.join(' and ')); }).join('; ') + '.') : '')
  + ' That is ' + esc(o.cat) + ' - ' + esc(TOOLBOX[o.cat]);
 if(o.missed.length) msg += ' <span class="' + c('note') + '">Could not read: ' + esc(o.missed.join(', ')) + '. Set those by hand.</span>';
 if(o.clash.length) msg += ' <span class="' + c('note') + '">' + esc(o.clash.join(', ')) + (o.clash.length > 1 ? ' are' : ' is')
   + ' advertised in use and also named as closed in the same broadcast. Read it yourself before you build on either half.</span>';
 if(o.notices) msg += ' <span class="' + c('dim') + '">Closures are read from the text the flow reader does not use, and that reading is a reminder rather than a judgement - the notices are in the box above.</span>';
 if(apply){
  var set = settled(o, m), keys = Object.keys(set);
  if(typeof F.apply === 'function' && keys.length){
   try{ F.apply(set); }catch(e){}
   msg += ' <span class="' + c('chip') + ' good">frame</span> Set '
    + keys.map(function(k){ return k === 'config' ? ('configuration ' + esc(cfgName(m.configs[0]))) : (k === 'wdir' ? ('wind direction ' + set.wdir) : (k === 'wkt' ? ('wind speed ' + set.wkt) : ('flight category ' + set.cat))); }).join(', ') + '.';
   say_log('D-ATIS read for ' + f.id + (set.config ? (': configuration set to ' + set.config + '.') : ': flow not settled (' + m.kind + ').'), set.config ? 'info' : 'warn');
  }
  if(m.kind !== 'one') msg += ' <span class="' + c('note') + '">The flow was not set from this broadcast (' + esc(m.kind === 'many' ? 'several configurations fit' : (m.kind === 'none' ? 'no configuration fits' : 'no runways advertised')) + ').</span>';
 }
 if(!state.stored) msg += ' <span class="' + c('note') + '">This browser will not keep what you paste, so it is held in memory only for this visit.</span>';
 say(msg);
 rows(o, m);
 persist();
 return o;
}

/* ONE network call, and it stays optional by construction: it is never on a
   path the tool needs, every failure hands straight to the paste box, and the
   parser it feeds is the same one paste uses. */
function doFetch(){
 var f = fieldOf(state.field);
 if(typeof fetch !== 'function'){
  say('<span class="' + c('chip') + ' warn">no</span> This browser gives the page no way to fetch. Paste the text below and press read what is pasted.');
  return;
 }
 if(!f.datis){
  say('<span class="' + c('chip') + ' warn">no</span> ' + esc(f.id) + ' publishes no D-ATIS, so there is nothing to fetch. Paste the text below.');
  return;
 }
 say('<span class="' + c('chip') + '">asking</span> Trying the published D-ATIS source for ' + esc(f.id) + '.');
 var hand = function(why){
  say('<span class="' + c('chip') + ' warn">no</span> '
   + (why ? ('Nothing came back - ' + esc(why) + '.')
          : ('The source would not answer. From a file page that is the usual result: the page has no origin, so the server may not allow the request, and this tool is built to work offline anyway.'))
   + ' Read the current ' + esc(f.id) + ' D-ATIS at <b>atis.info</b>, paste it below and press <b>read what is pasted</b>; that path always works.');
 };
 try{
  fetch(DATIS_URL + f.id, {cache:'no-store'}).then(function(r){
   if(!r || !r.ok) return hand('http ' + (r ? r.status : '?'));
   return r.text().then(function(body){
    var parts = [], re = /"datis"\s*:\s*"((?:[^"\\]|\\.)*)"/g, m;
    while((m = re.exec(body))){
     try{ parts.push(JSON.parse('"' + m[1] + '"')); }catch(e){ parts.push(m[1]); }
    }
    if(!parts.length){
     try{ var s = JSON.parse(body); if(typeof s === 'string') parts.push(s); }catch(e2){ /* not JSON */ }
    }
    if(!parts.length) return hand('nothing in the reply');
    state.text[f.id] = parts.join('\n\n');
    var ta = document.getElementById(c('text'));
    if(ta) ta.value = state.text[f.id];
    doRead(DATIS_NAME, true);
   });
  })['catch'](function(){ hand(); });
 }catch(e){ hand(); }
}

function syncBox(){
 var f = fieldOf(state.field);
 var ta = document.getElementById(c('text'));
 var lab = document.getElementById(c('boxlab'));
 if(ta){
  ta.value = textFor(state.field);
  ta.setAttribute('placeholder', 'Paste the current ' + f.id + ' D-ATIS here, or the vATIS text. A split broadcast goes in whole - put a blank line between the arrival half and the departure half.');
 }
 if(lab) lab.innerHTML = 'The ' + esc(f.id) + ' D-ATIS - the approach in use and the weather';
}

/* ---------- 5. Mount ---------- */
function mount(){
 var style = document.createElement('style');
 style.textContent = css;
 document.head.appendChild(style);
 var wrap = document.querySelector('.wrap');
 if(!wrap) return;
 var host = document.createElement('div');
 host.innerHTML = section();
 var sec = host.firstChild;
 if(!sec) return;
 var before = F.before ? document.getElementById(F.before) : null;
 if(before && before.parentNode) before.parentNode.insertBefore(sec, before);
 else {
  var footer = wrap.querySelector('footer');
  if(footer) wrap.insertBefore(sec, footer); else wrap.appendChild(sec);
 }
 if(typeof F.rails === 'function'){ try{ F.rails(sec); }catch(e){} }
 syncBox();
 var sel = document.getElementById(c('field'));
 if(sel) sel.addEventListener('change', function(){
  var ta = document.getElementById(c('text'));
  if(ta) state.text[state.field] = ta.value;
  state.field = sel.value;
  syncBox(); say(''); rows(null); persist();
 });
 var rb = document.getElementById(c('read'));
 if(rb) rb.addEventListener('click', function(){ doRead(null, true); });
 var fb = document.getElementById(c('fetch'));
 if(fb) fb.addEventListener('click', doFetch);
 /* what was saved is shown, and NEVER applied: the frame may have been changed
    by hand since, and a page load must not overwrite it */
 if(textFor(state.field)) doRead('what was saved', false);
}

var API = {
 FIELDS:FIELDS, read:readAll, shared:wxRead, expected:wxExpected, runways:wxRunways, observation:wxObservation,
 category:wxCategory, clean:wxClean, keyed:wxKeyed, labels:wxLabels,
 notices:wxNotices, closures:wxClosures, itemName:wxItemName,
 match:wxMatch, settled:settled, state:state, doRead:doRead, doFetch:doFetch, prefix:PFX, FACILITY:F
};
NS.datis = API;
window[PFX] = API;

if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', mount); }
else { mount(); }
})();
</script>
