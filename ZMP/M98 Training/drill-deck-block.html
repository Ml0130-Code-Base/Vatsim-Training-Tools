 '12-17':   {N:['BAINY','MUSCL','KKILR'], S:['NITZR','BLUEM','TORGY']},
 '30':      {N:['BAINY','MUSCL','KKILR'], S:['NITZR','BLUEM','TORGY']},
 '30-17':   {N:['BAINY','MUSCL','KKILR'], S:['NITZR','BLUEM','TORGY']},
 '30/12':   {N:['BAINY','MUSCL','KKILR'], S:['NITZR','BLUEM','TORGY']},
 '4':       {N:['BAINY','TORGY'], S:['MUSCL','KKILR','NITZR','BLUEM']},
 '22':      {N:['BAINY','TORGY'], S:['MUSCL','KKILR','NITZR','BLUEM']},
 '17-22':   {N:['BAINY','TORGY'], S:['MUSCL','KKILR','NITZR','BLUEM']},
 '30-35':   {N:['BAINY','MUSCL','KKILR'], S:['TORGY']},
 '4-35':    {N:['BAINY','TORGY'], S:['MUSCL','KKILR']}

function feederFor(cfg, gate){
 var sp = FEEDER_SPLIT[cfg] || FEEDER_SPLIT['12'];
 if(sp.N.indexOf(gate)>=0) return 'I';
 if(sp.S.indexOf(gate)>=0) return 'H';
 return null;
}

/* ---------- Which sector a gate belongs to — SOP 2-1, 4-2, 4-4d, 4-5 ----------
   Every M98 position, with the frequency from SOP 2-1. Names are the order's,
   so a message can say who owns the aircraft rather than printing a letter. */
var POS_NAME = {
 D:'North Departure', R:'South Departure', L:'East Departure',
 I:'North Feeder',    H:'South Feeder',
 N:'North Arrival',   S:'South Arrival',  J:'Runway 35 Arrival',
 E:'Flying Cloud Satellite', G:'St. Paul Satellite', K:'Crystal Satellite'
};
function posName(p){ return POS_NAME[p] || p; }
/* North and south sides of the split, whichever kind of position holds it —
   the Feeder split (4-4d) and the ACDA split (4-2) run on the same localizer,
   so a gate's side is one answer, not two. */
function sideOfPos(p){
 if(p==='N'||p==='I'||p==='D') return 'N';
 if(p==='S'||p==='H'||p==='R') return 'S';
 return null;
}
function arrivalSideFor(cfg, gate){ return sideOfPos(feederFor(cfg, gate)); }
/* Which side of the localizer a runway sits on — SOP 4-2. The parallels split
   north and south; 4, 22, 17 and 35 split west and east instead, so those name
   no side here and the gate decides. */
var RWY_SIDE = {'12L':'N', '30R':'N', '12R':'S', '30L':'S'};
function sideOfRunway(rwy){ return RWY_SIDE[rwy] || null; }
/* The Arrival on a given side, resolved through whoever is actually open. */
function arrivalReceiver(side){ return RECEIVER[side==='N' ? '12L' : '12R']; }
/* The Feeder positions as a mutable object, exactly like RECEIVER, so the
   builder can fold them into whoever is open when positions combine. */
var FEEDER_POS = {
 I:{pos:'I', frq:'126.35'},
 H:{pos:'H', frq:'135.475'}
};
/* ---------- Near and far gates — a property of the flow, not of the gate ----------
   Owner-corrected 2026-08-31.

   **A near gate is one whose arrivals drop onto the final. A far gate is one
   whose arrivals have to be vectored to it.** That is the whole definition, and
   it is why the answer moves with the landing direction rather than sitting on
   the gate: landing the 12s, TORGY and BAINY drop onto the final and the other
   four have to be turned in, so those two are the near gates; landing the 30s
   it is the other way round.

   An earlier reading in this file had the 12s inverted, because it generalised
   4-4c(7) to every configuration — and 4-4c(7) is a 30s paragraph, "Land 30s
   and 35". Read as a property of the gate it also had no way to be true in both
   directions at once, which it has to be.

   Two things in the order stop being contradictions once it is read this way,
   which is the check that it is right:
     - 4-5 offers "a BAINY OPD to Runway 12R" as its worked example of a NEAR-
       gate crossover. On a 12s BAINY is near, so it fits.
     - 4-5's two carve-outs are "KKILR landing 30L is not counted as a near-gate
       crossover" and "KKILR landing 12R is not counted as a far-gate
       crossover". KKILR is near on the 30s and far on the 12s, so each carve-out
       names the class KKILR actually has in that configuration. Both fit. Under
       the old flat reading one of them was a no-op, which was the tell. */
var NEAR_GATES = {
 '12':    ['TORGY','BAINY'],
 '12-17': ['TORGY','BAINY'],
 '30':    ['NITZR','BLUEM','KKILR','MUSCL'],
 '30-17': ['NITZR','BLUEM','KKILR','MUSCL'],
 '30-35': ['NITZR','BLUEM','KKILR','MUSCL'],  /* 4-4c(7) is this configuration verbatim */
 '17':    ['KKILR','MUSCL']                   /* 4-4c(2); BAINY is worked straight in by 17 Arrival */
};
/* Feeder-to-Arrival handoff altitudes, SOP 4-4c, by configuration. Where the
   order gives per-gate altitudes instead of the near/far language it is
   transcribed in claude_M98_SOP_Reference.md and not paraphrased here. */
var HANDOFF_ALT = {
 '12':{near:7000, far:8000}, '12-17':{near:7000, far:8000},
 '30':{near:7000, far:8000}, '30-17':{near:7000, far:8000}, '30-35':{near:7000, far:8000},
 '4':{near:8000, far:9000},  '22':{near:8000, far:9000},
 '17':{near:8000, far:9000}
};
/* null rather than a guess — 4/22 and the 35 configurations use the near/far
   altitudes without the order ever naming which gates are which. */
function nearFarFor(cfg, gate){
 var n=NEAR_GATES[cfg||'12'];
 return n ? (n.indexOf(gate)>=0 ? 'near' : 'far') : null;
}
function floorFor(cfg, gate){
 var c=nearFarFor(cfg, gate), a=HANDOFF_ALT[cfg||'12'];
 return (c && a) ? a[c] : null;
}
/* SOP 4-5 names two crossovers that are explicitly not counted as crossovers
   for coordination. Written out rather than folded into the logic, because
   they are exceptions to it — and each names the class KKILR actually has in
   that configuration, which is one of the checks that the near/far reading
   above is the right way round. */
var CROSSOVER_EXEMPT = [
 {gate:'KKILR', rwy:'30L', kind:'near', src:'SOP 4-5'},
 {gate:'KKILR', rwy:'12R', kind:'far',  src:'SOP 4-5'}
];
/* Is this gate-to-runway pairing a crossover, and if so which kind?
   SOP 4-2 splits the ACDA on the localizer: on a 12s or a 30s, North Arrival
   owns north of the 12L/30R localizer and South Arrival south of the 12R/30L.
   The runway therefore decides who takes an aircraft — until the gate and the
   runway are on opposite sides, which is a crossover, and then 4-5 decides. */
function crossoverFor(gate, rwy, cfg){
 var side = arrivalSideFor(cfg||'12', gate);
 if(!side || !rwy) return {type:'none', side:side};
 var rwySide = sideOfRunway(rwy);
 /* 4-2 splits 4, 22, 17 and 35 west and east of the localizer rather than north
    and south, so a runway on its own does not name a side there. No side means
    no crossover to work out. */
 if(!rwySide || side === rwySide) return {type:'none', side:side, rwySide:rwySide};
 var kind = nearFarFor(cfg||'12', gate)==='far' ? 'far' : 'near';
 var ex = CROSSOVER_EXEMPT.filter(function(e){
  return e.gate===gate && e.rwy===rwy && e.kind===kind; })[0];
 if(ex) return {type:'none', side:side, rwySide:rwySide,
                note:gate+' landing '+rwy+' is not counted as a '+kind+
                     '-gate crossover for coordination ('+ex.src+')'};
 return {type:kind, side:side, rwySide:rwySide};
}

   a heading-band table for aircraft not on a SID, not a sector-ownership map,
   so reading a SID departure's outbound bearing off it is an inference — the
   closest one the reference set supports. Bearings between the bands come back
   as Center with no sector named rather than being rounded into one. */
var ZMP_SECTORS = [
 {sector:'Sector 10', lo:290, hi:300, note:'west of the GEP/BAINY arrival'},
 {sector:'Sector 09', lo:265, hi:285, note:'north of the ENCEE arrival'},

 {sector:'Sector 10', lo:350, hi:380, note:'east of the GEP/BAINY arrival'}   /* 350 through 020 */
];
function zmpSectorFor(brg){
 var b=((brg%360)+360)%360;
 for(var i=0;i<ZMP_SECTORS.length;i++){
  var z=ZMP_SECTORS[i], t=(b<z.lo && z.hi>360) ? b+360 : b;
  if(t>=z.lo && t<=z.hi) return z;
 }
 return null;
}

/* ---------- Departure Dispersal Area — the lateral shape ----------
   Traced 2026-08-31 from the chart itself. The area is drawn in MSP-M98 LOA
   Attachment 1 and M98 7110.26A Appendix A, both page images with no text
   layer, so the polygon was recovered from the pixels rather than read off
   prose. How, so the number can be argued with:

     - the two concentric range rings on the chart fix the origin, which lands
       on the airport symbol;
     - the scale comes from the satellite cutout circles, because their
       airports have published coordinates — KMIC N45 03.72 / W093 21.24 and
       KFCM N44 49.63 / W093 27.43 are 14.76 NM apart and 480 pixels apart on
       the chart, so 32.5 pixels to the mile.

   Three independent checks then fall out of that one scale: the Class B
   circle measures 5.93 NM against a published 6, the outer range ring
   measures 15.00, and the close-in satellite arc measures 11.49 against the
   "~11.5 NM" already in the satellite notes. Good to about half a mile.

   It is a traced chart, not a surveyed boundary, and the interface says so.
   Only the 12 and 12-17 shape is carried: it is the only configuration the
   engine flies. The Runway 30 chart traces to an outer arc at 10.0 NM and is
   left out until the 30s route set exists to use it. */
var DDA_AREAS = {
 '12': {
  cfgs:['12','12-17'],
  src:'MSP-M98 LOA Attachment 1 / M98 7110.26A Appendix A, sheet "RUNWAY 12/17" — traced, not published as coordinates',
  arc:11.4,
  poly:[[74,6.40],[101,11.35],[111,11.40],[120,11.43],[130,11.43],[139,11.43],
        [148,11.43],[158,11.43],[173,11.43],[189,11.40],[199,11.40],[210,11.40],
        [218,11.30],[217,2.20],[130,1.72],[108,1.78]]
 }
};
function ddaFor(cfg){
 for(var k in DDA_AREAS){ if(DDA_AREAS[k].cfgs.indexOf(cfg||'12')>=0) return DDA_AREAS[k]; }

}
/* Point in the dispersal area, worked in MSP-relative nautical miles so it
   uses the same frame as posOf and the route data. */
function inDDA(e, n, cfg){
 var a=ddaFor(cfg); if(!a) return false;
 var pts=a.poly.map(function(p){ var r=p[0]*Math.PI/180;
  return [p[1]*Math.sin(r), p[1]*Math.cos(r)]; });
 var inside=false;
 for(var i=0,j=pts.length-1;i<pts.length;j=i++){
  var xi=pts[i][0], yi=pts[i][1], xj=pts[j][0], yj=pts[j][1];
  if((yi>n)!==(yj>n) && e < (xj-xi)*(n-yi)/(yj-yi)+xi) inside=!inside;
 }
 return inside;
}

/* ---------- Departure gates — M98 7110.26A, scratchpad #1 ----------
   A departure gate is the fix through which an aircraft exits M98 airspace, and
   SEVERAL SIDs can share one. The gate is not decoration: it is what goes in
   scratchpad #1 for APO automated coordination, as the gate's first letter
   followed by the two-digit requested altitude in thousands, "if other than the
   aircraft's present altitude". The order's own example is B12 — the BRD/DLH
   gate, assigned 12,000. Scratchpad #1 may instead carry the three-letter gate,
   or the arrival airport.

   Eight letters, transcribed from M98 7110.26A and confirmed against the owner's
   "M98 SIDS & Pointout Fix Indicators" chart (owner-supplied 2026-09-01), which
   also carries the datablock example BMJ59 / E11 / BE85 / G and a 20 NM ring. */
var DEP_GATES = {
 A:{fix:'ABR', name:'Aberdeen'},
 B:{fix:'BRD', name:'Brainerd', alt:'DLH'},
 D:{fix:'DLL', name:'Dells'},
 E:{fix:'EAU', name:'Eau Claire'},

/* Which gate each of the nine turbojet SIDs exits through. Derived, not guessed:
   each SID's terminal-fix bearing from the MSP VOR was computed and matched to
   the gate's position on the chart, and every SID_DEST value that already named
   a gate (DLL, FAR, ODI) agreed. Bearings are carried so the working is visible.

   SMERF and LEINY are the two exceptions and they are deliberate: the chart draws
   their exit fixes as SME and SMERF/LEI and LEINY WITHOUT a highlighted letter, and
   neither appears in the 7110.26A list. They get no gate letter — gate is null.

   Gates A (ABR) and B (BRD) have no turbojet SID in this set. They are real gates
   used by non-SID and prop departures; the absence here is not an omission. */
var SID_GATE = {
 WLSTN:{gate:'E', fix:'EAU', brg:58},
 COULT:{gate:'D', fix:'DLL', brg:115},
 ZMBRO:{gate:'N', fix:'ODI', brg:134},
 RST:  {gate:'R', fix:'RST', brg:159},
 ORSKY:{gate:'O', fix:'FOD', brg:210},
 SCHEP:{gate:'O', fix:'ONL', brg:234},
 LEINY:{gate:null, fix:'LEI', brg:274},
 SMERF:{gate:null, fix:'SME', brg:292},
 KBREW:{gate:'F', fix:'FAR', brg:312}
};
function gateForSid(sid){ var g=SID_GATE[sid]; return g?g.gate:null; }
function gateFixFor(sid){ var g=SID_GATE[sid]; return g?g.fix:null; }
/* Build the scratchpad #1 entry. 7110.26A gives three permitted forms:
     (a) gate letter + two-digit requested altitude in thousands, "if other than
         the aircraft's present altitude"  — B12
     (b) the three-letter departure gate                          — BRD
     (c) the arrival airport
   A CRC scratchpad is 3 or 4 alphanumeric characters (claude_CRC_Platform_Reference.md),
   so form (a) with no altitude would be a bare one-character letter and is NOT
   enterable in the client. With no altitude we therefore return form (b), the
   three-letter gate, which is both what the order permits and what CRC accepts.
   Returns null where the SID has no gate letter, rather than inventing one. */
function scratchpadFor(sid, altFt){
 var g=gateForSid(sid); if(!g) return null;
 if(altFt===null||altFt===undefined) return gateFixFor(sid);   /* form (b) */
 var th=Math.round(altFt/1000);
 return g + (th<10?'0':'') + th;                               /* form (a) */
}
/* Is a string enterable as a CRC scratchpad? 3-4 chars, alphanumeric plus + . * / and
   backtick. Used to keep any generated entry inside what the client can actually take. */
function scratchpadValid(s){
 return typeof s==='string' && s.length>=3 && s.length<=4 && /^[A-Z0-9+.*\/`]+$/i.test(s);
}

/* Where a SID ends up once it is out of M98. NOTE: this table is inconsistent by
   inheritance — some values are departure gates (DLL, FAR, ODI), some are the SID
   fix itself (LEINY, SMERF), some are downstream facilities or airports (GRB, ALO),
   and some are en route fixes (ONTIJ, RXANN). Use SID_GATE for the gate; this stays
   for the route text it already feeds. */
var SID_DEST = {COULT:'DLL', KBREW:'FAR', LEINY:'LEINY', ORSKY:'ONTIJ', RST:'ALO',
                SCHEP:'RXANN', SMERF:'SMERF', WLSTN:'GRB', ZMBRO:'ODI'};
/* The route as a fix sequence, built from the coordinate data. Deliberately no
   procedure revision name: the reference set names revisions only for the
   satellite and conventional arrivals (GOPHER ONE, KASPR SEVEN, AGUDE FIVE,
   ENCEE THREE, TWOLF FOUR) and gives none for the six mainline RNAV STARs or
   the nine turbojet SIDs, so inventing "NITZR THREE" is not on. Type the filed
   route over the top when you want the chart name. */
function routeTextFor(o){
 var role=(o&&o.role)||'arrival';
 if(role==='departure'){
  var d=DEPS[o.sid]; if(!d) return '';
  return d.map(function(p){return p.f;}).join(' ')+(SID_DEST[o.sid]?(' '+SID_DEST[o.sid]):'');
 }
 if(role==='arrival'){
  var g=ROUTES[o.gate]; if(!g) return '';
  return g.map(function(p){return p.f;}).join(' ');
 }
 return '';
}

/* Feeder-to-Arrival handoff floors for the configuration currently loaded,

   drift apart. Near and far belong to the flow, not to the gate: on a 12s
   TORGY and BAINY drop onto the final at 7,000 while NITZR, BLUEM, KKILR and
   MUSCL have to be vectored to it at 8,000, and running the 30s that reverses.
   Rebuilt by buildRoutes() every time the flow changes.
     Two citations, and they are different facts: 4-4c(3) gives the altitudes,
   4-4c(7) is what near and far are derived from. Appendix A is unread images,
   so the classification is still a derived reading. */
var FLOORS = {};
var FLOOR_BASIS = {};

 Object.keys(FLOORS).forEach(function(k){ delete FLOORS[k]; });
 Object.keys(FLOOR_BASIS).forEach(function(k){ delete FLOOR_BASIS[k]; });

  var cls = cfg ? nearFarFor(cfg, g) : null;
  var alt = cfg ? floorFor(cfg, g) : null;

var RECEIVER = {'12R':{pos:'S', frq:'126.95'}, '12L':{pos:'N', frq:'119.3'}};

/* ---------- 3. Sim state ---------- */
var sim = {t:0, rate:0, ac:[], feed:[], sel:null, scen:null, losFlag:false, ended:false, timer:null};

function fmtAlt(a){ return (Math.round(a/100)*100).toLocaleString(); }
function clock(){ var m=Math.floor(sim.t/60), s=Math.floor(sim.t%60); return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function log(kind, html, item){

/* ---------- Radar service — what already exists when it reaches you ----------
   Five states, because five different things actually happen on the frequency:

     established  handed off by another radar facility. Identified, on a
                  discrete code, and on a clearance if it is IFR. Saying "radar
                  contact" to one of these is redundant and gets called out.
     departure    just off a tower. It has a clearance and a code the tower
                  gave it, but nobody has radar identified it yet — that part is
                  yours, and it is the one IFR case where "radar contact" is the
                  right call rather than a redundant one.
     popup        a pop-up IFR: airborne, no code, not identified, not on a
                  clearance. Until you issue one it is not an IFR aircraft at
                  all, so it owes a code, an identification and a clearance.
     following    a VFR asking to pick up flight following. No code, not
                  identified, and what it wants is radar advisories — code,
                  identify, then work it, and terminate on the way out.
     none         a VFR cold call with nothing on it, asking to get through
                  rather than asking for service.

   identified, squawk and ifrCleared are all derived from this one field. */
var RADAR_STATES = {
 established:{ident:true,  code:true,  cleared:true,  label:'established — handed off by another radar facility'},
 departure:  {ident:false, code:true,  cleared:true,  label:'off the tower — owes a radar contact'},
 popup:      {ident:false, code:false, cleared:false, label:'pop-up IFR — airborne, asking for a clearance'},
 following:  {ident:false, code:false, cleared:false, label:'VFR asking for flight following'},
 none:       {ident:false, code:false, cleared:false, label:'cold call — nothing on it'}
};
/* Which states a strip can legally be in, given what it is doing and whether it
   is IFR. An arrival is never "off the tower"; an IFR aircraft never wants
   flight following, because it already has a clearance. */
function radarStatesFor(role, rules){
 if(rules==='VFR') return (role==='departure')
   ? ['departure','following','none','established']
   : ['established','following','none'];
 return (role==='departure') ? ['departure','established'] : ['established','popup'];
}
/* Stored drills predate the five states and carry only established/none, where
   "none" meant a pop-up on an IFR strip and a cold call on a VFR one. */
function normRadar(r, rules, role){
 if(RADAR_STATES[r] && radarStatesFor(role, rules).indexOf(r)>=0) return r;
 if(r==='none')  return (rules==='VFR') ? 'none' : 'popup';
 if(RADAR_STATES[r]) return r;
 return (role==='departure' && rules!=='VFR') ? 'departure' : 'established';
}
/* Who hands it to you, worked out from the job rather than typed. A departure
   is handed off by the tower at the field it left; an arrival or an overflight
   crosses the boundary from a radar facility, which the builder resolves from
   the bearing and the altitude it enters on. */
function towerHandoffFor(icao){
 var ap=airportOf(icao);
 return {name:ap.tower, frq:(ap.twrFrq&&ap.twrFrq[0])||null, kind:'tower',
         why:'a departure is handed off by the tower at the field it left, and '+ap.name+' is '+ap.tower};
}
function mkAc(o){
 var role = o.role || 'arrival';
 var rad = normRadar(o.radar, (o.rules==='VFR'?'VFR':'IFR'), role);
 var rs  = RADAR_STATES[rad] || RADAR_STATES.established;
 var route = role==='departure' ? DEPS[o.sid]
           : role==='overflight' ? overflightRoute(o.entry||{r:180,d:38}, o.exit||{r:0,d:38})
           : routeFor(o);
 if(!route) route = ROUTES.NITZR;
 var a = {
  cs:o.cs, type:o.type, gate:o.gate, route:route,
  role:role, sid:o.sid||null,
  /* Every strip carries its flight rules, and an IFR one carries its route.
     Named `filed` and not `route` on purpose: `route` is already this
     aircraft's geometric track and the two must never collide. */
  rules:(o.rules==='VFR'?'VFR':'IFR'),
  /* Radar service is one field with five states and everything else derived
     from it, so a scenario cannot describe a situation that does not exist. */
  radar:rad,
  dep:(role==='departure') ? (o.dep||'KMSP') : null,
  depRwy:(role==='departure') ? (o.depRwy||null) : null,
  dest:(role==='arrival')  ? (o.dest||'KMSP') : null,
  /* An arrival flies published speeds unless Center called and said otherwise;
     that provenance rides on the strip so the check-in can say where it came
     from rather than the speed just appearing. */
  ctrSpeed:!!o.ctrSpeed,
  /* the satellite crossings split by engine throughout the order, so the strip
     has to say which it is rather than the tool guessing off a type code */
  engine:(o.engine==='turboprop'||o.engine==='piston') ? o.engine : 'jet',
  from:o.from||'',
  squawk:rs.code ? (o.squawk||null) : null,
  identified:rs.ident,
  popup:(rad==='popup'),
  following:(rad==='following'),
  ifrCleared:(o.rules!=='VFR') && rs.cleared,
  svcNoted:false, clrNoted:false,
  filed:(o.rules==='VFR') ? (o.route||'') : (o.route || routeTextFor(o)),
  /* derived from the type, never taken from the scenario data */
  wk:wakeOf(o.type), wake:(wakeOf(o.type).heavy?'H':''),
  dist: o.dtgEnd!=null ? Math.max(0, route.total - o.dtgEnd)
      : (o.fromStart!=null ? Math.min(route.total, o.fromStart) : 0),
  alt:o.alt, ias:o.ias, iasAsg:o.iasAsg!=null?o.iasAsg:null,
  spdMode:o.spdMode||'published', rwy:o.rwy||null,
  ckdIn:!!o.ckdIn, altim:!!o.altim, itemsClock:o.ckdIn?0:null,
  flashed:null, switched:false, alive:true, spawned:o.spawnAt||0,
  onFreq:!!o.ckdIn, capNoted:false, savvgWarned:false, hoWarned:false
 };
 return a;
}
function segOf(a){ var r=a.route; for(var i=1;i<r.length;i++){ if(a.dist<=r[i].cum) return i; } return r.length-1; }
function posOf(a){
 var r=a.route, i=segOf(a);
 var d0=r[i-1].cum, d1=r[i].cum, f=(d1===d0)?0:(a.dist-d0)/(d1-d0);
 return {x:r[i-1].x+(r[i].x-r[i-1].x)*f, y:r[i-1].y+(r[i].y-r[i-1].y)*f,
         e:r[i-1].e+(r[i].e-r[i-1].e)*f, n:r[i-1].n+(r[i].n-r[i-1].n)*f};
}
function pubSpeedAt(a){
 var r=a.route, sp=null;
 for(var i=0;i<r.length;i++){ if(r[i].cum<=a.dist && r[i].spd) sp=r[i].spd; }
 /* upcoming restriction also binds descend-via speed planning: use next published if slower */
 for(var j=0;j<r.length;j++){ if(r[j].cum>a.dist && r[j].spd){ if(sp===null||r[j].spd<sp) sp=r[j].spd; break; } }
 return sp;
}
function dmeOf(a){ var p=posOf(a); return Math.sqrt(p.e*p.e+p.n*p.n); }
/* Who takes this one. Arrivals go to the Arrival controller on the far side of
   the localizer split; departures and overflights leave the facility, and the
   reference set has no SID-to-ZMP-sector table, so the receiver is Center and
   what gets graded is the timing of the release, not which sector. */
/* the bearing an aircraft is leaving on — the far end of its own track */
function exitBearing(a){
 var p=a.route[a.route.length-1];
 return (Math.atan2(p.e, p.n)*180/Math.PI+360)%360;
}
function receiverFor(a){
 if(a.role==='arrival'){
  /* Who takes an arrival is the gate and the runway together, not the runway
     alone — SOP 4-2 for the normal case, 4-5 once it is a crossover. */
  /* Anything landing a satellite field belongs to that field's satellite seat
     (SOP 6-2), not to the MSP split — there is no Feeder or Arrival in it. */
  var dst = a.dest || 'KMSP';
  if(dst !== 'KMSP'){
   var seat = satSeatFor(dst), sp = seat && SAT_POS[seat];
   if(sp) return {pos:sp.pos, frq:sp.frq, name:posName(sp.pos), cross:'none',
     why:dst+' is '+posName(seat)+'’s field, so a '+(a.gate||'satellite')+' arrival into it goes to that seat rather than down the MSP split (SOP 6-2)'};
  }
  var rwy = a.rwy || '12R';
  var x = crossoverFor(a.gate, rwy);
  var pick, why;
  if(x.type==='near' && a.hdg==null){
   /* A near-gate crossover on an OPD STAR goes to the Arrival controller
      whose airspace the aircraft enters first — its own gate's side. The
      order's example is a BAINY OPD to Runway 12R going to N. */
   pick = arrivalReceiver(x.side);
   why = a.gate+' is a near gate on the '+(x.side==='N'?'north':'south')+' side crossing over to '+rwy
       +', and a near-gate crossover on an OPD goes to whoever it reaches first (SOP 4-5)';
  } else if(x.type==='near'){
   /* Assigned a heading instead: the runway's controller, at 9,000, with the
      heading aimed at the 25-mile ring. Nothing assigns a heading yet. */
   pick = arrivalReceiver(sideOfRunway(rwy) || x.rwySide || x.side);
   why = a.gate+' is a near-gate crossover to '+rwy+' on a heading, which goes to the runway’s'
       +' controller at 9,000 with the heading aimed at the 25-mile range ring (SOP 4-5)';
  } else if(x.type==='far'){
   /* A far-gate crossover is not an Arrival handoff at all — it goes to the
      Feeder on the far side, communications not later than 15 NM. */
   pick = FEEDER_POS[x.rwySide==='N' ? 'I' : 'H'];
   why = a.gate+' is a far gate crossing to '+rwy+', and a far-gate crossover is handed to that side’s'
       +' Feeder with communications transferred not later than 15 NM from MSP (SOP 4-5)';
  } else {
   /* A runway that names no side of its own — 4, 22, 17, 35 — falls back to the
      side the gate feeds, which is what the west/east split amounts to here. */
   var useSide = sideOfRunway(rwy) || x.side;
   pick = arrivalReceiver(useSide);
   why = sideOfRunway(rwy)
     ? (a.gate+' feeds the '+(x.side==='N'?'north':'south')+' side and '+rwy+' is on that side of the'
        +' localizer, so it is a straight handoff down the split (SOP 4-2)'+(x.note?' — '+x.note:''))
     : (rwy+' splits west and east of the localizer rather than north and south (SOP 4-2), so this one'
        +' follows the side '+a.gate+' feeds'+(x.note?' — '+x.note:''));
  }
  return {pos:pick.pos, frq:pick.frq, name:posName(pick.pos), why:why, cross:x.type};
 }

 var n = neighbourAt(exitBearing(a), a.alt);
 /* name the ZMP sector where Table 1 supports one */
 if(n.pos==='ZMP' && a.role==='departure'){
  var z = zmpSectorFor(exitBearing(a));
  if(z) return {pos:'ZMP', frq:n.frq, name:'Minneapolis Center '+z.sector,
                why:n.why+'; Table 1 puts that bearing with '+z.sector+', '+z.note};
 }
 return n;
}
function nextAltTarget(a){
 /* Departures, overflights and anything VFR do not fly a published descent —
    they hold what they have until you give them something, which is the point.
    A VFR aircraft is not on the STAR at all, whatever gate it came from. */
 if(a.role!=='arrival' || a.rules==='VFR') return (a.hardAlt!=null) ? a.hardAlt : a.alt;
 var r=a.route;
 for(var i=0;i<r.length;i++){
  if(r[i].cum>=a.dist-0.05){
   /* the satellite ladders publish a jet value and a turboprop one */
   var atv=(a.engine!=='jet' && r[i].atProp!=null) ? r[i].atProp : r[i].at;
   if(atv!=null) return atv;
   if(r[i].aa!=null && a.alt>r[i].aa) return r[i].aa; /* descend toward the at-or-above */
  }
 }
 /* only the six MSP gates have a Feeder floor to settle at */
 return (FLOORS[a.gate]!=null) ? FLOORS[a.gate] : a.alt;
}
function tick(dt){
 sim.t+=dt;
 sim.ac.forEach(function(a){
  if(!a.alive) return;
  if(!a.onFreq && sim.t>=a.spawned){ a.onFreq=true; checkIn(a); }
  if(!a.onFreq) return;
  /* speed target */
  var tgt;
  if(a.spdMode==='assigned' && a.iasAsg!=null) tgt=a.iasAsg;
  else if(a.spdMode==='normal') tgt=a.ias;              /* holds current — published NOT reinstated */
  else if(a.spdMode==='free') tgt=280;
  else if(a.role==='overflight') tgt=a.ias;             /* holds what it filed; it is only passing through */
  else if(a.role==='departure') tgt=280;                /* no published ladder to follow */
  else tgt=pubSpeedAt(a)||280;
  if(a.alt<10000 && tgt>250){ tgt=250;
   if(!a.capNoted){ a.capNoted=true;
    log('crew','<b>'+a.cs+':</b> "'+(a.role==='departure'
      ? 'two five zero til one zero thousand, '
      : 'reaching one zero thousand, two five zero, ')+a.cs+'."');
    if(a.spdMode==='assigned'&&a.iasAsg>250){a.iasAsg=250;} } }
  var dv=tgt-a.ias; a.ias += Math.max(-1.2*dt, Math.min(1.2*dt, dv));
  /* altitude — arrivals descend via the ladder, everyone else does what they
     were told and nothing more */
  var at=nextAltTarget(a);
  if(a.alt>at) a.alt=Math.max(at, a.alt-30*dt);         /* ~1,800 fpm down */
  else if(a.alt<at && a.role!=='arrival') a.alt=Math.min(at, a.alt+33*dt);   /* ~2,000 fpm up */
  /* movement */
  var gs=a.ias*(1+0.02*(a.alt/1000));
  a.dist=Math.min(a.route.total, a.dist+gs/3600*dt);
  /* departures: the release to Center, ZMP-M98 LOA 4.c */
  if(a.role==='departure' && !a.relChecked){
   var dme=dmeOf(a);
   if(dme>=DEP_RELEASE.dme || a.alt>=DEP_RELEASE.alt){
    a.relChecked=true;
    var why = (dme>=DEP_RELEASE.dme) ? (dme.toFixed(0)+' DME') : ('leaving '+fmtAlt(a.alt));
    if(a.switched) log('good','<span class="dd-chip good">good</span><b>'+a.cs+'</b> was with Center before '+why+' — the release made 4.c.', 'posthandoff');
    else if(a.flashed) log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> reached '+why+' flashed but not switched. The 4.c release is 25 DME <b>or</b> leaving 11,000, whichever comes first — the flash alone does not stop the clock.', 'posthandoff');
    else { var nb=receiverFor(a);
     log('crit','<span class="dd-chip crit">crit</span><b>'+a.cs+'</b> passed '+why+' with no flash and no switch. M98 releases departures at 25 NM from the MSP DME or leaving 11,000 (ZMP-M98 LOA 4.c) — this one is '+nb.name+'\u2019s airplane and they do not know.'
      +(nb.pos==='RST'?' (The 4.c timing is the ZMP rule; the M98\u2013RST agreement is not in the reference set.)':''), 'posthandoff'); }
   }
  }
  /* the departure dispersal area is MSP Tower's from the surface up to and
     including 7,000 (MSP-M98 LOA 5.a(3)). An MSP departure belongs in there —
     Tower has automatic releases into it and 8.d lets Departure climb it.
     Anything else down there is standing in somebody else's airspace. */
  if(!a.ddaFlagged && a.role!=='departure' && a.alt<=7000){
   var pd=posOf(a);
   if(inDDA(pd.e, pd.n)){
    a.ddaFlagged=true;
    log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> is in the departure dispersal area at '+fmtAlt(a.alt)+'. That airspace is MSP Tower’s from the surface up to and including 7,000 (MSP-M98 LOA 5.a(3)) — an '+a.role+' in there is in their airspace and wants coordination. The shape is traced off the chart, so treat the edge as approximate.', 'floors');
   }
  }
  /* SAVVG runway-window check */
  var savvg=a.route.find(function(p){return p.f==='SAVVG';});
  if(savvg && !a.rwy && !a.savvgWarned && a.dist>=savvg.cum){
   a.savvgWarned=true; a.rwy='12R'; a.rwyAuto=true;
   log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> crossed SAVVG with no runway assigned — Table 2 default 12R applied for you. The 12L option died at the split.');
  }
  /* items-owed clock */
  if(a.itemsClock!=null){ a.itemsClock+=dt;
   if(a.itemsClock>90 && (!a.altim||!a.rwy)){ a.itemsClock=null;
    log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> checked on 90 seconds ago — still owed '+(!a.altim?'altimeter':'')+((!a.altim&&!a.rwy)?' + ':'')+(!a.rwy?'runway':'')+'.'); } }
  /* GREAK delivery-spec check */
  var greak=a.route.find(function(p){return p.f==='GREAK';});
  if(greak && !a.greakChecked && a.dist>=greak.cum){
   a.greakChecked=true;
   if(a.ias>240) log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> crossed GREAK at '+Math.round(a.ias)+' kt — the ladder promises Arrival 230 there. Assigned speeds override published until you restore them.', 'speed');
   else log('good','<span class="dd-chip good">good</span><b>'+a.cs+'</b> crossed GREAK at 230 — delivery spec intact.', 'speed');
  }

  if(a.dist>=a.route.total-0.05){
   a.alive=false;
   var rec=receiverFor(a);
   var where = a.role==='arrival' ? 'off the end of the tail'
             : a.role==='departure' ? 'off the end of the departure track'
             : 'across the boundary and out of your airspace';
   if(a.switched) log('good','<span class="dd-chip good">good</span><b>'+a.cs+'</b> '+where+' with '+rec.pos+' — clean.', 'posthandoff');
   else if(a.role==='overflight') log('crit','<span class="dd-chip crit">crit</span><b>'+a.cs+'</b> left your airspace still on your frequency — an overflight still has to be handed off or pointed out before the boundary.', 'posthandoff');
   else log('crit','<span class="dd-chip crit">crit</span><b>'+a.cs+'</b> reached the end of the tail still on your frequency — the floor handoff never happened. '+rec.pos+' is asking questions.', 'posthandoff');
  }
 });
 /* In-trail check. Two aircraft are only in trail where their routes have
    actually merged, so compare on the longest tail the pair genuinely shares
    — which is the whole route for two off the same gate, GREAK inbound for a
    KKILR against a NITZR, and nothing at all for a TORGY against a BAINY. */
 var live = sim.ac.filter(function(a){ return a.alive && a.onFreq && a.route && a.route.length>1; });
 for(var i=0;i<live.length;i++) for(var j=i+1;j<live.length;j++){
  var A=live[i], B=live[j];
  var sh=sharedTail(A.route,B.route);

  var da=A.route.total-A.dist, db=B.route.total-B.dist;
  if(da>sh.len || db>sh.len) continue;            /* not both onto the common track yet */
  var gap=Math.abs(da-db);
  if(gap<3 && Math.abs(A.alt-B.alt)<900 && !sim.losFlag){
   sim.losFlag=true;
   log('crit','<span class="dd-chip crit">crit</span>Loss of separation inbound '+sh.fix+' — <b>'+A.cs+'</b> / <b>'+B.cs+'</b>, '+gap.toFixed(1)+' NM, co-altitude. This goes in the log the way session 6 did.', 'sep');
  }
 }
 if(window.DD && DD.hooks) for(var h=0;h<DD.hooks.length;h++){ try{ DD.hooks[h](sim,dt); }catch(e){} }
 render();
}
/* trunk length helper on prototype-ish */
function trunkLenFor(gate){ var r=ROUTES[gate]; var e=r.find(function(p){return p.f==='ELLKO';}); return e?(r.total-e.cum):0; }
/* Longest common suffix of two routes, as {fix, len} — the fix the pair merges
   at and how much track they share from there to the end. Null when they never
   join, so two aircraft on unrelated tails are never compared in trail. */
function sharedTail(r1,r2){
 var n=0;
 while(n<r1.length && n<r2.length && r1[r1.length-1-n].f===r2[r2.length-1-n].f) n++;
 if(n<2) return null;                    /* a shared endpoint alone is not a shared track */
 var merge=r1[r1.length-n];
 return {fix:merge.f, len:r1.total-merge.cum};
}

function checkIn(a){
 a.ckdIn=true; a.itemsClock=0;
 var lvl = (a.alt>=18000?('flight level '+Math.round(a.alt/100)):(fmtAlt(a.alt)));
 var where = function(){
  var p=posOf(a), d=Math.sqrt(p.e*p.e+p.n*p.n), brg=(Math.atan2(p.e,p.n)*180/Math.PI+360)%360;
  var pts=['north','northeast','east','southeast','south','southwest','west','northwest'];
  return Math.round(d)+' miles '+pts[Math.round(brg/45)%8]+' of the airport';
 };
 /* Nothing on it yet — it tells you everything itself, because nobody has told
    you anything about it. */
 if(a.radar==='popup'){
  log('crew','<b>'+a.cs+':</b> "Minneapolis Approach, '+a.cs+', '+a.type+', '+where()+' at '+lvl+', VFR, requesting an IFR clearance."');
  log('info','<span class="dd-chip info">note</span><b>'+a.cs+'</b> is a pop-up IFR. It is not identified, it has no code, and it is not on a clearance — all three are yours before it is an IFR aircraft at all.');

 }
 if(a.radar==='following'){
  log('crew','<b>'+a.cs+':</b> "Minneapolis Approach, '+a.cs+', '+a.type+', '+where()+' at '+lvl+', VFR, request flight following'+(a.filed?(' to '+a.filed):'')+'."');
  log('info','<span class="dd-chip info">note</span><b>'+a.cs+'</b> wants to pick up flight following. There is no service on it yet — a code and a radar identification come before the advisories, and it gets terminated on the way out.');

 }
 if(a.radar==='none'){
  log('crew','<b>'+a.cs+':</b> "Minneapolis Approach, '+a.cs+', '+a.type+', '+where()+' at '+lvl+', VFR, request transit of the Bravo."');
  log('info','<span class="dd-chip info">note</span><b>'+a.cs+'</b> is a cold call — nobody has handed it to you, so there is no radar service on it yet. Code, identify, then work it.');
  return;
 }
 /* Off a tower: it has a clearance and the tower's code, but nobody has radar

 if(a.radar==='departure'){

    +(a.sid?(', '+a.sid+' departure'):'')+'."');
  log('info','<span class="dd-chip info">note</span><b>'+a.cs+'</b> was shipped by '+ap.tower+' on a clearance and a discrete code, but it is not radar identified yet. That is yours before you work it.');
  return;
 }
 if(a.rules==='VFR'){
  log('crew','<b>'+a.cs+':</b> "Minneapolis Approach, '+a.cs+', '+lvl+', VFR'+
    (a.from?(', with you from '+a.from):'')+', '+
    (a.role==='departure'?'off the field':'transiting the Bravo')+'."');

 }
 if(a.role==='departure'){
  log('crew','<b>'+a.cs+':</b> "Minneapolis Departure, '+a.cs+', '+lvl+' climbing, '+a.sid+' departure."');
 } else if(a.role==='overflight'){
  log('crew','<b>'+a.cs+':</b> "Minneapolis Approach, '+a.cs+', '+lvl+', requesting transit of your airspace."');
 } else {
  var rw = a.rwy? (', runway '+sayRunway(a.rwy)+' transition') : '';
  log('crew','<b>'+a.cs+':</b> "Minneapolis Approach, '+a.cs+', '+lvl+
    ', descending via the '+a.gate+' arrival'+rw+', with information Juliet."');
  /* the only reason an optimized profile descent is not on published speeds */
  if(a.ctrSpeed && a.iasAsg){
   log('info','<span class="dd-chip info">note</span>Center advised <b>'+a.cs+'</b> is assigned '+Math.round(a.iasAsg)
     +' knots rather than the published speeds. That came off a landline, not off the arrival — it holds until you do something about it.', 'speed');
  }
 }
}

/* ---------- 4. Command parser ---------- */
/* Spoken digits — zero is always "zero" and nine is always "niner"
   (claude_US_Carrier_Callsigns.md). */
var SAY_DIGIT=['zero','one','two','three','four','five','six','seven','eight','niner'];
/* Runway designators are spoken out, never read as a number —
   claude_SID_TTS_Voicing.md. */
function sayRunway(r){
 if(!r) return '';
 var m=String(r).match(/^(\d+)([LRC]?)$/);
 if(!m) return String(r);
 var d=m[1].split('').map(function(c){ return SAY_DIGIT[+c]; }).join(' ');
 return d+(m[2]==='L'?' left':(m[2]==='R'?' right':(m[2]==='C'?' center':'')));
}
var HEAR_DIGIT={zero:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',niner:'9',nine:'9'};
function sayDigits(s){ return String(s).split('').map(function(c){ return SAY_DIGIT[+c]!==undefined?SAY_DIGIT[+c]:c; }).join(' '); }
function simAltim(){ return (sim.scen && sim.scen.altim) ? String(sim.scen.altim).replace(/[^0-9]/g,'') : '2980'; }
/* an altimeter setting in any of the forms it actually gets said */
function altimIn(t){
 var m=t.match(/altimeter\s+(\d{2})\.(\d{2})/); if(m) return m[1]+m[2];
 m=t.match(/altimeter\s+(\d{4})/); if(m) return m[1];
 m=t.match(/altimeter((?:\s+(?:zero|one|two|three|four|five|six|seven|eight|niner|nine)){4})/);
 if(m) return m[1].trim().split(/\s+/).map(function(w){ return HEAR_DIGIT[w]; }).join('');
 return null;
}
function findAc(txt){
 var m=null;
 sim.ac.forEach(function(a){ if(txt.toUpperCase().indexOf(a.cs)>=0) m=a; });
 return m || (sim.sel!=null ? sim.ac.find(function(a){return a.cs===sim.sel;}) : null);
}
function transmit(){
 var el=document.getElementById('dd-cmd');
 var raw=el.value.trim(); if(!raw) return;
 el.value='';
 var t=raw.toLowerCase();
 var a=findAc(raw);
 log('info','<span class="dd-chip info">you</span><span class="dd-mono">'+raw.replace(/</g,'&lt;')+'</span>');
 if(!a){ log('coach','<span class="coach">No strip selected and no callsign heard — click a strip or lead with the callsign.</span>'); return; }
 if(!a.alive){ log('coach','<span class="coach">'+a.cs+' is no longer on your frequency.</span>'); return; }
 var acted=false;
 /* One transmission can carry several instructions, the way a real one does on
    initial contact — runway, altimeter, a descent and a speed all in a breath.
    Every clause is parsed independently and the readbacks are collected into a
    single crew response instead of one line per clause. */
 var acks=[];
 var control=false;   /* did this transmission actually try to control the aircraft */

 /* runway — the token can sit anywhere, as long as the transmission is about a runway */
 /* Any runway that exists at the field this one is landing at, digits or spoken
    — the parallels need their side, and a runway with no parallel must not be
    matched by something that does have one. Longest designator first so 12L
    wins over a bare 12. */
 var mR=null;
 if(/(expect|runway)/.test(t)){
  /* look only at the part of the transmission from the word onward, so a
     digit in the callsign can never be read as a runway */
  var ixs=[t.indexOf('expect'), t.indexOf('runway')].filter(function(x){ return x>=0; });
  var seg=t.slice(Math.min.apply(null, ixs));
  var cands=runwaysAt(a.dest||'KMSP').slice().sort(function(x,y){ return y.length-x.length; });
  for(var ri=0; ri<cands.length && !mR; ri++){
   var rr=cands[ri], num=rr.replace(/[LRC]$/,'');
   var sfx=((rr.match(/[LRC]$/)||[''])[0]).toLowerCase();
   var word=(sfx==='l'?'left':(sfx==='r'?'right':(sfx==='c'?'center':'')));
   var spoken=num.split('').map(function(c){ return SAY_DIGIT[+c]; }).join('[ ]+');
   var tail=word ? ('[ ]*(?:'+sfx+'|'+word+')(?![a-z])') : '(?![a-z0-9])';
   if(new RegExp('(?:^|[^a-z0-9])(?:'+num+'|'+spoken+')'+tail).test(seg)) mR=rr;
  }
 }
 if(mR){ acted=true; control=true;
  var prev=a.rwy; a.rwy=mR;
  acks.push('expect runway '+sayRunway(mR));
  if(prev&&prev!==mR){
   /* the receiver follows the gate as well as the runway, so a flip can hand
      the aircraft to a different sector than the runway alone would suggest */
   var nowR=receiverFor(a);
   a.rwy=prev; var wasR=receiverFor(a); a.rwy=mR;
   log('info','<span class="dd-chip info">note</span>Runway flip — <b>'+a.cs+'</b> now goes to '+nowR.name+' ('+nowR.frq+'): '+nowR.why+'. Any earlier flash to '+wasR.name+' is stale.');
   a.flashed=null;
  }

 }
 /* altimeter — any setting, checked against the one the drill is running */
 var givenAltim=altimIn(t);
 if(givenAltim){ acted=true;
  acks.push(sayDigits(givenAltim));
  if(givenAltim===simAltim()){ a.altim=true; }
  else {
   a.altim=true;
   log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> was given altimeter '+sayDigits(givenAltim)+' and the field is on '+sayDigits(simAltim())+'. They read back what you said, which is exactly the problem.');
  }
 }
 /* descend via — the standard initial-contact clause; acknowledged, changes nothing */
 if(/descend via/.test(t)){ acted=true;
  if(a.rules==='VFR'){
   log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> is VFR — there is no descend-via to issue. A VFR aircraft is not on the arrival, and telling it to descend via one leaves everybody guessing which set of rules it is under.');
  } else if(a.role!=='arrival'){
   log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> is a '+a.role+' — descend via belongs to an arrival on a STAR.');
  } else acks.push('descend via the '+(a.gate||'arrival')+' arrival');
 }
 /* speed family — requires the word speed or knots so it can never eat an altitude */
 var mS=t.match(/(?:speed(?:\s+to)?\s+(\d{2,3})|(\d{2,3})\s*(?:knots|kts))\b/);
 var spdVal=mS?+(mS[1]||mS[2]):null;
 if(mS && spdVal>=170 && spdVal<=340){ acted=true; control=true;
  a.iasAsg=spdVal; a.spdMode='assigned';
  acks.push(String(spdVal).split('').join(' ')+' on the speed');
 } else if(/resume published speed/.test(t)){ acted=true;
  var wasHot=(a.spdMode!=='published');
  a.spdMode='published'; a.iasAsg=null;
  acks.push('resume published speed');
  if(wasHot) log('good','<span class="dd-chip good">good</span>Ladder speeds restored on <b>'+a.cs+'</b> — that is the phrase that hands the STAR its own numbers back.', 'speed');
 } else if(/resume normal speed/.test(t)){ acted=true;
  a.spdMode='normal'; a.iasAsg=null;
  acks.push('resume normal speed');
  log('flag','<span class="dd-chip flag">flag</span>"Resume normal speed" does <b>not</b> reinstate the published restrictions — '+a.cs+' holds current speed. If you wanted the ladder back, that was "resume published speed."', 'speed');
 } else if(/delete speed restriction/.test(t)){ acted=true;
  a.spdMode='free'; a.iasAsg=null;
  acks.push('speed restrictions deleted');
  log('flag','<span class="dd-chip flag">flag</span>All published speeds waived for <b>'+a.cs+'</b> — Drill 8 lesson: assign the working speed up front rather than delete-then-recover.', 'speed');
 } else if(/comply with (published )?speed/.test(t)){ acted=true;
  a.spdMode='published'; a.iasAsg=null;
  acks.push('comply with published speeds');
 }
 /* altitude family — the signature phraseology check. The speed clause is cut
    out of the text first so "maintain 250 knots" can never read as an altitude,
    which is what used to force altitude and speed into separate transmissions. */
 var tAlt = mS ? t.replace(mS[0],' ') : t;
 var mAlt=tAlt.match(/(descend and maintain|climb and maintain|maintain)\s+([0-9][0-9,]{1,5})/);
 if(mAlt){ acted=true; control=true;
  var val=+mAlt[2].replace(/,/g,''); if(val<1000) val=val*100;
  if(mAlt[1]==='maintain' && Math.abs(val-a.alt)>400){
   log('crew','<b>'+a.cs+':</b> "ahh… confirm you want us '+(val<a.alt?'descending':'climbing')+' to '+fmtAlt(val)+'? '+a.cs+'."');
   log('flag','<span class="dd-chip flag">flag</span>Bare "maintain" to an aircraft '+(val<a.alt?'above':'below')+' the number — the crew has to query it. One word fixes it: "'+(val<a.alt?'descend':'climb')+' and maintain." This is the standing OJT item.', 'maintain');
  } else {
   acks.push((val<a.alt?'descend and maintain ':'climb and maintain ')+fmtAlt(val));
   log('info','<span class="dd-chip info">note</span>Assigned altitudes off a descend-via cancel the ladder below — the sim keeps it simple and flies '+a.cs+' to '+fmtAlt(val)+'.');
   a.hardAlt=val;
  }
 }
 /* Working an aircraft you have not identified. Said once per strip so it is a
    correction rather than a drumbeat. */
 if(control && a.popup && !a.ifrCleared && !a.clrNoted && !/cleared to\b/.test(t)){
  a.clrNoted=true;
  log('flag','<span class="dd-chip flag">flag</span>You are working <b>'+a.cs+'</b> as an IFR aircraft and it has never been given a clearance. It called you up VFR asking for one — until you issue it, it is not IFR, and that is the gap session 7 was about.');
 }
 if(control && !a.identified && !a.svcNoted){
  a.svcNoted=true;
  log('flag','<span class="dd-chip flag">flag</span>You are working <b>'+a.cs+'</b> before radar service exists on it — it came at you with nobody talking to it. A code and a radar identification come before a control instruction, not after.');
 }
 /* one readback for the whole transmission */
 if(acks.length) log('crew','<b>'+a.cs+':</b> "'+acks.join(', ')+', '+a.cs+'."');
 /* flash */
 if(/\bflash\b/.test(t)){ acted=true;
  var recF=receiverFor(a);
  var due=recF.pos;
  var side = /(^|\s)(n|north)(\s|$)/.test(t)?'N':(/(^|\s)(s|south)(\s|$)/.test(t)?'S':null);
  if(a.role!=='arrival'){
   var wrongWay = (/rochester|\brst\b/.test(t) && due!=='RST') || (/cent(?:er|re)|\bzmp\b/.test(t) && due!=='ZMP');
   if(wrongWay){
    log('flag','<span class="dd-chip flag">flag</span>That flash goes to the wrong neighbour — <b>'+a.cs+'</b> is '+recF.name+'\u2019s: '+recF.why+'.', 'posthandoff');
   } else {
    a.flashed=due;
    log('good','<span class="dd-chip good">good</span>'+recF.name+' takes the flash on <b>'+a.cs+'</b> \u2014 '+recF.why+'.', 'posthandoff');
   }
  } else if(side && side!==sideOfPos(due)){
   log('flag','<span class="dd-chip flag">flag</span>'+side+' bounces the flash on <b>'+a.cs+'</b> — it is '+recF.name+'’s: '+recF.why+'. Re-flash.', 'posthandoff');
  } else {
   a.flashed=due;
   log('good','<span class="dd-chip good">good</span>'+recF.name+' takes the flash on <b>'+a.cs+'</b>'
     +((recF.cross&&recF.cross!=='none')?' — '+recF.why:'')+'.', 'posthandoff');
  }
 }
 /* switch */
 if(/contact|switch/.test(t) && !/say/.test(t)){ acted=true;
  var rec=receiverFor(a);
  /* Center has no published sector frequency in the reference set, so a
     departure or an overflight is graded on the timing, not the number. */
  /* Rochester answers on 119.8 or 119.2 — the LOA says "as appropriate" and
     does not say which is which, so either is accepted (M98/RST LOA 5.b(3)). */
  var frqList = rec.alt2 ? [rec.frq, rec.alt2] : (rec.frq ? [rec.frq] : []);
  var frqOk = !frqList.length || !/\d/.test(t) || frqList.some(function(fq){
   return t.indexOf(fq)>=0 || t.replace(/\s|point/g,'').indexOf(fq.replace('.',''))>=0;
  });
  if(a.role!=='arrival'){
   /* naming the wrong neighbour is its own mistake, separate from the timing */
   var saidRst=/rochester|\brst\b/.test(t), saidCtr=/cent(?:er|re)|\bzmp\b/.test(t);
   if(rec.pos==='RST' && saidCtr && !saidRst){
    log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> goes to Rochester, not Center — '+rec.why+'. Center will not take it.', 'posthandoff');
   } else if(rec.pos==='ZMP' && saidRst && !saidCtr){
    log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> is Center\u2019s, not Rochester\u2019s — '+rec.why+'.', 'posthandoff');
   }
   /* the four altitudes M98 may enter RST airspace at — LOA 5.b(1) */
   if(rec.pos==='RST' && RST_ENTRY_ALTS.indexOf(Math.round(a.alt/100)*100)<0){
    log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> is going to Rochester at '+fmtAlt(a.alt)+'. M98 enters RST airspace at 3,000, 5,000, 7,000 or 9,000 and nothing else (M98/RST LOA 5.b(1)) \u2014 and at 7,000 or 9,000 it has to be clear of the KASPR arrival, parallel to it or diverging (5.b(2)).', 'floors');
   }
   if(!a.flashed){
    log('flag','<span class="dd-chip flag">flag</span><b>'+rec.pos+':</b> \u201cthere\u2019s a '+a.cs+' checking on that I never got a flash on. Flash it, then switch it \u2014 in that order.\u201d', 'posthandoff');
   } else {
    log('good','<span class="dd-chip good">good</span><b>'+a.cs+'</b> flashed then switched to '+rec.pos+' \u2014 the full sequence, in order.', 'posthandoff');
   }
   a.switched=true;
   log('crew','<b>'+a.cs+':</b> \u201cover to '+(rec.pos==='RST'?('Rochester, '+rec.frq):'Center')+', '+a.cs+', good day.\u201d');
  }
  else if(!a.flashed){
   log('flag','<span class="dd-chip flag">flag</span><b>'+rec.pos+':</b> "there\u2019s a '+a.cs+' on my frequency I never got a flash on. Flash it, then switch it — in that order."', 'posthandoff');
   a.switched=true; a.alive=true;
  } else if(!frqOk){
   log('flag','<span class="dd-chip flag">flag</span>Wrong frequency for '+rec.pos+' — they own '+rec.frq+'. The crew comes back confused.', 'posthandoff');
  } else if(a.alt>FLOORS[a.gate]+400){
   a.switched=true;
   log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> shipped at '+fmtAlt(a.alt)+' — the '+(FLOORS[a.gate]===8000?'far-gate 8,000':'near-gate 7,000')+' floor wasn\u2019t made. '+rec.pos+' has to un-do the altitude.', 'floors');
   log('crew','<b>'+a.cs+':</b> "over to approach, '+rec.frq+', '+a.cs+', good night."');
  } else {
   a.switched=true;
   log('good','<span class="dd-chip good">good</span><b>'+a.cs+'</b> switched to '+rec.pos+' at the floor, flashed first — the full sequence, in order.', 'floors');
   log('crew','<b>'+a.cs+':</b> "over to approach, '+rec.frq+', '+a.cs+', good night."');
  }
 }
 /* queries */
 if(/say speed/.test(t)){ acted=true; log('crew','<b>'+a.cs+':</b> "'+a.cs+', '+Math.round(a.ias)+'."'); }
 if(/say altitude/.test(t)){ acted=true; log('crew','<b>'+a.cs+':</b> "'+a.cs+', '+fmtAlt(a.alt)+'."'); }
 if(/say route|say intentions/.test(t)){ acted=true;
  log('crew','<b>'+a.cs+':</b> "'+a.cs+' is '+a.rules+(a.rules==='IFR'
    ? (a.filed?(', '+a.filed):', and we never filed a route with you')
    : (a.filed?(', '+a.filed):', no IFR route'))+'."'); }
 /* the IFR clearance a pop-up is waiting on. Session 7's pattern was a Skyhawk
    given a heading and an altitude but never an actual clearance, so what gets
    checked here is whether the clearance is complete: where to, how, and how
    high, with no gap where VFR-or-IFR is ambiguous. */
 if(/cleared to\b/.test(t)){ acted=true; control=true;
  var hasWay = /\bvia\b|heading|direct|radar vector/.test(t);
  var hasHigh = /climb|descend|maintain/.test(t);
  if(a.rules!=='IFR'){
   log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> is VFR — there is no IFR clearance to issue unless it asked for one. If it did, build it as a pop-up.');
  } else if(a.ifrCleared){
   log('coach','<span class="coach">'+a.cs+' is already on a clearance — it came to you on one.</span>');
  } else {
   a.ifrCleared=true;
   var missing=[];
   if(!hasWay) missing.push('how it gets there — via, direct, or a heading');
   if(!hasHigh) missing.push('an altitude');
   if(missing.length){
    log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> has a clearance now, but it is missing '+missing.join(' and ')+'. \u201cCleared to the airport via fly heading two seven zero, climb and maintain four thousand\u201d \u2014 no gap where VFR-or-IFR is ambiguous.');
   } else {
    log('good','<span class="dd-chip good">good</span><b>'+a.cs+'</b> is on a full IFR clearance \u2014 where to, how, and how high, all in one.');
   }
   acks.push('cleared as issued');
  }
 }
 /* beacon code, radar identification, and terminating the service */
 /* The navaids at the head of a departure are part of the procedure, not fixes
    anybody gets cleared direct to. */
 var mDir=t.match(/\bdirect\s+([a-z]{3,5})\b/);
 if(mDir){
  var want=mDir[1].toUpperCase();
  var onRt=a.route.filter(function(p){ return p.f===want; })[0];
  if(a.role==='departure' && onRt && onRt.vor){
   acted=true;
   log('flag','<span class="dd-chip flag">flag</span>'+want+' is a navaid at the head of the '
     +(a.sid?(a.sid+' departure'):'departure')+' — it is there because the procedure starts on it, not because it is a fix you clear anybody direct to. <b>'+a.cs
     +'</b> flies the departure; if you want it off the procedure, give it a heading or a fix further out.');
  } else if(onRt){
   acted=true; acks.push('direct '+want);
   if(!a.dirNoted){ a.dirNoted=true;
    log('info','<span class="dd-chip info">note</span>Read back, but the engine does not re-path an aircraft — <b>'+a.cs+'</b> keeps flying its own track. The direct is scored as phraseology, not as a route change.');
   }
  }
 }
 var mSq=t.match(/squawk\s+(\d{4})/);
 if(mSq){ acted=true; a.squawk=mSq[1]; acks.push('squawk '+sayDigits(mSq[1])); }
 if(/radar service terminated/.test(t)){ acted=true;
  a.identified=false; a.radar='terminated';
  acks.push('radar service terminated');
 } else if(/radar contact/.test(t)){ acted=true;
  if(a.identified){
   log('coach','<span class="coach">'+a.cs+' was already in radar contact when it reached you — it came as a handoff'+(a.from?(' from '+a.from):'')+'. Saying it again costs nothing but it is not doing anything either.</span>');
  } else if(!a.squawk){
   log('flag','<span class="dd-chip flag">flag</span><b>'+a.cs+'</b> has not been given a code and has not been identified, so there is nothing to be in radar contact with. Assign a beacon code first, then identify, then say it.');
  } else {
   var wasFollowing=(a.radar==='following'), wasDep=(a.radar==='departure');
   a.identified=true;
   log('good','<span class="dd-chip good">good</span><b>'+a.cs+'</b> is radar contact on '+sayDigits(a.squawk)
     +(wasDep ? ' — it came off '+airportOf(a.dep).tower+' on the tower’s code and this is the identification it was owed.'
      : wasFollowing ? ' — flight following established. It gets advisories now, and it gets terminated on the way out.'
      : ' — radar service established, and now you can work it.'), 'posthandoff');
  }
 }
 if(/disregard/.test(t)) acted=true;

 if(!acted) log('coach','<span class="coach">Nothing parsed. Known verbs: expect runway · speed NNN · descend/climb and maintain · resume published speed · resume normal speed · delete speed restrictions · flash · contact/switch · altimeter 2980 · say speed/altitude. Departures and overflights take the same verbs — climb and maintain, flash, contact center.</span>');
 render();
}

/* hardAlt override on descent target */
var _origNext = nextAltTarget;
nextAltTarget = function(a){ if(a.hardAlt!=null) return a.hardAlt; return _origNext(a); };

/* ---------- 5. Render ---------- */
function fixDot(p, big){ return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(big?3.5:2.2)+'" fill="var(--green)" opacity="'+(big?'0.9':'0.55')+'"/>'; }
function scopeSvg(){
 var s='<svg class="dd-scope" viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live drill scope">';
 s+='<text x="14" y="20" fill="var(--dim2)" font-family="IBM Plex Mono" font-size="10">LIVE SCOPE \u2014 SCHEMATIC, PLOTTED FROM FIX COORDINATES</text>';
 /* charted obstructions */
 if(LAYERS!=='off'){
  OBSTRUCTIONS.forEach(function(o){
   var p=pxRD(o.r,o.d);
   var col=o.watch?'var(--red)':'var(--dim2)';
   s+='<path d="M'+(p.x).toFixed(1)+','+(p.y-4).toFixed(1)+' L'+(p.x-3.5).toFixed(1)+','+(p.y+2.5).toFixed(1)+' L'+(p.x+3.5).toFixed(1)+','+(p.y+2.5).toFixed(1)+' Z" fill="none" stroke="'+col+'" stroke-width="1" opacity="'+(o.watch?'0.95':'0.55')+'"/>';
   if(o.watch) s+='<text x="'+(p.x+6).toFixed(1)+'" y="'+(p.y+3).toFixed(1)+'" fill="'+col+'" font-family="IBM Plex Mono" font-size="9">'+o.ft.toLocaleString()+'</text>';
  });
 }
 /* the departure dispersal area — MSP Tower's, surface to 7,000 */
 var ddaA=ddaFor('12');
 if(ddaA && LAYERS!=='off'){
  var dpp=ddaA.poly.map(function(b){var p=pxRD(b[0],b[1]);return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ');

function logHtml(){
 var cards=DRILL_LOG.map(function(d){
  return '<div class="dd-log-card"><div class="dd-log-head"><b>Drill '+d.n+' \u2014 '+d.head+'</b>'
   +'<span class="dd-log-meta">'+d.date+' \u00b7 '+d.seat+' \u00b7 '+d.cfg+' \u00b7 <span class="dd-chip '+d.chip+'">'+(d.chip==='good'?'clean':d.chip)+'</span></span></div>'
   +(d.banked.length?'<div class="lab g">Banked</div><ul>'+d.banked.map(function(b){return '<li>'+b+'</li>';}).join('')+'</ul>':'')
   +(d.open.length?'<div class="lab o">Open</div><ul>'+d.open.map(function(o){return '<li>'+o+'</li>';}).join('')+'</ul>':'')
   +(d.n==='10R'?'<div style="margin-top:10px;"><button class="dd-send" onclick="ddLoad(\'resume10r\')">Resume Drill 10R in the player</button></div>':'')
   +'</div>';
 }).join('');
 return '<section class="module dd-section" id="mod-log" data-mod="log">'
 +'<div class="modhead"><div><span class="tag">LOG</span><h2>Drill Library</h2>'
 +'<p class="modsub">Every AI-assisted drill \u2014 what got banked, what stayed open</p></div></div>'
 +'<div class="dd-note" style="margin-bottom:14px;">The cross-session review of OJT sessions 1\u20137 that used to open this page is now reference: <b>claude_M98_OJT_Session_Review.md</b>. It is where the standing items below came from.</div>'
 +'<div class="dd-panel dd-standing"><div class="lab" style="font-family:var(--mono);font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--amber);margin-bottom:8px;">Standing items \u2014 open across drills</div><ul>'
 + STANDING.map(function(s){return '<li><b style="color:var(--ink)">'+s.t+'.</b> '+s.d+'</li>';}).join('')
 +'</ul></div>'
 + cards
 +'</section>';
}
/* mount \u2014 resilient to placement and host-page structure */
function mountAll(){
 var wrap=document.querySelector('.wrap')||document.body;
 if(!wrap) return;
 var mount=document.createElement('div');
 mount.innerHTML=liveHtml()+logHtml();
 var foot=wrap.querySelector('footer');
 if(foot){ wrap.insertBefore(mount, foot); } else { wrap.appendChild(mount); }
 var nav=document.getElementById('modnav');
 if(nav){ nav.innerHTML += '<a href="#mod-live">LIVE</a><a href="#mod-log">LOG</a>'; }
 document.title='M98 Drill Deck';
 var tb=document.querySelector('.topbar div:last-child'); if(tb) tb.textContent='DRILL DECK';
 sim.timer=setInterval(function(){ if(sim.rate>0 && !sim.ended) tick(sim.rate); }, 1000);
 render();
}
