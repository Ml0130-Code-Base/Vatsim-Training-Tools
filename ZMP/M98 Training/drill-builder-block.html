   Requires the Drill Deck block (window.DD) earlier in the page.

     1. Authoring — build a drill by hand, or generate one from a seed,
        and load it straight into the live player. Saved drills persist.
     2. Response timing — the airplanes keep moving while you think, so
        the block measures the gap between the trigger and your key-up
        and grades it against a target you set.
     3. A notebook — every finished drill banks into the library with
        the standing items it exercised, so the open-items list stays
        current instead of going stale.

   No new operational data lives here. Every fix, floor, ladder speed
   and frequency is read through window.DD.
   ================================================================ */

+ '.dd-tabs button:hover{color:var(--ink);border-color:var(--dim2);}'

+ '@media (max-width:600px){.dd-grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}.dd-tabs{position:static;}}';
var st = document.createElement('style'); st.textContent = css;
if(document.head && document.head.appendChild) document.head.appendChild(st);

/* ---------- 2. Persistence (offline-safe, degrades to memory) ---------- */
var KEY = 'm98-drill-deck-v1';
var state = {v:1, drills:[], entries:[], retired:{}, target:20, seq:11, hot:false,
 layers:'tracked',
 pos:{seats:{H:1}, open:{H:1, R:1, N:1, S:1}, towers:'satellite towers open', rstOpen:true}};
var storeOk = true;
function store(){
 try{ return (typeof localStorage!=='undefined') ? localStorage : null; }catch(e){ return null; }
}
function save(){
 var s=store(); if(!s){ storeOk=false; return; }
 try{ s.setItem(KEY, JSON.stringify(state)); storeOk=true; }catch(e){ storeOk=false; }
}
function restore(){
 var s=store(); if(!s){ storeOk=false; return; }
 try{
  var raw=s.getItem(KEY); if(!raw) return;
  var o=JSON.parse(raw); if(!o||o.v!==1) return;
  state.drills=o.drills||[]; state.entries=o.entries||[]; state.retired=o.retired||{};
  state.target=o.target||20; state.seq=o.seq||11; state.hot=!!o.hot;
  if(o.layers) state.layers=o.layers;
  if(o.pos && o.pos.open){
   /* v1 stored a single seat string; carry it forward as a one-seat set */
   var seats = o.pos.seats || (o.pos.seat ? (function(){ var s={}; s[o.pos.seat]=1; return s; })() : null);
   if(seats) state.pos={seats:seats, open:o.pos.open, towers:o.pos.towers||state.pos.towers,
                        rstOpen:(o.pos.rstOpen!==false)};
  }
 }catch(e){ storeOk=false; }
}

/* ---------- 3. Reference lookups (all through DD — no second copy) ---------- */
var GATES = Object.keys(DD.ROUTES);
var RWYS = Object.keys(DD.RECEIVER);
/* the six MSP ladders and the three satellite ones both answer here */
function routeOf(g){ return DD.ROUTES[g] || DD.SAT_ROUTES[g] || null; }
function totalOf(g){ var r=routeOf(g); return r?r.total:0; }
/* the binding published altitude at a point on the ladder, per the STAR reference */
function capAt(g, dist){
 var r=routeOf(g); if(!r) return null;
 for(var i=0;i<r.length;i++){
  if(r[i].cum>=dist-0.05){ if(r[i].at!=null) return r[i].at; if(r[i].aa!=null) return r[i].aa; }
 }
 return DD.FLOORS[g];
}
function fixAt(g, dist){
 var r=routeOf(g), best=null; if(!r) return null;
 for(var i=0;i<r.length;i++){ if(r[i].cum>=dist-0.05){ best=r[i].f; break; } }
 return best||r[r.length-1].f;
}
function pubSpdAt(g, dist){
 var r=routeOf(g), sp=null; if(!r) return null;
 for(var i=0;i<r.length;i++){ if(r[i].cum<=dist && r[i].spd) sp=r[i].spd; }
 if(sp==null){ for(var j=0;j<r.length;j++){ if(r[j].spd){ sp=r[j].spd; break; } } }
 return sp||280;
}

/* ---------- 3b. Weather, configuration and voicing ----------
   Config follows the wind and the weather; it is never a free pick
   (claude_M98_Config_Reference.md, MSP-M98 LOA 9). Flight-category
   thresholds are the NWS/AWC set written down in claude_M98_Drill_Format.md.
   Weather floors: CRO 2,200/5 (MSP-M98 LOA 7.i); 17-22 1,400/4 (SOP 7-1 / LOA 11). */
function category(ceil, vis){
 var c=(ceil==null||isNaN(ceil))?99999:ceil, v=(vis==null||isNaN(vis))?99:vis;
 if(c<500 || v<1) return 'LIFR';
 if(c<1000 || v<3) return 'IFR';
 if(c<=3000 || v<=5) return 'MVFR';
 return 'VFR';
}
var TOOLBOX={
 VFR:'Full toolbox — visual approaches, visual separation, VFR traffic and Bravo transitions.',
 MVFR:'Marginal — visuals may still hold, but check the floor before you plan on one.',
 IFR:'Instrument approaches only — no visual approaches, no visual separation, no CRO. Wider spacing.',
 LIFR:'Instrument approaches only, and watch for below-minimums. No visuals, no visual separation, no CRO.'
};
var CONFIGS=[
 {id:'12',     name:'12 — land 12L/12R, depart 12L/12R', land:['12L','12R'], note:'SE flow; Mendota and Eagan corridor departures; STP shelf active'},
 {id:'12-17',  name:'12-17 — land 12L/12R, depart 12L/12R and 17', land:['12L','12R'], note:'Maximum runway 17 track 215 degrees; 3 miles in trail same fix'},
 {id:'30',     name:'30 — land 30L/30R, depart 30L/30R', land:['30L','30R'], note:'NW flow; dependent parallels; heavy jets to 30L'},
 {id:'30-17',  name:'30-17 — land 30L/30R, depart 30L/30R and 17', land:['30L','30R'], note:'NITZR and BLUEM are always Knock-It-Off in this one; Area F point-out to 6,000'},
 {id:'30-35',  name:'30-35 CRO — land 30L/30R and 35, depart 30L/30R', land:['30L','30R','35'], min:{ceil:2200, vis:5}, src:'MSP-M98 LOA 7.i', note:'CRDA ghost 30L to 35; matched and balanced sets'},
 {id:'17-22',  name:'17-22 CRO — land 17 and 22, depart 12R and 17', land:['17','22'], min:{ceil:1400, vis:4}, src:'SOP 7-1 / LOA 11', note:'LAHSO and CRDA; KKILR and WILDD arrivals prohibited'},
 {id:'4-35',   name:'4-35 — land 35, depart 4', land:['35'], note:'Land 35, depart 4 off the south intersection'},
 {id:'4',      name:'4 — land 4, depart 4', land:['4'], note:'NE wind; Knock-It-Off arrivals'},
 {id:'22',     name:'22 — land 22, depart 22', land:['22'], note:'SW wind; Knock-It-Off arrivals'},
 {id:'30/12',  name:'Land 30s / depart 12s — noise default', land:['30L','30R'], note:'Opposite-direction down the Mendota Heights and Eagan corridor; the quiet-hours default (LOA 9.g)'}
];
function configById(id){ for(var i=0;i<CONFIGS.length;i++){ if(CONFIGS[i].id===id) return CONFIGS[i]; } return CONFIGS[0]; }

/* ---------- D-ATIS — roadmap item 3 ----------
   The tool is offline by architecture, so the path that always works is paste:
   drop the current KMSP D-ATIS text in and it sets the flow and the weather on
   the frame. The fetch button is a convenience on top of that — it asks the
   published sources and falls back to the paste box the moment the browser
   refuses, which from a file page it usually does, because such a page has no
   origin for the server to allow. Nothing else in the tool touches the network
   and nothing here is needed for the rest of it to run. */
var DATIS_SOURCES = [
 {name:'atis.info',     url:'https://atis.info/api/KMSP'},
 {name:'datis.clowd.io', url:'https://datis.clowd.io/api/KMSP'}
];
/* the sources return either a bare string or an array of objects with a datis
   field, so unwrap whichever came back */
/* MSP runs a split D-ATIS — a separate arrival and departure broadcast with
   their own information letters — so both come back and both get read. The
   arrival one carries the approach in use, the departure one the runway being
   departed, and neither is complete on its own. */
function datisParts(payload){
 if(typeof payload==='string') return [payload];
 if(payload && typeof payload.datis==='string') return [payload.datis];
 if(payload && Array.isArray(payload)){
  var out=[]; payload.forEach(function(p){ out=out.concat(datisParts(p)); }); return out;
 }
 return [];
}
function datisText(payload){ return datisParts(payload).join('\n\n'); }
/* Sort a payload into the two broadcasts, so each lands in its own box. The
   sources tag them; where a source does not, the text says which it is in the
   first few words — "MSP ARR INFO J" against "MSP DEP INFO W". */
function datisSplit(payload){
 var out={arr:'', dep:''};
 if(typeof payload==='string'){ out.arr=payload; return out; }
 var list=(payload && Array.isArray(payload)) ? payload : (payload ? [payload] : []);
 list.forEach(function(p){
  if(!p || typeof p.datis!=='string') return;
  var ty=String(p.type||'').toLowerCase();
  var head=p.datis.toUpperCase().slice(0,40);
  var isDep = (ty.indexOf('dep')===0) || (!ty && /\bDEP\b|\bDEPARTURE\b/.test(head));
  if(isDep){ if(!out.dep) out.dep=p.datis; }
  else if(!out.arr) out.arr=p.datis;
 });
 return out;
}
/* The two boxes are one D-ATIS as far as the parser is concerned — it already
   reads a split broadcast, and the blank line is what separates them. */
function datisJoined(d){
 return [(d&&d.datisArr)||'', (d&&d.datisDep)||''].filter(function(s){ return String(s).trim(); }).join('\n\n');
}
/* Everything past the notice to airmen is closures and field condition. It
   names runways that are SHUT — "RWYS 12L, 30R CLSD" — so it must never be
   read as a runway in use. */
function datisClean(seg){ return String(seg).split(/NOTICE TO AIRMEN|NOTAMS?\b/)[0]; }
function rwyList(s){
 var out=[], m=String(s||'').toUpperCase().match(/\d{1,2}[LRC]?/g)||[];
 m.forEach(function(r){ if(out.indexOf(r)<0) out.push(r); });
 return out;
}
/* Which configuration the landing and departing runways describe. The landing
   set picks the candidates and the departures break the tie — a 12s and a
   12s-Depart-17 land the same runways. */
function configFromRunways(land, dep){
 if(!land || !land.length) return null;
 var key=land.slice().sort().join(',');
 var pick=function(cands){
  if(!cands.length) return null;
  if(cands.length===1) return cands[0].id;
  var d=' '+(dep||[]).join(' ')+' ';
  var has=function(id){ return cands.some(function(c){ return c.id===id; }); };
  if(/ 17 /.test(d) && has('12-17')) return '12-17';
  if(/ 17 /.test(d) && has('30-17')) return '30-17';
  if(/ 12[LRC]? /.test(d) && has('30/12')) return '30/12';
  return cands[0].id;
 };
 var exact=pick(CONFIGS.filter(function(c){ return c.land.slice().sort().join(',')===key; }));
 if(exact) return exact;
 /* a runway out of service narrows the flow without changing it — landing 30L
    on its own because 30R is closed is still a 30s. Take the configuration that
    covers what is landing with the fewest runways left over. */
 return pick(CONFIGS.filter(function(c){
   return land.every(function(r){ return c.land.indexOf(r)>=0; });
  }).sort(function(a,b){ return a.land.length-b.land.length; }));
}
/* Tolerant on purpose: D-ATIS comes through as the coded form, the spoken form,
   or a mix of the two depending on the source. */
function parseDatis(raw){
 var src=String(raw||'').trim();
 if(!src) return null;
 var segs=src.toUpperCase().split(/\n\s*\n/).map(function(s){ return datisClean(s.replace(/\s+/g,' ')); });
 var t=segs.join(' ');
 var o={raw:src, missed:[]}, m;
 /* one information letter per broadcast */
 segs.forEach(function(s){
  var c=s.match(/INFO(?:RMATION)? ([A-Z])\b/);
  if(!c) return;
  if(/\bDEP\b|\bDEPARTURE\b/.test(s.slice(0, c.index+12))) o.atisDep=o.atisDep||c[1];
  else o.atis=o.atis||c[1];
 });
 if(!o.atis && o.atisDep) o.atis=o.atisDep;
 /* wind */
 if(/\bWIND CALM\b|\b00000KT\b/.test(t)) o.wind='calm';
 else if((m=t.match(/\b(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?KT\b/)))
  o.wind=m[1]+'/'+parseInt(m[2],10)+(m[3]?('G'+parseInt(m[3],10)):'');
 else if((m=t.match(/\bWIND (\d{3}) AT (\d{1,3})(?: GUSTS? (?:TO )?(\d{1,3}))?/)))
  o.wind=m[1]+'/'+parseInt(m[2],10)+(m[3]?('G'+parseInt(m[3],10)):'');
 else o.missed.push('wind');
 /* visibility */
 if((m=t.match(/\b(\d{1,2}) (\d)\/(\d)SM\b/))) o.vis=parseInt(m[1],10)+parseInt(m[2],10)/parseInt(m[3],10);
 else if((m=t.match(/\b(\d{1,2})SM\b/))) o.vis=parseInt(m[1],10);
 else if((m=t.match(/\b(\d)\/(\d)SM\b/))) o.vis=parseInt(m[1],10)/parseInt(m[2],10);
 else if((m=t.match(/VISIBILITY (\d{1,2})\b/))) o.vis=parseInt(m[1],10);
 else o.missed.push('visibility');
 /* ceiling is the lowest broken or overcast layer; few and scattered are not
    ceilings, so a sky with neither is unlimited rather than unknown */
 var lows=[], sawSky=false;
 (t.match(/\b(?:BKN|OVC)\d{3}\b/g)||[]).forEach(function(s){ sawSky=true; lows.push(parseInt(s.slice(3),10)*100); });
 (t.match(/\b(?:BROKEN|OVERCAST) \d{3,5}\b/g)||[]).forEach(function(s){
  sawSky=true; var n=parseInt(s.replace(/\D+/g,''),10); lows.push(n<1000?n*100:n); });
 if(/\b(?:FEW|SCT|SKC|CLR|CAVOK|SCATTERED|FEW)\d*\b/.test(t)) sawSky=true;
 if(lows.length) o.ceil=Math.min.apply(null, lows);
 else if(sawSky) o.ceil=12000;
 else o.missed.push('ceiling');
 /* altimeter */
 if((m=t.match(/\bA(\d{4})\b/))) o.altim=m[1];
 else if((m=t.match(/ALTIMETER ((?:\d ?){4})/))) o.altim=m[1].replace(/\D/g,'');
 else o.missed.push('altimeter');
 /* the flow */
 /* the flow reads either as "landing runways 12L, 12R" or, when a single
    approach is advertised, as "visual runway 30L approach in use" — the runway
    sits ahead of the phrase in the second form */
 if((m=t.match(/(?:LAND(?:ING)?|LNDG) (?:RUNWAYS?|RWYS?) ([^.]*)/))) o.land=rwyList(m[1]);
 else if((m=t.match(/(?:APPROACHES?|APCHS?) IN USE ([^.]*)/))) o.land=rwyList(m[1]);
 else if((m=t.match(/([^.]*?) ?(?:APCH(?:ES)?|APPROACH(?:ES)?) IN USE/))) o.land=rwyList(m[1]);
 if((m=t.match(/(?:DEPART(?:ING)?|DEPTG) (?:RUNWAYS?|RWYS?) ([^.]*)/))) o.dep=rwyList(m[1]);
 o.cfg=configFromRunways(o.land||[], o.dep||[]);
 if(o.cfg && configById(o.cfg).land.slice().sort().join(',') !== (o.land||[]).slice().sort().join(','))
  o.partial=true;   /* matched on a subset — something is out of service */
 if(!o.land || !o.land.length) o.missed.push('landing runways');
 else if(!o.cfg) o.missed.push('a configuration matching landing '+(o.land||[]).join(', '));
 return o;
}
/* the arrival ladders the engine actually carries */
function engineRunways(){ return RWYS; }
/* Whether the engine has arrival geometry for a configuration. It does when
   ZMP-M98 LOA Table 2 gives that configuration a row of runway transitions —
   12, 12-17, 30, 30-17, 30-35 and 17-22 — and it does not for 4, 22, 4-35 or
   the 30/12 noise default, which Table 2 never names. This is not a runway
   test: the question is whether ZMP assigns transitions, not what M98 lands. */
function configCarried(cfg){ return DD.flowCarried(cfg); }

/* Callsign voicing — claude_US_Carrier_Callsigns.md.
   Flight numbers group in twos; registrations spell straight; zero is
   always "zero". Shown next to every strip so the drill trains the voice
   as well as the plan. */
var CARRIERS={DAL:'Delta', AAL:'American', UAL:'United', ASA:'Alaska', SWA:'Southwest', JBU:'JetBlue',
 FFT:'Frontier Flight', AAY:'Allegiant', SCX:'Sun Country', MXY:'Moxy', VXP:'Avelo',
 SKW:'SkyWest', EDV:'Endeavor', RPA:'Brickyard', JIA:'Blue Streak', ENY:'Envoy', PDT:'Piedmont',
 QXE:'Horizon Air', ASH:'Air Shuttle', GJS:'Lindbergh', UCA:'CommutAir', AWI:'Air Wisconsin',
 FDX:'FedEx', UPS:'UPS', GTI:'Giant', CKS:'Connie', ABX:'Abex', ATN:'Air Transport'};
var ONES=['zero','one','two','three','four','five','six','seven','eight','nine'];
var TEENS=['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
var PHON={A:'alpha',B:'bravo',C:'charlie',D:'delta',E:'echo',F:'foxtrot',G:'golf',H:'hotel',I:'india',
 J:'juliet',K:'kilo',L:'lima',M:'mike',N:'november',O:'oscar',P:'papa',Q:'quebec',R:'romeo',S:'sierra',
 T:'tango',U:'uniform',V:'victor',W:'whiskey',X:'x-ray',Y:'yankee',Z:'zulu'};
function pair2(n){
 if(n<10) return ONES[n];
 if(n<20) return TEENS[n-10];
 var t=Math.floor(n/10), o=n%10;
 return TENS[t]+(o?'-'+ONES[o]:'');
}
function flightNum(s){
 if(s.length===4){
  if(s.slice(2)==='00') return pair2(parseInt(s.slice(0,2),10))+' hundred';
  if(s.charAt(2)==='0') return pair2(parseInt(s.slice(0,2),10))+' zero '+ONES[+s.charAt(3)];
  return pair2(parseInt(s.slice(0,2),10))+' '+pair2(parseInt(s.slice(2),10));
 }
 if(s.length===3){
  if(s.slice(1)==='00') return ONES[+s.charAt(0)]+' hundred';
  if(s.charAt(1)==='0') return ONES[+s.charAt(0)]+' zero '+ONES[+s.charAt(2)];

 if(far.length)  opts.push({id:'far',  gates:far,  label:'Far gates only — '+far.join(', ')});

var PRESS={
 routine:{gap:[11,15], margin:[2200,3200], spawn:[70,100], live:2, label:'routine'},
 compressed:{gap:[6,9], margin:[1200,2200], spawn:[40,60], live:2, label:'compressed'},
 saturated:{gap:[4,6], margin:[700,1400], spawn:[22,35], live:3, label:'saturated'}
};
var FOCUS={
 free:{label:'open push', line:'Nothing weighted — everything is owed from the first transmission.'},
 sep:{label:'Separation proof', line:'Two on the shared trunk closing at the same altitude. Say who is one, say the number at the merge, say the protect move — out loud, before the engine notices.'},
 maintain:{label:'Climb / descend and maintain', line:'Every live strip starts well above its ladder, so the descent has to come from you. Drop the verb and the crew queries you.'},
 floors:{label:'Floors cited aloud', line:'Short fuse to the floor handoff. Cite the floor and its book before every switch — near 7,000 / far 8,000 on a 12s, SOP 4-4c(3).'},
 speed:{label:'Speed-restoration constructs', line:'Everyone arrives on an assigned speed. Restore the ladder before GREAK or the delivery spec breaks.'},
 posthandoff:{label:'Post-handoff discipline', line:'A runway flip mid-stream. Re-flash to the new receiver, then switch — in that order, and nothing after.'}
};
function gen(o){
 o=o||{};
 var seed = (o.seed!=null) ? (o.seed|0) : Math.floor(Math.random()*100000);
 var rnd=lcg(seed);
 var focus=FOCUS[o.focus]?o.focus:'free';
 var press=PRESS[o.pressure]||PRESS.compressed;
 var mix=(o.mixGates && o.mixGates.length) ? o.mixGates.slice() : GATES.slice();
 /* Shuffle the mix on the seed. The gate is picked by strip index, so without
    this a three-strip drill off a six-gate mix could only ever see the first
    three and MUSCL or BAINY would never turn up. Still deterministic — the
    same seed gives the same order. */
 for(var mi=mix.length-1; mi>0; mi--){
  var mj=Math.floor(rnd()*(mi+1)), mt=mix[mi]; mix[mi]=mix[mj]; mix[mj]=mt;
 }
 var n=Math.max(1,Math.min(6, o.count|0 || 3));
 var live=Math.min(n, press.live + (focus==='sep'?1:0));
 var near = (focus==='floors'||focus==='posthandoff');
 var band = near ? [6,13] : [17,31];
 var ac=[], used={}, dtgLive=0, spawnT=ri(rnd,8,22);
 var sepPair=null;
 if(focus==='sep'){
  for(var sx=0; sx<mix.length && !sepPair; sx++)
   for(var sy=sx+1; sy<mix.length && !sepPair; sy++)
    if(DD.sharedTail(DD.ROUTES[mix[sx]], DD.ROUTES[mix[sy]])) sepPair=[mix[sx], mix[sy]];
  if(!sepPair) sepPair=[mix[0], mix[0]];      /* one gate shares its whole ladder */
 }
 for(var i=0;i<n;i++){
  var gate=mix[i%mix.length];
  /* A separation drill needs the first two on a track they genuinely share,
     so the pair is chosen out of the mix rather than hardcoded to NITZR and
     BLUEM — a one-gate mix shares the whole ladder and is a valid pair. */
  if(focus==='sep' && i<2 && sepPair){ gate = sepPair[i]; }
  var ft=pick(rnd,FLEET), cs;
  do{ cs=ft.c+ri(rnd,120,2980); }while(used[cs]);
  used[cs]=1;
  var total=totalOf(gate);
  var r={cs:cs, type:ft.t, gate:gate, rules:'IFR', route:'', radar:'established',
         from:'', rwy:'', ckdIn:false, altim:false, spawnAt:0,
         mode:'published', asg:230};
  if(i<live){
   dtgLive = (i===0) ? ri(rnd,band[0],band[1]) : dtgLive + ri(rnd,press.gap[0],press.gap[1]);
   if(focus==='sep' && i===1) dtgLive = ac[0].dtg + ri(rnd,5,8);
   r.dtg = Math.round(Math.min(dtgLive, Math.max(3, total-1))*10)/10;
   r.ckdIn = true;
   r.altim = rnd()<0.6;
   var margin = ri(rnd,press.margin[0],press.margin[1]);
   if(focus==='maintain') margin += ri(rnd,2800,4200);
   var pub = capAt(gate, total-r.dtg);
   /* never start below the gate floor — that is the altitude the handoff is
      made at, so beginning under it would hand the trainee a drill that is
      already wrong (SOP 4-4c(3)) */
   var base = Math.max(DD.FLOORS[gate], pub==null?0:pub);
   r.alt = Math.max(DD.FLOORS[gate], Math.min(24000, Math.round((base+margin)/100)*100));
   r.ias = Math.round(pubSpdAt(gate, total-r.dtg)||280);
   if(focus==='sep' && i===1){ r.alt=ac[0].alt; r.ias=ac[0].ias+ri(rnd,20,40); }
   if(focus==='speed'){ r.mode='assigned'; r.asg=pick(rnd,[210,220,230,250]); r.ias=r.asg; }
   /* heavy jets take the 12R/30L transition in every config — ZMP Table 2c.
      The class comes off the type, so the flip can only go to one that is not. */
   if(near){ r.rwy = (focus==='posthandoff' && i===0 && !DD.wakeOf(r.type).heavy) ? '12L' : '12R'; r.altim=true; }
   else if(rnd()<0.35){ r.rwy='12R'; }
  } else {
   r.dtg = Math.round(total*10)/10; r.spawnAt = spawnT; spawnT += ri(rnd,press.spawn[0],press.spawn[1]);
   r.alt = Math.min(24000, capAt(gate, 0) + ri(rnd,6000,9000));
   r.alt = Math.max(DD.FLOORS[gate], Math.round(r.alt/1000)*1000);
   r.ias = 280;
  }
  r.route = DD.routeTextFor(r);
  /* who handed it over follows from where it comes in and how high */
  var rn = DD.neighbourAt(entryBearing(r), r.alt);
  r.from = (rn.pos==='RST') ? 'Rochester approach' : ('ZMP Sector '+pick(rnd,['5','9','10']));
  ac.push(r);
 }
 /* departures and an overflight ride alongside whatever the focus asked for */
 var nDep=Math.max(0, Math.min(3, o.deps|0));
 for(var d=0; d<nDep; d++){
  var ftd=pick(rnd,FLEET), dcs;
  do{ dcs=ftd.c+ri(rnd,120,2980); }while(used[dcs]);
  used[dcs]=1;
  var dsid=pick(rnd,SIDS);
  ac.push({cs:dcs, type:ftd.t, role:'departure', rules:'IFR', radar:'established', from:'MSP tower', sid:dsid,
           route:DD.routeTextFor({role:'departure', sid:dsid}),
           fromStart:ri(rnd,2,7), alt:ri(rnd,40,60)*100, ias:250,
           gate:'NITZR', dtg:20, mode:'free', asg:230, rwy:'',
           entryR:180, entryD:38, exitR:20, exitD:38,
           ckdIn:(d===0), altim:false, spawnAt:(d===0?0:ri(rnd,30,90))});
 }
 if(o.overflight){
  var er=ri(rnd,150,240), xr=(er+ri(rnd,120,200))%360;
  /* an overflight arriving from Rochester comes in at one of the three
     altitudes the LOA allows; anything else would need coordinating */
  var oAlt=ri(rnd,40,75)*100, oRadar=(rnd()<0.5?'none':'established');
  var oNb=DD.neighbourAt(er, oAlt);
  if(oNb.pos==='RST'){ oAlt=pick(rnd,DD.RST_OVF_ALTS); oNb=DD.neighbourAt(er, oAlt); }
  ac.push({cs:'N'+ri(rnd,100,999)+pick(rnd,['SP','GT','DP','ER','CM']), type:pick(rnd,['C172','SR22','BE36','PA46']), wake:'',
           role:'overflight', rules:'VFR', route:'',
           radar:oRadar, from:(oRadar==='established'?oNb.name:''),
           entryR:er, entryD:38, exitR:xr, exitD:38,
           alt:oAlt, ias:ri(rnd,110,180),
           gate:'NITZR', dtg:20, sid:'WLSTN', fromStart:4, mode:'free', asg:230, rwy:'',
           ckdIn:false, altim:false, spawnAt:ri(rnd,20,70)});
 }
 var fc=FOCUS[focus];
 return {
  id:'u'+seed+'-'+focus,
  name:'Built — '+fc.label+' · seed '+seed,
  cfg:o.cfg||'12', wind:o.wind||'150/9', ceil:(o.ceil==null?5000:o.ceil), vis:(o.vis==null?10:o.vis),
  atis:'J', altim:'2980', seat:o.seat||seatLabel(), towers:state.pos.towers,
  open:openLabel(), rstOpen:rstOpen(),
  brief:fc.line+' Generated '+press.label+' push, '+n+' strip'+(n>1?'s':'')+', seed '+seed+' — same seed rebuilds the same drill.',
  focus:focus, seed:seed, rate:1, hot:!!o.hot,
  speci:{on:!!o.speci, at:ri(rnd,150,300), ceil:1800, vis:3, wind:o.wind||'150/12'}, ac:ac
 };
}

/* ---------- 8. Validation — refuses anything the reference data won't carry ---------- */
function validate(rec){
 var errs=[], warns=[], seen={};
 if(!rec.name || !rec.name.trim()) errs.push('The drill needs a name.');
 if(!rec.ac || !rec.ac.length) errs.push('A drill needs at least one strip.');
 (rec.ac||[]).forEach(function(a,i){
  var tag='Strip '+(i+1)+(a.cs?' ('+a.cs+')':'');
  if(!a.cs || !/^[A-Z]{1,3}[0-9]{1,4}$|^N[0-9A-Z]{2,5}$/.test(a.cs)) errs.push(tag+': callsign should read like DAL589 or N172ER.');
  if(seen[a.cs]) errs.push(tag+': duplicate callsign — the parser matches on callsign and would address the wrong strip.');
  seen[a.cs]=1;
  var role=roleOf(a);
  if(!(a.alt>=2000 && a.alt<=24000)) errs.push(tag+': altitude must be between 2,000 and 24,000.');
  if(role==='departure'){
   if(SIDS.indexOf(a.sid)<0) errs.push(tag+': '+a.sid+' is not one of the turbojet SIDs in the reference ('+SIDS.join(', ')+').');
   else {
    var dt=DD.DEPS[a.sid].total;
    if(!(a.fromStart>=0)) errs.push(tag+': distance from MSP must be a number.');
    else if(a.fromStart>dt+0.5) errs.push(tag+': '+a.fromStart+' NM out is past the end of the '+a.sid+' join track ('+dt.toFixed(1)+' NM). M98 only takes a departure to the 60 NM join limit (ZMP-M98 LOA 4.f).');
    else if(a.fromStart>=DD.DEP_RELEASE.dme) warns.push(tag+': starts at '+a.fromStart+' NM, already at or beyond the '+DD.DEP_RELEASE.dme+' DME release point — the 4.c clock has run out before the drill begins.');
   }
   if(a.alt>=DD.DEP_RELEASE.alt) warns.push(tag+': starts at '+DD.fmtAlt(a.alt)+', at or above the '+DD.fmtAlt(DD.DEP_RELEASE.alt)+' release trigger — the release is already due on the first tick.');
  }
  else if(role==='overflight'){
   [['entryR',a.entryR,'entry radial'],['exitR',a.exitR,'exit radial']].forEach(function(p){
    if(!(p[1]>=0 && p[1]<=360)) errs.push(tag+': '+p[2]+' must be between 0 and 360.');
   });
   [['entryD',a.entryD,'entry distance'],['exitD',a.exitD,'exit distance']].forEach(function(p){
    if(!(p[1]>=5 && p[1]<=60)) errs.push(tag+': '+p[2]+' must be between 5 and 60 NM of the MSP VOR.');
   });
   if(a.entryR===a.exitR && a.entryD===a.exitD) errs.push(tag+': the entry and the exit are the same point — an overflight has to cross something.');
  }
  else if(!DD.ARRIVALS[a.gate]) errs.push(tag+': '+a.gate+' is not an arrival in the reference set ('+Object.keys(DD.ARRIVALS).join(', ')+').');
  else if((function(){
   /* the gate belongs to a Feeder position — 4-4d. Only worth saying when a
      Feeder seat is being worked and the other Feeder is actually open. */
   var owner=DD.feederFor(rec.cfg, a.gate);
   if(!owner) return false;
   var working=seatIds();
   if(working.indexOf('H')<0 && working.indexOf('I')<0) return false;
   if(working.indexOf(owner)>=0) return false;
   if(!isOpen(owner)) return false;          /* the other feeder is closed, so it is yours anyway */
   return owner;
  })()){
   var ow=DD.feederFor(rec.cfg, a.gate);
   if(!warns.some(function(w){ return w.indexOf('SOP 4-4d')>=0; }))
    warns.push(tag+': '+a.gate+' is a '+(ow==='I'?'North':'South')+' Feeder gate in the '+configById(rec.cfg).id+' configuration (SOP 4-4d) and you are working '+seatIds().join(' + ')+'. Gates do get reassigned between the Feeders to balance, so this is legal — but it is not the default split.');
  }
  else if(DD.SAT_DIRECT[a.gate]){
   /* a direct routing has no published ladder — its length falls out of where
      it crossed the boundary, so there is nothing to check until that is set */
   var dr=(a.entryR>=0 && a.entryR<=360 && a.entryD>0)
     ? DD.satDirectRoute(a.gate, {r:a.entryR, d:a.entryD}, a.dest||'KFCM') : null;
   if(dr){
    if(!(a.dtg>=0)) errs.push(tag+': distance to go must be a number.');
    else if(a.dtg>dr.total+0.5) errs.push(tag+': '+a.dtg.toFixed(1)+' NM to go is longer than the whole '+a.gate+' routing ('+dr.total.toFixed(1)+' NM from the boundary to '+(a.dest||'KFCM')+').');
    var da=DD.SAT_DIRECT[a.gate];
    if(a.alt>da.alt+100)
     warns.push(tag+': starts at '+DD.fmtAlt(a.alt)+' on the '+a.gate+' routing, which the agreement puts at '+da.altNote+' ('+da.src+'). Legal to be higher on the way in, but it has to be down there by the boundary.');
   }
  }
  else {
   var total=totalOf(a.gate);
   if(!(a.dtg>=0)) errs.push(tag+': distance to go must be a number.');
   else if(a.dtg>total+0.5) errs.push(tag+': '+a.dtg.toFixed(1)+' NM to go is past the start of the '+a.gate+' ladder ('+total.toFixed(1)+' NM total).');
   /* only the six MSP gates have a Feeder-to-Arrival floor; a satellite arrival
      is held to its own published crossings instead */
   var floor=DD.FLOORS[a.gate];
   if(floor!=null && a.alt>=2000 && a.alt<floor) errs.push(tag+': '+DD.fmtAlt(a.alt)+' is below the '+a.gate+' floor of '+DD.fmtAlt(floor)+' — '+(DD.FLOOR_BASIS[a.gate]||'SOP 4-4c')+'. The drill would start below the handoff floor.');
   else {
    var cap=capAt(a.gate, Math.max(0,total-a.dtg));
    if(cap!=null && a.alt<cap-100) warns.push(tag+': starts at '+DD.fmtAlt(a.alt)+', below the published '+DD.fmtAlt(cap)+' binding at '+fixAt(a.gate, Math.max(0,total-a.dtg))+' — legal to fly, but the ladder is already satisfied and there is no descend-via left to work.');
   }
  }
  /* an overflight can be a light single; an arrival or a departure cannot */
  var loSpd = (role==='overflight') ? 60 : 150;
  if(!(a.ias>=loSpd && a.ias<=350)) errs.push(tag+': speed must be between '+loSpd+' and 350 knots'+(role==='overflight'?' — a transiting light single sits around 110.':'.'));
  if(a.mode==='assigned' && !(a.asg>=170 && a.asg<=340)) errs.push(tag+': assigned speed must be between 170 and 340 knots.');
  if(role==='arrival' && a.rwy && RWYS.indexOf(a.rwy)<0) errs.push(tag+': '+a.rwy+' is not a runway in the receiver table ('+RWYS.join(', ')+').');
  if(!a.ckdIn && !(a.spawnAt>=0)) errs.push(tag+': check-in time must be zero or more seconds.');
  if(role==='arrival' && a.alt>=18000 && a.dtg<15) warns.push(tag+': '+DD.fmtAlt(a.alt)+' with '+a.dtg.toFixed(1)+' NM to run — the engine descends about 1,800 feet a minute, so this one cannot make its floor. Deliberate, or a typo?');
 });
 /* opening geometry against the in-trail check the engine runs — only for a
    pair that actually shares a tail, which is what the engine compares */
 var liveArr=(rec.ac||[]).filter(function(a){ return a.ckdIn && roleOf(a)==='arrival' && DD.ROUTES[a.gate]; });
 for(var i=0;i<liveArr.length;i++) for(var j=i+1;j<liveArr.length;j++){
  var A=liveArr[i], B=liveArr[j];
  var sh=DD.sharedTail(DD.ROUTES[A.gate], DD.ROUTES[B.gate]);
  if(!sh || A.dtg>sh.len || B.dtg>sh.len) continue;
  if(Math.abs(A.dtg-B.dtg)<3 && Math.abs(A.alt-B.alt)<900)
   warns.push(A.cs+' and '+B.cs+' begin '+Math.abs(A.dtg-B.dtg).toFixed(1)+' NM apart co-altitude on the shared '+sh.fix+' tail — the engine logs loss of separation on the first tick. Start them apart and let the closure be the drill.');
 }
 /* a departure with nobody working departures is worth saying out loud */
 var hasDep=(rec.ac||[]).some(function(a){ return roleOf(a)==='departure'; });
 if(hasDep && !seatPositions().some(function(p){ return p.job==='departure' || p.id==='H'; }))
  warns.push('This drill has departures in it but the seat you are working is not a departure position and is not the combined H. Deliberate, or does the position setup need a look?');
 /* configuration follows the weather — MSP-M98 LOA 9; it is not a free pick */
 var cfg=configById(rec.cfg), cat=category(rec.ceil, rec.vis);
 if(cfg.min){
  if(rec.ceil!=null && rec.ceil<cfg.min.ceil) errs.push(cfg.id+' needs a ceiling of at least '+cfg.min.ceil.toLocaleString()+' feet and you have set '+Number(rec.ceil).toLocaleString()+' ('+cfg.src+'). Below the floor this configuration is off the table — fall back to one that the weather supports.');
  if(rec.vis!=null && rec.vis<cfg.min.vis) errs.push(cfg.id+' needs visibility of at least '+cfg.min.vis+' miles and you have set '+rec.vis+' ('+cfg.src+').');
 }
 if(cat!=='VFR') warns.push('Flight category is '+cat+'. '+TOOLBOX[cat]+' Whatever you had planned on a visual, plan again.');
 if(!configCarried(rec.cfg)) warns.push('ZMP-M98 LOA Table 2 has no row for the '+configById(rec.cfg).id+' configuration, so the engine carries no arrival ladders for it and the scope draws no gate geometry. Table 2 covers 12, 12-17, 30, 30-17, 30-35 and 17-22. Everything else about the frame is real — brief it and work it — but which transition ZMP assigns here is not in the document, and the tool will not guess it from the landing runways.');
 if(DD.TABLE2_FOOTNOTE[rec.cfg]) warns.push(DD.TABLE2_FOOTNOTE[rec.cfg]);
 (rec.ac||[]).forEach(function(a,i){
  var rules=(a.rules==='VFR')?'VFR':'IFR';
  var tag2=(a.cs||'Strip '+(i+1));
  /* we have to know the rules, and an IFR strip has to have a route */
  /* A pop-up has not filed anything — the route is what you are about to give

  var radarState=DD.normRadar(a.radar, rules, roleOf(a));
  var isPopup=(radarState==='popup');
  if(rules==='IFR' && !isPopup && !String(a.route||'').trim())
   errs.push(tag2+' is IFR with no route. Fill it from the procedure or type the filed one — an IFR strip handed to you is on a clearance, and a clearance has a route.');
  if(isPopup && roleOf(a)==='arrival')
   warns.push(tag2+' is a pop-up IFR on the '+a.gate+' ladder. A pop-up comes up airborne asking for a clearance, so it would not already be flying a STAR — check this is the drill you meant.');
  if(isPopup && String(a.route||'').trim())
   warns.push(tag2+' is a pop-up IFR with a route already on it. That is what it is asking you for, so the route reads as what it wants rather than what it has.');

   errs.push(tag2+' is VFR at '+DD.fmtAlt(a.alt)+'. Class A starts at 18,000 and it is IFR only.');
  if(rules==='VFR' && roleOf(a)==='arrival')
   warns.push(tag2+' is a VFR arrival on the '+a.gate+' ladder. A VFR aircraft is not flying the descend-via, so the engine will hold its altitude until you assign one — deliberate, or should it be IFR?');
  /* radar service — a handoff should say who from, and a cold call cannot be one */

  var st=DD.RADAR_STATES[radarState], noSvc=(!st.code && !st.ident);

  if(roleOf(a)==='departure'){

    errs.push(tag2+' departs '+(a.dep||'KMSP')+', and the route data carries only the nine MSP turbojet SIDs — a satellite departure has no track for the engine to fly yet.');
   if(a.depRwy && dapt.rwys.indexOf(a.depRwy)<0)

   if(rules==='IFR' && a.depRwy && dapt.noIfrDep && dapt.noIfrDep.indexOf(a.depRwy)>=0)

  }

   /* the arrival has to be one that actually ends at that field */

   if(a.gate && !proc)

   else if(a.gate && !DD.arrivalServes(a.gate, dest)){

      +proc.serves.join(', ')+'. Into '+dest+' it would be '+(ok.length?ok.join(', '):'nothing in the reference set')+'.'
      +(proc.kind==='RNAV' ? ' The six RNAV gates are MSP arrivals and nothing else.' : ''));
   }

   if(a.rwy && !DD.runwaysAt(dest).length)
    errs.push(tag2+' is assigned runway '+a.rwy+' at '+dest+', and that field’s runway inventory is not in the reference set. Leave the runway unissued.');
   if(a.rwy && dap.rwys.indexOf(a.rwy)<0)
    errs.push(tag2+' is assigned runway '+a.rwy+', which is not a runway at '+dest+'. That field has '+dap.rwys.join(', ')+'.');
   if(a.rwy && String(rec.cfg||'').indexOf(String(a.rwy).replace(/[LRC]$/,''))<0)
    warns.push(tag2+' is assigned runway '+a.rwy+' in a '+rec.cfg+' configuration, which is not a runway that configuration lands. Configuration follows the wind and is never a free pick (MSP-M98 LOA 9) — check the frame.');
   if(a.rwy && DD.sideOfRunway(a.rwy)===null)
    warns.push(tag2+' is assigned runway '+a.rwy+'. SOP 4-2 splits 4, 22, 17 and 35 west and east of the localizer rather than north and south, so the receiver falls back to the side the gate feeds — the frame is right, the vectoring is not modelled.');
   if(proc && proc.direct && !(a.entryR>=0 && a.entryR<=360 && a.entryD>0))
    errs.push(tag2+' comes in on '+a.gate+', which is a direct routing rather than a published arrival, so it needs the radial and the DME it crosses the boundary on — the same way an overflight does.');
   if(a.mode==='assigned' && !(a.asg>=60 && a.asg<=350))
    errs.push(tag2+' is marked as Center-advised on speed, but the speed reads '+a.asg+'. An arrival on an optimized profile descent flies the published speeds unless Center called with something else — give the number they passed, or put it back on published.');
  }
  if(radarState==='established' && !String(a.from||'').trim())
   warns.push(tag2+' arrives with radar service already established but nothing says who handed it off. On this geometry that would be '+((nb&&nb.name)||'a ZMP sector')+' — '+((nb&&nb.why)||'')+'.');
  if(radarState==='established' && nb && String(a.from||'').trim()){
   var says=String(a.from).toLowerCase();
   var saysRst=/rochester|\brst\b/.test(says), saysZmp=/cent(?:er|re)|\bzmp\b/.test(says);
   if(!rstOpen() && /rochester|\brst\b/.test(String(a.from||'').toLowerCase()))
   errs.push(tag2+' is marked as handed off by Rochester, but this drill has Rochester closed. The delegated airspace reverts to '+DD.RST_CLOSED_OWNER+' (M98/RST LOA 4.a), so nobody at Rochester could have handed it to you.');
  /* what RST hands us, and at what altitude — M98/RST LOA 5.a(6) and 5.a(7) */
  if(nb && nb.pos==='RST' && rstOpen() && roleOf(a)==='overflight'){
   var oa=Math.round(a.alt/100)*100;
   if(DD.RST_OVF_ALTS.indexOf(oa)<0)
    warns.push(tag2+' comes in from Rochester at '+DD.fmtAlt(a.alt)+'. RST enters overflights into M98 at 4,000, 6,000 or 8,000 (M98/RST LOA 5.a(6)) — anything else was individually coordinated, so brief why.');
   if(a.alt>=7000)
    warns.push(tag2+' transits at '+DD.fmtAlt(a.alt)+'. An overflight at 7,000 or above is individually coordinated at least five minutes before it enters M98 (M98/RST LOA 5.a(7)) — that call should be part of the drill, not a surprise.');
  }
  if(nb.pos==='RST' && saysZmp && !saysRst)
    warns.push(tag2+' is marked as handed off by '+a.from+', but it enters '+nb.why+' — that is Rochester\u2019s airspace, so it would have come from RST.');
   if(nb.pos==='ZMP' && saysRst && !saysZmp)
    warns.push(tag2+' is marked as handed off by '+a.from+', but it enters where '+nb.why+' — RST would not have had it.');
  }
  if(noSvc && roleOf(a)==='arrival')
   warns.push(tag2+' is an arrival on a published ladder that nobody handed to you. That happens, but it is unusual — an arrival on a STAR is normally a handoff. Check this is the drill you meant to build.');
  if(noSvc && a.ckdIn)
   warns.push(tag2+' starts already on your frequency but with no radar service on it. It will read as a cold call the moment the drill opens rather than calling in when it gets to you — set it to check in at a time if you want the call to arrive mid-drill.');
  if(rules==='VFR' && category(rec.ceil, rec.vis)!=='VFR')
   warns.push(tag2+' is VFR and the field is '+category(rec.ceil, rec.vis)+'. '+TOOLBOX[category(rec.ceil, rec.vis)]+' Check that this one still works in these conditions.');
  var wk=DD.wakeOf(a.type);
  if(roleOf(a)==='arrival' && wk.heavy && a.rwy && a.rwy!=='12R') errs.push((a.cs||'A heavy')+' is a '+wk.label+' ('+a.type+') assigned '+a.rwy+' — heavy jets take the 12R/30L transition in every configuration (ZMP-M98 LOA Table 2c).');
  if(wk.cls==='nowgt') warns.push((a.cs||'Strip '+(i+1))+': '+a.type+' is not in the weight table, so it tags NOWGT — 10 NM ahead and behind until the weight is verified. Check the type against the facility CWT reference, or use one the table already knows.');
 });
 if(rec.speci && rec.speci.on){
  var after=category(rec.speci.ceil, rec.speci.vis);
  if(!(rec.speci.at>=0)) errs.push('The special observation needs a time in seconds from the start of the drill.');
  if(after===cat) warns.push('The special observation does not change the flight category — it stays '+cat+'. Push the ceiling or the visibility across a threshold if you want the drill to force a re-plan.');
 }
 return {errors:errs, warnings:warns};
}

/* ---------- 9. Drill record <-> scenario ---------- */
/* The frame line the drill format asks for: config · wind · flight category ·
   seat · towers, with who else is open carried alongside it. */
function frameOf(rec){
 var cat=category(rec.ceil, rec.vis);
 var rst=(rec.rstOpen===false)?' · RST closed':'';
 var wx=cat+' '+(rec.ceil==null?'':(rec.ceil>=99999?'':(rec.ceil+' broken '))) + (rec.vis==null?'':(rec.vis+' miles'));
 return [configById(rec.cfg).id, 'wind '+(rec.wind||'150/9'), wx.trim(), (rec.seat||'Split H — South Feeder'),
         (rec.towers||'towers open')+rst, 'ATIS '+(rec.atis||'J'), 'A'+(rec.altim||'2980')].join(' · ');
}
function openLine(rec){ return rec.open ? ('Open around you: '+rec.open) : ''; }
function toScenario(rec){
 return {
  id:rec.id, name:rec.name, frame:frameOf(rec), altim:String(rec.altim||'2980'),
  brief:[rec.brief||'', openLine(rec), configById(rec.cfg).note+'. '+TOOLBOX[category(rec.ceil, rec.vis)]].filter(Boolean).join(' '),
  ac:function(){
   return rec.ac.map(function(a){
    var role=roleOf(a);
   var o={cs:a.cs, type:a.type, role:role, rules:(a.rules==='VFR'?'VFR':'IFR'), route:a.route||'',
          radar:DD.normRadar(a.radar, (a.rules==='VFR'?'VFR':'IFR'), role), from:a.from||'',
          dep:a.dep||'KMSP', dest:a.dest||'KMSP', depRwy:a.depRwy||null,
          ctrSpeed:(role==='arrival' && a.mode==='assigned'),
          alt:a.alt, ias:a.ias,
          iasAsg:(a.mode==='assigned'?a.asg:null), spdMode:a.mode||'published',
          ckdIn:!!a.ckdIn, altim:!!a.altim, spawnAt:a.ckdIn?0:(a.spawnAt||0)};
   if(role==='departure'){ o.sid=a.sid; o.fromStart=a.fromStart; o.spdMode='free'; o.iasAsg=null; }
   else if(role==='overflight'){ o.entry={r:a.entryR,d:a.entryD}; o.exit={r:a.exitR,d:a.exitD}; o.spdMode='free'; o.iasAsg=null; }
   else { o.gate=a.gate; o.dtgEnd=a.dtg; o.rwy=a.rwy||null; o.engine=a.engine||'jet';
          if(DD.SAT_DIRECT[a.gate]) o.entry={r:a.entryR, d:a.entryD}; }
   return o;
   });
  }
 };
}
function findDrill(id){ for(var i=0;i<state.drills.length;i++){ if(state.drills[i].id===id) return state.drills[i]; } return null; }
function publish(rec){
 var sc=toScenario(rec);
 for(var i=0;i<DD.SCENARIOS.length;i++){ if(DD.SCENARIOS[i].id===rec.id){ DD.SCENARIOS[i]=sc; return sc; } }
 DD.SCENARIOS.push(sc); return sc;
}
function saveDrill(rec){
 var v=validate(rec); if(v.errors.length) return v;
 var found=false;
 for(var i=0;i<state.drills.length;i++){ if(state.drills[i].id===rec.id){ state.drills[i]=rec; found=true; } }
 if(!found) state.drills.push(rec);
 publish(rec); save(); renderSaved(); renderCustomBar();
 return v;
}
function deleteDrill(id){
 state.drills=state.drills.filter(function(d){return d.id!==id;});
 for(var i=DD.SCENARIOS.length-1;i>=0;i--){ if(DD.SCENARIOS[i].id===id) DD.SCENARIOS.splice(i,1); }
 save(); renderSaved(); renderCustomBar();
}
function runDrill(rec){
 state.hot = !!rec.hot;
 syncHotBtn();
 /* a drill carries whether Rochester was open when it was built */
 if(rec.rstOpen!==undefined){ state.pos.rstOpen = (rec.rstOpen!==false); }
 DD.setRstOpen(rstOpen());
 var ro=document.getElementById('ddb-rstopen'); if(ro) ro.checked=rstOpen();
 publish(rec);
 activeRec=rec; speciFired=false;
 window.ddLoad(rec.id);
 activeRec=rec; speciFired=false;
 if(rec.rate) window.ddRate(rec.rate);
}

/* ---------- 10. Draft, tally, bank ---------- */
function tallyFeed(){
 var t={};
 DD.STANDING.forEach(function(s){ t[s.id]={good:0, flag:0}; });
 DD.sim.feed.forEach(function(e){
  if(!e.item || !t[e.item]) return;
  if(e.kind==='good') t[e.item].good++;
  else if(e.kind==='flag'||e.kind==='crit') t[e.item].flag++;
 });
 return t;
}
function draftFromSim(){
 var tally=tallyFeed(), banked=[], open=[], tm=timingSummary(), crit=false, flag=false;
 DD.sim.feed.forEach(function(e){ if(e.kind==='crit') crit=true; if(e.kind==='flag') flag=true; });
 DD.sim.ac.forEach(function(a){
  var rec=DD.RECEIVER[a.rwy||'12R'];
  if(a.switched && a.flashed) banked.push(a.cs+' flashed to '+rec.pos+' then switched — sequence in order');
  else if(a.switched) open.push(a.cs+' switched to '+rec.pos+' without a flash on record');
  else if(!a.alive) open.push(a.cs+' ran off the end of the tail still on frequency');
  else open.push(a.cs+' left unresolved when the drill was called');
  if(a.rwyAuto) open.push(a.cs+' took the Table 2 default at SAVVG — the runway word was never said');
 });
 if(DD.sim.losFlag) open.push('Loss of separation logged on the shared trunk');
 DD.STANDING.forEach(function(s){
  var t=tally[s.id]; if(!t) return;
  if(t.flag) open.push(s.t+' — '+t.flag+' flag'+(t.flag>1?'s':'')+' this drill');
  else if(t.good) banked.push(s.t+' — clean, '+t.good+' time'+(t.good>1?'s':''));
 });
 if(tm.n){
  var line='Acknowledgement lag: median '+tm.median+'s, worst '+tm.worst+'s against a '+tm.target+'s target';
  if(tm.late) open.push(line+' — '+tm.late+' over');
  else banked.push(line+' — all inside');
 }
 if(tm.txPaused) open.push(tm.txPaused+' transmission'+(tm.txPaused>1?'s':'')+' composed with the sim paused ('+tm.pauses+' pause'+(tm.pauses===1?'':'s')+') — free thinking time the real scope does not give you');
 var sc=DD.sim.scen;
 return {
  n:String(state.seq), date:today(), seat:(activeRec&&activeRec.seat)||seatLabel(),
  cfg:(sc&&sc.frame)||'12s–Depart 17', head:(sc&&sc.name)||'Built drill',
  banked:banked, open:open, chip:crit?'crit':(flag?'flag':'good'),
  tally:tally, timing:tm
 };
}
function today(){
 try{ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
 catch(e){ return ''; }
}
function bank(entry){
 entry.id='e'+(state.entries.length+1)+'-'+entry.n;
 entry.user=true;
 state.entries.push(entry);
 var next=parseInt(entry.n,10); if(!isNaN(next)) state.seq=next+1;
 DD.DRILL_LOG.unshift(entry);
 save(); refreshLog(); renderItems(); renderEntries();
 return entry;
}
function unbank(id){
 state.entries=state.entries.filter(function(e){return e.id!==id;});
 for(var i=DD.DRILL_LOG.length-1;i>=0;i--){ if(DD.DRILL_LOG[i].id===id) DD.DRILL_LOG.splice(i,1); }
 save(); refreshLog(); renderItems(); renderEntries();
}
function refreshLog(){
 var sec=document.getElementById('mod-log');
 if(sec && sec.parentNode && typeof sec.outerHTML==='string'){ sec.outerHTML=DD.logHtml(); }
}

/* ---------- 11. Editor state ---------- */
var draft = null;
var SIDS = Object.keys(DD.DEPS);
var ROLES = [
 {id:'arrival',    label:'arrival',    hint:'Flies a published STAR ladder to a runway transition and gets handed to Arrival at the floor.'},
 {id:'departure',  label:'departure',  hint:'Climbs out on a SID join. Released to Center at 25 NM from the MSP DME or leaving 11,000 — ZMP-M98 LOA 4.c, whichever comes first.'},
 {id:'overflight', label:'overflight', hint:'Crosses the airspace on the radial and distance you give it, level, and has to be handed off or pointed out before the far boundary.'}
];
function blankAc(){
 return {cs:'', type:'B738', role:'arrival', rules:'IFR', route:'',
         radar:'established', from:'', gate:'NITZR', sid:'WLSTN',
         entryR:180, entryD:38, exitR:20, exitD:38,
         dtg:20, fromStart:4, alt:12000, ias:280, mode:'published', asg:230,
         rwy:'', ckdIn:true, altim:false, spawnAt:0};
}
function roleOf(a){ return a.role||'arrival'; }
/* Where a strip enters M98 from, as a bearing off the MSP VOR — which is what
   decides whether the neighbour is Rochester or Center. */
function entryBearing(a){
 var role=roleOf(a);
 if(role==='overflight') return ((a.entryR%360)+360)%360;
 var r = (role==='departure') ? DD.DEPS[a.sid] : DD.ROUTES[a.gate];
 if(!r) return null;
 var p = (role==='departure') ? r[r.length-1] : r[0];
 return (Math.atan2(p.e, p.n)*180/Math.PI+360)%360;
}
function neighbourOf(a){
 var b=entryBearing(a);
 if(b==null) return null;
 return DD.neighbourAt(b, a.alt);
}
function blankDrill(){
 return {id:'u'+Math.floor(Math.random()*100000), name:'', cfg:'12', wind:'150/9', ceil:5000, vis:10,
         atis:'J', altim:'2980', seat:seatLabel(), towers:state.pos.towers,
         open:openLabel(), rstOpen:rstOpen(),
         brief:'', datis:'', datisArr:'', datisDep:'', focus:'free', seed:null, rate:1, hot:false,
         speci:{on:false, at:180, ceil:1800, vis:3, wind:'150/12'}, ac:[blankAc()]};
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function num(v,d){ var n=parseFloat(v); return isNaN(n)?d:n; }
function readEditor(){
 if(!draft) return null;
 var g=function(id){ var e=document.getElementById(id); return (e&&typeof e.value==='string')?e.value:''; };
 var gc=function(id){ var e=document.getElementById(id); return !!(e&&e.checked); };
 draft.name=g('ddb-name')||draft.name;
 draft.cfg=g('ddb-cfg')||draft.cfg;
 /* The arrival ladders follow the flow. ZMP-M98 LOA Table 2 assigns a runway
    transition per gate per configuration, so changing the configuration
    changes the geometry the scope draws, the tails the in-trail check pairs
    on, and the floors the builder enforces. Idempotent and cheap — setFlow
    returns immediately when the requested flow is already loaded. */
 DD.setFlow(draft.cfg);
 draft.wind=g('ddb-wind')||draft.wind;
 draft.ceil=num(g('ddb-ceil'), draft.ceil);
 draft.vis=num(g('ddb-vis'), draft.vis);
 draft.seat=g('ddb-seat')||draft.seat;
 draft.towers=g('ddb-towers')||draft.towers;
 draft.open=g('ddb-open')||draft.open;
 draft.speci=draft.speci||{};
 draft.speci.on=gc('ddb-speci');
 draft.speci.at=num(g('ddb-speciat'), draft.speci.at);
 draft.speci.ceil=num(g('ddb-specic'), draft.speci.ceil);
 draft.speci.vis=num(g('ddb-speciv'), draft.speci.vis);
 draft.speci.wind=g('ddb-speciw')||draft.speci.wind;
 draft.atis=g('ddb-atis')||draft.atis;
 draft.altim=g('ddb-altim')||draft.altim;
 draft.brief=g('ddb-brief')||draft.brief;
 var dtaA=document.getElementById('ddb-datis-arr');
 if(dtaA && typeof dtaA.value==='string') draft.datisArr=dtaA.value;
 var dtaD=document.getElementById('ddb-datis-dep');
 if(dtaD && typeof dtaD.value==='string') draft.datisDep=dtaD.value;
 /* a drill saved before the boxes were split carries one blob */
 if(draft.datis && !draft.datisArr && !draft.datisDep){ draft.datisArr=draft.datis; draft.datis=''; }
 draft.rate=parseInt(g('ddb-rate'),10)||1;
 draft.hot=gc('ddb-hot');
 draft.ac.forEach(function(a,i){
  a.cs=(g('ddb-cs'+i)||a.cs).toUpperCase().replace(/\s+/g,'');
  a.type=(g('ddb-type'+i)||a.type).toUpperCase();
  a.role=g('ddb-role'+i)||roleOf(a);
  a.rules=g('ddb-rules'+i)||a.rules||'IFR';

  a.dep=g('ddb-dep'+i)||a.dep||'KMSP';

  a.dest=g('ddb-dest'+i)||a.dest||'KMSP';
  /* handed off by is derived, not typed, wherever the job settles it */
  var rst=DD.RADAR_STATES[a.radar];

  else if(roleOf(a)==='departure') a.from=DD.towerHandoffFor(a.dep).name;
  else a.from=g('ddb-from'+i)||a.from;
  var rv=document.getElementById('ddb-route'+i);
  if(rv && typeof rv.value==='string') a.route=rv.value;
  a.gate=g('ddb-gate'+i)||a.gate;

  a.entryR=num(g('ddb-er'+i), a.entryR); a.entryD=num(g('ddb-ed'+i), a.entryD);
  a.exitR=num(g('ddb-xr'+i), a.exitR);   a.exitD=num(g('ddb-xd'+i), a.exitD);
  a.dtg=num(g('ddb-dtg'+i), a.dtg);
  a.alt=num(g('ddb-alt'+i), a.alt);
  a.ias=num(g('ddb-ias'+i), a.ias);
  a.mode=g('ddb-mode'+i)||a.mode;
  a.engine=g('ddb-eng'+i)||a.engine||'jet';
  a.asg=num(g('ddb-asg'+i), a.asg);
  a.rwy=g('ddb-rwy'+i);
  a.ckdIn=gc('ddb-ck'+i);
  a.altim=gc('ddb-al'+i);
  a.spawnAt=num(g('ddb-sp'+i), a.spawnAt);
 });
 return draft;
}

/* ---------- 12. Rendering ---------- */
/* the line of context under each strip's heading — what the reference data says
   about where this one actually is */
function rowContext(a){
 var role=roleOf(a);
 if(role==='departure'){
  var dr=DD.DEPS[a.sid];
  if(!dr) return '';
  return a.sid+' join track '+dr.total.toFixed(1)+' NM · starts '+a.fromStart+' NM out · released to Center by '
   +DD.DEP_RELEASE.dme+' DME or leaving '+DD.fmtAlt(DD.DEP_RELEASE.alt)+' (ZMP-M98 LOA 4.c)';
 }
 if(role==='overflight'){
  var rt=DD.overflightRoute({r:a.entryR,d:a.entryD},{r:a.exitR,d:a.exitD});
  return 'crossing '+rt.total.toFixed(1)+' NM, MSP radial '+a.entryR+' at '+a.entryD+' to radial '+a.exitR+' at '+a.exitD
   +' · handed off or pointed out before the far side';
 }
 if(!a.gate) return '';
 var dest=a.dest||'KMSP', proc=DD.ARRIVALS[a.gate];
 /* a satellite arrival — published ladder or direct routing — describes itself
    and names the seat it belongs to rather than the MSP split */
 if(proc && proc.flies && dest!=='KMSP'){
  var st=DD.satSeatFor(dest), sr=DD.SAT_ROUTES[a.gate], dr=DD.SAT_DIRECT[a.gate];
  return a.gate+(proc.rev?(' '+proc.rev):'')+' into '+dest
   +(sr?(' · ladder '+sr.total.toFixed(1)+' NM'):'')
   +(dr?(' · '+dr.label+', from '+dr.from+' · '+dr.altNote+' ('+dr.src+')'):'')
   +(sr?(' · '+sr.filter(function(p){return p.at!=null;}).map(function(p){
      return p.f+' '+DD.fmtAlt(p.at)+(p.atProp!=null&&p.atProp!==p.at?(' jets / '+DD.fmtAlt(p.atProp)+' turboprops'):'');
    }).join(', ')):'')
   +(st?(' · '+dest+' is '+DD.posName(st)+'’s field (SOP 6-2), worked by '
         +DD.posName(DD.SAT_POS[st].pos)+' on '+DD.SAT_POS[st].frq
         +(DD.SAT_POS[st].pos!==st?' while that seat is closed':'')):'');
 }
 /* an arrival the engine has no ladder for describes itself instead */
 if(!proc || !proc.flies){
  var seat=DD.satSeatFor(dest);
  return a.gate+(proc&&proc.rev?(' '+proc.rev):'')+' into '+dest
   +(proc?(' · serves '+proc.serves.join(', ')):' · not an arrival in the reference set')
   +(proc&&proc.note?(' · '+proc.note):'')
   +(seat?(' · '+dest+' is '+DD.posName(seat)+'’s field (SOP 6-2)'):'')
   +' · frame only — the route data has ladder geometry for the six MSP RNAV gates and nothing else';
 }
 var total=totalOf(a.gate)||0, dist=Math.max(0,total-a.dtg);
 var cfgId=(draft&&draft.cfg)||'12', ow=DD.feederFor(cfgId, a.gate);
 /* A gate with no ladder in this flow describes the gap rather than measuring
    against a route that is not there. Two ways to land here: Table 2 has no
    row for the configuration at all, or it marks this gate N/A — KKILR on a
    17-22, where the arrival is prohibited outright (ZMP-M98 LOA 5.b(3)). */
 if(!DD.ROUTES[a.gate]){
  return a.gate+' has no arrival ladder in the '+cfgId+' configuration — '
   +(DD.flowCarried(cfgId)
     ? 'ZMP-M98 LOA Table 2 marks it N/A here, so the arrival is not flown in this configuration'
     : 'ZMP-M98 LOA Table 2 has no row for this configuration, so which transition ZMP assigns is not documented')
   +'. No ladder distance, published altitude or floor is asserted.';
 }
 var toRwy=DD.runwaysAt(dest).filter(function(rw){ return DD.sideOfRunway(rw); }).map(function(rw){
  var v=DD.receiverFor({role:'arrival', gate:a.gate, rwy:rw}), x=DD.crossoverFor(a.gate, rw, cfgId);
  return rw+' → '+v.name+' '+v.frq+(x.type!=='none'?(' ('+x.type+'-gate crossover)'):'');
 }).join(', ');
 return a.gate+' ladder '+total.toFixed(1)+' NM · at '+a.dtg+' NM to go the binding published altitude is '
  +(capAt(a.gate,dist)!=null?DD.fmtAlt(capAt(a.gate,dist)):'—')+' near '+fixAt(a.gate,dist)
  +' · floor '+DD.fmtAlt(DD.FLOORS[a.gate])+' ('+(DD.FLOOR_BASIS[a.gate]||'')+')'
  + ' · '+(ow?DD.posName(ow)+' owns this gate (SOP 4-4d)':'not on either Feeder in this configuration')

function ptOn(r, dist){
 if(!r || !r.length) return null;
 for(var i=1;i<r.length;i++){
  if(dist<=r[i].cum){
   var d0=r[i-1].cum, d1=r[i].cum, t=(d1===d0)?0:(dist-d0)/(d1-d0);
   return {x:r[i-1].x+(r[i].x-r[i-1].x)*t, y:r[i-1].y+(r[i].y-r[i-1].y)*t};
  }
 }
 return {x:r[r.length-1].x, y:r[r.length-1].y};
}
function posAt(gate, dist){ return ptOn(routeOf(gate), dist); }
/* the route a built strip will actually fly, and where on it it starts */
function routeFor(a){
 var role=roleOf(a);
 if(role==='departure') return DD.DEPS[a.sid]||null;
 if(role==='overflight') return DD.overflightRoute({r:a.entryR,d:a.entryD},{r:a.exitR,d:a.exitD});
 return DD.ROUTES[a.gate]||null;
}
function startDistFor(a, r){
 var role=roleOf(a);
 if(!r) return 0;
 if(role==='departure') return Math.min(r.total, a.fromStart||0);
 if(role==='overflight') return 0;
 return Math.max(0, r.total-(a.dtg||0));
}

function toCode(rec){
 var lines = rec.ac.map(function(a){
  var parts=["cs:'"+a.cs+"'", "type:'"+a.type+"'"];
  if(a.wake) parts.push("wake:'"+a.wake+"'");
  parts.push("gate:'"+a.gate+"'", 'dtgEnd:'+(+a.dtg), 'alt:'+(+a.alt), 'ias:'+Math.round(a.ias));
  if(a.mode==='assigned') parts.push('iasAsg:'+(+a.asg));
  parts.push("spdMode:'"+a.mode+"'");
  if(a.rwy) parts.push("rwy:'"+a.rwy+"'");
  if(a.ckdIn) parts.push('ckdIn:true'); else parts.push('spawnAt:'+(+a.spawnAt));
  if(a.altim) parts.push('altim:true');
  return '   {'+parts.join(', ')+'}';
 }).join(',\n');
 return " {id:'"+rec.id+"', name:'"+rec.name.replace(/'/g,"\\'")+"', frame:'"+frameOf(rec).replace(/'/g,"\\'")+"',\n"
 +"  brief:'"+(rec.brief||'').replace(/'/g,"\\'")+"',\n"
 +"  ac:function(){ return [\n"+lines+"\n  ];}},";
}
/* Written in the shape the practice log already uses (§19A): a dated
   heading, the drills run, strengths shown, watch-fors, suggested next
   reps. Paste it straight under the last entry in
   claude_M98_AI_Practice_Log.md. */
function toMd(){
 var out=[];
 var byDate={};
 state.entries.forEach(function(e){ (byDate[e.date] = byDate[e.date] || []).push(e); });
 var dates=Object.keys(byDate).sort();
 if(!dates.length) out.push('*(Nothing banked in the tool yet — finish a drill in the live player and bank it.)*','');
 dates.reverse().forEach(function(d){
  var list=byDate[d];
  out.push('## '+d+' — Drill Deck: '+list.map(function(e){return 'Drill '+e.n;}).join(', '),'');
  out.push('**Drills run**');
  list.forEach(function(e){
   out.push('- **Drill '+e.n+' — '+e.head+'** ('+e.seat+'). Frame: '+e.cfg+'.'
    +(e.timing && e.timing.n ? ' Acknowledgement lag: median '+e.timing.median+'s, worst '+e.timing.worst+'s against a '+e.timing.target+'s target'
      +(e.timing.txPaused?'; '+e.timing.txPaused+' transmission'+(e.timing.txPaused>1?'s':'')+' composed with the clock stopped.':'.') : ''));
  });
  out.push('');
  var strengths=[], watch=[];
  list.forEach(function(e){
   e.banked.forEach(function(b){ strengths.push(list.length>1?('Drill '+e.n+' — '+b):b); });
   e.open.forEach(function(o){ watch.push(list.length>1?('Drill '+e.n+' — '+o):o); });
  });
  if(strengths.length){ out.push('**Strengths shown**'); strengths.forEach(function(s){ out.push('- '+s); }); out.push(''); }
  if(watch.length){ out.push('**Watch-fors for next time**'); watch.forEach(function(w){ out.push('- '+w); }); out.push(''); }
  out.push('**Suggested next reps**');
  ranked().slice(0,3).forEach(function(id){
   var it=itemById(id); if(!it) return;
   out.push('- '+it.t+' — '+statusOf(id).label+'. Build a drill weighted to it in the Drill Builder.');
  });
  out.push('');
 });
 out.push('### Standing items — currency as of '+today(),'');
 ranked().forEach(function(id){
  var it=itemById(id); if(!it) return;
  var s=statusOf(id), x=s.s;
  out.push('- **'+it.t+'** — '+s.label
   +(x.exposures ? ' ('+x.good+' clean / '+x.flag+' flagged across '+x.exposures+' drill'+(x.exposures===1?'':'s')+' on record: '+x.drills.join(', ')+'; last at drill '+x.last+')'
     : ' (no drill on record has exercised this one yet)'));
 });
 out.push('','*Exported from the Drill Deck on '+today()+'. These are deliberate-practice reps with the tool, not OJT evaluations.*');
 return out.join('\n');
}

/* Try the published sources. Anything at all goes wrong and it hands over to
   the paste box, which is the path that works offline. */
window.ddbDatisFetch=function(){
 datisSay('<span class="dd-chip">asking</span> Trying the published D-ATIS sources.');
 if(typeof fetch!=='function'){
  datisSay('<span class="dd-chip warn">no</span> This browser gives the page no way to fetch. Paste the D-ATIS text below and press read it.');
  return;
 }
 var i=0;
 var tryNext=function(){
  if(i>=DATIS_SOURCES.length){
   datisSay('<span class="dd-chip warn">no</span> Neither source would answer. That is the usual result from a file page — it has no origin, so the server will not allow it, and the tool is built to work offline anyway. Paste the current KMSP D-ATIS below and press <b>read what is pasted</b>; that path always works.');
   return;
  }
  var s=DATIS_SOURCES[i++];
  var done=false;
  var fail=function(){ if(!done){ done=true; tryNext(); } };
  try{
   fetch(s.url, {cache:'no-store'}).then(function(r){
    if(!r || !r.ok) return fail();
    var ct=(r.headers && r.headers.get && r.headers.get('content-type'))||'';
    return (/json/i.test(ct) ? r.json() : r.text());
   }).then(function(p){
    if(done) return;
    var sp=datisSplit(p);
    if(!sp.arr && !sp.dep) return fail();
    done=true;
    draft.datisArr=sp.arr; draft.datisDep=sp.dep; draft.datis='';
    renderEditor();
    window.ddbDatisApply(s.name);
   }).catch(fail);
  }catch(e){ fail(); }
 };
 tryNext();
};

  state.drills.forEach(publish);
  for(var i=DD.DRILL_LOG.length-1;i>=0;i--){ if(DD.DRILL_LOG[i].user) DD.DRILL_LOG.splice(i,1); }
  state.entries.forEach(function(en){ DD.DRILL_LOG.unshift(en); });
  save(); refreshLog(); renderSaved(); renderCustomBar(); renderItems(); renderEntries();
  msg('Imported '+state.drills.length+' drill'+(state.drills.length===1?'':'s')+' and '+state.entries.length+' notebook entr'+(state.entries.length===1?'y':'ies')+'.','k');
 }catch(err){ msg('That did not parse as JSON.','e'); }
};

/* ---------- 15. Sections ---------- */
function buildHtml(){
 var focusOpts=Object.keys(FOCUS).map(function(k){
  return '<option value="'+k+'">'+(k==='free'?'Open push — nothing weighted':FOCUS[k].label)+'</option>';
 }).join('');
 return '<section class="module dd-section" id="mod-build" data-mod="build">'
 +'<div class="modhead"><div><span class="tag">BUILD</span><h2>Drill Builder</h2>'
 +'<p class="modsub">Author a drill, or let the notebook pick one — every number checked against the route data before it flies</p></div></div>'

 +'<div class="dd-panel"><div class="dd-sub a">What your notes want next</div>'
 +'<div class="dd-hint" style="margin:0 0 12px;">Ordered by what has the strongest claim on the next drill: something that bit you the last time it came up, then something never exercised at all, then the ones the written notes still call open that you keep not testing. A clean run subtracts; three clean runs make it a retirement candidate.</div>'
 +'<div id="ddb-items"></div></div>'

 +'<div class="dd-panel"><div class="dd-sub">Generate</div>'
 +'<div class="dd-grid">'
 +f('Focus','<select class="dd-sel" id="ddb-focus">'+focusOpts+'</select>')
 +f('Gates','<select class="dd-sel" id="ddb-mix" onchange="ddbSync()"></select>')
 +f('Pressure','<select class="dd-sel" id="ddb-pressure"><option value="routine">routine</option><option value="compressed" selected>compressed</option><option value="saturated">saturated</option></select>')
 +f('Strips','<select class="dd-sel" id="ddb-count"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select>')
 +f('Departures','<select class="dd-sel" id="ddb-deps"><option value="0">none</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>')
 +f('Overflight','<select class="dd-sel" id="ddb-ovf"><option value="">none</option><option value="1">one crossing</option></select>')
 +f('Seed','<input class="dd-in" id="ddb-seed" placeholder="any number">')
 +'</div>'
 +'<div class="dd-actions"><button class="dd-btn pri" onclick="ddbGenerate()">Generate drill</button>'
 +'<button class="dd-btn" onclick="ddbDice()">new seed</button>'
 +'<button class="dd-btn" onclick="ddbNew()">start blank instead</button>'
 +'<span class="dd-hint" style="margin:0;">Same seed, same drill — write the number in your notes and you can fly it again cold.</span></div></div>'

 +'<div class="dd-panel" id="ddb-editor"><div class="dd-sub">Edit</div>'
 +'<div class="dd-grid">'
 +f('Name','<input class="dd-in" id="ddb-name" placeholder="what this drill is for">')
 +f('Configuration','<select class="dd-sel" id="ddb-cfg" onchange="ddbSync()">'+CONFIGS.map(function(c){return '<option value="'+c.id+'">'+c.name+'</option>';}).join('')+'</select>')
 +f('Wind','<input class="dd-in" id="ddb-wind" onchange="ddbSync()">')
 +f('Ceiling (feet)','<input class="dd-in" id="ddb-ceil" onchange="ddbSync()">')
 +f('Visibility (miles)','<input class="dd-in" id="ddb-vis" onchange="ddbSync()">')
 +f('Seat','<input class="dd-in" id="ddb-seat" onchange="ddbSync()">')
 +f('Towers','<input class="dd-in" id="ddb-towers" onchange="ddbSync()">')
 +f('Open around you','<input class="dd-in" id="ddb-open" onchange="ddbSync()">')
 +f('ATIS','<input class="dd-in" id="ddb-atis">')
 +f('Altimeter','<input class="dd-in" id="ddb-altim">')
 +f('Opening rate','<select class="dd-sel" id="ddb-rate"><option value="0">paused</option><option value="1" selected>1× — real time</option><option value="4">4×</option></select>')
 +'<label class="dd-chk"><input type="checkbox" id="ddb-hot">run hot — no pausing</label>'
 +'</div>'
 +'<div class="dd-field" style="margin-top:12px;"><span class="dd-lab">D-ATIS — sets the flow and the weather from the current one. '
 +'MSP broadcasts arrival and departure separately, with a letter each; paste whichever you have and it reads what is there. '
 +'<button class="dd-btn sm" style="margin-left:8px;" onclick="ddbDatisFetch()">fetch the current one</button> '
 +'<button class="dd-btn sm" onclick="ddbDatisApply()">read what is pasted</button></span></div>'
 +'<div class="dd-grid" style="margin-top:6px;">'
 +'<div class="dd-field"><span class="dd-lab">Arrival D-ATIS — the approach in use, and the weather</span>'
 +'<textarea class="dd-in" id="ddb-datis-arr" rows="3" style="min-height:58px;resize:vertical;font-family:var(--mono);font-size:11.5px;" '
 +'placeholder="MSP ARR INFO J 0353Z. 22003KT 10SM CLR ... VISUAL RWY 30L APCH IN USE."></textarea></div>'
 +'<div class="dd-field"><span class="dd-lab">Departure D-ATIS — the runways being departed</span>'
 +'<textarea class="dd-in" id="ddb-datis-dep" rows="3" style="min-height:58px;resize:vertical;font-family:var(--mono);font-size:11.5px;" '
 +'placeholder="MSP DEP INFO W 0353Z. ... DEPARTING RWY 30L."></textarea></div>'
 +'</div>'
 +'<div class="dd-msg" id="ddb-datis-msg"></div>'
 +'<div class="dd-msg" id="ddb-frame" style="margin-top:12px;"></div>'

 +'<div class="dd-sub" style="margin-top:16px;">Special observation — the frame changes mid-drill</div>'
 +'<div class="dd-grid">'
 +'<label class="dd-chk"><input type="checkbox" id="ddb-speci" onchange="ddbSync()">drop a SPECI</label>'
 +f('At T-plus (seconds)','<input class="dd-in" id="ddb-speciat" onchange="ddbSync()">')
 +f('New ceiling','<input class="dd-in" id="ddb-specic" onchange="ddbSync()">')
 +f('New visibility','<input class="dd-in" id="ddb-speciv" onchange="ddbSync()">')
 +f('New wind','<input class="dd-in" id="ddb-speciw" onchange="ddbSync()">')
 +'</div>'
 +'<div class="dd-hint">A special observation is unscheduled — it lands between the hourly reports when the weather crosses a threshold, and because the configuration follows the weather, a big enough change forces a re-plan. The engine will not re-route the strips already flying; it announces the new observation and the category it produces, and the rep is saying what changes.</div>'
 +'<div class="dd-field" style="margin-top:14px;"><span class="dd-lab">Brief — what the drill is asking of you</span><textarea class="dd-ta" id="ddb-brief"></textarea></div>'
 +'<div class="dd-sub" style="margin-top:16px;">Strips</div>'
 +'<div id="ddb-rows"></div>'
 +'<div class="dd-actions"><button class="dd-btn" onclick="ddbAddRow()">add a strip</button></div>'
 +'<div class="dd-msg" id="ddb-check"></div>'
 +'<div class="dd-scopewrap" style="margin-top:12px;"><div id="ddb-preview"></div></div>'
 +'<div class="dd-actions"><button class="dd-btn pri" onclick="ddbFly()">Save and fly it</button>'
 +'<button class="dd-btn" onclick="ddbSave()">Save only</button></div></div>'

 +'<div class="dd-panel"><div class="dd-sub">Saved drills</div><div id="ddb-saved"></div></div>'

 +'<div class="dd-note">Gates belong to a Feeder position by configuration (SOP 4-4d) — in a 12s or 30s that is BAINY, MUSCL and KKILR to North and NITZR, BLUEM and TORGY to South, with the boundary on the 30L/12R localizer. The generator picks gates the seat you are working actually owns, and building one off your own split is allowed but called out, because the order says gates get reassigned to balance workload. The floors themselves are near 7,000 / far 8,000 on a 12s (SOP 4-4c(3)); which gates are near and which are far is derived from 4-4c(7) rather than published, and Appendix A is still unread images. Charted obstructions from SOP 8-1 are plotted on the scope, with Arden Hills / Shoreview at MSP 018/011, 2,438 feet, drawn in red because it is the recurring bust near the St Paul Runway 14 final. The departure dispersal area is drawn too, as the amber dashed sector southeast of the field: MSP Tower owns it from the surface up to and including 7,000 (MSP-M98 LOA 5.a(3)), and anything of yours that is not an MSP departure sitting in there at or below 7,000 gets flagged. Its outline was traced off the chart in the agreement rather than read off a published list of coordinates, so treat the edge as good to about half a mile. Everything around M98 is Center except one stretch of the perimeter: the Rochester boundary runs MSP 185/038, 158/041, 149/040, and south of that line RST owns 9,000 and below while Center owns everything above it. M98 enters RST airspace at 3,000, 5,000, 7,000 or 9,000 and nothing else, on 119.8 or 119.2 (M98/RST LOA 5.b); RST enters overflights into M98 at 4,000, 6,000 or 8,000, and anything at 7,000 or above is individually coordinated five minutes out (5.a(6) and (7)). With Rochester closed the delegated airspace reverts to '+DD.RST_CLOSED_OWNER+' top to bottom (4.a). All of it is in claude_M98_RST_Reference.md, including two conflicts that are named rather than resolved. The tool works out who a strip came from, and who it goes to, from the bearing it crosses on and the altitude it is at \u2014 so the same overflight is Rochester\u2019s at 6,500 and Center\u2019s at 11,000, and naming the wrong one is graded. An IFR aircraft is established unless it is a pop-up: a handoff arrives identified, on a code and on a clearance, and the answer is \u201cradar contact\u201d. A pop-up IFR has none of the three \u2014 it comes up airborne asking for a clearance, and until you issue one it is not an IFR aircraft at all, which is the gap session 7 was about. A VFR aircraft is either handed to you with service already on it or calling cold with nothing. The player grades that order: work an unidentified aircraft and it says so, and \u201cradar contact\u201d with no code assigned is refused. Distance to go is measured to the end of the runway-transition tail, so a strip at 12 NM is twelve miles from the handoff point, not from the airport. Altitudes, published speeds and floors on each strip are read live from the route data, and the builder refuses a start below the gate floor (SOP 4-4c(3) — near 7,000 / far 8,000 on a 12s; which gate is near and which is far is still the working read, unverified against Appendix A). Configuration follows the wind and the weather rather than being picked (MSP-M98 LOA 9), so the weather floors are enforced: CRO needs 2,200 and 5 (LOA 7.i), 17-22 needs 1,400 and 4 (SOP 7-1 / LOA 11). Heavy jets are held to the 12R/30L transition in every configuration (ZMP-M98 LOA Table 2c). The spoken form beside each strip follows the carrier callsign reference — flight numbers grouped in twos, registrations spelled straight, zero never “oh.”</div>'
 +'</section>';
}
function posHtml(){
 return '<section class="module dd-section" id="mod-pos" data-mod="pos">'
 +'<div class="modhead"><div><span class="tag">POSITION</span><h2>Position Setup</h2>'
 +'<p class="modsub">The seat is your pick — say what you are working and what is open around you, and the rest of the tool follows</p></div></div>'

 +'<div class="dd-panel"><div class="dd-sub">Quick setups</div>'
 +'<div class="dd-actions" style="margin-top:0;">'
 + Object.keys(PRESETS).map(function(k){ return '<button class="dd-btn" onclick="ddbPreset(\''+k+'\')">'+esc(PRESETS[k].label)+'</button>'; }).join('')
 +'</div>'
 +'<div class="dd-hint">M98 collapses to <b>H</b>, South Feeder, and the splits open in the order H → R → N → S — R as combined Departure, N as combined MSP Final, S as South Final, with E as the combined Satellite (SOP 2-1 NOTE 2). Anything you leave closed folds into whoever is still open along that chain.</div></div>'

 +'<div class="dd-panel"><div class="dd-sub a">Which seat are you working</div>'
 +'<div id="ddb-seatbox"></div></div>'

 +'<div class="dd-panel"><div class="dd-sub">Open around you</div>'
 +'<div class="dd-grid" id="ddb-openbox"></div>'
 +'<div class="dd-grid" style="margin-top:12px;">'
 +f("Towers",'<input class="dd-in" id="ddb-towers" onchange="ddbTowers()">')
 +'<label class="dd-chk"><input type="checkbox" id="ddb-rstopen" onchange="ddbRst()">Rochester approach open</label>'
 +'</div>'
 +'<div class="dd-hint">Rochester is not a 24-hour facility. With it closed, the segment below stops mattering and Center owns that corner top to bottom — so the same aircraft that would have gone to RST at 6,000 goes to Center instead. Its hours are not in the reference set, so this is yours to state with the rest of the frame, the same way towers open or closed is.</div></div>'

 +'<div class="dd-panel"><div class="dd-sub">What that resolves to</div>'
 +'<div class="dd-msg" id="ddb-resolved"></div>'
 +'<div class="dd-hint">This drives the live player, not just the paperwork: whoever ends up owning the arrival is who has to take the flash, on their frequency, and the switch button in the player follows it. Close South Arrival and both runways go to N on 119.3 — flash it to S anyway and the player will tell you nobody is there.</div></div>'

 +'<div class="dd-note">Positions, identifiers and frequencies are M98 SOP 2-1; the combining order is NOTE 2 on the same paragraph. Position duties are SOP 2-1 / 2-4 / 2-5 — Feeder assigns the runway and starts crossovers, Arrival vectors, sequences and clears. The arrival split rides the localizers, so 12R is South Arrival\u2019s side and 12L is North\u2019s (SOP 4-2a). Which arrival gates belong to North rather than South Feeder is SOP 4-4d, which is not in the reference set here — if you take the North Feeder seat, confirm that split yourself before you trust the traffic.</div>'
 +'</section>';
}

 +'</section>';
}

/* ---------- 16. Mount ---------- */
function mount(){
 restore();
 state.drills.forEach(publish);
 state.entries.forEach(function(e){ DD.DRILL_LOG.unshift(e); });

 /* Three pages rather than one long scroll: set the drill up, fly it, then the
    notebook and the library. The live player is a page of its own so nothing
    above it has to be scrolled past while a drill is running. */
 var wrap=document.querySelector('.wrap')||document.body;
 var foot=wrap && wrap.querySelector && wrap.querySelector('footer');
 function put(html, beforeId){
  var el=document.createElement('div');
  el.innerHTML=html;
  var anchor=document.getElementById(beforeId);
  if(anchor && anchor.parentNode && anchor.parentNode.insertBefore){ anchor.parentNode.insertBefore(el, anchor); return el; }
  if(wrap && foot && wrap.insertBefore){ wrap.insertBefore(el, foot); return el; }
  if(wrap && wrap.appendChild) wrap.appendChild(el);
  return el;
 }
 put(posHtml()+buildHtml(), 'mod-live');
 put(notesHtml(), 'mod-log');
 buildPages();
 syncMixOptions();
 var nav=document.getElementById('modnav');
 /* the old anchor nav is replaced by the page tabs */
 if(nav && typeof nav.innerHTML==='string') nav.innerHTML='';

 /* live-player additions: saved-drill buttons, a hot toggle, the timing strip */
 var bar=document.querySelector('#mod-live .dd-bar');
 if(bar && bar.insertBefore){
  var span=document.createElement('span'); span.id='ddb-custombar';
  var rateBar=document.getElementById('dd-ratebar');
  if(rateBar && rateBar.parentNode===bar) bar.insertBefore(span, rateBar); else bar.appendChild(span);
  var hb=document.createElement('button'); hb.id='ddb-hotbtn'; hb.textContent='run hot';
  hb.onclick=function(){ window.ddbHot(); };
  if(rateBar && rateBar.nextSibling) bar.insertBefore(hb, rateBar.nextSibling); else bar.appendChild(hb);
  if(state.hot && hb.classList) hb.classList.add('on');
 }
 var feed=document.getElementById('dd-feed');
 if(feed && feed.parentNode && feed.parentNode.insertBefore){
  var tm=document.createElement('div'); tm.className='dd-timing'; tm.id='ddb-timing';
  feed.parentNode.insertBefore(tm, feed);
 }

 applyReceivers();
 DD.setRstOpen(rstOpen());
 if(window.ddLayers) window.ddLayers(state.layers||'tracked');
 draft=blankDrill();
 refreshLog();
 renderPos(); renderEditor(); renderSaved(); renderCustomBar(); renderPrior(); renderItems(); renderEntries(); renderTiming();
 if(!storeOk) setHtml('ddb-iomsg','<div class="w">This browser is not letting the page save anything locally, so drills and notes will vanish on reload. Use the JSON export to keep them.</div>');
}

/* ---------- 17. Test surface ---------- */
window.ddb = {
 state:state, gen:gen, validate:validate, saveDrill:saveDrill, deleteDrill:deleteDrill,
 runDrill:runDrill, publish:publish, toScenario:toScenario, toCode:toCode, toMd:toMd,
 draftFromSim:draftFromSim, bank:bank, tallyFeed:tallyFeed, itemStats:itemStats,
 statusOf:statusOf, pertinence:pertinence, ranked:ranked, timing:TIMING,
 PRIOR:PRIOR, hist:hist, priorCard:priorCard,
 spoken:spoken, category:category, configById:configById, frameOf:frameOf,
 POSITIONS:POSITIONS, ownerOf:ownerOf, isOpen:isOpen, applyReceivers:applyReceivers,
 seatLabel:seatLabel, openLabel:openLabel, PRESETS:PRESETS,
 seatIds:seatIds, isSeat:isSeat, seatPositions:seatPositions,
 mixOptions:mixOptions, mixGates:mixGates, seatGates:seatGates,
 parseDatis:parseDatis, datisText:datisText, datisSplit:datisSplit, datisJoined:datisJoined,
 configFromRunways:configFromRunways, DATIS_SOURCES:DATIS_SOURCES,
 timingSummary:timingSummary, setDraft:function(d){ draft=d; renderEditor(); }, getDraft:function(){ return draft; }
};

if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', mount); }
else { mount(); }
})();
</script>
