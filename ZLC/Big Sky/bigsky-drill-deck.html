/* ================================================================
   MASTER STRIP BLOCK — the flight-strip row, facility-agnostic.

   Extracted from the M98 drill builder and generalised so the same row
   can serve every deck. Paste it in, give it a facility contract, and it
   renders the strip and enforces that every procedure on it belongs to
   the facility working the strip.

   THE POINT OF THIS FILE IS THE ENFORCEMENT, not the markup. A strip is
   a statement about a real aircraft on a real procedure, and most of the
   ways it can be wrong are combinations that look fine field by field:

     - an M98 arrival landing at a field M98 does not work
     - a KSLC STAR on an M98 strip, or an MSP STAR on an S56 one
     - an MSP SID flown off a satellite field that does not have it
     - a runway that is not at the airport selected

   Every one of those is refused BY NAME, saying what would have been
   valid instead, because a silent drop teaches the wrong thing and a
   generic "invalid" teaches nothing.

   IT NOW CARRIES THE WHOLE ROW, NOT HALF OF IT. Until 2026-09-07 this
   block held only the job half — the part that names a procedure — and
   each deck wrote its own callsign, type and altitude boxes. That made
   the strip a different shape at every facility, and it meant the work
   M98 had already done on flight rules, radar service, wake class,
   speeds and check-in timing reached nobody else. Owner's call: the M98
   row is the format, so the format lives here.

   WHAT IS GENERIC AND WHAT IS THE FACILITY'S. The row's shape, and every
   field whose meaning is national, is here: the five radar-service
   states and which of them a job and a set of flight rules can legally
   be in, the wake class by maximum certificated takeoff weight, the
   published-versus-Center-advised speed pair, the check-in clock. What
   is the facility's is passed IN, through optional functions on the
   contract — who hands this aircraft off, which fixes are on the
   procedure it is flying, what its filed route reads as, what the strip
   is doing in one line. A deck that cannot answer one of those gets the
   honest fallback: a plain box, or nothing, never a guess.

   ---------------------------------------------------------------
   THE CONTRACT

   window.STRIP_FACILITY = {
     id: 'M98',                    // facility label, used in every message
     prefix: 'strip',              // id/class prefix, so it can sit beside
                                   //   a deck's own controls
     sync: 'ddbSync',              // OPTIONAL OVERRIDE. Defaults to
                                   //   '<prefix>Sync', which every mount
                                   //   defines. See "the re-render" below.
     airports: {
       KMSP: {name:'Minneapolis-St Paul', rwys:['12L','12R','30L','30R']},
       KLVN: {name:'Airlake',             rwys:null}   // not in the reference set
     },
     arrivals:   { NITZR:{serves:['KMSP'], flies:true} },
     departures: { COULT:{from:['KMSP'],   flies:true} },

     // ---- all optional; each one has a stated fallback ----
     spoken:       function(cs){...},        // callsign in spoken form
     context:      function(strip){...},     // one line: what this strip is doing
     handoffFor:   function(strip, role, radarState){...},
     fixesOn:      function(strip){...},     // fixes on the procedure it is on
     routeTextFor: function(strip){...},     // the filed route, for the placeholder
     roleHints:    {arrival:'...', departure:'...', overflight:'...'},
     extraFields:  function(strip, i){...}   // the deck's own boxes, after the tail
   };

   `serves` is the list of airports an ARRIVAL actually ends at.
   `from` is the list of airports a DEPARTURE actually leaves from.

   BOTH ARE REQUIRED AND NEITHER DEFAULTS TO "EVERYWHERE". A procedure
   with an empty list is offered nowhere. That is the safe direction: a
   missing entry shows up as a procedure you cannot pick, never as one
   that silently works at the wrong field.

   `rwys: null` where a field's runways are not in the reference set. The
   control then says "no runway inventory for KLVN" rather than rendering
   an empty box or inventing one.

   `flies` and `track` are DIFFERENT CLAIMS, and the row labels them
   differently. Conflating them is what let a deck holding a complete
   published ladder still describe itself as a frame.

     flies  this deck's engine has geometry it can actually FLY.
            False everywhere but M98, and false for a reason that has
            nothing to do with the data: a deck with no traffic model
            flies nothing, however much it knows.
     track  the published track IS carried — fixes, crossing
            restrictions, speed limits. Set by the procedures block,
            which reads the FAA's coded source.

   flies:false with track:true renders "(track only)". flies:false
   with no track renders "(frame only)". Neither is a defect; saying
   which of the two is true is the entire point.

   ---------------------------------------------------------------
   THE OPTIONAL HOOKS, AND WHAT HAPPENS WITHOUT THEM

     spoken       header reads Strip 1 — "Delta five eight nine".
                  WITHOUT IT the header prints the bare callsign. It is
                  not defaulted, because callsign voicing is a national
                  reference a facility either carries or does not, and a
                  deck with no TTS layer inventing a pronunciation is
                  exactly what claude_US_Carrier_Callsigns.md forbids.
     context      the grey line beside the strip number.
                  WITHOUT IT the line is empty.
     handoffFor   returns {name, freq} for a job whose handoff the
                  facility can derive — a departure off a known tower.
                  Return null to let the controller type it.
                  WITHOUT IT every job gets the plain input.
     fixesOn      the fixes on the procedure this strip is on, in order.
                  With it, the row asks for MILES FROM A NAMED FIX and
                  offers only fixes on that procedure. WITHOUT IT, or
                  where it returns nothing, the row falls back to a bare
                  distance-to-go box — which is what M98 does for a
                  routing with no published ladder.
     routeTextFor the placeholder in the route box, and it enables the
                  "fill from the procedure" button.
                  WITHOUT IT the placeholder reads "filed route" and the
                  button is not offered, because there is nothing to fill
                  from.
     roleHints    the title text on the job selector.
     extraFields  html appended after the tail, for boxes only this deck
                  needs — C90 and AZO place a strip on their scope by
                  bearing and distance, which no other deck does.

   ---------------------------------------------------------------
   THE CEILING ON A DRILL (2026-10-27)

   window.strip.MAX is 50 and window.strip.refuseAdd(have) enforces it.
   The deck's "add a strip" calls refuseAdd(rows.length) first and stops
   if it returns true; its "drop a strip" calls it again after the
   splice so the note clears once there is room. The note is written
   above the rows (<prefix>-cap) and says why. M98 does not carry this
   block and holds the same number as STRIP_MAX in its builder.

   ---------------------------------------------------------------
   THE RE-RENDER IS NOT OPT-IN

   Every control here carries an onchange that calls <prefix>Sync,
   through window and guarded, so the block still names the deck's
   re-render function rather than depending on any particular builder.

   IT USED TO BE OPT-IN AND THAT WAS A REAL BUG, FOUND 2026-09-07. With
   no `sync` in the contract this emitted no handler at all, so the
   airport, procedure and runway controls were inert. Changing the
   landing field left the arrival list showing the PREVIOUS field's
   STARs; a KORD STAR could be selected on a strip landing Midway; and
   the check line went on reporting the stale combination as legal.

   All five decks carrying the block shipped without `sync`. Five
   contracts do not forget the same field independently — the default was
   wrong. The filtering was never broken: jobFields has always built the
   list from arrivalsFor(dest), and normStrip has always re-placed a
   procedure the new field cannot carry. Nothing ever ran them.

   AND WRITE THE OPTION'S VALUE OUT. With none, an option's value is its
   own label text, so any decoration — a revision name, a "(frame only)"
   tag — reads back as part of the key. This block has always done it;
   M98's own row had not, and six of its sixteen arrivals could not be
   selected at all.
   ================================================================ */
(function(){
'use strict';

var F = window.STRIP_FACILITY;
if(!F || !F.airports){ return; }   /* no contract — do nothing, per the block contract */

var FID = F.id || 'this facility';
var AP  = F.airports || {};
var ARR = F.arrivals || {};
var DEP = F.departures || {};

/* ---------- 1. What this facility can legally put on a strip ---------- */

function airportsHere(){ return Object.keys(AP); }
function worksAirport(icao){ return !!(icao && AP[icao]); }
function airportName(icao){ return (AP[icao] && AP[icao].name) || icao; }

/* Runways at a field, or nothing where the inventory is not in the
   reference set. Never invent one — an empty list is an honest answer and
   an invented runway is a strip that trains a wrong readback. */
function runwaysAt(icao){
 var a = AP[icao];
 return (a && a.rwys) ? a.rwys.slice() : [];
}

/* The arrivals that actually END at this field, and the departures that
   actually LEAVE it. These two functions are the whole guard: every
   dropdown is built from them, so an out-of-facility procedure is never
   offered in the first place. */
function arrivalsFor(icao){
 return Object.keys(ARR).filter(function(k){
  return (ARR[k].serves || []).indexOf(icao) >= 0;
 });
}
function departuresFor(icao){
 return Object.keys(DEP).filter(function(k){
  return (DEP[k].from || []).indexOf(icao) >= 0;
 });
}
function arrivalServes(proc, icao){ return arrivalsFor(icao).indexOf(proc) >= 0; }
function departureLeaves(proc, icao){ return departuresFor(proc ? icao : icao).indexOf(proc) >= 0; }

/* Where a procedure IS valid, for the refusal message. A procedure this
   facility does not have at all is named as foreign rather than as
   missing, because those are different mistakes. */
function servesList(proc){ return (ARR[proc] && ARR[proc].serves) || null; }
function fromList(proc){ return (DEP[proc] && DEP[proc].from) || null; }

/* ---------- 2. The check ----------
   Returns a list of plain-language errors. Empty means the combination is
   legal for this facility. Each message names the offending value and
   what would have been valid, in that order. */
function checkStrip(s, label){
 var e = [], tag = label || (s && s.cs) || 'that strip';
 if(!s) return ['there is no strip to check'];
 var role = s.role || 'arrival';

 if(role === 'arrival'){
  var dest = s.dest;
  if(!worksAirport(dest)){
   e.push(tag + ' is landing at ' + (dest || 'nowhere') + ', and ' + FID
     + ' does not work that field. It works ' + airportsHere().join(', ') + '.');
  } else if(s.gate){
   if(!ARR[s.gate]){
    e.push(tag + ' is on the ' + s.gate + ' arrival, which is not a ' + FID
      + ' procedure at all. ' + airportName(dest) + ' is served by '
      + (arrivalsFor(dest).join(', ') || 'no arrival in the reference set') + '.');
   } else if(!arrivalServes(s.gate, dest)){
    var sv = servesList(s.gate);
    e.push(tag + ' is landing ' + dest + ' on the ' + s.gate
      + ' arrival, and ' + s.gate + ' does not serve that field — it serves '
      + (sv && sv.length ? sv.join(', ') : 'no field in the reference set')
      + '. ' + airportName(dest) + ' is served by '
      + (arrivalsFor(dest).join(', ') || 'no arrival in the reference set') + '.');
   }
  }
  if(s.rwy && runwaysAt(dest).indexOf(s.rwy) < 0){
   var rw = runwaysAt(dest);
   e.push(tag + ' is assigned runway ' + s.rwy + ' at ' + dest + ', which '
     + (rw.length ? ('does not have it — it has ' + rw.join(', '))
                  : 'has no runway inventory in the reference set') + '.');
  }
 }

 if(role === 'departure'){
  var dep = s.dep;
  if(!worksAirport(dep)){
   e.push(tag + ' departed ' + (dep || 'nowhere') + ', and ' + FID
     + ' does not work that field. It works ' + airportsHere().join(', ') + '.');
  } else if(s.sid){
   if(!DEP[s.sid]){
    e.push(tag + ' is on the ' + s.sid + ' departure, which is not a ' + FID
      + ' procedure at all. ' + airportName(dep) + ' has '
      + (departuresFor(dep).join(', ') || 'no departure in the reference set') + '.');
   } else if(departuresFor(dep).indexOf(s.sid) < 0){
    var fr = fromList(s.sid);
    e.push(tag + ' departed ' + dep + ' on the ' + s.sid
      + ' departure, and ' + s.sid + ' does not leave that field — it leaves '
      + (fr && fr.length ? fr.join(', ') : 'no field in the reference set')
      + '. ' + airportName(dep) + ' has '
      + (departuresFor(dep).join(', ') || 'no departure in the reference set') + '.');
   }
  }
  if(s.depRwy && runwaysAt(dep).indexOf(s.depRwy) < 0){
   var dr = runwaysAt(dep);
   e.push(tag + ' departed runway ' + s.depRwy + ' at ' + dep + ', which '
     + (dr.length ? ('does not have it — it has ' + dr.join(', '))
                  : 'has no runway inventory in the reference set') + '.');
  }
 }

 return e;
}

/* Bring a stored strip back inside the contract rather than leaving it in
   a state the row cannot display. A drill saved at another facility, or
   before a procedure was renamed, resolves to something legal here and
   the caller is told what moved. */
function normStrip(s){
 var moved = [];
 if(!s) return {strip:s, moved:moved};
 var role = s.role || 'arrival';
 var here = airportsHere();
 if(role === 'arrival'){
  if(!worksAirport(s.dest)){ moved.push('landing ' + s.dest + ' -> ' + here[0]); s.dest = here[0]; }
  var av = arrivalsFor(s.dest);
  if(s.gate && av.indexOf(s.gate) < 0){ moved.push('arrival ' + s.gate + ' -> ' + (av[0] || 'none')); s.gate = av[0] || ''; }
  /* THE MODEL MATCHES WHAT THE CONTROL CAN EXPRESS. The procedure picker
     has no blank option, so with nothing set the browser shows the first
     one — and the strip would then be carrying an arrival the row was
     displaying but the model did not have, which is how a context line
     comes to say "no arrival selected" under a control reading BEWTE4.
     Not a move: nothing was displaced, this is the default the control
     was already showing. */
  if(!s.gate && av.length) s.gate = av[0];
  if(s.rwy && runwaysAt(s.dest).indexOf(s.rwy) < 0){ moved.push('runway ' + s.rwy + ' -> not issued'); s.rwy = ''; }
 }
 if(role === 'departure'){
  if(!worksAirport(s.dep)){ moved.push('departed ' + s.dep + ' -> ' + here[0]); s.dep = here[0]; }
  var dv = departuresFor(s.dep);
  if(s.sid && dv.indexOf(s.sid) < 0){ moved.push('departure ' + s.sid + ' -> ' + (dv[0] || 'none')); s.sid = dv[0] || ''; }
  if(!s.sid && dv.length) s.sid = dv[0];
  if(s.depRwy && runwaysAt(s.dep).indexOf(s.depRwy) < 0){ moved.push('runway ' + s.depRwy + ' -> not stated'); s.depRwy = ''; }
 }
 return {strip:s, moved:moved};
}

 LJ60:23500, H25B:28000, DH8A:36300, DH8B:36300, DH8C:41100,
 DH8D:64500, AT43:36817, AT45:41005, AT72:50265, AT75:50265,
 AT76:50265, SF34:29000, SW4:16500, B190:17120, JS41:24000,
 PC12:10450, TBM9:7394, PC24:18300, C208:8750, C25A:10700,
 C25B:13870, C25C:17110, E55P:18500, E50P:10472, HDJT:6000,
 /* small */
 C172:2450, C182:3100, C206:3600, SR20:3050, SR22:3600,
 PA46:4340, PA34:4570, PA28:2550, DA40:2646, DA42:4189, DA62:5071,
 M20P:2740, M20T:3374, C310:5500, BE58:5500, AC11:3800
};
var B757_CLASS = {B752:1, B753:1};
function wakeOf(type){
 var t = (type || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
 if(t === 'A388' || t === 'A225')
  return {cls:'super', label:'super', heavy:true, known:true, mtow:MTOW[t]};
 var w = MTOW[t];
 if(w == null) return {cls:'nowgt', label:'NOWGT — weight unverified', heavy:false, known:false,
   note:'This type is not in the table, so it tags NOWGT: 10 NM ahead and behind until the weight is verified.'};
 if(w >= 300000) return {cls:'heavy', label:'heavy', heavy:true, known:true, mtow:w};
 if(B757_CLASS[t]) return {cls:'large', label:'large — B757 class', heavy:false, known:true, mtow:w,
   note:'A 757 is a Large, so it carries its own wake requirement behind it.'};
 if(w > 41000) return {cls:'large', label:'large', heavy:false, known:true, mtow:w};
 return {cls:'small', label:'small', heavy:false, known:true, mtow:w};
}

/* The five states an aircraft can be in when it first speaks to you, and
   what each one has already got. `ident` is radar identified, `code` is
   a discrete beacon code, `cleared` is an IFR clearance. */
var RADAR_STATES = {
 established:{ident:true,  code:true,  cleared:true,  label:'established — handed off by another radar facility'},
 departure:  {ident:false, code:true,  cleared:true,  label:'off the tower — owes a radar contact'},
 popup:      {ident:false, code:false, cleared:false, label:'pop-up IFR — airborne, asking for a clearance'},
 following:  {ident:false, code:false, cleared:false, label:'VFR asking for flight following'},
 none:       {ident:false, code:false, cleared:false, label:'cold call — nothing on it'}
};
/* Which states a strip can legally be in, given what it is doing and
   whether it is IFR. An arrival is never "off the tower"; an IFR
   aircraft never wants flight following, because it already has a
   clearance. The pop-up stays available on IFR, which is the case that
   makes the box worth having at all. */
function radarStatesFor(role, rules){
 if(rules === 'VFR') return (role === 'departure')
   ? ['departure','following','none','established']
   : ['established','following','none'];
 return (role === 'departure') ? ['departure','established'] : ['established','popup'];
}
/* Stored drills predate the five states and carry only established/none,
   where "none" meant a pop-up on an IFR strip and a cold call on a VFR
   one. */
function normRadar(r, rules, role){
 var legal = radarStatesFor(role, rules);
 if(RADAR_STATES[r] && legal.indexOf(r) >= 0) return r;
 if(r === 'none') r = (rules === 'VFR') ? 'none' : 'popup';
 if(RADAR_STATES[r] && legal.indexOf(r) >= 0) return r;
 /* A KNOWN STATE THAT THIS JOB AND THESE FLIGHT RULES CANNOT BE IN. Pick
    "VFR asking for flight following", then switch the strip to IFR: the
    box correctly stops offering it, but handing the illegal state back
    unchanged would leave the row DISPLAYING "established" while the
    strip was STORED as "following". Keep what the state MEANT and take
    the legal state that means the same thing. */
 var st = RADAR_STATES[r], i, c;
 if(st && !st.code && !st.ident){
  for(i = 0; i < legal.length; i++){
   c = RADAR_STATES[legal[i]];
   if(c && !c.code && !c.ident) return legal[i];
  }
 }
 return (role === 'departure' && rules !== 'VFR') ? 'departure' : 'established';
}

var ROLES = ['arrival','departure','overflight'];
function roleOf(s){
 var r = s && s.role;
 return (ROLES.indexOf(r) >= 0) ? r : 'arrival';
}
var ROLE_HINT_DEFAULT = {
 arrival:    'Inbound to a field this facility works.',
 departure:  'Off a field this facility works, climbing out.',
 overflight: 'Crosses the airspace and has to be handed off or pointed out before the far side.'
};

/* ---------- 4. The row ----------
   Ids are prefixed so a deck can host this alongside its own controls.

   `onchange` calls the deck's re-render function BY NAME, through
   window, so this block still depends on no particular builder. The name
   defaults to <prefix>Sync, which is what every mount defines; `sync` in
   the contract overrides it. Guarded, so a host that defines no such
   function gets an inert control rather than a console error. */
var PFX  = (F.prefix || 'strip');
var SYNC = F.sync || (PFX + 'Sync');
function esc(s){
 return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
   .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function call(fn){ return 'window[\'' + fn + '\'] && window[\'' + fn + '\']()'; }
function ev(){ return ' onchange="' + call(SYNC) + '"'; }
function fld(lab, ctl){
 return '<div class="' + PFX + '-f"><span class="' + PFX + '-lab">' + lab + '</span>' + ctl + '</div>';
}
function opts(list, sel, fmt){
 return list.map(function(v){
  return '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>'
    + esc(fmt ? fmt(v) : v) + '</option>';
 }).join('');
}
function inp(id, val, ph, extra){
 return '<input class="' + PFX + '-in" id="' + PFX + '-' + id + '" value="' + esc(val)
   + '"' + (ph ? (' placeholder="' + esc(ph) + '"') : '') + (extra || '') + ev() + '>';
}
function pick(id, list, sel, fmt){
 return '<select class="' + PFX + '-sel" id="' + PFX + '-' + id + '"' + ev() + '>'
   + opts(list, sel, fmt) + '</select>';
}
/* A derived value the controller reads but cannot type. */
function shown(txt, title){
 return '<div class="' + PFX + '-in ' + PFX + '-derived"'
   + (title ? (' title="' + esc(title) + '"') : '') + '>' + esc(txt) + '</div>';
}

/* The airport control offers THIS FACILITY'S FIELDS AND NOTHING ELSE.
   That single fact is what makes a cross-facility strip unbuildable
   rather than merely refused after the fact. */
function airportControl(id, sel){
 return pick(id, airportsHere(), sel, function(k){ return k + ' — ' + airportName(k); });
}
function procControl(id, list, sel, meta, empty){
 if(!list.length){
  return '<div class="' + PFX + '-sel ' + PFX + '-none">' + esc(empty) + '</div>';
 }
 return '<select class="' + PFX + '-sel" id="' + PFX + '-' + id + '"' + ev() + '>'
   + list.map(function(p){
      var m = meta[p] || {};
      return '<option value="' + esc(p) + '"' + (p === sel ? ' selected' : '') + '>'
        + esc(p) + (m.rev ? (' — ' + esc(m.rev)) : '')
        + (m.flies === false ? (m.track ? ' (track only)' : ' (frame only)') : '')
        + '</option>';
     }).join('')
   + '</select>';
}
function runwayControl(id, icao, sel, blank){
 var rw = runwaysAt(icao);
 if(!rw.length){
  return '<div class="' + PFX + '-sel ' + PFX + '-none">no runway inventory for ' + esc(icao) + '</div>';
 }
 return '<select class="' + PFX + '-sel" id="' + PFX + '-' + id + '"' + ev() + '>'
   + '<option value=""' + (sel ? '' : ' selected') + '>' + esc(blank) + '</option>'
   + opts(rw, sel) + '</select>';
}

/* Who handed it to you follows the job, not the typing. Anything with no
   service on it was handed off by nobody at all, and the facility gets
   first refusal on deriving the rest — a departure off a tower this
   facility knows is not something the controller should have to type. */
function handoffControl(s, i){
 var st = RADAR_STATES[s.radar];
 if(st && !st.code && !st.ident){
  return shown('nobody — it calls you itself');
 }
 var d = F.handoffFor ? F.handoffFor(s, roleOf(s), s.radar) : null;
 if(d && d.name){
  return shown(d.name + (d.freq ? ('  ' + d.freq) : ''), d.why || '');
 }
 return inp('from' + i, s.from, 'the facility that handed it off');
}

/* The job half — the part that differs by what the aircraft is doing,
   and the only part that carries a procedure. */
function jobFields(s, i){
 var role = roleOf(s);
 if(role === 'departure'){
  var dep = worksAirport(s.dep) ? s.dep : airportsHere()[0];
  var dl  = departuresFor(dep);
  return fld('Departed', airportControl('dep' + i, dep))
   + fld('Runway', runwayControl('drwy' + i, dep, s.depRwy, 'not stated'))
   + fld('Departure', procControl('sid' + i, dl, s.sid, DEP,
       'no departure procedure at ' + dep + ' in the reference set'))
   + fld('NM from the field', inp('fs' + i, s.fromStart));
 }
 if(role === 'overflight'){
  return fld('Entry radial', inp('er' + i, s.entryR))
   + fld('Entry DME',   inp('ed' + i, s.entryD))
   + fld('Exit radial', inp('xr' + i, s.exitR))
   + fld('Exit DME',    inp('xd' + i, s.exitD));
 }
 var dest = worksAirport(s.dest) ? s.dest : airportsHere()[0];
 var al   = arrivalsFor(dest);
 return fld('Landing', airportControl('dest' + i, dest))
  + fld('Arrival', procControl('gate' + i, al, s.gate, ARR,
      'no arrival procedure at ' + dest + ' in the reference set'))
  + placeOnTrack(s, i)
  + fld('Engine', pick('eng' + i, ['jet','turboprop','piston'], s.engine || 'jet'));
}

/* Placed by the fix it is running to and the distance still to run — the
   way it reads off a scope — with ONLY the fixes on THIS procedure
   offered. A routing with no published ladder keeps the bare distance,
   which is the honest fallback rather than an empty fix picker. */
function fixesFor(s){
 if(!F.fixesOn) return [];
 var out = F.fixesOn(s);
 return (out && out.length) ? out : [];
}
function placeOnTrack(s, i){
 var fx = fixesFor(s);
 if(!fx.length) return fld('NM to go', inp('dtg' + i, s.dtg));
 var sel = (fx.indexOf(s.dtgFix) >= 0) ? s.dtgFix : fx[0];
 return fld('Miles from', inp('dtgnm' + i, s.dtgNm))
  + fld('Next fix', pick('dtgfix' + i, fx, sel));
}

function rowHtml(s, i){
 var role  = roleOf(s);
 var rules = (s.rules === 'VFR') ? 'VFR' : 'IFR';
 var radar = normRadar(s.radar, rules, role);
 var wk    = wakeOf(s.type);
 var hints = F.roleHints || ROLE_HINT_DEFAULT;

 var head = fld('Job', '<select class="' + PFX + '-sel" id="' + PFX + '-role' + i + '"'
     + ' title="' + esc(hints[role] || '') + '"' + ev() + '>' + opts(ROLES, role) + '</select>')
  + fld('Callsign', inp('cs' + i, s.cs, 'DAL589'))
  + fld('Flight rules', pick('rules' + i, ['IFR','VFR'], rules))
  /* The states this job and these flight rules can legally be in, and
     no others — an IFR arrival is never asking for flight following. */
  + fld('Radar service', '<select class="' + PFX + '-sel" id="' + PFX + '-radar' + i + '"' + ev() + '>'
      + opts(radarStatesFor(role, rules), radar, function(k){ return RADAR_STATES[k].label; })
      + '</select>')
  + fld('Handed off by', handoffControl(s, i))
  + fld('Type', inp('type' + i, s.type))
  /* The class, not the weight — the box is what a controller reads off a
     data block, and a data block carries the class. The weight is in the
     tooltip, where the citation for the class belongs. */
  + fld('Wake class', '<div class="' + PFX + '-in ' + PFX + '-wake-' + wk.cls + '" title="'
      + esc(wk.note || ('Maximum certificated takeoff weight '
          + (wk.mtow ? (wk.mtow.toLocaleString() + ' lb') : 'not in the table')))
      + '">' + esc(wk.label) + '</div>');

 var tail = fld('Altitude', inp('alt' + i, s.alt))
  + fld('Speed', inp('ias' + i, s.ias));

 if(role === 'arrival'){
  /* An arrival on an optimized profile descent flies the speeds printed
     on the arrival. The only reason it is doing anything else is that
     Center called and said so, which is a coordination event and not a
     strip setting — so there are two options and the second names where
     it came from. The box is DISABLED under "published", because there
     is nothing Center advised to write in it. */
  var mode = (s.mode === 'assigned') ? 'assigned' : 'published';
  var dest = worksAirport(s.dest) ? s.dest : airportsHere()[0];
  tail += fld('Speed', '<select class="' + PFX + '-sel" id="' + PFX + '-mode' + i + '"' + ev() + '>'
      + '<option value="published"' + (mode === 'published' ? ' selected' : '') + '>published — descend via the arrival</option>'
      + '<option value="assigned"'  + (mode === 'assigned'  ? ' selected' : '') + '>Center advised something other than published</option>'
      + '</select>')
   + fld('Center advised', inp('asg' + i, s.asg, '', mode === 'assigned' ? '' : ' disabled'))
   + fld('Runway', runwayControl('rwy' + i, dest, s.rwy, 'not yet issued'));
 }

 tail += fld('Checks in at', inp('sp' + i, s.spawnAt, '', s.ckdIn ? ' disabled' : ''))
  + '<label class="' + PFX + '-chk"><input type="checkbox" id="' + PFX + '-ck' + i + '"'
    + (s.ckdIn ? ' checked' : '') + ev() + '>already on frequency</label>';
 if(role === 'arrival'){
  tail += '<label class="' + PFX + '-chk"><input type="checkbox" id="' + PFX + '-al' + i + '"'
    + (s.altim ? ' checked' : '') + ev() + '>altimeter given</label>';
 }
 if(F.extraFields) tail += F.extraFields(s, i);

 /* The route sits on its own line — it is the longest field on the strip. */
 var fill = F.routeTextFor
   ? (' <button class="' + PFX + '-btn ' + PFX + '-sm" onclick="window[\'' + PFX
      + 'FillRoute\'] && window[\'' + PFX + 'FillRoute\'](' + i + ')">fill from the procedure</button>')
   : '';
 var routeLab = (rules === 'IFR')
   ? ((radar === 'popup' || radar === 'none')
       ? 'Route — what the pop-up is asking for, optional'
       : 'Route — required on an IFR strip')
   : 'Intentions — optional, this one is VFR';
 var ph = (rules === 'IFR')
   ? ((F.routeTextFor && F.routeTextFor(s)) || 'filed route')
   : 'northeast bound, request Bravo transition';
 var routeRow = '<div class="' + PFX + '-routerow"><span class="' + PFX + '-lab">'
   + routeLab + (rules === 'IFR' ? fill : '') + '</span>'
   + '<input class="' + PFX + '-in" id="' + PFX + '-route' + i + '" value="' + esc(s.route || '')
   + '" placeholder="' + esc(ph) + '"' + ev() + '></div>';

 var spokenCs = (F.spoken && s.cs) ? F.spoken(s.cs) : '';
 var ctx = F.context ? (F.context(s) || '') : '';
 return '<div class="' + PFX + '-row" id="' + PFX + '-row' + i + '">'
  + '<div class="' + PFX + '-rowhead"><b>Strip ' + (i + 1)
    + (s.cs ? (' — ' + (spokenCs ? ('“' + esc(spokenCs) + '”') : esc(s.cs))) : '') + '</b>'
    + '<span>' + esc(ctx) + '</span>'
    + '<button class="' + PFX + '-btn ' + PFX + '-sm" onclick="window[\'' + PFX
      + 'Drop\'] && window[\'' + PFX + 'Drop\'](' + i + ')">remove</button></div>'
  + '<div class="' + PFX + '-grid">' + head + jobFields(s, i) + tail + '</div>'
  + routeRow
  + '<div id="' + PFX + '-msg' + i + '"></div>'
  + '<div id="' + PFX + '-moved' + i + '" class="' + PFX + '-moved"></div>'
  + '</div>';
}

/* ---------- 5. Read back ---------- */
function g(id){ var e = document.getElementById(PFX + '-' + id); return e ? e.value : null; }
function chk(id){ var e = document.getElementById(PFX + '-' + id); return e ? !!e.checked : null; }
function keep(cur, v){ return (v != null) ? v : cur; }

function readJob(s, i){
 var role = roleOf(s);
 if(role === 'departure'){
  s.dep    = keep(s.dep,    g('dep' + i));
  s.sid    = keep(s.sid,    g('sid' + i));
  s.depRwy = keep(s.depRwy, g('drwy' + i));
  s.fromStart = keep(s.fromStart, g('fs' + i));
 } else if(role === 'overflight'){
  s.entryR = keep(s.entryR, g('er' + i)); s.entryD = keep(s.entryD, g('ed' + i));
  s.exitR  = keep(s.exitR,  g('xr' + i)); s.exitD  = keep(s.exitD,  g('xd' + i));
 } else {
  s.dest = keep(s.dest, g('dest' + i));
  s.gate = keep(s.gate, g('gate' + i));
  s.rwy  = keep(s.rwy,  g('rwy' + i));
  s.engine = keep(s.engine, g('eng' + i));
  if(document.getElementById(PFX + '-dtgfix' + i)){
   s.dtgFix = keep(s.dtgFix, g('dtgfix' + i));
   s.dtgNm  = keep(s.dtgNm,  g('dtgnm' + i));
  } else {
   s.dtg = keep(s.dtg, g('dtg' + i));
  }
 }
 /* changing the field can strand the procedure that was on it */
 return normStrip(s);
}

/* The whole row, generic half included. A mount calls this one. */
function readRow(s, i){
 s.role = keep(s.role, g('role' + i));
 s.cs   = (g('cs' + i) != null) ? String(g('cs' + i)).toUpperCase().replace(/\s+/g,'') : s.cs;
 s.type = (g('type' + i) != null) ? String(g('type' + i)).toUpperCase() : s.type;
 s.rules = keep(s.rules, g('rules' + i));
 s.rules = (s.rules === 'VFR') ? 'VFR' : 'IFR';
 s.radar = normRadar(keep(s.radar, g('radar' + i)), s.rules, roleOf(s));
 /* Derived where the facility can derive it, typed where it cannot. */
 var st = RADAR_STATES[s.radar];
 if(st && !st.code && !st.ident){ s.from = ''; }
 else {
  var d = F.handoffFor ? F.handoffFor(s, roleOf(s), s.radar) : null;
  s.from = (d && d.name) ? d.name : keep(s.from, g('from' + i));
 }
 s.alt = keep(s.alt, g('alt' + i));
 s.ias = keep(s.ias, g('ias' + i));
 s.mode = keep(s.mode, g('mode' + i));
 s.asg  = keep(s.asg,  g('asg' + i));
 /* Published speeds are the arrival's own, so there is nothing Center
    advised to carry. Clear it rather than keeping a stale number behind
    a disabled box, which would export a speed nobody assigned. */
 if(s.mode !== 'assigned') s.asg = '';
 s.spawnAt = keep(s.spawnAt, g('sp' + i));
 var c = chk('ck' + i); if(c != null) s.ckdIn = c;
 var a = chk('al' + i); if(a != null) s.altim = a;
 s.route = keep(s.route, g('route' + i));
 return readJob(s, i);
}

/* Fill the route from the procedure, where the facility can say what it
   reads as. Named on window so the row's button can reach it without the
   mount having to wire anything. */
window[PFX + 'FillRoute'] = function(i){
 if(!F.routeTextFor || !window[PFX + 'RowAt']) return;
 var s = window[PFX + 'RowAt'](i);
 if(!s) return;
 var box = document.getElementById(PFX + '-route' + i);
 var txt = F.routeTextFor(s);
 if(box && txt){ box.value = txt; s.route = txt; }
};

/* ---------- 6. The look ----------
   The row's CSS lives here so the strip is the same shape at every
   facility. Namespaced by prefix, and it uses only the design system's
   own custom properties — no new colours, no new fonts. */
var CSS = ''
 + '.' + PFX + '-row{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin:8px 0;}'
 + '.' + PFX + '-rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;}'
 + '.' + PFX + '-rowhead b{font-family:var(--mono);font-size:12px;color:var(--ink);}'
 + '.' + PFX + '-rowhead span{font-family:var(--mono);font-size:10.5px;color:var(--dim2);flex:1 1 auto;}'
 + '.' + PFX + '-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;}'
 + '.' + PFX + '-f{display:flex;flex-direction:column;gap:4px;min-width:0;}'
 + '.' + PFX + '-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:0.09em;text-transform:uppercase;color:var(--dim);}'
 + '.' + PFX + '-in,.' + PFX + '-sel{background:var(--bg);border:1px solid var(--line);border-radius:4px;'
 +   'color:var(--ink);font-family:var(--mono);font-size:12px;padding:7px 8px;width:100%;box-sizing:border-box;}'
 + '.' + PFX + '-in:focus,.' + PFX + '-sel:focus{outline:2px solid var(--green);outline-offset:1px;}'
 + '.' + PFX + '-in[disabled]{color:var(--dim2);}'
 + '.' + PFX + '-derived{color:var(--dim);}'
 + '.' + PFX + '-wake-nowgt{color:var(--amber);}'
 + '.' + PFX + '-wake-heavy,.' + PFX + '-wake-super{color:var(--green);}'
 + '.' + PFX + '-wake-large,.' + PFX + '-wake-small{color:var(--dim);}'
 + '.' + PFX + '-none{color:var(--amber);font-style:italic;padding:7px 8px;'
 +   'border:1px dashed var(--line);border-radius:4px;font-size:11.5px;box-sizing:border-box;}'
 + '.' + PFX + '-chk{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;'
 +   'color:var(--dim);cursor:pointer;padding-top:14px;}'
 + '.' + PFX + '-chk input{accent-color:var(--green);width:14px;height:14px;}'
 + '.' + PFX + '-routerow{display:flex;flex-direction:column;gap:4px;margin-top:8px;}'
 + '.' + PFX + '-btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);'
 +   'border-radius:4px;padding:6px 11px;font:11px/1.4 var(--body);cursor:pointer;}'
 + '.' + PFX + '-btn:hover{border-color:var(--dim);}'
 + '.' + PFX + '-sm{font-size:10.5px;padding:4px 8px;}'
 + '.' + PFX + '-err{color:var(--red);font:11.5px/1.6 var(--body);margin-top:6px;}'
 + '.' + PFX + '-ok{color:var(--green);font:11.5px/1.6 var(--body);margin-top:6px;}'
 + '.' + PFX + '-moved{color:var(--amber);font:11.5px/1.6 var(--body);margin-top:4px;}'
 + '.' + PFX + '-dim{color:var(--dim);font:11.5px/1.65 var(--body);}'
 + '@media (max-width:600px){.' + PFX + '-grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}}';
function mountCss(){
 if(document.getElementById(PFX + '-css')) return;
 var st = document.createElement('style');
 st.id = PFX + '-css';
 st.textContent = CSS;
 document.head.appendChild(st);
}

/* A blank strip that is legal here from the moment it appears. */
function blankStrip(){
 var a = airportsHere()[0];
 var av = arrivalsFor(a);
 return {role:'arrival', cs:'', type:'B738', rules:'IFR', radar:'established', from:'',
         dest:a, gate:av[0] || '', rwy:'', engine:'jet', dtg:'', dtgFix:'', dtgNm:'',
         dep:a, sid:'', depRwy:'', fromStart:'',
         entryR:'', entryD:'', exitR:'', exitD:'',

 if(e.cfg) s += ' The configuration is now <b>' + esc(e.cfgName || e.cfg) + '</b>. The strips already flying keep their published tracks: this player does not re-plan them, so re-vector or re-assign any that need it.';
 return s;
}
function fireEvents(){
 for(var i = 0; i < sim.events.length; i++){
  var e = sim.events[i];
  if(e.fired || !(e.at <= sim.t)) continue;
  e.fired = true;
  if(e.kind === 'speci') log('info', chip('info', 'SPECI') + speciText(e));
  else if(e.kind === 'landline') log('info', chip('info', 'landline') + '<b>' + esc(e.from || 'The other side') + '</b> on the landline' + (e.cs ? ' about ' + esc(e.cs) : '') + ': ' + esc(e.text));
 }
}
function checkLos(){
 var live = sim.ac.filter(function(a){ return a.alive && a.onFreq && !a.handed && airborne(a); });
 for(var i = 0; i < live.length; i++){
  for(var j = i + 1; j < live.length; j++){
   var A = live[i], B = live[j], key = A.cs + '|' + B.cs;
   var dh = dist(A, B), dv = Math.abs(A.alt - B.alt);
   if(dh < 3 && dv < 1000){
    if(!sim.los[key]){
     sim.los[key] = true;
     log('crit', chip('crit') + 'Loss of separation - <b>' + esc(A.cs) + '</b> / <b>' + esc(B.cs) + '</b>, '
      + dh.toFixed(1) + ' NM and ' + Math.round(dv) + ' ft. Reminder, not a judgement: this applies 3 NM and 1,000 ft and nothing else - it does not know where the radar is, the wake class or the facility’s own minima.');
    }
   } else if(dh > 3.5 || dv > 1500){ delete sim.los[key]; }
  }
 }
}

/* ---------- 5. check-in ---------- */
function callName(a){
 if(typeof F.callName === 'function'){ var n = F.callName(a.role); if(n) return n; }
 return FID + (a.role === 'departure' ? ' departure' : ' approach');
}
function putOnFreq(a){
 a.onFreq = true; a.checkT = sim.t; a.checkReal = Date.now(); a.distAtCheck = a.dist;
 var st = ST.RADAR_STATES[a.radar] || {};
 var line;
 if(a.role === 'departure') line = 'passing ' + fmtAlt(a.alt) + ' on the ' + (a.track.id || 'departure');
 else if(a.role === 'overflight') line = 'level ' + fmtAlt(a.alt);
 else line = (a.via ? 'descending via the ' : 'on the ') + (a.track.id || 'arrival') + ' arrival, ' + fmtAlt(a.alt);
 var tail = '';
 if(a.role === 'arrival' && a.strip.altim) tail = ', with the altimeter';
 log('coach', '<span class="crew">' + esc(callName(a)) + ', ' + esc(a.cs) + ', ' + esc(line) + esc(tail) + '.</span>');
 if(a.role === 'departure' && a.track.vectored){
  log('info', chip('info', 'vectored departure') + '<b>' + esc(a.cs) + '</b> is on ' + esc(a.track.id) + ', which is radar vectors and publishes no fix. Coded: '
   + (a.track.coded.length ? esc(a.track.coded.join(', ')) : 'nothing for this runway') + '. The line it flies is a straight stand-in from the field to '
   + esc(a.track.entry) + ', a charted fix on the published procedures at this field. Which fix the route really uses is not published - reminder, not a judgement.');
 }
 if(a.role === 'departure' && a.altAsg == null && climbTarget(a) == null){
  log('info', chip('info', 'note') + '<b>' + esc(a.cs) + '</b>: ' + esc(a.track.id) + ' publishes no altitude to climb to from here, so it holds ' + fmtAlt(a.alt) + ' until you assign one.');
 }
 if(!st.ident && !a.notes.unident){
  a.notes.unident = true;
  log('info', chip('info', 'note') + '<b>' + esc(a.cs) + '</b> is not radar identified'
   + (st.code ? '' : ' and has no code') + (st.cleared ? '' : ' and is not on a clearance')
   + '. Code, identify, then work it.');
 }
}

/* ---------- 6. the transmission ---------- */
var UNITS = {zero:0, oh:null, one:1, two:2, three:3, tree:3, four:4, fower:4, five:5, fife:5, six:6, seven:7, eight:8, nine:9, niner:9};
var TEENS = {ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19};
var TENS  = {twenty:20, thirty:30, forty:40, fifty:50, sixty:60};
/* Spoken to written, so "descend and maintain one one thousand" and
   "contact tower one one eight point seven" read the way the digits do. */
function despell(t){
 t = ' ' + String(t).toLowerCase().replace(/[,;]/g, ' ') + ' ';
 t = t.replace(/\b(twenty|thirty|forty|fifty|sixty)[\s-]+(one|two|three|four|five|six|seven|eight|nine)\b/g, function(m, a, b){ return String(TENS[a] + UNITS[b]); });
 t = t.replace(/\b(ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen)\b/g, function(m){ return String(TEENS[m]); });
 t = t.replace(/\b(twenty|thirty|forty|fifty|sixty)\b/g, function(m){ return String(TENS[m]); });
 t = t.replace(/\b(zero|one|two|three|tree|four|fower|five|fife|six|seven|eight|nine|niner)\b/g, function(m){ return String(UNITS[m]); });
 t = t.replace(/\b(point|decimal)\b/g, '.');
 t = t.replace(/(\d+)\s*thousand(?:\s+(\d)\s*hundred)?/g, function(m, a, b){ return String(+a * 1000 + (b ? +b * 100 : 0)); });
 t = t.replace(/(\d)\s*hundred/g, function(m, a){ return String(+a * 100); });
 t = t.replace(/(\d)\s+(?=\d)/g, '$1').replace(/(\d)\s*\.\s*(?=\d)/g, '$1.');
 return t.replace(/\s+/g, ' ').trim();
}
function normCs(s){ return String(s).toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function findAc(raw){
 var up = normCs(raw), found = null, dt = despell(raw);
 sim.ac.forEach(function(a){
  if(found || !a.cs) return;
  if(up.indexOf(normCs(a.cs)) >= 0) found = a;
  else if(typeof F.spoken === 'function'){
   var sp = F.spoken(a.cs);
   if(sp && dt.indexOf(despell(sp)) >= 0) found = a;
  }
 });
 if(found) return found;
 return sim.sel != null ? (sim.ac.filter(function(a){ return a.cs === sim.sel; })[0] || null) : null;
}
function stripCs(a, raw){
 var t = String(raw);
 var re = new RegExp(a.cs.split('').join('[\\s-]*'), 'i');
 t = t.replace(re, ' ');
 if(typeof F.spoken === 'function'){
  var sp = F.spoken(a.cs);
  if(sp){ t = t.replace(new RegExp(sp.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '[\\s,]+'), 'i'), ' '); }
 }
 return t;
}
function normFreq(f){ var n = parseFloat(String(f)); return isFinite(n) ? n.toFixed(3) : ''; }
function receivers(){ return (typeof F.positions === 'function') ? (F.positions() || []) : []; }
function findReceiver(t, a){
 var m = /(\d{3}\.\d{1,3})/.exec(t), list = receivers();
 if(m){
  for(var i = 0; i < list.length; i++){ if(normFreq(list[i].freq) === normFreq(m[1])) return list[i]; }
  if(typeof F.towerFor === 'function' && a.role === 'arrival'){
   var tw = F.towerFor(a.strip.dest); if(tw && normFreq(tw.freq) === normFreq(m[1])) return {id:'TWR', name:tw.name, freq:tw.freq, open:true, kind:'twr'};
  }
  return {unknown:true, freq:m[1]};
 }
 if(/\btower\b/.test(t) && typeof F.towerFor === 'function'){
  var tw2 = F.towerFor(a.role === 'departure' ? a.strip.dep : a.strip.dest);
  if(tw2) return {id:'TWR', name:tw2.name, freq:tw2.freq, open:true, kind:'twr'};
 }
 var best = null;
 list.forEach(function(p){
  var n = String(p.name || '').toLowerCase(), id = String(p.id || '').toLowerCase();
  if((n && t.indexOf(n) >= 0) || (id && new RegExp('(?:^|[^a-z0-9])' + id.replace(/[^a-z0-9]/g, '') + '(?![a-z0-9])').test(t))){
   if(!best || n.length > String(best.name || '').length) best = p;
  }
 });
 return best;
}
function nextAlt(a){
 for(var i = 0; i < a.track.pts.length; i++){
  var pt = a.track.pts[i];
  if(pt.cum >= a.dist && pt.hi != null && pt.hi < a.alt) return pt.hi;
 }
 return null;
}

function transmit(raw){
 raw = String(raw == null ? '' : raw).trim();
 if(!raw) return null;
 var a = findAc(raw);
 log('info', chip('info', 'you') + '<span class="' + PFX + '-mono">' + esc(raw) + '</span>');
 if(!a){ log('coach', '<span class="coach">No strip selected and no callsign heard - click a strip or lead with the callsign.</span>'); return null; }
 if(!a.alive || a.handed){ log('coach', '<span class="coach">' + esc(a.cs) + ' is no longer on your frequency.</span>'); return null; }
 if(!a.onFreq){ log('coach', '<span class="coach">' + esc(a.cs) + ' has not checked in yet.</span>'); return null; }
 /* response timing, in real seconds: the clock can be paused and the lag is still real */
 sim.tx++;
 if(sim.rate === 0 && !sim.hot) sim.pausedTx++;
 if(a.firstWord == null){
  a.firstWord = Date.now();
  var lag = (a.firstWord - a.checkReal) / 1000, covered = Math.max(0, a.dist - a.distAtCheck);
  sim.timing.push({cs:a.cs, lag:lag});
  if(lag > sim.target){
   log('flag', chip('flag') + '<b>' + esc(a.cs) + '</b> checked in ' + Math.round(lag) + ' s before your first word - the target is ' + sim.target
    + ' s. It covered ' + covered.toFixed(1) + ' NM while you composed.');
  }
 }
 sim.lastTx = Date.now();
 var t = despell(stripCs(a, raw));
 var acks = [], acted = false, control = false;

 /* a runway - read only from the word onward, so a digit in a callsign can never be one */
 var isAppr = /\bcleared\b/.test(t) && /\b(approach|apch)\b/.test(t);
 var rwys = ST.runwaysAt(a.strip.dest || a.strip.dep);
 var mR = null;
 if(!isAppr && a.role === 'arrival' && /(expect|runway)/.test(t)){
  var ix = [t.indexOf('expect'), t.indexOf('runway')].filter(function(x){ return x >= 0; });
  var seg = t.slice(Math.min.apply(null, ix));
  var cands = rwys.slice().sort(function(x, y){ return y.length - x.length; });
  for(var ri = 0; ri < cands.length && !mR; ri++){
   var rr = cands[ri], num = rr.replace(/[LRC]$/, ''), sfx = (rr.match(/[LRC]$/) || [''])[0].toLowerCase();
   var word = sfx === 'l' ? 'left' : (sfx === 'r' ? 'right' : (sfx === 'c' ? 'center' : ''));
   var tail = sfx ? '[ ]*(?:' + sfx + '|' + word + ')(?![a-z])' : '(?![a-z0-9])';
   if(new RegExp('(?:^|[^a-z0-9])0?' + num + tail).test(seg)) mR = rr;
  }
 }
 if(mR){ acted = true; control = true; a.rwy = mR; acks.push('expect runway ' + sayRwy(mR)); }

 /* an approach clearance: read back, never flown */
 if(isAppr && a.role === 'arrival'){
  acted = true; control = true;
  var kind = /\bils\b/.test(t) ? 'ILS' : /\brnav\b|\bgps\b/.test(t) ? 'RNAV' : /\bvisual\b/.test(t) ? 'visual' : /\bvor\b/.test(t) ? 'VOR' : /\blocalizer\b/.test(t) ? 'localizer' : 'straight-in';
  var rm = /runway\s*0?(\d{1,2})\s*(left|right|center|l|r|c)?/.exec(t), cr = null;
  if(rm){ var sx = rm[2] ? rm[2][0].toUpperCase() : ''; cr = String(+rm[1]) + sx; rwys.forEach(function(r){ if(r.replace(/^0/, '') === cr) cr = r; }); }
  a.appr = {kind:kind, rwy:cr};
  acks.push('cleared ' + kind + ' ' + (cr ? 'runway ' + sayRwy(cr) + ' ' : '') + 'approach');
  log('info', chip('info', 'approach') + '<b>' + esc(a.cs) + '</b> is cleared. The engine flies no intercept - the final approach course and the threshold are not carried for every field - so there is no localizer to join and nothing to grade. Hand it to the tower.');
 }

 /* altimeter - read back and nothing else, there is no setting to check it against */
 var mAl = /altimeter\s*(\d{4})/.exec(t);
 if(mAl){ acted = true; a.altim = true; acks.push('altimeter ' + sayDigits(mAl[1])); }

 /* descend via the arrival */
 if(/\b(descend|resume)\s+(via|the (?:arrival|descent|profile))|\bdescend via\b/.test(t) && a.track.ok && a.role === 'arrival'){
  acted = true; control = true;
  a.via = true; a.altAsg = null;
  if(a.nav !== 'track'){ log('flag', chip('flag') + '<b>' + esc(a.cs) + '</b> is off the arrival, so there is no published profile to descend via. Give it an altitude.'); acks.push('unable, not on the arrival'); a.via = false; }
  else acks.push('descend via the ' + (a.track.id || 'arrival') + ' arrival');
 }

 /* speed - keyword-gated, and its match cut out of the text so altitude and speed can share a breath */
 var tt = t;
 /* A speed is a speed verb or the word speed before the number, or a number with knots after it.
    "maintain" alone is an altitude verb: it only counts here with knots behind it, and the number is
    never cut short of a digit, so 11,000 can never be read as 110. */
 var mSp = /\b(?:reduce|increase|decrease|slow)(?:\s+speed)?(?:\s+to|\s+by)?\s+(\d{2,3})(?!\d)|\bspeed\s+(?:to\s+|of\s+)?(\d{2,3})(?!\d)|\bmaintain\s+(\d{2,3})\s*(?:knots?|kts?)\b|\b(\d{2,3})\s*(?:knots?|kts?)\b/.exec(tt);
 if(mSp){
  var sv = parseInt(mSp[1] || mSp[2] || mSp[3] || mSp[4], 10);
  if(sv >= 100 && sv <= 400){
   acted = true; control = true;
   a.spdAsg = sv; a.pubOn = false;
   acks.push(String(sv).split('').join(' ') + ' on the speed');
   tt = tt.replace(mSp[0], ' ');
   if(sv > 250 && a.alt < 10000) log('flag', chip('flag') + '<b>' + esc(a.cs) + '</b> is below 10,000 and the crew holds 250 there regardless of what is assigned. It will fly 250.');
  }
 }
 if(/resume (?:normal|own) speed|resume normal/.test(t)){ acted = true; control = true; a.spdAsg = null; a.pubOn = false; a.iasNorm = Math.round(a.ias); acks.push('resume normal speed'); }
 else if(/resume (?:the )?published|comply with (?:the )?published|resume published/.test(t)){
  acted = true; control = true;
  if(a.nav === 'track'){ a.spdAsg = null; a.pubOn = true; acks.push('resume published speed'); }
  else { acks.push('unable, not on the procedure'); log('flag', chip('flag') + '<b>' + esc(a.cs) + '</b> is off the procedure, so there is no published speed to resume.'); }
 }
 if(/delete (?:speed|all speed)|speed restrictions? (?:deleted|cancel)|no speed restriction/.test(t)){ acted = true; control = true; a.spdAsg = null; a.pubOn = false; a.iasNorm = Math.max(a.iasNorm, 250); acks.push('speed restrictions deleted'); }

 /* altitude */
 var mAlt = /(descend|climb|maintain)(?:\s+and\s+maintain|\s+and)?\s*(?:fl|flight level)?\s*(\d{1,5})/.exec(tt);
 if(mAlt && !mAl){
  var raw2 = parseInt(mAlt[2], 10), isFl = /\b(?:fl|flight level)\b/.test(tt.slice(Math.max(0, mAlt.index - 2), mAlt.index + mAlt[0].length + 2));
  var val = isFl ? raw2 * 100 : (raw2 < 1000 ? raw2 * 100 : raw2);
  if(val >= 100 && val <= 60000){
   acted = true; control = true;
   var verb = mAlt[1];
   if(verb === 'maintain' && !/descend|climb/.test(tt) && Math.abs(val - a.alt) > 1000){
    log('flag', chip('flag') + 'Bare “maintain” ' + fmtAlt(val) + ' is ' + Math.round(Math.abs(val - a.alt)).toLocaleString('en-US') + ' ft from where <b>' + esc(a.cs) + '</b> is. Say climb or descend. The crew queries it.');
    acks.push('say again, climb or descend and maintain ' + fmtAlt(val) + '?');
   } else {
    if(verb === 'descend' && val > a.alt + 50) log('flag', chip('flag') + 'You said descend, ' + fmtAlt(val) + ' is above <b>' + esc(a.cs) + '</b> at ' + fmtAlt(a.alt) + '. The crew reads back a climb.');
    if(verb === 'climb' && val < a.alt - 50) log('flag', chip('flag') + 'You said climb, ' + fmtAlt(val) + ' is below <b>' + esc(a.cs) + '</b> at ' + fmtAlt(a.alt) + '. The crew reads back a descent.');
    a.altAsg = val; a.altFrom = 'you'; a.via = false;
    acks.push((val < a.alt ? 'descend and maintain ' : 'climb and maintain ') + fmtAlt(val));
   }
  }
 }

 /* heading */
 var mH = /(?:turn\s+(left|right)\s+)?(?:fly\s+)?(?:heading|hdg)\s*(\d{1,3})/.exec(tt);
 if(/fly present heading|present heading/.test(t)){
  acted = true; control = true; toVector(a, 'hdg'); a.hdgTgt = null; a.turn = null;
  acks.push('present heading ' + sayDigits(pad3(Math.round(a.hdg))));
 } else if(mH){
  var hv = parseInt(mH[2], 10);
  if(hv >= 1 && hv <= 360){
   acted = true; control = true; toVector(a, 'hdg');
   a.hdgTgt = hv % 360; a.turn = mH[1] ? mH[1][0].toUpperCase() : null; a.directTo = null;
   acks.push((mH[1] ? 'turn ' + mH[1] + ' ' : 'fly ') + 'heading ' + sayDigits(pad3(hv)));
  }
 }

 /* direct to a fix the deck knows */
 var mD = /\b(?:proceed\s+)?direct(?:\s+to)?\s+([a-z]{3,5})\b/.exec(tt);
 if(mD && mD[1] !== 'to'){
  var want = mD[1].toUpperCase(), ll = HAVE_PROCS ? NS.PFIX[want] : null;
  if(ll){
   acted = true; control = true;
   var onTrack = null;
   a.track.pts.forEach(function(p){ if(p.fix === want) onTrack = p; });
   if(onTrack && onTrack.cum < a.dist && a.nav === 'track'){
    acks.push('unable direct ' + want + ', already past it');
    log('flag', chip('flag') + '<b>' + esc(a.cs) + '</b> is already past ' + esc(want) + '.');
   } else {
    var wasVia = a.via;
    toVector(a, 'direct');
    var p2 = onTrack || xy(ll);
    a.directTo = onTrack ? onTrack : {x:p2.x, y:p2.y, fix:want, cum:null};
    a.hdgTgt = crs(a, a.directTo); a.turn = null;
    acks.push('direct ' + want);
    if(wasVia && onTrack) a.via = false;
    if(!onTrack) log('flag', chip('flag') + esc(want) + ' is not on <b>' + esc(a.cs) + '</b>’s track, so it leaves ' + esc(onWhat(a)) + ' there and holds the heading it ends on. Reminder, not a judgement: nothing here says that routing is allowed.');
   }
  } else {
   log('flag', chip('flag') + '<b>' + esc(want) + '</b> is not a fix this deck carries coordinates for. Say again.');
   acks.push('say again the fix');
  }
 }

 /* radar service */
 var mSq = /squawk\s*(\d{4})/.exec(t);
 if(mSq){ acted = true; a.code = true; a.squawk = mSq[1]; acks.push('squawk ' + sayDigits(mSq[1])); }
 if(/\bradar contact\b/.test(t)){
  acted = true;
  if(a.ident){ log('info', chip('info', 'note') + '<b>' + esc(a.cs) + '</b> arrived identified, so “radar contact” is redundant.'); }
  else if(!a.code){ acks.push('negative, no code yet'); log('flag', chip('flag') + 'Radar contact on <b>' + esc(a.cs) + '</b> before a code. Assign one first.'); }
  else { a.ident = true; acks.push('roger'); }
 }
 if(control && !a.ident && !a.notes.working){
  a.notes.working = true;
  log('flag', chip('flag') + 'You are working <b>' + esc(a.cs) + '</b>, which is not radar identified. Identify it first.');
 }

 /* handoff: flash, then contact */
 var mFl = /\b(flash|handoff|hand off|initiate)\b/.test(t);
 var mCt = /\b(contact|switch|frequency change|change to|go to|monitor)\b/.test(t);
 var rcv = (mFl || mCt) ? findReceiver(t, a) : null;
 if(mFl && !mCt){
  acted = true; a.flashed = true; a.flashTo = rcv && !rcv.unknown ? rcv : null;
  log('info', chip('info', 'flash') + 'Handoff of <b>' + esc(a.cs) + '</b> initiated' + (a.flashTo ? ' to ' + esc(a.flashTo.name) + ' ' + esc(a.flashTo.freq) : '') + '. It stays with you until you switch it.');
 }
 if(mCt){
  acted = true;
  if(!rcv){ acks.push('say again the frequency'); log('coach', '<span class="coach">Name a position or give a frequency: “contact tower 118.3”. No position in this deck’s reference set matched.</span>'); }
  else if(rcv.unknown){
   acks.push('say again the frequency');
   log('flag', chip('flag') + 'No position in this deck’s reference set is on ' + esc(rcv.freq) + '. <b>' + esc(a.cs) + '</b> stays with you.');
  } else if(rcv.self){
   acks.push('say again, that is this frequency');
   log('flag', chip('flag') + esc(rcv.name) + ' (' + esc(rcv.freq) + ') is the position you are working. There is nobody to switch <b>' + esc(a.cs) + '</b> to.');
  } else if(rcv.open === false){
   var ow = rcv.owner;
   log('flag', chip('flag') + esc(rcv.name) + ' (' + esc(rcv.freq) + ') is not open in this frame, so nobody is there. ' + (ow ? ('It answers on ' + esc(ow.name) + ' ' + esc(ow.freq) + '. ') : '') + '<b>' + esc(a.cs) + '</b> comes back to you.');
   acks.push('nobody on that frequency, back with you');
  } else {
   if(!a.flashed) log('info', chip('info', 'note') + 'No flash before the switch on <b>' + esc(a.cs) + '</b>. In the room the receiving controller accepts the handoff before communications move. Reminder, not a judgement: nothing here says who should have received it.');
   if(rcv.kind === 'twr' && a.role === 'arrival'){
    var apLL = airportLL(a.strip.dest);
    if(apLL) log('info', chip('info', 'note') + '<b>' + esc(a.cs) + '</b> goes to ' + esc(rcv.name) + ' ' + dist(a, xy(apLL)).toFixed(0) + ' NM from ' + esc(a.strip.dest) + ' at ' + fmtAlt(a.alt) + '. Reminder, not a judgement: the engine does not know where that tower wants it.');
   }
   a.handed = {name:rcv.name, freq:rcv.freq}; a.handedAt = sim.t;
   acks.push('contact ' + rcv.name + ' ' + String(rcv.freq).split('').join(' ').replace(/ \. /g, ' point '));
   log('good', chip('good', 'switched') + '<b>' + esc(a.cs) + '</b> is with ' + esc(rcv.name) + ' on ' + esc(rcv.freq) + '. It is off your frequency.');
  }
 }
 if(/\bradar service terminated\b/.test(t)){ acted = true; acks.push('radar service terminated'); }

 if(acks.length){
  log('coach', '<span class="crew">' + esc(acks.join(', ')) + ', ' + esc(a.cs) + '.</span>');
 } else if(!acted){
  log('coach', '<span class="coach">' + esc(a.cs) + ' did not take that as an instruction. Try an altitude, speed, heading, direct, a runway, “descend via”, “flash” or “contact <position> <frequency>”.</span>');

/* A brand, then one of its operators: equal chance per brand printed. At a field with no list the
   flat list stands, and it draws once, as it always did. */
function carrierAt(R, apt){
 var e = opsAt(apt);
 return e ? pick(R, pick(R, e.flown).cs) : pick(R, CARRIERS);
}
function callsign(R, used, piston, apt){
 for(var k = 0; k < 40; k++){
  var cs = piston ? ('N' + between(R, 100, 9999) + String.fromCharCode(65 + between(R, 0, 25)) + String.fromCharCode(65 + between(R, 0, 25)))
                  : (carrierAt(R, apt) + String(between(R, 1, 9999)));
  if(!used[cs]){ used[cs] = 1; return cs; }
 }
 return (opsAt(apt) ? carrierAt(R, apt) : 'DAL') + between(R, 1000, 9999);
}
/* The altitude an arrival starts at: what its first published ceiling ahead allows on the
   engine's descent path, rounded to a thousand; with no ceiling anywhere on the track, a
   fixture. Said so on the strip. */
function startAlt(track, from){
 var G = 240, pts = track.pts, best = null;     /* ft per NM, below what any aircraft here can descend at, so the start is on or under the path */
 /* the LOWEST allowance over every ceiling ahead, not the first: a nearer, lower ceiling is the one that binds */
 for(var i = 0; i < pts.length; i++){
  if(pts[i].cum >= from && pts[i].hi != null){
   var a = pts[i].hi + G * (pts[i].cum - from);
   if(best == null || a < best) best = a;
  }
 }
 var firstLo = null;
 for(var j = 0; j < pts.length && firstLo == null; j++){ if(pts[j].cum >= from && pts[j].lo != null) firstLo = pts[j].lo; }
 if(best == null) return firstLo != null ? Math.ceil(firstLo / 1000) * 1000 : 12000;
 /* rounded DOWN: a start above the path could not get back onto it before the ceiling */
 var a0 = clamp(Math.floor(best / 1000) * 1000, 3000, 24000);
 /* ...but never under the next published floor, which an arrival descending via cannot climb back to */
 if(firstLo != null && a0 < firstLo) a0 = Math.ceil(firstLo / 1000) * 1000;
 return a0;
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

/* Can an aircraft of this engine climb to every published floor ahead at the rate the engine
   gives it? Climb rate in feet per minute against ground speed in NM per minute, with a margin. */
function canClimb(track, alt0, from, eng, ias){
 var cap = (FL.CLIMB[eng] || 1500) / ((ias * 1.1) / 60);
 for(var i = 0; i < track.pts.length; i++){
  var p = track.pts[i];
  if(p.lo == null || p.cum <= from) continue;
  if((p.lo - alt0) / Math.max(p.cum - from, 1) > cap * 0.8) return false;
 }
 return true;
}

function genArrival(R, used, fl){
 var apts = ST.airportsHere().filter(function(a){ return ST.arrivalsFor(a).length && !(fl && fl.only && fl.airport && a !== fl.airport); });
 if(!apts.length) return null;
 var apt = (fl && fl.airport && apts.indexOf(fl.airport) >= 0 && R() < 0.8) ? fl.airport : pick(R, apts);
 var land = (fl && fl.airport === apt && fl.land && fl.land.length) ? fl.land : [''];
 var ids = shuffled(R, ST.arrivalsFor(apt));
 for(var t = 0; t < ids.length; t++){
  var rws = shuffled(R, land);
  for(var r = 0; r < rws.length; r++){
   var type = pick(R, R() < 0.15 ? PROPS : JETS);
   var s = ST.blank();
   s.role = 'arrival'; s.rules = 'IFR'; s.dest = apt; s.gate = ids[t]; s.rwy = rws[r]; s.type = type;
   s.engine = engineOf(type);
   s.cs = callsign(R, used, false, apt);
   var q = FL.procFor(s), tr = FL.transOptions(s);
   if(tr.length){ s.trans = pick(R, tr); }
   var T = FL.track(s);
   if(!T.ok) { delete used[s.cs]; continue; }
   /* start 35 to 80 NM from the end of the track, so something happens within minutes
      rather than twenty minutes out on a long transition; a shorter track starts at its beginning */
   var remain = between(R, 35, 80), d0 = Math.max(0, T.total - remain);
   s.dtg = String(Math.round((T.total - d0) * 10) / 10);
   s.alt = String(startAlt(T, d0));
   s.ias = s.engine === 'turboprop' ? '180' : (+s.alt >= 10000 ? '280' : '250');
   s.radar = ST.normRadar('established', 'IFR', 'arrival');
   return s;
  }
 }
 return null;
}
function genDeparture(R, used, fl){
 var apts = ST.airportsHere().filter(function(a){ return ST.departuresFor(a).length && !(fl && fl.only && fl.airport && a !== fl.airport); });
 if(!apts.length) return null;
 var apt = (fl && fl.airport && apts.indexOf(fl.airport) >= 0 && R() < 0.8) ? fl.airport : pick(R, apts);
 var rwys = (fl && fl.airport === apt && fl.dep && fl.dep.length) ? fl.dep : [''];
 var ids = shuffled(R, ST.departuresFor(apt));
 for(var t = 0; t < ids.length; t++){
  var type = pick(R, R() < 0.15 ? PROPS : JETS);
  var s = ST.blank();
  s.role = 'departure'; s.rules = 'IFR'; s.dep = apt; s.sid = ids[t]; s.depRwy = pick(R, rwys); s.type = type;
  s.engine = engineOf(type);
  s.cs = callsign(R, used, false, apt);
  var q = FL.procFor(s), tr = FL.transOptions(s);
  if(tr.length){ s.trans = pick(R, tr); }
  var T = FL.track(s);
  if(!T.ok){ delete used[s.cs]; continue; }
  s.fromStart = String(between(R, 0, 4));
  s.alt = String(1500 + between(R, 0, 3) * 500);
  /* a departure must be able to make the SID's own floors at the climb rate it has: a slow
     turboprop is swapped for a jet, and a SID no aircraft here could climb is skipped */
  if(!canClimb(T, +s.alt, +s.fromStart, s.engine, 190)){
   s.type = 'B738'; s.engine = 'jet';
   if(!canClimb(T, +s.alt, +s.fromStart, 'jet', 190)){ delete used[s.cs]; continue; }
  }
  /* a cleared altitude that does not contradict the SID's own floor: never below the highest
     "at or above" the published track carries */
  var floorAlt = null;
  T.pts.forEach(function(p){ if(p.lo != null && (floorAlt == null || p.lo > floorAlt)) floorAlt = p.lo; });
  var ct = pick(R, CLEARED);
  if(floorAlt != null && ct < floorAlt) ct = Math.ceil(floorAlt / 1000) * 1000;
  s.climbTo = String(ct);
  s.ias = s.engine === 'turboprop' ? '160' : '190';
  s.radar = ST.normRadar('departure', 'IFR', 'departure');
  return s;
 }
 return null;
}
function genOverflight(R, used){
 var type = pick(R, R() < 0.5 ? PISTONS : JETS), eng = engineOf(type);
 var s = ST.blank();
 s.role = 'overflight'; s.type = type; s.engine = eng;
 s.rules = eng === 'piston' ? 'VFR' : 'IFR';
 s.cs = callsign(R, used, eng === 'piston');
 var er = between(R, 0, 359), xr = (er + 180 + between(R, -40, 40) + 360) % 360;
 s.entryR = String(er); s.entryD = '40'; s.exitR = String(xr); s.exitD = '40';
 s.alt = eng === 'piston' ? String(pick(R, [4000, 6000, 8000])) : String(pick(R, [24000, 28000, 34000]));
 s.ias = eng === 'piston' ? '110' : '420';
 s.radar = ST.normRadar(eng === 'piston' ? 'following' : 'established', s.rules, 'overflight');
 return s;
}
function generate(seed, n, mix){
 var R = rng(seed), used = {}, fl = flow(), out = [], i, s;
 var want = {arr:0, dep:0, over:0};
 /* A kind the deck has no procedure for anywhere is drawn as an overflight in the mixed draw, so a deck
    whose fields code no STAR or no SID still builds the drill as long as it was asked for. The draw
    below consumes the same random numbers either way, so a deck with both kinds is unchanged. */
 var canArr = ST.airportsHere().some(function(a){ return ST.arrivalsFor(a).length; });
 var canDep = ST.airportsHere().some(function(a){ return ST.departuresFor(a).length; });
 for(i = 0; i < n; i++){
  var r = R();
  if(mix === 'arrivals') want.arr++;
  else if(mix === 'departures') want.dep++;
  else if(r < 0.5){ if(canArr) want.arr++; else want.over++; }
  else if(r < 0.85){ if(canDep) want.dep++; else want.over++; }
  else want.over++;
 }
 var kinds = [];
 for(i = 0; i < want.arr; i++) kinds.push('a');
 for(i = 0; i < want.dep; i++) kinds.push('d');
 for(i = 0; i < want.over; i++) kinds.push('o');
 kinds = shuffled(R, kinds);
 var skipped = [];
 kinds.forEach(function(k){
  s = (k === 'a') ? genArrival(R, used, fl) : (k === 'd' ? genDeparture(R, used, fl) : genOverflight(R, used));
  if(s) out.push(s); else skipped.push(k === 'a' ? 'an arrival' : (k === 'd' ? 'a departure' : 'an overflight'));
 });
 /* stagger: the first two are already on the frequency, the rest check in over ten minutes */
 var t = 0;
 out.forEach(function(x, idx){
  if(idx < 2){ x.ckdIn = true; x.spawnAt = ''; }
  else { t += between(R, 30, 150); x.ckdIn = false; x.spawnAt = String(t); }
 });
 return {strips:out, skipped:skipped};
}

}
function numOf(v){ var n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.]/g, '')); return isFinite(n) ? n : null; }

/* The events the builder has typed, as the fly block's drill carries them. Whatever is blank is
   left off the event; the fly block's validate names any that cannot fire. Nothing here is data
   from a document - it is the trainee's own scenario text. */
function eventsOut(){
 var out = [], sp = ui.speci;
 if(sp.on){
  var e = {kind:'speci', at:numOf(sp.at)};
  if(sp.ceil.trim()) e.ceil = sp.ceil.trim();
  if(sp.vis.trim()) e.vis = sp.vis.trim();
  if(sp.wind.trim()) e.wind = sp.wind.trim();
  if(sp.cat) e.cat = sp.cat;
  if(sp.cfg){ e.cfg = sp.cfg; e.cfgName = cfgName(sp.cfg); }
  out.push(e);

  if(!(String(l.at).trim() || l.from.trim() || l.text.trim() || l.cs.trim())) return;
  var e = {kind:'landline', at:numOf(l.at), from:l.from.trim(), text:l.text.trim()};
  if(l.cs.trim()) e.cs = l.cs.trim().toUpperCase();
  out.push(e);
 });
 return out;
}
/* A landline call about a callsign the drill does not carry reads as a call about nothing. */
function eventNotes(d){
 var notes = [], have = {}, n = 0;
 (d.strips || []).forEach(function(s){ if(s.cs) have[String(s.cs).toUpperCase()] = 1; });
 (d.events || []).forEach(function(e){
  if(e.kind !== 'landline') return;
  n++;
  if(e.cs && !have[String(e.cs).toUpperCase()]) notes.push('Landline call ' + n + ' is about ' + e.cs + ', which is not a strip in this drill.');
 });

}
function collect(){

  brief:ui.brief, rate:ui.hot ? 'hot' : ui.rate, at:new Date().toISOString().slice(0, 16).replace('T', ' '),
  seed:ui.seed || null, frame:{text:frameText()}, strips:snapshot()};

function say(html, kind){ ui.msg = '<div class="' + PFX + '-msg ' + (kind || '') + '">' + html + '</div>'; paint(); }
function flyIt(drill){
