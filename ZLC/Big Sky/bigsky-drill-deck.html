<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Sky Drill Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D0C;
    --panel:#0F1614;
    --panel2:#121A17;
    --ink:#E7EDE9;
    --dim:#6F8079;
    --dim2:#455049;
    --line:#1E2925;
    --green:#4FE0A0;
    --amber:#E8A23D;
    --red:#E8604D;
    --display:'Space Grotesk',sans-serif;
    --body:'IBM Plex Sans',sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(79,224,160,0.05), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--body);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(79,224,160,0.25);}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px;}
  a{color:var(--green);}

  .wrap{max-width:940px;margin:0 auto;padding:0 20px 80px;}

  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--line);
    padding:16px 20px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--dim);
    position:sticky;top:0;
    background:rgba(10,13,12,0.9);
    backdrop-filter:blur(6px);
    z-index:20;
  }
  .topbar b{color:var(--ink);font-weight:600;}

  .hero{padding:26px 0 4px;}
  .hero .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:0.14em;
    text-transform:uppercase;color:var(--green);margin-bottom:10px;
  }
  .hero h1{
    font-family:var(--display);font-weight:600;
    font-size:clamp(20px,3vw,26px);
    margin:0 0 6px;letter-spacing:-0.01em;
  }
  .hero p{color:var(--dim);max-width:64ch;margin:0 0 8px;font-size:15px;}

  .modnav{
    display:flex;gap:8px;flex-wrap:wrap;margin:32px 0;
    padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  .modnav:empty{display:none;}

  footer{
    margin-top:70px;padding-top:20px;border-top:1px solid var(--line);
    font-size:12px;color:var(--dim2);
  }
  footer a{color:var(--dim);}

  @media(max-width:640px){
    .hero h1{font-size:26px;}
    .wrap{padding:0 14px 60px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div><b>BIG SKY</b> APPROACH</div>
  <div>DRILL DECK</div>
</div>

<div class="wrap">

  <div class="hero">
    <div class="eyebrow">Big Sky &mdash; skeleton</div>
    <h1>Pick the area and the flow, open the sectors, see who owns what.</h1>
    <p>Two areas that never touch: Boise in southwest Idaho, Bozeman in southwest Montana. The selector and the vertical structure are built; the engine that flies traffic through them is not.</p>
  </div>
  <div class="modnav" id="modnav"></div>

  <footer id="foot"></footer>

</div>

<script>

+ '.zlc-cred a{color:var(--dim);}'

+ '.zlc-div .h{font-family:var(--mono);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--amber);}'
+ '.zlc-div .b{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.5;}'
+ '.zlc-div .b b{color:var(--ink);font-weight:500;}';

var st=document.createElement('style');
st.textContent=css;
document.head.appendChild(st);

/* ---------- 2. Data ----------
   Positions and frequencies: verified 2026-09-01 from the narrative
   paragraphs of BOI 7110.2B and BZN FCT, confirmed a fourth time
   2026-09-02 against the VATGlasses ZLC dataset. See
   ../_shared/claude_ZLC_Positions_Reference.md.

   Geometry (extents, altitude blocks, runway gates, community
   ownership chains): decoded from the VATGlasses ZLC dataset vendored
   at ../_shared/source-vatglasses/, pinned commit c469b42 (2026-08-26),
   pulled 2026-09-02. Decoded per sector in
   ../_shared/claude_ZLC_Sector_Geometry_Reference.md.
   Licence CC BY-NC-SA 4.0 — the credit below is required, not optional. */

var RADIO = 'Big Sky Approach';   /* BOI 7110.2B 3-1-1 */

var CREDIT = {
 project:'VATGlasses',
 url:'https://vatglasses.uk',
 repo:'github.com/lennycolton/vatglasses-data',
 dataset:'ZLC dataset, maintained by ZLC vARTCC',
 commit:'c469b42 (2026-08-26)',
 licence:'CC BY-NC-SA 4.0'
};

/* The runway gate on each airspace block is the configuration selector.
   Four gates exist across the whole ZLC dataset; Big Sky uses two. */
var FLOWS = {
 BOI:[
  {id:'E', label:'East Flow',  gate:'KBOI 10L/R'},
  {id:'W', label:'West Flow',  gate:'KBOI 28L/R'}
 ],
 BZN:[]   /* Bozeman's blocks carry no runway gate — they exist in every configuration */
};

var AREAS = [
 {
  id:'BOI',
  name:'BOI Area',
  where:'Boise, southwest Idaho',
  blurb:'Two radar sectors that combine with each other. Sage is the base: it assumes Alpine when they are combined.',
  root:'SAG',
  upper:'SLC_30_CTR',
  upperName:'Salt Lake Center sector 30',
  range:'11 NM outside delegated airspace (3-2-3a, 3-3-2a)',
  doc:'BOI ATCT/TRACON 7110.2B',
  extent:'42.972–44.216 N, 115.297–117.130 W'
 },
 {
  id:'BZN',
  name:'BZN Area',
  where:'Bozeman, southwest Montana',
  blurb:'One radar sector with no sibling. It has nothing to combine with inside Big Sky &mdash; it folds straight to Center.',
  root:'APB',
  upper:'SLC_08_CTR',
  upperName:'Salt Lake Center sector 8',
  range:'10 NM outside delegated airspace (3-4-2a)',
  doc:'BOI ATCT/TRACON 7110.2B ch.3 s.4, with BZN FCT',
  extent:'45.117–46.269 N, 110.000–112.104 W'
 }
];

/* `into` is the DOCUMENTARY combining chain — SOP 3-3-1c and the AFV
   inheritance tree. It always stays inside its own area, because the two
   areas share no airspace boundary. `vg` is the community chain from
   VATGlasses ownership/default.json, shown beside it and never used to
   resolve: a facility order outranks community data (root CLAUDE.md §6). */
var SECTORS = [
 {id:'SAG', area:'BOI', name:'Sage Radar', abbr:'SAG', stars:'G', cs:'BOI_G_APP', frq:'119.600',
  into:null, vgKey:'B1S', vg:['B1S','B1A','31','30','41','40','43','44'],
  airspace:'Appendix 1B (East Flow) / 1C (West Flow)',
  extent:'42.972–44.216 N, 115.297–117.130 W',
  blocks:{
   E:[{f:70,c:164,v:30},{f:null,c:69,v:45}],
   W:[{f:70,c:164,v:17},{f:null,c:69,v:26}]
  },
  duty:'Sequences BOI IFR arrivals to Alpine per Table 3-2-1 (East) or 3-2-2 (West). Aircraft handed to Alpine are released for turns and descent, except arrivals in the southernmost downwind during East Flow.',
  src:'BOI 7110.2B 3-3-1'},

 {id:'ALP', area:'BOI', name:'Alpine Radar', abbr:'ALP', stars:'A', cs:'BOI_A_APP', frq:'126.900',
  into:'SAG', vgKey:'B1A', vg:['B1A','B1S','30','31','41','40','43','44'],
  airspace:'Appendix 1B (East Flow) / 1C (West Flow)',
  extent:'42.972–44.216 N, 115.297–117.130 W',
  blocks:{
   E:[{f:70,c:164,v:17},{f:null,c:69,v:26}],
   W:[{f:70,c:164,v:30},{f:null,c:69,v:45}]
  },
  duty:'Sequences all arrivals to BOI except VFR handed to Local. Separates arrivals to the Local Control lateral boundary; to the threshold when wake turbulence minima apply. Transfers communications before the Local boundary and no further than 10 NM from the field.',
  src:'BOI 7110.2B 3-2-1'},

 {id:'APB', area:'BZN', name:'Bozeman Radar', abbr:'APB', stars:null, cs:'BZN_APP', frq:'118.975',
  into:null, vgKey:'B1Z', vg:['B1Z','06','14','04','44'],
  airspace:'Appendix 1D',
  extent:'45.117–46.269 N, 110.000–112.104 W',
  blocks:{
   any:[{f:75,c:164,v:32},{f:null,c:74,v:55}]
  },
  duty:'Coordinates with Bozeman FCT for the approach in use on the ATIS, and for any aircraft cleared for an approach other than the one advertised. Provides separation for VFR aircraft on practice instrument approaches.',
  src:'BOI 7110.2B 3-4-1'}
];

var TOPDOWN = {
 BOI:[
  {cs:'BOI_TWR', nm:'Boise Tower',       frq:'118.100', src:'BOI 7110.2B 2-3-1a', shape:null},
  {cs:'BOI_GND', nm:'Boise Ground',      frq:'121.700', src:'BOI 7110.2B 2-2-1a', shape:null},
  {cs:'BOI_DEL', nm:'Boise Clearance',   frq:'125.900', src:'BOI 7110.2B 2-1-1a', shape:null}
 ],
 BZN:[
  {cs:'BZN_TWR', nm:'Bozeman Tower',     frq:'118.200', src:'BZN FCT, Local 1',
   shape:'surface– 7,400 (VATGlasses B1L, 22 vertices)'},
  {cs:'BZN_GND', nm:'Bozeman Ground',    frq:'121.800', src:'BZN FCT, Ground 1', shape:null},
  {cs:'BZN_DEL', nm:'Bozeman Clearance', frq:'124.050', src:'BZN FCT, Clearance 1', shape:null}
 ]
};

var PRESETS = {
 BOI:[
  {id:'combined', label:'Sage combined — one controller', open:{SAG:1}},
  {id:'split',    label:'Sage and Alpine split',          open:{SAG:1, ALP:1}}
 ],
 BZN:[
  {id:'open',     label:'Bozeman open',                   open:{APB:1}}
 ]
};

/* Divergences between the documents and the community dataset.
   Named, not resolved — root CLAUDE.md §6. */
var DIVERGE = {
 BOI:[
  {h:'Which of Sage and Alpine covers the other',
   b:'The SOP is directional: <b>3-3-1c says Sage assumes Alpine’s responsibilities when combined</b>, and the AFV tree agrees. VATGlasses lists the two as <b>mutually covering</b> — <span class="zlc-mono">B1A → B1S</span> and <span class="zlc-mono">B1S → B1A</span> — so either can hold the other. The tool resolves on the SOP. The community listing is not wrong, it is just less specific about which direction is normal.'}
 ],
 BZN:[
  {h:'Where Bozeman folds when it closes',
   b:'The AFV tree in the ZLC frequency sheet gives <span class="zlc-mono">BZN_APP → SLC_08_CTR → SLC_06_CTR</span>. VATGlasses gives <span class="zlc-mono">B1Z → 06 → 14 → 04 → 44</span> — <b>straight to 06, never through 08</b>, although sector 08 exists in its position list. Both agree Bozeman folds into Center Area A and never into Boise. The tool shows the documentary chain; the disagreement is an owner question.'}
 ]
};

/* ---------- 3. State ---------- */
var state = {
 area:'BOI',
 flow:{BOI:'E', BZN:null},
 open:{SAG:1},
 seat:'SAG'
};

/* ---------- 3a. Persistence (issue #45) ----------
   One key, <file basename>-v1, with no status word in it: the key outlives the status, and renaming
   it later orphans what a trainee wrote. The deck keeps its frame under "deck" and the weather
   reader keeps its pasted text under "wx"; EACH WRITE READS THE WHOLE OBJECT FIRST AND CHANGES ONLY
   ITS OWN PART, so neither can erase the other (S56 overwrites, which is issue #70). Saved drills
   live under a second key, bigsky-drill-deck-fly-v1. Where storage is unavailable the deck still
   works in memory and says so on the page. */
var KEY = 'bigsky-drill-deck-v1';
var storageOK = true;
function persistRead(){
 try{
  var raw = window.localStorage.getItem(KEY);
  if(!raw) return {};
  var o = JSON.parse(raw);
  return (o && typeof o === 'object' && !(o instanceof Array)) ? o : {};
 }catch(e){ storageOK = false; return {}; }
}
function persistLoad(){
 var d = persistRead().deck;
 if(!d || typeof d !== 'object') return;
 var area = null, i;
 for(i = 0; i < AREAS.length; i++){ if(AREAS[i].id === d.area) area = AREAS[i].id; }
 if(!area) return;
 var open = {}, any = false;
 if(d.open && typeof d.open === 'object'){
  for(var k in d.open){
   if(d.open.hasOwnProperty(k) && secById(k) && secById(k).area === area){ open[k] = 1; any = true; }
  }
 }
 if(!any) return;
 state.area = area; state.open = open;
 state.seat = (typeof d.seat === 'string' && open[d.seat]) ? d.seat : Object.keys(open)[0];
 for(var a in state.flow){
  if(!state.flow.hasOwnProperty(a)) continue;
  var want = d.flow && d.flow[a], ok = false, fa = FLOWS[a] || [];
  for(i = 0; i < fa.length; i++){ if(fa[i].id === want) ok = true; }
  if(ok) state.flow[a] = want;
 }
}
function persistSave(){
 try{
  var o = persistRead();
  o.deck = {area:state.area, flow:state.flow, open:state.open, seat:state.seat};
  window.localStorage.setItem(KEY, JSON.stringify(o));
 }catch(e){ storageOK = false; }
}
function storeNoteHtml(){
 return storageOK ? '' : '<div class="zlc-note">This browser will not keep what you set, so the frame lives only until the page is closed.</div>';
}

/* ---------- 4. Resolution ---------- */
function secById(id){
 for(var i=0;i<SECTORS.length;i++){ if(SECTORS[i].id===id) return SECTORS[i]; }
 return null;
}
function sectorsIn(area){
 return SECTORS.filter(function(s){ return s.area===area; });
}
function areaById(id){
 for(var i=0;i<AREAS.length;i++){ if(AREAS[i].id===id) return AREAS[i]; }
 return null;
}
function isOpen(id){ return !!state.open[id]; }

function ownerOf(id){
 var s=secById(id), seen={};
 while(s && !seen[s.id]){
  if(isOpen(s.id)) return s;
  seen[s.id]=1;
  s = s.into ? secById(s.into) : null;
 }
 return null;
}
function answerFor(id){
 var own=ownerOf(id);
 if(own) return {kind:'sector', sec:own};
 var a=areaById(secById(id).area);
 return {kind:'center', cs:a.upper, name:a.upperName};
}
function openCount(area){
 return sectorsIn(area).filter(function(s){ return isOpen(s.id); }).length;
}
function flowsFor(area){ return FLOWS[area]||[]; }
function curFlow(){ return state.flow[state.area]; }
function flowObj(){
 var f=curFlow(); if(!f) return null;
 return flowsFor(state.area).filter(function(x){ return x.id===f; })[0]||null;
}
/* blocks for a sector under the currently selected flow */
function blocksFor(s){
 if(s.blocks.any) return s.blocks.any;
 var f=curFlow();
 return (f && s.blocks[f]) ? s.blocks[f] : [];
}

/* ---------- 5. Helpers ---------- */
function esc(s){
 return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* upstream stores hundreds of feet, inclusive. FL69 is 6,900. */
function ft(n){
 if(n===null||n===undefined) return null;
 var v=n*100, s=String(v), out='', c=0, i;
 for(i=s.length-1;i>=0;i--){ out=s.charAt(i)+out; if(++c%3===0 && i>0) out=','+out; }
 return out;
}
function floorTxt(b){ return b.f===null ? 'surface' : ft(b.f); }
function ceilTxt(b){ return b.c===null ? 'unlimited' : ft(b.c); }
function bandTxt(b){ return floorTxt(b)+' – '+ceilTxt(b); }
/* lowest floor and highest ceiling across the blocks that exist now */
function envelope(s){
 var bs=blocksFor(s);
 if(!bs.length) return null;
 var lo=null, hi=null, i;
 for(i=0;i<bs.length;i++){
  var f=(bs[i].f===null?0:bs[i].f), c=bs[i].c;
  if(lo===null || f<lo) lo=f;
  if(hi===null || (c!==null && c>hi)) hi=c;
 }
 return {lo:lo, hi:hi};
}

/* ---------- 6. Render: chrome ---------- */
function areasHtml(){
 return AREAS.map(function(a){
  var n=sectorsIn(a.id).length;
  return '<button class="zlc-area'+(state.area===a.id?' on':'')+'" onclick="zlcArea(\''+a.id+'\')">'
   +'<span class="nm">'+esc(a.name)+'</span>'
   +'<span class="loc">'+esc(a.where)+' &middot; '+n+' sector'+(n===1?'':'s')+'</span>'
   +'<span class="d">'+a.blurb+'</span>'
   +'</button>';
 }).join('');
}

function flowHtml(){
 var fs=flowsFor(state.area);
 if(!fs.length){
  return '<div class="zlc-bar"><span class="sub" style="margin-left:0">Bozeman’s airspace carries no runway gate — the same blocks exist in every configuration.</span></div>';
 }
 var h=fs.map(function(f){
  return '<button class="'+(curFlow()===f.id?'on':'')+'" onclick="zlcFlow(\''+f.id+'\')">'+esc(f.label)+'</button>';
 }).join('');
 var fo=flowObj();
 return '<div class="zlc-bar">'+h+'<span class="sub">gate '+esc(fo?fo.gate:'')+'</span></div>';
}

function sectorsHtml(){
 return sectorsIn(state.area).map(function(s){
  var open=isOpen(s.id), seat=(state.seat===s.id);
  var cls='zlc-sec'+(open?' open':'')+(seat?' seat':'');
  var status;
  if(seat)      status='<b>Your seat.</b> Staffed.';
  else if(open) status='Staffed by someone else.';
  else {
   var ans=answerFor(s.id);
   status = ans.kind==='sector'
     ? 'Closed &mdash; folds into <b>'+esc(ans.sec.name)+'</b> on '+esc(ans.sec.frq)+'.'
     : 'Closed &mdash; folds up to <b>'+esc(ans.name)+'</b>.';
  }
  var env=envelope(s), bs=blocksFor(s);
  var vert = env
   ? '<div class="vert"><b>'+esc(ft(env.lo)===null?'surface':(env.lo===0?'surface':ft(env.lo)))+' – '+esc(env.hi===null?'unlimited':ft(env.hi))+'</b> &middot; '+bs.length+' block'+(bs.length===1?'':'s')+'</div>'
   : '<div class="vert none">no airspace block in this flow</div>';
  return '<div class="'+cls+'">'
   +'<div class="hd" onclick="zlcToggle(\''+s.id+'\')"><span class="nm">'+esc(s.name)+'</span><span class="id">'+esc(s.abbr)+(s.stars?' &middot; '+esc(s.stars):'')+'</span></div>'
   +'<div class="frq" onclick="zlcToggle(\''+s.id+'\')">'+esc(s.frq)+' <span class="cs">'+esc(s.cs)+'</span></div>'
   +vert
   +'<div class="st">'+status+'</div>'
   +'<div class="acts"><button onclick="zlcSeat(\''+s.id+'\')">Take seat</button></div>'
   +'</div>';
 }).join('');
}

function presetsHtml(){
 return (PRESETS[state.area]||[]).map(function(p){
  var on=sectorsIn(state.area).every(function(s){ return !!p.open[s.id] === isOpen(s.id); });
  return '<button class="'+(on?'on':'')+'" onclick="zlcPreset(\''+p.id+'\')">'+esc(p.label)+'</button>';
 }).join('');
}

function ownershipHtml(){
 var rows=sectorsIn(state.area).map(function(s){
  var ans=answerFor(s.id);
  var who = ans.kind==='sector'
    ? esc(ans.sec.name)+(ans.sec.id===s.id?'':' <span class="zlc-mono" style="color:var(--dim2)">(combined)</span>')
    : esc(ans.name);
  var frq = ans.kind==='sector' ? ans.sec.frq : '&mdash;';
  return '<tr><td>'+esc(s.name)+'</td><td class="d">'+esc(s.airspace)+'</td><td>'+who+'</td><td class="m">'+frq+'</td>'
    +'<td class="n" style="color:var(--dim2)">'+esc(s.vg.join(' → '))+'</td></tr>';
 }).join('');
 return '<table class="zlc-tbl"><thead><tr><th>Airspace</th><th>Chart</th><th>Answered by</th><th>Frequency</th><th>VATGlasses chain</th></tr></thead><tbody>'+rows+'</tbody></table>'
  +'<div class="zlc-note">The last column is the community dataset’s ranked ownership list, shown for comparison only. <b>The tool resolves on the documentary chain</b> — the SOP and the AFV inheritance tree — because a facility order outranks community data.</div>';
}

function stackHtml(s){
 var bs=blocksFor(s);
 if(!bs.length){
  return '<div class="zlc-note"><b>The dataset carries no airspace block for this sector in this flow.</b> That is what the data says, not a claim that the sector closes — see the gaps section.</div>';
 }
 /* sort by floor so the stack reads bottom-up */
 var sorted=bs.slice().sort(function(a,b){ return (a.f===null?0:a.f)-(b.f===null?0:b.f); });
 return '<div class="zlc-stack">'+sorted.map(function(b){
  return '<div class="zlc-blk"><span class="alt">'+esc(bandTxt(b))+'</span><span class="vtx">'+b.v+' vertices</span></div>';
 }).join('')+'</div>';
}

function seatHtml(){
 var s=secById(state.seat);
 if(!s || s.area!==state.area) return '<p class="zlc-sub">No seat taken in this area.</p>';
 var fo=flowObj();
 var folded=sectorsIn(state.area).filter(function(x){
  if(x.id===s.id) return false;
  var o=ownerOf(x.id); return o && o.id===s.id;
 });
 var h='<p class="zlc-sub">You are <b style="color:var(--ink)">'+esc(s.name)+'</b>, working as <b style="color:var(--ink)">'+esc(RADIO)+'</b> on <span class="zlc-mono" style="color:var(--green)">'+esc(s.frq)+'</span> &mdash; login <span class="zlc-mono">'+esc(s.cs)+'</span>'
   +(fo?', in <b style="color:var(--ink)">'+esc(fo.label)+'</b>':'')+'.</p>';
 h+='<p class="zlc-sub">'+esc(s.duty)+' <span style="color:var(--dim2)">('+esc(s.src)+')</span></p>';
 if(folded.length){
  h+='<p class="zlc-sub">Also yours right now, because nobody is in '+(folded.length===1?'it':'them')+': <b style="color:var(--amber)">'
    +folded.map(function(x){return esc(x.name);}).join(', ')+'</b>.</p>';
 } else {
  h+='<p class="zlc-sub">Nothing else in the area folds into you.</p>';
 }

 return h;
}
/* the seat's reference half: what the flow gives it vertically, and who is above and around it. It is
   reference, not setup, so it sits on the third page. */
function seatRefHtml(){
 var s=secById(state.seat);
 if(!s || s.area!==state.area) return '';
 var a=areaById(state.area), fo=flowObj();
 var td=TOPDOWN[state.area]||[];
 var h='<h3 style="margin-top:4px">Vertical structure'+(fo?' &mdash; '+esc(fo.label):'')+'</h3>';
 h+='<p class="zlc-sub" style="font-size:13px">One lateral shape sliced into blocks. Floors and ceilings are inclusive. Lateral extent '+esc(s.extent)+'.</p>';
 h+=stackHtml(s);

 h+='<h3 style="margin-top:16px">Top-down from this seat</h3>';
 h+='<table class="zlc-tbl"><thead><tr><th>Position</th><th>Login</th><th>Frequency</th><th>Source</th></tr></thead><tbody>'
   +td.map(function(t){
     return '<tr><td>'+esc(t.nm)+(t.shape?'<br><span class="zlc-mono" style="font-size:10.5px;color:var(--dim2)">'+esc(t.shape)+'</span>':'')
       +'</td><td class="d zlc-mono">'+esc(t.cs)+'</td><td class="m">'+esc(t.frq)+'</td><td class="d">'+esc(t.src)+'</td></tr>';
   }).join('')
   +'</tbody></table>';
 h+='<div class="zlc-note">Radar range for this area: '+esc(a.range)+'. Source: '+esc(a.doc)+'.</div>';
 return h;
}

function divergeHtml(){
 var list=DIVERGE[state.area]||[];
 if(!list.length) return '';
 return list.map(function(d){
  return '<div class="zlc-div"><div class="h">Named, not resolved</div><div class="b"><b>'+esc(d.h)+'.</b> '+d.b+'</div></div>';
 }).join('');
}

function boundaryNote(){
 var other=AREAS.filter(function(a){ return a.id!==state.area; })[0];
 var me=areaById(state.area);
 return '<div class="zlc-note"><b>These two areas do not share an airspace boundary.</b> '
  +esc(me.where.split(',')[0])+' and '+esc(other.where.split(',')[0])
  +' are separated by most of a state, and nothing in '+esc(state.area)+' ever combines with, hands off to, or folds into '
  +esc(other.id)+'. When the last sector in an area closes, its airspace goes up to Center &mdash; '
  +esc(me.upperName)+' for '+esc(state.area)+' &mdash; never sideways to the other area. '
  +'The geometry confirms it: this area spans '+esc(me.extent)+' and the other spans '+esc(other.extent)+', more than fifty miles apart with no shared edge. '
  +'The one thing they share is the radio name: both answer as <span class="zlc-mono" style="color:var(--ink)">'+esc(RADIO)+'</span>.</div>';
}

function creditHtml(){
 return '<div class="zlc-cred"><b>Sector geometry credit.</b> The lateral extents, altitude blocks, runway gates and community ownership chains on this page are derived from the '
  +'<b>'+esc(CREDIT.project)+'</b> '+esc(CREDIT.dataset)+' (<span class="zlc-mono">'+esc(CREDIT.repo)+'</span>, commit '+esc(CREDIT.commit)+'), '
  +'licensed <b>'+esc(CREDIT.licence)+'</b>. Attribution and share-alike are conditions of that licence. '
  +'The data is not a facility document: where a ZLC order disagrees with it, the order wins.</div>';
}

/* ---------- 7. Sections ---------- */
function posHtml(){
 return '<section class="zlc-section" id="mod-area">'
  +'<div class="zlc-tag">Step one</div>'
  +'<h2>Area and flow</h2>'
  +'<p class="zlc-sub">Big Sky is one facility and one radio name covering two separate pieces of the map. Pick the one you are working, then the runway configuration &mdash; the flow decides which airspace blocks exist.</p>'
  +'<div class="zlc-areas" id="zlc-areas"></div>'
  +'<div id="zlc-flow"></div>'
  +'<div id="zlc-boundary"></div>'
  +'</section>'

  +'<section class="zlc-section" id="mod-pos">'
  +'<div class="zlc-tag">Position</div>'
  +'<h2>Position Setup</h2>'
  +'<p class="zlc-sub">The seat is your pick &mdash; say what you are working and what is open around you, and the rest of the tool follows.</p>'

  +'<div class="zlc-panel"><div class="zlc-psub">Quick setups</div>'
  +'<div class="zlc-bar" id="zlc-presets"></div>'
  +'<div class="zlc-note">A quick setup opens a set of sectors in the area you picked above; anything you leave closed folds into whoever is still open along that area&rsquo;s chain. Sage is the Boise base, and Bozeman has nothing to combine with inside Big Sky.</div></div>'

  +'<div class="zlc-panel"><div class="zlc-psub a">Which seat are you working</div>'
  +'<div id="zlc-seat"></div></div>'

  +'<div class="zlc-panel"><div class="zlc-psub">Open around you</div>'
  +'<div class="zlc-secs" id="zlc-secs"></div>'
  +'<div class="zlc-note">Click a sector name or frequency to open or close it, or take its seat. Each card shows the vertical envelope that sector holds in the selected flow. Towers open or closed is not modelled: the Big Sky orders carry no towers-open frame element for this tool to read.</div></div>'

  +'<div class="zlc-panel"><div class="zlc-psub">What that resolves to</div>'
  +'<div id="zlc-own"></div>'
  +'<div class="zlc-note">Whoever answers a sector is who has to take its traffic, on their frequency; the Fly it page&rsquo;s position list follows this table. When the last sector in an area closes its airspace goes up to Center, never sideways to the other area.</div></div>'
  +'<div id="zlc-div"></div>'
  +'</section>'

  +'<section class="zlc-section" id="mod-seat">'
  +'<div class="zlc-tag">Reference</div>'
  +'<h2>Your seat</h2>'
  +'<p class="zlc-sub">What the flow gives the seat you are working vertically, and who is above and around it.</p>'
  +'<div class="zlc-panel" id="zlc-seatref"></div>'
  +'<div id="zlc-credit"></div>'
  +'</section>';
}

function stubHtml(){
 return '<section class="zlc-section" id="mod-stubs">'
  +'<div class="zlc-tag warn">State of the data</div>'
  +'<h2>What is filled, and what is not</h2>'
  +'<p class="zlc-sub">Named so the gaps are visible rather than discovered later. Two of these moved on 2026-09-02 when the sector geometry arrived; one got worse.</p>'

  +'<div class="zlc-split">'

  +'<div class="zlc-stub part"><span class="lbl">Slot 1 &middot; partly filled</span><h3>Sector boundaries</h3>'
  +'<p>Carried since 2026-09-02. All three Big Sky sectors have a lateral extent, runway-gated altitude blocks and an ownership chain, from the VATGlasses ZLC dataset &mdash; trusted because ZLC vARTCC owns and maintains it. <b>Still missing: the Ellis Corridor, the pre-arranged coordination areas and the arrival zones.</b> VATGlasses draws sectors, not gates, and Appendices 1B, 1C, 1D, 2 and 3 remain chart images with no text layer.</p></div>'

  +'<div class="zlc-stub part"><span class="lbl">Slot 2 &middot; filled</span><h3>Flow</h3>'
  +'<p>Also arrived with the geometry. Every block is gated on a runway configuration, and Big Sky uses two &mdash; <code>KBOI 10L/R</code> East and <code>KBOI 28L/R</code> West. Alpine and Sage hold the same two bands over the same total airspace and <b>swap shapes</b> between the flows: 17 and 26 vertices one way, 30 and 45 the other. The selector above now models this. Bozeman is not gated at all.</p></div>'

  +'<div class="zlc-stub block"><span class="lbl">Slot 3 &middot; live blocker</span><h3>Handoff identifiers</h3>'
  +'<p>Big Sky has <b>does not carry the handoff IDs yet</b>, and the geometry did not help: the community dataset carries none, and its keys (<code>B1S</code>, <code>B1A</code>, <code>B1Z</code>) are display handles, not STARS IDs. STARS-side identifiers come from vNAS, always &mdash; and the ZLC vNAS record is now held (<code>ZLC/_vnas/ZLC_vnas.json</code>, pulled 2026-10-22) and carries them, but this tool does not yet.</p></div>'

  +'<div class="zlc-stub"><span class="lbl">Slot 4 &middot; empty</span><h3>Routes, fixes and MVAs</h3>'
  +'<p>The sequencing tables name KOURT, SPUUD, SADYL, JIMMI, KYANN, BEWTE and TOILS with descend-to altitudes, and BZN names the BGSKY, BOBKT, MEADO and HIA departures. None are located. No MVA data is present in any community source either.</p></div>'

  +'<div class="zlc-stub part"><span class="lbl">Slot 5 &middot; partly filled</span><h3>Traffic engine and grading</h3>'
  +'<p>A published-track player since 2026-10-27 (issue #76): aircraft fly the CIFP SIDs and STARs straight between fixes on a real clock, and overflights on a radial and distance. It adds no boundary, no sector owner, no handoff grading and no wind, and it <b>grades nothing</b>: there are no standing training items. In the M98 deck they came out of real session notes, not invented to fill the slot.</p></div>'

  +'</div>'

  +'<div class="zlc-note"><b>Two things in the source documents are still unresolved.</b> '
  +'The SOP tables end with &ldquo;Bold designates a primary position&rdquo;, but bold is lost in text extraction, so which sectors are primary is not known. '
  +'And the ZLC frequency sheet’s worked example for Boise refers to <span class="zlc-mono">BOI_S_APP</span> and <span class="zlc-mono">BOI_N_APP</span>, callsigns that appear in no current position table &mdash; that example appears to predate the rename to Sage and Alpine. '
  +'Both are left empty here rather than guessed.</div>'
  +'</section>';
}

function footHtml(){
 return 'Skeleton tool. Sector names, identifiers, callsigns and frequencies are verified against BOI ATCT/TRACON 7110.2B, BZN FCT and the ZLC Position and Frequency Info sheet, and confirmed independently by the VATGlasses ZLC dataset '
  +'&mdash; see BOI/claude_BOI_Reference.md, BZN/claude_BZN_Reference.md, _shared/claude_ZLC_Positions_Reference.md and _shared/claude_ZLC_Sector_Geometry_Reference.md. '
  +'Sector geometry &copy; '+esc(CREDIT.project)+' contributors (' + esc(CREDIT.dataset) + '), licensed '+esc(CREDIT.licence)+' &mdash; <a href="'+esc(CREDIT.url)+'">'+esc(CREDIT.url)+'</a>. '
  +'Everything marked empty is an empty slot, not an omission. Single file, no build step, no network.';
}

/* ---------- 8. Render ---------- */
function render(){
 var el;
 el=document.getElementById('zlc-areas');    if(el) el.innerHTML=areasHtml();
 el=document.getElementById('zlc-flow');     if(el) el.innerHTML=flowHtml();
 el=document.getElementById('zlc-boundary'); if(el) el.innerHTML=boundaryNote();
 el=document.getElementById('zlc-presets');  if(el) el.innerHTML=presetsHtml();
 el=document.getElementById('zlc-secs');     if(el) el.innerHTML=sectorsHtml();
 el=document.getElementById('zlc-own');      if(el) el.innerHTML=ownershipHtml();
 el=document.getElementById('zlc-div');      if(el) el.innerHTML=divergeHtml();
 el=document.getElementById('zlc-seat');     if(el) el.innerHTML=seatHtml();
 el=document.getElementById('zlc-seatref');  if(el) el.innerHTML=seatRefHtml();
 el=document.getElementById('zlc-credit');   if(el) el.innerHTML=creditHtml();
 persistSave();
 el=document.getElementById('zlc-storenote'); if(el) el.innerHTML=storeNoteHtml();
 for(var i=0;i<ZLC.hooks.length;i++){ try{ ZLC.hooks[i](); }catch(e){} }
}

/* ---------- 9. Actions ---------- */
window.zlcArea=function(id){
 if(state.area===id) return;
 state.area=id;
 var p=(PRESETS[id]||[])[0];
 state.open = p ? JSON.parse(JSON.stringify(p.open)) : {};
 var first=sectorsIn(id).filter(function(s){ return isOpen(s.id); })[0] || sectorsIn(id)[0];
 state.seat = first ? first.id : null;
 render();
};
window.zlcFlow=function(f){
 if(!flowsFor(state.area).length) return;
 state.flow[state.area]=f;
 render();
};
window.zlcToggle=function(id){
 var s=secById(id);
 if(!s) return;
 if(isOpen(id)){
  var a=areaById(s.area);
  if(a.root===id && openCount(s.area)<=1){ return; }
  delete state.open[id];
  if(state.seat===id){
   var own=ownerOf(id);
   state.seat = own ? own.id : null;
  }
 } else {
  state.open[id]=1;
 }
 render();
};
window.zlcSeat=function(id){
 if(!isOpen(id)) state.open[id]=1;
 state.seat=id;
 render();
};
window.zlcPreset=function(pid){
 var p=(PRESETS[state.area]||[]).filter(function(x){ return x.id===pid; })[0];
 if(!p) return;
 state.open=JSON.parse(JSON.stringify(p.open));
 if(!isOpen(state.seat)){
  var first=sectorsIn(state.area).filter(function(s){ return isOpen(s.id); })[0];
  state.seat=first?first.id:null;
 }
 render();
};

/* ---------- 10. Mount ---------- */
function mountAll(){
 var wrap=document.querySelector('.wrap')||document.body;
 if(!wrap) return;
 var mount=document.createElement('div');
 mount.innerHTML=posHtml()+stubHtml()+'<div id="zlc-storenote"></div>';
 var foot=wrap.querySelector('footer');
 if(foot){ wrap.insertBefore(mount, foot); foot.innerHTML=footHtml(); } else { wrap.appendChild(mount); }
 var nav=document.getElementById('modnav');
 if(nav){ nav.innerHTML += '<a href="#mod-area">AREA</a><a href="#mod-pos">SECTORS</a><a href="#mod-seat">SEAT</a><a href="#mod-stubs">DATA</a>'; }
 persistLoad();
 render();
}

/* ---------- 11. Extension bridge ---------- */
window.ZLC = {
 version:0.2, skeleton:true, facility:'BIGSKY', hooks:[],
 RADIO:RADIO, CREDIT:CREDIT, AREAS:AREAS, FLOWS:FLOWS, SECTORS:SECTORS,
 TOPDOWN:TOPDOWN, PRESETS:PRESETS, DIVERGE:DIVERGE,
 state:state,
 secById:secById, areaById:areaById, sectorsIn:sectorsIn,
 isOpen:isOpen, ownerOf:ownerOf, answerFor:answerFor, openCount:openCount,
 flowsFor:flowsFor, curFlow:curFlow, flowObj:flowObj, blocksFor:blocksFor,
 envelope:envelope, ft:ft, bandTxt:bandTxt,
 render:render, esc:esc,
 /* Empty until a session is flown, and the smoke test asserts it (root CLAUDE.md invariant 4). */
 STANDING:[]
};

if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', mountAll); }
else { mountAll(); }
})();
</script>

<script>
/* ================================================================
   Big Sky — D-ATIS AND WEATHER READER. Additive extension block.
   Requires the Big Sky deck (window.ZLC) earlier in the page and
   returns early without it, per the block contract.

   WHICH FIELDS PUBLISH ONE WAS CHECKED, NOT ASSUMED. Six of the
   twenty-three fields this repo works have a D-ATIS: KMSP, KOMA, KORD,
   KMDW, KSLC, KBOI. Pulled 2026-09-04 from atis.info per field and from
   datis.clowd.io/api/all as a list; both agreed on every field, present
   and absent. The manifest, the pull recipe and the verbatim broadcasts
   are in claude_DATIS_Field_Survey.md at the repository root.

   "No D-ATIS" means no digital text feed, not no ATIS. Those fields have
   a voice ATIS; it simply is not published as text, so there is nothing
   to fetch and nothing to paste. A field without one gets the weather
   half of this reader and says so.

   THE READER IS GRAMMAR-DRIVEN, NOT MSP-SHAPED. Every field writes its
   flow line differently, and two of them carry no notice heading at all:

     KMSP  VISUAL RWY 30L APCH IN USE, VISUAL RWY 30R APCH IN USE.
           DEPARTING RWY 30L, RWY 30R.
     KOMA  VISUAL APCH 14R, 14L, 18 IN USE.        no runway keyword
     KORD  ARR EXP VECTORS ILS RWY 27C APCH, ...   no "in use" at all
           DEPS EXP RWYS 22L 28R                   space separated
     KMDW  RNAV Y RWY 22L APCH IN USE. LNDG AND DEPG RWYS 22.
     KSLC  ... ILS RY 16L RNAV Y RY 17 RNAV Z RY 16R OR VISUAL APCHS IN USE.
     KBOI  RNAV RWY 28L APCHS IN USE. LNDG AND DEPG RWY 28L.

   The sentence is the unit and it is classified before it is read. KORD
   and KSLC run their closures straight on from the flow line with no
   heading between, so cutting at the heading cannot be the only guard —
   a sentence naming a runway as shut or out of service is disqualified
   outright. That is what keeps ORD's thirteen out-of-service runways and
   its closed 4L/22R pair out of the landing set.

   Offline first: the paste box is the path that always works and needs
   no network at all. One fetch button sits on top of it and asks the
   source that fits the field — the D-ATIS feed where the field publishes
   one, the observation otherwise. That is ONE network call with a source
   that follows the field, not a second network dependency: it is never on
   a path the tool needs, every failure hands straight to the paste box,
   and the parser it feeds is the same one paste uses.

  return {text:'<span class="bskw-dim">' + esc(state.field)
   + ' has no runway-gated blocks — its sectors exist in every configuration, so there is no '
   + 'flow for a broadcast to set.</span>'};
 }
 if(!all.length) return {text:'<span class="bskw-dim">nothing advertised to match</span>'};

 FLOWS.forEach(function(f){

var fieldIds = FIELDS.map(function(f){ return f.id; });

function storeRead(){

  var raw = window.localStorage.getItem(STORE_KEY);
  if(!raw) return null;
  var o = JSON.parse(raw);
  return (o && typeof o === 'object') ? o : null;
 }catch(e){ state.stored = false; return null; }
}
function storeSave(){
 if(!STORE_KEY){ state.stored = false; return; }

  var o = storeRead() || {};
  o.wx = {field:state.field, text:state.text};
  window.localStorage.setItem(STORE_KEY, JSON.stringify(o));
 }catch(e){ state.stored = false; }
}
function storeLoad(){
 var o = storeRead();

  if(o.wx.text && typeof o.wx.text === 'object') state.text = o.wx.text;
  if(o.wx.field && fieldIds.indexOf(o.wx.field) >= 0) state.field = o.wx.field;

}

function fieldOf(id){
 for(var i = 0; i < FIELDS.length; i++){ if(FIELDS[i].id === id) return FIELDS[i]; }

function fieldPicker(){
 if(FIELDS.length < 2) return '';
 var opts = FIELDS.map(function(f){
  return '<option value="' + esc(f.id) + '"' + (f.id === state.field ? ' selected' : '') + '>'
   + esc(f.id) + ' — ' + esc(f.name) + (f.datis ? '' : ' (no D-ATIS)') + '</option>';
 }).join('');
 return '<div class="bskw-f"><span class="bskw-lab">Field</span>'
  + '<select class="bskw-in" id="bskw-field">' + opts + '</select></div>';
}

function section(){
 var f = fieldOf(state.field);
 return '<section class="panel bskw-sec" id="mod-bskw" data-note="weather">'
  + '<h2>Weather and the D-ATIS</h2>'
  + '<p class="bskw-dim">Sets the wind, the visibility, the ceiling, the altimeter, the '
  + 'information letter and the runways in use from the current broadcast. '
  + 'Pasting is the path that always works and needs no network.</p>'
  + '<div class="bskw-grid">' + fieldPicker()
  + '<div class="bskw-f"><span class="bskw-lab">&nbsp;</span><div>'
  + '<button class="bskw-btn" id="bskw-read">read what is pasted</button> '
  + '<button class="bskw-btn" id="bskw-fetch">fetch the current one</button>'
  + '</div></div></div>'
  + '<div class="bskw-f"><span class="bskw-lab" id="bskw-boxlab"></span>'
  + '<textarea class="bskw-in bskw-ta" id="bskw-text"></textarea></div>'
  + '<div class="bskw-msg" id="bskw-msg"></div>'
  + '<div class="bskw-rows" id="bskw-rows"></div>'
  + '</section>';
}

function say(html){
 var b = document.getElementById('bskw-msg');
 if(b) b.innerHTML = html;
}
function rows(o){
 var b = document.getElementById('bskw-rows');
 if(!b) return;
 if(!o){ b.innerHTML = ''; return; }
 var r = [];
 var add = function(k, v){ if(v !== '' && v != null) r.push('<div class="bskw-row"><b>' + k + '</b><span>' + v + '</span></div>'); };
 add('Information', o.info ? esc(o.info) + (o.letters ? ' <span class="bskw-dim">(split broadcast — ' + esc(o.letters.join(' and ')) + ')</span>' : '') : '<span class="bskw-note">not read</span>');
 add('Wind', o.wind ? esc(o.wind) : '<span class="bskw-note">not read</span>');
 add('Visibility', o.vis != null ? esc(String(o.vis)) : '<span class="bskw-note">not read</span>');
 add('Ceiling', o.ceil != null ? (o.ceil >= 12000 ? 'unlimited' : o.ceil.toLocaleString()) : '<span class="bskw-note">not read</span>');
 add('Altimeter', o.altim ? esc(o.altim) : '<span class="bskw-note">not read</span>');
 add('Flight category', esc(o.cat) + ' <span class="bskw-dim">' + esc(TOOLBOX[o.cat]) + '</span>');
 add('Landing', o.land.length ? esc(o.land.join(', ')) : '<span class="bskw-note">not advertised</span>');
 add('Departing', o.dep.length ? esc(o.dep.join(', ')) : '<span class="bskw-dim">not stated in this broadcast</span>');
 if(o.apch.length) add('Approaches', o.apch.map(function(a){ return esc(a.apch) + ' to ' + esc(a.rwys.join(' and ')); }).join('; '));
 /* Issue #18. A REMINDER, NOT A JUDGEMENT: this is read from the same text the
    flow reader deliberately does not use, and a sentence it cannot read is
    shown verbatim rather than guessed at — which is why the verbatim row is
    here and not optional. */
 if(o.closed.length) add('Closed', '<span class="bskw-note">' + esc(o.closed.join(', ')) + '</span>');
 if(o.ots.length) add('Out of service', o.ots.map(function(x){
   return esc(x.what) + ' on ' + esc(x.rwys.join(' and ')); }).join('; '));
 if(o.notices) add('Not read as the flow', '<span class="bskw-dim">' + esc(o.notices) + '</span>');
 var fl = flowFor(o.land, o.dep);
 add('Flow', fl.text);
 b.innerHTML = r.join('');
}

function doRead(from){
 var f = fieldOf(state.field);
 var ta = document.getElementById('bskw-text');
 if(ta) state.text[state.field] = ta.value;
 var o = wxRead(textFor(state.field));
 state.last = o;
 if(!o){
  say('<span class="bskw-chip warn">nothing</span> The box is empty. Paste the current '
   + esc(f.id) + ' ' + (f.datis ? 'D-ATIS' : 'observation') + ' and press read what is pasted.');
  rows(null); storeSave(); return null;
 }
 var got = [];
 if(o.info) got.push('information ' + esc(o.info));
 if(o.wind) got.push('wind ' + esc(o.wind));
 if(o.ceil != null) got.push('ceiling ' + (o.ceil >= 12000 ? 'unlimited' : o.ceil.toLocaleString()));
 if(o.vis != null) got.push('visibility ' + esc(String(o.vis)));
 if(o.altim) got.push('altimeter ' + esc(o.altim));
 var msg = '<span class="bskw-chip good">read</span> ' + (from ? ('from ' + esc(from) + ' — ') : '')
  + esc(f.id) + '. ' + (got.length ? ('Set ' + got.join(', ') + '.') : 'Nothing in the observation was recognised.')
  + (o.land.length ? (' Landing ' + esc(o.land.join(', '))
     + (o.dep.length ? (', departing ' + esc(o.dep.join(', '))) : '') + '.') : '')
  + (o.apch.length ? (' Approaches advertised: ' + o.apch.map(function(a){
      return esc(a.apch) + ' to ' + esc(a.rwys.join(' and ')); }).join('; ') + '.') : '')
  + (o.closed.length ? (' <span class="bskw-note">Closed: ' + esc(o.closed.join(', ')) + '.</span>') : '')
  + (o.ots.length ? (' Out of service: ' + o.ots.map(function(x){
      return esc(x.what) + ' on ' + esc(x.rwys.join(' and ')); }).join('; ') + '.') : '')
  + ' That is ' + esc(o.cat) + ' — ' + esc(TOOLBOX[o.cat]);
 /* An observation has no runways in it and never did, so at a field with no
    D-ATIS that is not something the reader failed at — reporting it as a
    failure would train you to ignore the line that matters when it is. */
 var missed = f.datis ? o.missed
  : o.missed.filter(function(x){ return x !== 'the runways in use'; });
 if(missed.length) msg += ' <span class="bskw-note">Could not read: ' + esc(missed.join(', ')) + '. Set those by hand.</span>';
 if(o.clash.length) msg += ' <span class="bskw-note">' + esc(o.clash.join(', '))
   + (o.clash.length > 1 ? ' are' : ' is') + ' advertised in use and also named as closed in the same '
   + 'broadcast. Read it yourself before you build on either half.</span>';
 if(o.notices) msg += ' <span class="bskw-dim">Closures are read from the text the flow reader does '
   + 'not use, and that reading is a reminder rather than a judgement — the notices are in the box above.</span>';
 if(!state.stored) msg += ' <span class="bskw-note">This browser will not keep what you paste, so it is held in memory only for this visit.</span>';
 say(msg);
 rows(o);
 storeSave();
 return o;
}

/* ---------- The observation, for a field with no D-ATIS ----------
   AVIATIONWEATHER.GOV CANNOT BE FETCHED FROM A BROWSER. It serves the
   METAR for every one of these fields, but it sends no
   access-control-allow-origin header on any endpoint, so the request is
   refused from every origin. Tested in a real browser on 2026-09-04:
   both /api/data/metar and /cgi-bin/data/metar.php fail outright. It is
   still the right place to READ one by hand, and the failure message
   names it.

   api.weather.gov is the same National Weather Service data and does send
   the header, so that is what the button calls. Its `rawMessage` carries
   the verbatim METAR where it is populated, and that is used unchanged.
   For most of these fields it is EMPTY while the structured observation
   is complete, so the line is rebuilt from that instead.

   THE REBUILT LINE IS SHOWN IN THE BOX, not parsed behind your back — it
   is the same text you would have pasted, so you can compare it against
   the field's real METAR. The conversions were checked against stations
   that return both forms: KLOT rebuilds digit for digit, and KCBF, KMLE
   and KOFF match apart from the AUTO and RMK groups the parser ignores.
   A null reading is OMITTED rather than guessed, so the parser lists it
   as unread — which is what KGYY does when its wind is missing. */
var METAR_URL  = 'https://api.weather.gov/stations/';
var METAR_NAME = 'api.weather.gov';
var METAR_BY_HAND = 'https://aviationweather.gov/';
function pad(n, w){ n = String(n); while(n.length < w) n = '0' + n; return n; }
function nwsMetar(id, j){
 var p = (j && j.properties) || {};
 if(p.rawMessage && String(p.rawMessage).trim()) return {text:String(p.rawMessage).trim(), built:false};
 var v = function(o){ return (o && o.value != null) ? o.value : null; };
 var bits = [id];
 if(p.timestamp){
  var d = new Date(p.timestamp);
  bits.push(pad(d.getUTCDate(), 2) + pad(d.getUTCHours(), 2) + pad(d.getUTCMinutes(), 2) + 'Z');
 }
 var wd = v(p.windDirection), ws = v(p.windSpeed), wg = v(p.windGust);
 if(ws != null){
  var kt = Math.round(ws * 0.539957), gk = (wg != null) ? Math.round(wg * 0.539957) : null;
  bits.push((wd == null ? 'VRB' : pad(Math.round(wd), 3)) + pad(kt, 2) + (gk ? ('G' + pad(gk, 2)) : '') + 'KT');
 }
 var vis = v(p.visibility);
 if(vis != null) bits.push(Math.round(vis / 1609.344 * 10) / 10 + 'SM');
 (p.cloudLayers || []).forEach(function(L){
  var b = v(L.base);
  bits.push(L.amount + ((b != null && L.amount !== 'CLR' && L.amount !== 'SKC')
   ? pad(Math.round(b / 0.3048 / 100), 3) : ''));
 });
 var t = v(p.temperature), dp = v(p.dewpoint);
 if(t != null && dp != null) bits.push(Math.round(t) + '/' + Math.round(dp));
 var pa = v(p.barometricPressure);
 if(pa != null) bits.push('A' + pad(Math.round(pa * 0.00029530 * 100), 4));
 return {text:bits.join(' '), built:true};
}

/* ONE network call, and it stays optional by construction: it is never on
   a path the tool needs, every failure hands straight to the paste box,
   and the parser it feeds is the same one paste uses. Which source it
   asks follows the field — the D-ATIS feed where the field publishes one,
   the observation otherwise — so this is one call with a source that
   fits, not a second network dependency. */
function doFetch(){
 var f = fieldOf(state.field);
 if(typeof fetch !== 'function'){
  say('<span class="bskw-chip warn">no</span> This browser gives the page no way to fetch. '
   + 'Paste the text below and press read what is pasted.');
  return;
 }
 var kind = f.datis ? 'D-ATIS' : 'observation';
 say('<span class="bskw-chip">asking</span> Trying the published ' + kind + ' source for ' + esc(f.id) + '.');
 /* A specific reason replaces the generic one rather than being stacked on
    top of it — "no reporting station" and "the browser would not allow the
    request" are different problems and only one of them is worth retrying. */
 var hand = function(why){
  say('<span class="bskw-chip warn">no</span> '
   + (why
      ? ('Nothing came back — ' + esc(why) + '.')
      : ('The source would not answer. From a file page that is the usual result: the page has no '
         + 'origin, so the server will not allow the request, and this tool is built to work '
         + 'offline anyway.'))
   + ' Read the current ' + esc(f.id) + ' ' + kind + ' at <b>'
   + (f.datis ? 'atis.info' : METAR_BY_HAND) + '</b>, paste it below and press '
   + '<b>read what is pasted</b>; that path always works.');
 };
 var put = function(text, note){
  state.text[f.id] = text;
  var ta = document.getElementById('bskw-text');
  if(ta) ta.value = text;
  doRead(note);
 };
 try{
  if(f.datis){
   fetch(DATIS_URL + f.id, {cache:'no-store'}).then(function(r){
    if(!r || !r.ok) return hand('http ' + (r ? r.status : '?'));
    return r.text().then(function(body){
     var parts = [], re = /"datis"\s*:\s*"((?:[^"\\]|\\.)*)"/g, m;
     while((m = re.exec(body))){
      try{ parts.push(JSON.parse('"' + m[1] + '"')); }catch(e){ parts.push(m[1]); }
     }
     if(!parts.length){
      try{
       var s = JSON.parse(body);
       if(typeof s === 'string') parts.push(s);
      }catch(e2){ /* not JSON */ }
     }
     if(!parts.length) return hand('nothing in the reply');
     put(parts.join('\n\n'), DATIS_NAME);
    });
   })['catch'](function(){ hand(); });
  } else {
   fetch(METAR_URL + f.id + '/observations/latest', {cache:'no-store'}).then(function(r){
    if(!r || !r.ok){
     return hand(r && r.status === 404
      ? (f.id + ' has no reporting station on this source')
      : ('http ' + (r ? r.status : '?')));
    }
    return r.json().then(function(j){
     var m = nwsMetar(f.id, j);
     if(!m.text || m.text === f.id) return hand('the observation came back empty');
     put(m.text, m.built ? (METAR_NAME + ', rebuilt from the structured observation')
                         : METAR_NAME);
    });
   })['catch'](function(){ hand(); });
  }
 }catch(e){ hand(); }
}

function syncBox(){
 var f = fieldOf(state.field);
 var ta = document.getElementById('bskw-text');
 var lab = document.getElementById('bskw-boxlab');
 var fb = document.getElementById('bskw-fetch');
 if(ta){
  ta.value = textFor(state.field);
  ta.setAttribute('placeholder', f.datis
   ? ('Paste the current ' + f.id + ' D-ATIS here. A split broadcast goes in whole — put a blank line between the arrival half and the departure half.')
   : ('Paste the current ' + f.id + ' METAR here, or press fetch. ' + f.id + ' publishes no D-ATIS, so there are no runways to read — the weather and the flight category still come off it.'));
 }
 if(lab) lab.innerHTML = f.datis
  ? ('The ' + esc(f.id) + ' D-ATIS — the approach in use and the weather')
  : ('The ' + esc(f.id) + ' observation — <span class="bskw-note">this field publishes no D-ATIS</span>'
     + '<span class="bskw-dim">, so the weather comes off the METAR and no runways are advertised</span>');
 if(fb) fb.textContent = f.datis ? 'fetch the current one' : 'fetch the current observation';
}

/* ---------- 6. Mount ---------- */
function mount(){
 var style = document.createElement('style');
 style.textContent = css;
 document.head.appendChild(style);

 var wrap = document.querySelector('.wrap');
 if(!wrap) return;

 var host = document.createElement('div');
 host.innerHTML = section();
 var sec = host.firstChild;
 if(!sec) return;

 var page = document.getElementById('zlc-page-notes');
 if(page){ page.appendChild(sec); }
 else {
  var footer = wrap.querySelector('footer');
  if(footer) wrap.insertBefore(sec, footer); else wrap.appendChild(sec);
 }

 storeLoad();
 syncBox();

 var sel = document.getElementById('bskw-field');
 if(sel) sel.addEventListener('change', function(){
  var ta = document.getElementById('bskw-text');
  if(ta) state.text[state.field] = ta.value;
  state.field = sel.value;
  syncBox(); say(''); rows(null); storeSave();
 });
 var rb = document.getElementById('bskw-read');
 if(rb) rb.addEventListener('click', function(){ doRead(); });
 var fb = document.getElementById('bskw-fetch');
 if(fb) fb.addEventListener('click', doFetch);

 if(textFor(state.field)) doRead('what was saved');
 if(typeof DECK.log === 'function'){ DECK.log('Weather and D-ATIS reader mounted. Which fields publish a D-ATIS was checked against both published sources on 2026-09-04, not assumed.', 'info'); }
}

window.bskw = {
 FIELDS:FIELDS, read:wxRead, runways:wxRunways, observation:wxObservation,
 category:wxCategory, clean:wxClean, keyed:wxKeyed, labels:wxLabels,
 notices:wxNotices, closures:wxClosures, itemName:wxItemName,
 flowFor:flowFor, state:state, doRead:doRead
};

if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', mount); }
else { mount(); }
})();
</script>

/* ================================================================
   Big Sky — PUBLISHED PROCEDURES. Additive extension block.

   The SIDs and STARs this facility's fields actually have, taken from
   the FAA's coded source rather than traced off a chart image.

   SOURCE. CIFP cycle 261001, effective 2026-10-01, pulled 2026-10-20.
   Cycle 261029 (effective 2026-10-29) was decoded too and is NOT carried:
   it changes one Bozeman altitude (FALIA 8,200, was 8,000, on the HIA
   transition and final of ILS Y and LOC Y RWY 12). Rolling to it is #65.
   Pull recipe, record layout and licence in the root
   claude_CIFP_Source_Reference.md; the same data written out for
   reading in claude_BigSky_CIFP_Procedures.md beside this file.
   THE CYCLE IS THE CITATION — every value here is true for 28 days by
   construction. Re-pull before trusting it in a later cycle.

   COVERAGE. Both areas are fully coded — five STARs and two SIDs at
   Boise, five STARs and five SIDs at Bozeman — so this is the one
   facility in scope where CIFP answers the whole question for every
   field the tool works.

   BOI3 IS A VECTOR SID (ARINC 424 route type T): a climb on a heading and
   then radar vectors, no fix. It is the one radar-vectored departure CIFP
   codes at these fields, it carries vector:true, and the panel labels it
   so rather than calling it conventional.

   Nothing here is a sector boundary. The ZLC polygons and the flow
   branch they carry stay where they are, in
   ../_shared/claude_ZLC_Sector_Geometry_Reference.md, and a runway
   transition named RW10L is the PROCEDURE's runway, not a statement
   about which flow is running.

   KEYED BY AIRPORT, THEN BY PROCEDURE, and that is load-bearing. A
   procedure identifier is NOT unique across fields: ADELL EIGHT is
   published at DuPage, Aurora, Gary and Lewis with a different set of
   runway transitions at each, and PANGG SEVEN has a different common
   segment at Gary than at Midway. Keyed on the identifier alone, four
   fields' legs concatenate into a track no aircraft could fly. Every
   lookup below therefore takes the field first.

   WHAT A PROCEDURE CARRIES. Three parts, in the order an aircraft
   flies them. A STAR runs trans -> common -> rwy; a SID runs
   rwy -> common -> trans. Either outer part may be absent, because
   the published procedure does not have it.

     trans   entry transitions, keyed by the fix each starts at
     common  the segment every aircraft on the procedure flies
     rwy     runway transitions, keyed by RWnn

   A LEG IS ONE ROW OF THE PUBLISHED TABLE.

     {f:'BENKY', at:12000, t:'TF'}      cross BENKY at 12,000
     {f:'BFORD', above:22000}           at or above
     {f:'MINCE', below:10000}           at or below
     {f:'BYLAW', lo:20000, hi:23000}    between, inclusive
     {f:'PTERZ', above:6000, spd:220}   with a published speed limit
     {from:'BRIKK', vec:'FM'}           LEAVES BRIKK ON A VECTOR

   The last one is the one that matters. FM, VM, VA, CA and VI do not
   terminate at a waypoint — the fix on the record is where the leg
   STARTS, not a point the aircraft crosses. Emitting that as `f`
   would draw a crossing the procedure does not have and would repeat
   the fix before it, so a vector leg never carries `f`. Anything
   walking a track has to stop there; `trackTo` does.

   Altitudes are feet, never thousands. Coordinates live once in PFIX
   and a leg names its fix rather than repeating the numbers, because
   a fix on seven transitions is still one pair of numbers (house
   rule 5, one copy of every operational number).

   WHAT THIS IS NOT, AND THE PART TO READ BEFORE BUILDING A DRILL ON
   IT. CIFP is the published procedure and nothing else.

     - It does not say which transition Big Sky ASSIGNS in a given
       configuration. That is an LOA and SOP question and CIFP has no
       answer to it, so the tool offers every published transition and
       never claims one is the right one.
     - It carries no sector boundary, no MVA, no delegation and no
       ownership. Nothing here narrows house rule 7.
     - It does not make the procedure flyable. That is the fly block,
       which flies the track straight between fixes; it refuses, strip
       by strip and by name, a procedure with fewer than two
       coordinates for the runway and transition chosen (BOI3 is a
       radar-vectored SID with no fix).
   ================================================================ */

/* ---------- resolution ----------
   Everything below reads through PFIX/STARS/SIDS and keeps no second
   copy of any number. */

/* A PROCEDURE IS SCOPED TO ITS AIRPORT, and that is not a detail. A
   procedure identifier is not unique across fields: ADELL EIGHT exists
   at DuPage, Aurora, Gary and Lewis with a different set of runway
   transitions at each, and PANGG SEVEN has a different common segment
   at Gary than at Midway. Keyed on the identifier alone, four fields'
   legs concatenate into one track no aircraft could fly. So every
   lookup here takes the field first. */
function procOf(apt, id){
  return (STARS[apt] && STARS[apt][id]) || (SIDS[apt] && SIDS[apt][id]) || null;
}
function kindOf(apt, id){
  if(STARS[apt] && STARS[apt][id]) return 'STAR';
  if(SIDS[apt]  && SIDS[apt][id])  return 'SID';
  return null;
}
function fixLL(name){ var c = PFIX[name]; return c ? [c[0],c[1]] : null; }

function procsAt(icao, kind){
  var src = (kind === 'SID' ? SIDS : STARS)[icao];
  return src ? Object.keys(src).sort() : [];
}
/* Every field at which a procedure of this name is published. This is
   what `serves` and `from` on a strip are asking, and it is a scan
   rather than a stored list precisely so it cannot disagree with the
   tables above. */
function fieldsWith(id, kind){
  var src = kind === 'SID' ? SIDS : STARS, out = [];
  for(var a in src){ if(src[a][id]) out.push(a); }
  return out.sort();
}
function transitionsOf(apt, id){
  var p = procOf(apt, id); if(!p) return {trans:[], rwy:[]};
  return { trans: p.trans ? Object.keys(p.trans).sort() : [],
           rwy:   p.rwy   ? Object.keys(p.rwy).sort()   : [] };
}

/* The whole track, in flying order, with the joins de-duplicated: a
   transition ends on the fix the next part begins on, and printing it
   twice reads as two crossings of one fix. Returns legs only — it
   asserts nothing about whether the aircraft is cleared for them. */
function trackTo(apt, id, entry, rwy){
  var p = procOf(apt, id); if(!p) return [];
  var order = kindOf(apt, id) === 'SID'
    ? [ p.rwy && p.rwy[rwy], p.common, p.trans && p.trans[entry] ]
    : [ p.trans && p.trans[entry], p.common, p.rwy && p.rwy[rwy] ];
  var out = [];
  for(var i = 0; i < order.length; i++){
    var seg = order[i]; if(!seg) continue;
    for(var j = 0; j < seg.length; j++){
      var g = seg[j], last = out[out.length-1];
      if(last && g.f && last.f === g.f && !g.vec && !last.vec){ continue; }
      out.push(g);
    }
  }
  return out;
}

/* Does the track stop on a vector rather than at a fix? A drill that
   sequences to a point has to know that the published data runs out. */
function endsOnVector(legs){
  var l = legs[legs.length-1];
  return !!(l && l.vec);
}

/* ---------- the strip contract ----------
   The flight-strips block reads window.STRIP_FACILITY. Building its
   arrivals and departures from THIS data rather than a hand-typed
   list is what keeps the two from drifting, and it is what stops a
   procedure serving several fields from being written several times
   under one key — an object literal keeps only the last of those, so
   a hand-typed list silently loses every field but one. */
function stripProcs(kind){
  var src = kind === 'SID' ? SIDS : STARS, out = {};
  for(var a in src){
    for(var k in src[a]){
      if(out[k]) continue;                    /* already scanned for every field */
      out[k] = kind === 'SID'
        ? { from:  fieldsWith(k, 'SID'),  flies:true, track:true }
        : { serves:fieldsWith(k, 'STAR'), flies:true, track:true };
    }
  }
  return out;
}

/* ---------- rendering ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function ft(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* The crossing, written the way the chart writes it. A leg with no
   number has no published crossing, and the cell says so rather than
   leaving a blank that reads as unrestricted. */
function crossing(g){
  var a = g.at    != null ? 'cross at ' + ft(g.at)
        : g.lo    != null ? ft(g.lo) + ' &ndash; ' + ft(g.hi)
        : g.above != null ? 'at or above ' + ft(g.above)
        : g.below != null ? 'at or below ' + ft(g.below)
        : '';
  /* A vector leg can still carry an altitude — a VA or CA climbs on a
     course TO one. Print the altitude AND the fact that it does not end
     at a waypoint; dropping either would misstate the leg. */
  if(g.vec) return (a ? a + ' &middot; ' : '')
    + '<span class="bskp-vec">terminates on a vector</span>';
  return a || '<span class="bskp-none">no published crossing</span>';
}

/* The fix cell. Three cases, and the third is why this is not just
   `g.f`: a leg may end at a fix, may leave one on a vector, or — a VA
   or CA off the runway — may name no fix at all. */
function fixCell(g){
  if(g.f)    return esc(g.f);
  if(g.from) return '<span class="bskp-none">from</span> ' + esc(g.from);
  return '<span class="bskp-none">no fix</span>';
}
function legRow(g){
  var ll = g.f ? fixLL(g.f) : null;
  return '<tr>'
    + '<td class="bskp-fix">' + fixCell(g) + '</td>'
    + '<td>' + crossing(g) + '</td>'
    + '<td>' + (g.spd != null ? (esc(g.spd) + ' kt') : '<span class="bskp-none">&mdash;</span>') + '</td>'
    + '<td class="bskp-t">' + esc(g.t || g.vec || '') + '</td>'
    + '<td class="bskp-ll">' + (ll ? (ll[0].toFixed(4) + ', ' + ll[1].toFixed(4))
                                      : '<span class="bskp-none">&mdash;</span>') + '</td>'
    + '</tr>';
}

var state = { apt:'', kind:'STAR', proc:'', entry:'', rwy:'' };

function fields(){
  var apts = {}, a;
  for(a in STARS) apts[a] = 1;
  for(a in SIDS)  apts[a] = 1;
  return Object.keys(apts).sort();
}

function sel(id, list, cur, fmt){
  return '<select class="bskp-sel" id="bskp-' + id + '" onchange="bskpPick(\'' + id + '\',this.value)">'
    + list.map(function(v){
        return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>'
          + esc(fmt ? fmt(v) : v) + '</option>';
      }).join('')
    + '</select>';
}

function body(){
  var apts = fields();
  if(!apts.length){
    return '<div class="bskp-empty">CIFP codes no SID and no STAR for any field this facility works. '
      + 'That is a coverage fact about the published data, not a gap in this tool &mdash; see the '
      + 'facility CLAUDE.md and claude_BigSky_CIFP_Procedures.md.</div>';
  }
  if(!state.apt || apts.indexOf(state.apt) < 0) state.apt = apts[0];

  var here = procsAt(state.apt, state.kind);
  if(!here.length){
    var other = state.kind === 'STAR' ? 'SID' : 'STAR';
    if(procsAt(state.apt, other).length){ state.kind = other; here = procsAt(state.apt, other); }
  }
  if(!state.proc || here.indexOf(state.proc) < 0) state.proc = here[0] || '';

  var tr = transitionsOf(state.apt, state.proc);
  if(tr.trans.indexOf(state.entry) < 0) state.entry = tr.trans[0] || '';
  if(tr.rwy.indexOf(state.rwy)     < 0) state.rwy   = tr.rwy[0]   || '';

  var p = procOf(state.apt, state.proc);
  var legs = state.proc ? trackTo(state.apt, state.proc, state.entry, state.rwy) : [];

  var h = '<div class="bskp-picks">'
    + '<div class="bskp-f"><span class="bskp-lab">Field</span>' + sel('apt', apts, state.apt) + '</div>'
    + '<div class="bskp-f"><span class="bskp-lab">Kind</span>'
    +   sel('kind', ['STAR','SID'], state.kind, function(v){ return v === 'STAR' ? 'arrival (STAR)' : 'departure (SID)'; })
    + '</div>';

  if(!here.length){
    return h + '</div><div class="bskp-empty">CIFP codes no '
      + (state.kind === 'SID' ? 'SID' : 'STAR') + ' at ' + esc(state.apt) + '. '
      + 'CIFP can carry a radar-vector departure (route type T, as at Boise) but codes none here, so a zero is a '
      + 'coding gap at this field and not proof the field has none.</div>';
  }

  h += '<div class="bskp-f"><span class="bskp-lab">Procedure</span>'
    +   sel('proc', here, state.proc) + '</div>';
  if(tr.trans.length)
    h += '<div class="bskp-f"><span class="bskp-lab">'
      +  (state.kind === 'SID' ? 'Exit transition' : 'Entry transition') + '</span>'
      +  sel('entry', tr.trans, state.entry) + '</div>';
  if(tr.rwy.length)
    h += '<div class="bskp-f"><span class="bskp-lab">Runway transition</span>'
      +  sel('rwy', tr.rwy, state.rwy) + '</div>';
  h += '</div>';

  var also = fieldsWith(state.proc, state.kind);
  h += '<div class="bskp-meta">' + esc(state.proc) + ' at ' + esc(state.apt) + ' &middot; '
    + (p && p.rnav ? 'RNAV' : (p && p.vector ? 'vector SID (route type T)' : 'conventional')) + ' &middot; CIFP ' + CYCLE
    + (also.length > 1
        ? (' &middot; also published at ' + esc(also.filter(function(a){ return a !== state.apt; }).join(', '))
           + ', with that field\'s own runway transitions')
        : '')
    + '</div>';

  h += '<div class="bskp-scroll"><table class="bskp-tbl">'
    + '<thead><tr><th>Fix</th><th>Crossing</th><th>Speed</th><th>Leg</th><th>Coordinates</th></tr></thead><tbody>'
    + legs.map(legRow).join('')
    + '</tbody></table></div>';

  if(endsOnVector(legs))
    h += '<div class="bskp-warn">This track ends on a vector, not at a fix. The published data '
      +  'stops there and so does anything that walks it &mdash; the rest is the controller\'s.</div>';

  h += '<div class="bskp-note">CIFP ' + CYCLE + ' lists every transition that EXISTS. It does not say '
    +  'which one Big Sky assigns in a given configuration, and this tool does not guess: that is an SOP '
    +  'and LOA question. Nothing on this page is a boundary, an MVA or a delegation.</div>';
  return h;
}

window['bskpPick'] = function(what, val){
  state[what] = val;
  if(what === 'apt' || what === 'kind'){ state.proc = ''; state.entry = ''; state.rwy = ''; }
  if(what === 'proc'){ state.entry = ''; state.rwy = ''; }
  render();
};

function render(){
  var el = document.getElementById('bskp-body');
  if(el) el.innerHTML = body();
}

     block runs after the page builder and before the strips block, so
     the wrapper exists by now; without one, fall in above the footer. */
  var page = null, ids = [];
