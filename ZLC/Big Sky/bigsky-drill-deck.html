 });
 return out || '<div class="' + PFX + '-dim">No strip here follows a published procedure.</div>';
}
/* The start positions, drawn by the player's own scope code (fly.preview), so the fit, the rings,
   the outline and the tracks are the ones that will be flown. */
function previewHtml(){
 var rows = (D.rows() || []).filter(function(s){ return s && String(s.cs || '').trim(); }), p = null;
 if(typeof FL.preview === 'function'){ try{ p = FL.preview(rows); }catch(e){ p = null; } }
 if(!p) return '<div class="' + PFX + '-dim">The player cannot draw start positions here.</div>';
 var out = '';
 if(p.count){
  out += '<div class="' + PFX + '-cap">Start positions - same geometry as the live scope</div>'
   + '<div class="' + PFX + '-scopewrap">' + p.svg + '</div>'
   + '<div class="' + PFX + '-hint">Dimmed targets check in later. Each is drawn at the point on its published track where the strip starts it, on the Fly it page\'s own scope code.</div>';
 } else {
  out += '<div class="' + PFX + '-dim">Nothing to draw yet: a strip needs a callsign and either a published procedure or an overflight\'s radials before it has a start position.</div>';
 }
 if(p.skipped.length) out += '<div class="' + PFX + '-gap" style="margin-top:8px;">No start position: ' + esc(p.skipped.join('; ')) + '.</div>';
 return out;
}
function tailHtml(){
 var list = store.drills.map(function(d, i){
  var ne = d.events ? d.events.length : 0;
  return '<div class="' + PFX + '-drow"><b>' + esc(d.name) + '</b> <span class="' + PFX + '-dim">' + (d.strips ? d.strips.length : 0) + ' strips' + (ne ? ' · ' + ne + ' event' + (ne === 1 ? '' : 's') : '') + ' · ' + esc(d.at || '') + (d.seed ? ' · seed ' + esc(d.seed) : '') + '</span> '
   + '<button class="' + PFX + '-btn" onclick="' + PFX + 'Fly(' + i + ')">Fly it</button> '
   + '<button class="' + PFX + '-btn" onclick="' + PFX + 'Open(' + i + ')">Load into the strips</button> '
   + '<button class="' + PFX + '-btn" onclick="' + PFX + 'Del(' + i + ')">Delete</button>'
   + (d.brief ? '<div class="' + PFX + '-dim">' + esc(d.brief) + '</div>' : '') + '</div>';
 }).join('');
 return '<section class="' + SEC + ' ' + PFX + '-sec" id="' + PFX + '-tail" data-note="drill.saved">'
  + '<div class="' + PFX + '-panel"><div class="' + PFX + '-sub">Start positions</div>'
  + '<div id="' + PFX + '-preview">' + previewHtml() + '</div></div>'
  + '<div class="' + PFX + '-panel">'
  + '<div class="' + PFX + '-sub a">Flown on</div>'
  + '<div id="' + PFX + '-details">' + detailsHtml() + '</div>'
  + '<div class="' + PFX + '-actions">'
  + '<button class="' + PFX + '-go" onclick="' + PFX + 'SaveFly()">Save and fly it</button>'
  + '<button class="' + PFX + '-btn" onclick="' + PFX + 'SaveOnly()">Save only</button>'
  + '</div>'
  + ui.msg
  + '</div>'
  + '<div class="' + PFX + '-panel"><div class="' + PFX + '-sub">Saved drills</div>'
  + (storeOk ? '' : '<div class="' + PFX + '-msg bad">Local storage is not available in this context, so saved drills live only until the page is closed. Export them before you leave.</div>')
  + (list || '<div class="' + PFX + '-dim">None saved yet.</div>')
  + '<div class="' + PFX + '-actions">'
  + '<button class="' + PFX + '-btn" onclick="' + PFX + 'Export()">Export as JSON</button>'
  + '<button class="' + PFX + '-btn" onclick="' + PFX + 'Import()">Import from the box below</button>'
  + '</div>'
  + '<textarea class="' + PFX + '-in ' + PFX + '-json" id="' + PFX + '-json" rows="6" placeholder="Exported drills appear here. To import, paste JSON here and press Import.">' + esc(ui.exportText) + '</textarea>'
  + '</div>'
  + '</section>';
}

/* ---------- 5. painting ---------- */
function paint(){
 var h = document.getElementById(PFX + '-head'), t = document.getElementById(PFX + '-tail');
 if(h){ var nh = document.createElement('div'); nh.innerHTML = headHtml(); h.parentNode.replaceChild(nh.firstChild, h); }
 if(t){ var nt = document.createElement('div'); nt.innerHTML = tailHtml(); t.parentNode.replaceChild(nt.firstChild, t); }
}
/* the frame line follows the position and weather panels above, which this block does not own */
function paintFrame(){
 var e = document.getElementById(PFX + '-frame');
 if(!e) return;
 var t = frameText();
 if(t === lastFrame) return;
 lastFrame = t; e.innerHTML = frameInner(t);
}
/* repaint only the flown-on panel and the start positions, so typing in the head never loses focus */
function paintDetails(){
 var e = document.getElementById(PFX + '-details'); if(e) e.innerHTML = detailsHtml();
 var p = document.getElementById(PFX + '-preview'); if(p) p.innerHTML = previewHtml();
 paintFrame();
}

/* ---------- 6. handlers ---------- */
function read(){
 function v(id){ var e = document.getElementById(PFX + '-' + id); return e ? e.value : null; }
 function c(id){ var e = document.getElementById(PFX + '-' + id); return e ? !!e.checked : null; }
 if(v('name') != null) ui.name = v('name');
 if(v('brief') != null) ui.brief = v('brief');
 if(v('rate') != null) ui.rate = parseInt(v('rate'), 10) || 0;
 if(c('hot') != null) ui.hot = c('hot');
 if(v('seed') != null) ui.seed = v('seed');
 if(v('n') != null){ var n = parseInt(v('n'), 10); ui.n = (n >= 1 && n <= ST.MAX) ? n : ui.n; }
 if(v('mix') != null) ui.mix = v('mix');
 if(c('speci') != null){
  var sp = ui.speci;
  sp.on = c('speci'); sp.at = v('speciat') || ''; sp.ceil = v('specic') || ''; sp.vis = v('speciv') || '';
  sp.wind = v('speciw') || ''; sp.cat = v('specicat') || '';
  sp.cfg = (v('specicfg') != null) ? v('specicfg') : sp.cfg;
 }
 ui.lines.forEach(function(l, i){
  if(v('lat' + i) == null) return;
  l.at = v('lat' + i); l.from = v('lfrom' + i) || ''; l.cs = v('lcs' + i) || ''; l.text = v('ltxt' + i) || '';
 });
}
window[PFX + 'Set'] = function(){ read(); };
window[PFX + 'Gen'] = function(){
 read();
 var seed = parseInt(String(ui.seed).replace(/\D/g, ''), 10);
 if(!isFinite(seed)){ seed = Math.floor(Math.random() * 100000); ui.seed = String(seed); }
 var g = generate(seed, ui.n, ui.mix);
 if(!g.strips.length){ say('Nothing could be generated: no strip could be built on a published procedure this deck can fly.', 'bad'); return; }
 D.rows(g.strips);
 ui.msg = '<div class="' + PFX + '-msg">Built ' + g.strips.length + ' strip' + (g.strips.length === 1 ? '' : 's') + ' from seed ' + esc(ui.seed) + '.'
  + (g.skipped.length ? ' Could not build ' + esc(g.skipped.join(', ')) + ' on a flyable procedure.' : '')
  + ' Change any box you like, then fly it.</div>';
 paint();
};
window[PFX + 'Dice'] = function(){
 read();
 ui.seed = String(Math.floor(Math.random() * 100000));
 var e = document.getElementById(PFX + '-seed'); if(e) e.value = ui.seed;
};
window[PFX + 'Blank'] = function(){
 read();
 D.rows([ST.blank()]);
 ui.msg = '<div class="' + PFX + '-msg">Started blank. Fill in the strips below, then fly it.</div>';
 paint();
};
window[PFX + 'AddLine'] = function(){
 read();
 ui.lines.push({at:'', from:'', cs:'', text:''});
 paint();
};
window[PFX + 'DropLine'] = function(i){
 read();
 ui.lines.splice(i, 1);
 paint();
};
window[PFX + 'Trans'] = function(i, v){ var r = D.rows()[i]; if(!r) return; if(v) r.trans = v; else delete r.trans; paintDetails(); };
window[PFX + 'Climb'] = function(i, v){ var r = D.rows()[i]; if(!r) return; if(String(v).trim()) r.climbTo = String(v).trim(); else delete r.climbTo; paintDetails(); };
function readyDrill(){
 read();
 if(typeof window[ST.prefix + 'Sync'] === 'function') window[ST.prefix + 'Sync']();
 return collect();
}
window[PFX + 'SaveFly'] = function(){
 var d = readyDrill(), v = FL.validate(d);
 if(v.errs.length){ say('<b>This drill cannot be flown yet.</b><br>' + v.errs.map(esc).join('<br>'), 'bad'); return; }
 store.drills.push(d); save();
 flyIt(d);
};
window[PFX + 'SaveOnly'] = function(){
 var d = readyDrill();
 store.drills.push(d); save();
 var v = FL.validate(d), notes = v.warns.concat(eventNotes(d));
 say('Saved <b>' + esc(d.name) + '</b>, ' + d.strips.length + ' strip' + (d.strips.length === 1 ? '' : 's')
  + (d.events ? ' and ' + d.events.length + ' event' + (d.events.length === 1 ? '' : 's') : '') + '.'
  + (v.errs.length ? '<br>It cannot be flown yet: ' + v.errs.map(esc).join(' ') : '')
  + (notes.length ? '<br>' + notes.map(esc).join('<br>') : ''), v.errs.length ? 'bad' : '');
};
window[PFX + 'Fly'] = function(i){ var d = store.drills[i]; if(d) flyIt(d); };
window[PFX + 'Open'] = function(i){
 var d = store.drills[i]; if(!d) return;
 var moved = [], strips = JSON.parse(JSON.stringify(d.strips || []));
 strips.forEach(function(s){ var r = ST.normStrip(s); (r.moved || []).forEach(function(m){ moved.push((s.cs || 'a strip') + ': ' + m); }); });
 ui.name = d.name; ui.brief = d.brief || ''; ui.seed = d.seed || '';
 ui.hot = (d.rate === 'hot'); ui.rate = ui.hot ? 1 : (parseInt(d.rate, 10) || 0);
 ui.speci = {on:false, at:'', ceil:'', vis:'', wind:'', cat:'', cfg:''}; ui.lines = [];
 var specis = 0;
 (d.events || []).forEach(function(e){
  if(!e) return;
  if(e.kind === 'speci'){
   specis++;
   if(specis === 1) ui.speci = {on:true, at:String(e.at == null ? '' : e.at), ceil:String(e.ceil || ''), vis:String(e.vis || ''), wind:String(e.wind || ''), cat:String(e.cat || ''), cfg:String(e.cfg || '')};
  } else if(e.kind === 'landline'){
   ui.lines.push({at:String(e.at == null ? '' : e.at), from:String(e.from || ''), cs:String(e.cs || ''), text:String(e.text || '')});
  }
 });
 D.rows(strips);
 ui.msg = '<div class="' + PFX + '-msg">Loaded <b>' + esc(d.name) + '</b>.'
  + (specis > 1 ? ' The drill carries ' + specis + ' special observations; the builder edits one, the first.' : '')
  + (moved.length ? ' What could not follow into this facility moved: ' + esc(moved.join('; ')) + '.' : '') + '</div>';
 paint();
};
window[PFX + 'Del'] = function(i){
 var d = store.drills[i]; if(!d) return;
 if(!window.confirm('Delete the drill "' + d.name + '"? Export it first if you want to keep it.')) return;
 store.drills.splice(i, 1); save(); paint();
};
window[PFX + 'Export'] = function(){
 ui.exportText = JSON.stringify({kind:'drills', facility:(ST.FACILITY && ST.FACILITY.id) || '', drills:store.drills}, null, 1);
 paint();
};
window[PFX + 'Import'] = function(){
 var e = document.getElementById(PFX + '-json'), txt = e ? e.value : '';
 var o;
 try{ o = JSON.parse(txt); }catch(err){ say('That is not JSON: ' + esc(String(err.message || err)), 'bad'); return; }
 var list = Array.isArray(o) ? o : (o && o.drills ? o.drills : (o && o.strips ? [o] : null));
 if(!list){ say('No drills found in that JSON. It should carry a drills list or a drill with strips.', 'bad'); return; }
 var n = 0, moved = [];
 list.forEach(function(d){
  if(!d || !d.strips || !d.strips.length) return;
  d.strips.forEach(function(s){ var r = ST.normStrip(s); (r.moved || []).forEach(function(m){ moved.push((s.cs || 'a strip') + ': ' + m); }); });
  d.id = 'd' + Date.now().toString(36) + n; d.name = d.name || 'Imported drill';
  store.drills.push(d); n++;
 });
 save(); ui.exportText = '';
 say('Imported ' + n + ' drill' + (n === 1 ? '' : 's') + '.' + (moved.length ? ' What could not follow into this facility moved: ' + esc(moved.join('; ')) + '.' : ''));
};

/* ---------- 7. mount ---------- */
function mountCss(){
 if(document.getElementById(PFX + '-css')) return;
 var c = '.' + PFX + '-sec{margin-top:22px;}'
  + '.' + PFX + '-panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin:14px 0;}'
  + '.' + PFX + '-sub{font-family:var(--mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;}'
  + '.' + PFX + '-sub.a{color:var(--amber);}'
  + '.' + PFX + '-frame{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:12px;}'
  + '.' + PFX + '-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:10px 0;}'
  + '.' + PFX + '-row label,.' + PFX + '-blk{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);}'
  + '.' + PFX + '-row label.' + PFX + '-chk,.' + PFX + '-chk{flex-direction:row;align-items:center;gap:6px;font-size:11px;letter-spacing:0;text-transform:none;color:var(--dim);cursor:pointer;padding-bottom:7px;}'
  + '.' + PFX + '-blk{margin:10px 0;}'
  + '.' + PFX + '-drow label{font-family:var(--mono);font-size:10px;letter-spacing:0.06em;color:var(--dim);margin-right:8px;}'
  + '.' + PFX + '-in,.' + PFX + '-sel{background:var(--panel2);border:1px solid var(--line);border-radius:3px;color:var(--ink);font-family:var(--mono);font-size:12px;padding:6px 8px;text-transform:none;letter-spacing:0;}'
  + '.' + PFX + '-in:focus,.' + PFX + '-sel:focus{outline:2px solid var(--green);outline-offset:1px;}'
  + '.' + PFX + '-json{width:100%;box-sizing:border-box;margin-top:10px;}'
  + '.' + PFX + '-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;}'
  + '.' + PFX + '-btn{font-family:var(--mono);font-size:11.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer;}'
  + '.' + PFX + '-btn:hover{color:var(--ink);border-color:var(--dim2);}'
  + '.' + PFX + '-go{font-family:var(--mono);font-size:12px;font-weight:600;background:var(--green);color:#062;border:0;border-radius:4px;padding:9px 16px;cursor:pointer;}'
  + '.' + PFX + '-drow{padding:8px 0;border-top:1px solid var(--line);font-size:13px;}'
  + '.' + PFX + '-drow:first-of-type{border-top:0;}'
  + '.' + PFX + '-line{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin:8px 0;}'
  + '.' + PFX + '-linehead{display:flex;gap:10px;align-items:center;font-size:13px;}'
  + '.' + PFX + '-cap{font-family:var(--mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--dim2);margin-bottom:6px;}'
  + '.' + PFX + '-scopewrap{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px;}'
  + '.' + PFX + '-scopewrap svg{display:block;width:100%;height:auto;}'
  + '.' + PFX + '-dim{color:var(--dim);font-size:12px;}'
  + '.' + PFX + '-hint{font-size:11.5px;color:var(--dim2);line-height:1.55;margin-top:8px;}'
  + '.' + PFX + '-gap{color:var(--amber);}'
  + '.' + PFX + '-note{font-size:12px;color:var(--dim2);border-left:2px solid var(--line);padding-left:10px;margin-top:10px;}'
  + '.' + PFX + '-msg{font-size:13px;margin-top:12px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);}'
  + '.' + PFX + '-msg.bad{border-color:var(--amber);color:var(--amber);}';
 var st = document.createElement('style'); st.id = PFX + '-css'; st.textContent = c; document.head.appendChild(st);
}
function mount(){
 mountCss(); load();
 var anchor = (typeof D.anchor === 'function') ? D.anchor() : null;
 var hd = document.createElement('div'), tl = document.createElement('div');
 hd.innerHTML = headHtml(); tl.innerHTML = tailHtml();
 var head = hd.firstChild, tail = tl.firstChild;
 if(anchor && anchor.parentNode){
  anchor.parentNode.insertBefore(head, anchor);
  anchor.parentNode.insertBefore(tail, anchor.nextSibling);
 } else { return; }
 if(typeof D.mountRails === 'function'){ try{ D.mountRails(head); D.mountRails(tail); }catch(e){} }
 /* The strips' own handlers keep the panel honest: wrap them, never edit them. */
 ['Sync', 'Add', 'Drop'].forEach(function(n){
  var name = ST.prefix + n, orig = window[name];
  if(typeof orig !== 'function') return;
  window[name] = function(){ var r = orig.apply(this, arguments); paintDetails(); return r; };
 });
 paintDetails();
 /* the frame line is owned by blocks this one does not wrap, so it is read again after any click or
    change on the page and now and then (a fetched D-ATIS lands later); it touches the page only when
    the text has changed */
 function soon(){ setTimeout(paintFrame, 60); }
 document.addEventListener('click', soon, true);
 document.addEventListener('change', soon, true);
 setInterval(paintFrame, 1500);
}
if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', mount); }
else { mount(); }

window.drill = {store:function(){ return store; }, generate:generate, rng:rng, collect:collect, flyIt:flyIt, KEY:KEY, storeOk:function(){ return storeOk; },
 events:eventsOut, ui:function(){ return ui; }, refresh:paintDetails};
})();
</script>
<script>
/* ================================================================
   Big Sky — PAGES. Additive extension block, and deliberately the last.

   Everything before this mounts one long scroll with a row of anchor
   links. This block moves the sections that already exist into three
   view wrappers and turns #modnav into the page switcher the other
   five decks use — house rule 4, "three pages, not one scroll", and
   the ZLC divergence logged in house rule 9.

   It edits no earlier block. It finds the sections by id AFTER they
   have mounted, which is why it must stay last: its DOMContentLoaded
   handler registers after theirs and so runs after them. Adding a
   further block means adding it before this one, or naming its
   section here.

   Section ids survive the move (house rule 4), so the deck's own
   getElementById calls and the strips block's data-note anchor keep
   working untouched.

   The third page is "What this tool knows", not "Notes and log":
   this deck carries no notes layer and no persistence at all, which
   is the gap house rule 9 records. Naming the page after a section
   that does not exist would be the tool asserting something it does
   not have. The weather block's zlc-page-notes lookup therefore
   never matches here and falls back to the footer; placement is
   decided below instead — mod-bskw is listed under 'setup', beside the
   area and flow it drives, and the Fly it page holds the player alone.
   ================================================================ */
(function(){ 'use strict';

var DECK = (window.ZLC && window.ZLC.facility === 'BIGSKY') ? window.ZLC : null;
if(!DECK) return;

var PAGES = [
 {id:'setup', label:'Set up a drill', hint:'area and flow, the weather behind it, the position setup, and the strips and drill built from them',
  sections:['mod-area','mod-bskw','mod-pos','bskdrill-head','mod-bskst','bskdrill-tail']},
 {id:'fly',   label:'Fly it',         hint:'the live player',
  sections:['mod-bskfly']},
 {id:'data',  label:'What this tool knows', hint:'the slots that are filled and the ones that are not, the seat reference, and the published procedures',
  sections:['mod-stubs','mod-seat','mod-bskp']}
];

/* Copied from the M98 tab styling so the two read as one toolset. The
   sticky offset is this deck's own topbar: 16px padding twice, an 11px
   line and the bottom border. */
var css =
  '.zlc-view{display:none;}'
+ '.zlc-view.on{display:block;}'
+ '.zlc-view > *:first-child{margin-top:34px;}'
+ '.modnav.zlc-tabs{margin:28px 0 0;position:sticky;top:50px;'
+   'background:rgba(10,13,12,0.94);backdrop-filter:blur(6px);z-index:15;}'
+ '.modnav.zlc-tabs button{font-family:var(--mono);font-size:11.5px;letter-spacing:0.06em;'
+   'text-transform:uppercase;color:var(--dim);background:transparent;'
+   'border:1px solid var(--line);border-radius:3px;padding:7px 14px;cursor:pointer;}'
+ '.modnav.zlc-tabs button:hover{color:var(--ink);border-color:var(--dim2);}'
+ '.modnav.zlc-tabs button.on{color:var(--green);border-color:var(--green);'
+   'background:var(--panel);}'
+ '.modnav.zlc-tabs .sub{font-family:var(--mono);font-size:10.5px;color:var(--dim2);'
+   'align-self:center;margin-left:auto;}'
+ '@media (max-width:600px){.modnav.zlc-tabs{position:static;}'
+   '.modnav.zlc-tabs .sub{display:none;}}';

function esc(s){
 return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
   .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pageById(id){
 for(var i=0;i<PAGES.length;i++){ if(PAGES[i].id===id) return PAGES[i]; }
 return null;
}

var page = 'setup';

window.zlcPage = function(id, keepScroll){
 var p = pageById(id), i;
 if(!p) return;
 page = id;
 for(i=0;i<PAGES.length;i++){
  var v = document.getElementById('zlc-page-'+PAGES[i].id);
  if(v && v.classList) v.classList.toggle('on', PAGES[i].id===id);
 }
 var nav = document.getElementById('modnav');
 if(nav && nav.querySelectorAll){
  var bs = nav.querySelectorAll('button');
  for(i=0;i<bs.length;i++){
   if(bs[i].classList) bs[i].classList.toggle('on', bs[i].getAttribute('data-p')===id);
  }
 }
 var hint = document.getElementById('zlc-tabhint');
 if(hint && typeof hint.textContent==='string') hint.textContent = p.hint;
 if(!keepScroll && typeof window.scrollTo==='function'){
  try{ window.scrollTo({top:0, behavior:'instant'}); }catch(e){ window.scrollTo(0,0); }
 }
};

function buildPages(){
 var wrap = document.querySelector('.wrap');
 var nav  = document.getElementById('modnav');
 if(!wrap || !nav || !document.createElement) return;

 var st = document.createElement('style'); st.textContent = css;
 if(document.head && document.head.appendChild) document.head.appendChild(st);

 /* #modnav held anchor links. Those anchors point into views that are
    now hidden, so the switcher replaces them rather than joining them. */
 var html = '', i, j;
 for(i=0;i<PAGES.length;i++){
  html += '<button data-p="'+PAGES[i].id+'" onclick="zlcPage(\''+PAGES[i].id+'\')">'
       +  esc(PAGES[i].label)+'</button>';
 }
 nav.innerHTML = html + '<span class="sub" id="zlc-tabhint"></span>';
 nav.className = 'modnav zlc-tabs';

 /* appendChild MOVES a node, so every section keeps its id, its
    attributes and its event listeners. Insert each view at the same
    anchor so the three land in declaration order. */
 var anchor = nav.nextSibling;
 for(i=0;i<PAGES.length;i++){
  var v = document.createElement('div');
  v.className = 'zlc-view'; v.id = 'zlc-page-'+PAGES[i].id;
  wrap.insertBefore(v, anchor);
  for(j=0;j<PAGES[i].sections.length;j++){
   var sec = document.getElementById(PAGES[i].sections[j]);
   if(sec && v.appendChild) v.appendChild(sec);
  }
 }
 window.zlcPage(page, true);
}

if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', buildPages); }
else { buildPages(); }
})();
